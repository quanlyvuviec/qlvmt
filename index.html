// ── Smart FormModal ──────────────────────────────────────────
function FormModal({fields,initial,title,onSave,onClose,allRecords,khuPhoList}){
  const [data,setData]=useState(()=>{
    const base={};
    fields.forEach(f=>{base[f.k]=f.def!=null?f.def:(f.type==="bool"?false:"");base[f.k+"_other"]="";});
    if(initial)return{...base,...initial};
    // ── Giá trị mặc định thông minh cho bản ghi mới ──
    // Ngày theo giờ Việt Nam (không dùng toISOString – trước 7h sáng sẽ bị lùi 1 ngày)
    const _n=new Date();const today=_n.getFullYear()+"-"+String(_n.getMonth()+1).padStart(2,"0")+"-"+String(_n.getDate()).padStart(2,"0");
    if(Object.prototype.hasOwnProperty.call(base,"ngay_vao_so"))base.ngay_vao_so=today;
    // Thời điểm đưa vào (cột 17 PL1B) ≡ Ngày vào sổ → mốc tính TĂNG khi xuất TB136
    if(Object.prototype.hasOwnProperty.call(base,"thoi_diem_dua_vao_ql"))base.thoi_diem_dua_vao_ql=today;
    if(Object.prototype.hasOwnProperty.call(base,"phuong_xa")&&!base.phuong_xa)
      base.phuong_xa=String(CONFIG.donVi||"").replace(/^Công an\s*(phường|xã|thị trấn)\s*/i,"").trim();
    if(Object.prototype.hasOwnProperty.call(base,"quan_huyen")&&!base.quan_huyen)base.quan_huyen=CONFIG.quanHuyen;
    if(Object.prototype.hasOwnProperty.call(base,"co_mat"))base.co_mat=true;
    return base;
  });
  const [errors,setErrors]=useState({});
  const [warns,setWarns]=useState({});
  const [activeGrpIdx,setActiveGrpIdx]=useState(0);
  const [dirty,setDirty]=useState(false);
  const [search,setSearch]=useState("");
  const [viewMode,setViewMode]=useState("all"); // all | empty | filled | req
  const ref=useRef();
  const bodyRef=useRef();
  const {style:dragStyle,dragHandleProps}=useDraggableModal();

  // ── Kiểm tra thông minh từng trường ngay khi nhập ──
  const smartCheck=(k,v,cur)=>{
    const e={},w={};
    const digits=x=>String(x||"").replace(/\D/g,"");
    if(k==="cccd"&&v){
      const d=digits(v);
      if(d.length&&d.length!==9&&d.length!==12)e.cccd="Số CCCD/CMND phải có 9 hoặc 12 chữ số";
      else if(d.length===12&&Array.isArray(allRecords)){
        const trung=allRecords.find(r=>r._id!==(initial&&initial._id)&&digits(r.cccd)===d);
        if(trung)w.cccd="⚠️ Trùng CCCD với bản ghi: "+(trung.ho_ten||"(không tên)");
      }
    }
    if(k==="sdt"&&v){
      const d=digits(v);
      if(d.length&&(d.length<9||d.length>11))e.sdt="Số điện thoại không hợp lệ";
    }
    if(k==="ngay_sinh"&&v){
      const d=_pd(v);
      if(d&&d>new Date())e.ngay_sinh="Ngày sinh không thể ở tương lai";
      else if(d&&new Date().getFullYear()-d.getFullYear()>110)e.ngay_sinh="Năm sinh không hợp lý";
    }
    if(k==="ngay_vao_so"&&v){
      const d=_pd(v);
      if(d&&d>new Date())w.ngay_vao_so="⚠️ Ngày vào sổ ở tương lai – kiểm tra lại vì đây là mốc tính tăng/giảm của báo cáo";
    }
    if((k==="ngay_loai"||k==="ngay_vao_so")&&cur.ngay_loai&&cur.ngay_vao_so){
      const a=_pd(k==="ngay_vao_so"?v:cur.ngay_vao_so),b=_pd(k==="ngay_loai"?v:cur.ngay_loai);
      if(a&&b&&b<a)e[k]="Ngày loại phải sau ngày vào sổ";
    }
    return{e,w};
  };
  const set=(k,v)=>{
    setData(p=>{
      const next={...p,[k]:v};
      // Chuẩn hóa họ tên: bỏ khoảng trắng thừa, viết hoa chữ đầu mỗi từ
      if(k==="ho_ten"&&typeof v==="string")
        next[k]=v.replace(/\s+/g," ").replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toLocaleUpperCase("vi"));
      // Gợi ý khu phố từ địa chỉ nếu chưa chọn
      if((k==="hktt"||k==="noi_o_ht")&&!p.khu_pho_moi){
        const ds=Array.isArray(khuPhoList)&&khuPhoList.length
          ? khuPhoList.map(kp=>kp.ten_moi||kp.ten_cu||"")
          : (OPT.khuPhoMoi||[]);
        const addr=stripDiacriticsVN(String(v||"")).toLowerCase();
        const hit=ds.find(ten=>{
          const t=stripDiacriticsVN(ten||"").toLowerCase().trim();
          return t.length>=3&&addr.includes(t);
        });
        if(hit)next.khu_pho_moi=hit;
      }
      if(k==="ngay_goi_hoi"){
        const count=v?v.split(",").filter(d=>d.trim()).length:0;
        next["so_luot_goi_hoi"]=String(count);
      }
      // Số hồ sơ sưu tra ↔ Diện QL (cột 11 PL1B): thay đúng số hồ sơ cũ trong ô Diện QL,
      // KHÔNG xoá phần còn lại (VD: "…, Số 37/QĐ-UBND … quản lý sau cai")
      if(k==="so_ho_so_suu_tra"){
        const cur=String(p.dien_ql_so_hs||""),old=String(p.so_ho_so_suu_tra||"").trim();
        if(!cur.trim()||cur.trim()===old)next["dien_ql_so_hs"]=v;
        else if(old&&cur.includes(old))next["dien_ql_so_hs"]=cur.replace(old,v);
      }
      // Ngày vào sổ ⇄ Thời điểm đưa vào quản lý: đồng bộ khi 2 ô đang giống nhau / còn trống
      if(k==="ngay_vao_so"&&(!p.thoi_diem_dua_vao_ql||p.thoi_diem_dua_vao_ql===p.ngay_vao_so))next.thoi_diem_dua_vao_ql=v;
      if(k==="thoi_diem_dua_vao_ql"&&(!p.ngay_vao_so||p.ngay_vao_so===p.thoi_diem_dua_vao_ql))next.ngay_vao_so=v;
      if(k==="ngay_sinh")next.ngay_sinh_chi_nam=false;
      return next;
    });
    setDirty(true);
    const{e,w}=smartCheck(k,v,data);
    setErrors(p=>{const n={...p};delete n[k];if(e[k])n[k]=e[k];return n;});
    setWarns(p=>{const n={...p};delete n[k];if(w[k])n[k]=w[k];return n;});
  };
  // Sao chép nhanh HKTT sang Nơi ở hiện tại
  const copyHktt=()=>{if(data.hktt)set("noi_o_ht",data.hktt);};
  // Derive which nhom are selected (for F_UNIFIED filtering)
  const selectedNhom=Array.isArray(data.nhom)?data.nhom:[];

  // ── Field visibility: nhomShow filter ──────────────────────
  // Fields with nhomShow only appear when matching nhom is selected
  const isFieldVisible=(f)=>{
    if(!f.nhomShow||f.nhomShow.length===0) return true;
    if(selectedNhom.length===0) return false;
    return f.nhomShow.some(id=>selectedNhom.includes(id));
  };
  // Only show groups that have ≥1 visible field
  const allGroupNames=[...new Set(fields.map(f=>f.grp||"Thông tin"))];
  const groups=allGroupNames.filter(grp=>
    fields.filter(f=>(f.grp||"Thông tin")===grp).some(isFieldVisible)
  );
  // Clamp index when groups shrink
  const safeIdx=Math.min(activeGrpIdx,Math.max(0,groups.length-1));
  const isMultiGroup=groups.length>3;
  const activeGrp=groups[safeIdx]||groups[0];
  // Khi gõ tìm kiếm hoặc lọc "Chưa điền/Bắt buộc" thì hiện tất cả các nhóm để
  // không phải bấm qua từng bước mới thấy trường cần nhập
  const isFiltering=!!search.trim()||viewMode!=="all";
  const visibleGroups=(isMultiGroup&&!isFiltering)?[activeGrp]:groups;

  const validate=()=>{
    const e={};
    fields.filter(f=>f.req&&isFieldVisible(f)).forEach(f=>{
      if(!data[f.k]&&data[f.k]!==true)e[f.k]="Bắt buộc nhập";
    });
    setErrors(e);
    if(Object.keys(e).length>0){
      const firstErr=fields.find(f=>e[f.k]);
      if(firstErr){const gi=groups.indexOf(firstErr.grp||"Thông tin");if(gi>=0)setActiveGrpIdx(gi);}
    }
    return!Object.keys(e).length;
  };

  const handleSave=()=>{
    if(Object.keys(errors).length){
      const g=fields.find(f=>errors[f.k]);
      if(g){const gi=groups.indexOf(g.grp||"Thông tin");if(gi>=0)setActiveGrpIdx(gi);}
      return;
    }
    if(validate())onSave(data);
  };
  // ── Phím tắt: Ctrl+S lưu, Esc đóng ──
  useEffect(()=>{
    const onKey=e=>{
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();handleSave();}
      else if(e.key==="Escape"){e.preventDefault();handleClose();}
    };
    window.addEventListener("keydown",onKey);
    return()=>window.removeEventListener("keydown",onKey);
  });
  // ── Lọc trường theo từ khóa và trạng thái điền ──
  const matchFilter=(f)=>{
    if(search.trim()){
      const q=stripDiacriticsVN(search).toLowerCase();
      const hay=stripDiacriticsVN((f.lbl||"")+" "+f.k).toLowerCase();
      if(!hay.includes(q))return false;
    }
    const has=data[f.k]&&data[f.k]!==false&&data[f.k]!=="";
    if(viewMode==="empty")return!has;
    if(viewMode==="filled")return!!has;
    if(viewMode==="req")return!!f.req;
    return true;
  };

  const handleClose=()=>{
    if(dirty&&!window.confirm("Bạn có thay đổi chưa lưu. Thoát?"))return;
    onClose();
  };

  // Scroll body to top on group change
  useEffect(()=>{if(bodyRef.current)bodyRef.current.scrollTop=0;},[activeGrpIdx]);

  // Filled count: only count VISIBLE fields
  const filledCount=(grp)=>{
    const fs=fields.filter(f=>(f.grp||"Thông tin")===grp&&isFieldVisible(f));
    return fs.filter(f=>data[f.k]&&data[f.k]!==false&&data[f.k]!=="").length;
  };
  const totalInGrp=(grp)=>fields.filter(f=>(f.grp||"Thông tin")===grp&&isFieldVisible(f)).length;

  const totalReq=fields.filter(f=>f.req&&isFieldVisible(f)).length;
  const filledReq=fields.filter(f=>f.req&&isFieldVisible(f)&&data[f.k]&&data[f.k]!==false&&data[f.k]!=="").length;
  const progress=totalReq>0?Math.round(filledReq/totalReq*100):100;

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(10,20,50,.6)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:1000,overflowY:"auto",padding:"12px 8px"}}
      ref={ref} onClick={e=>e.target===ref.current&&handleClose()}>
      <div style={{background:"#fff",borderRadius:14,width:"min(980px,98vw)",margin:"auto",
        boxShadow:"0 20px 60px rgba(0,0,0,.3)",display:"flex",flexDirection:"column",maxHeight:"95vh",...dragStyle}}>

        {/* ── Header (kéo được — giữ chuột vào đây rồi kéo để di chuyển cửa sổ) ── */}
        <div {...dragHandleProps} style={{...dragHandleProps.style,background:"linear-gradient(135deg,#0d1b3e 0%,#1e3a6e 100%)",borderRadius:"14px 14px 0 0",
          padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div>
            <div style={{color:"#fff",fontSize:15,fontWeight:700}}>{title}</div>
            {totalReq>0&&<div style={{color:"rgba(255,255,255,.6)",fontSize:11,marginTop:2}}>
              Bắt buộc: {filledReq}/{totalReq} trường đã điền
            </div>}
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {totalReq>0&&<div style={{width:80,height:6,background:"rgba(255,255,255,.2)",borderRadius:3,overflow:"hidden"}}>
              <div style={{width:progress+"%",height:"100%",background:progress===100?"#69f0ae":"#ffb300",borderRadius:3,transition:"width .3s"}}/>
            </div>}
            <button onClick={handleClose} style={{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.25)",
              cursor:"pointer",color:"#fff",width:30,height:30,borderRadius:7,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
          </div>
        </div>

        {/* ── Thanh tìm nhanh trường + bộ lọc ── */}
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"9px 16px",borderBottom:"1px solid #e8edf5",
          background:"#f8fafd",flexShrink:0,flexWrap:"wrap"}}>
          <input className="fi" value={search} onChange={e=>setSearch(e.target.value)}
            autoComplete="off" spellCheck="false"
            placeholder="🔎 Tìm nhanh trường cần nhập (VD: cccd, hộ khẩu, quyết định)..."
            style={{flex:"1 1 240px",height:32,fontSize:12.5}}/>
          <div style={{display:"flex",gap:4}}>
            {[["all","Tất cả"],["req","Bắt buộc"],["empty","Chưa điền"],["filled","Đã điền"]].map(([m,lbl])=>(
              <button key={m} type="button" onClick={()=>setViewMode(m)}
                style={{padding:"5px 10px",borderRadius:7,fontSize:11.5,fontWeight:700,cursor:"pointer",
                  border:"1px solid "+(viewMode===m?"#1e3a6e":"#dbe3ef"),
                  background:viewMode===m?"#1e3a6e":"#fff",color:viewMode===m?"#fff":"#475569"}}>{lbl}</button>
            ))}
          </div>
          <span style={{fontSize:11,color:"#94a3b8"}}>Ctrl+S lưu · Esc đóng</span>
        </div>

        {/* ── Group nav (sidebar + content) ── */}
        <div style={{display:"flex",flex:1,overflow:"hidden",minHeight:0}}>

          {/* Sidebar nav for multi-group */}
          {isMultiGroup&&(
            <div style={{width:200,flexShrink:0,background:"#f4f6fb",borderRight:"1px solid #dde3ee",overflowY:"auto",padding:"10px 0"}}>
              {groups.map((g,gi)=>{
                const meta=getGrpMeta(g);
                const cnt=filledCount(g);
                const total=fields.filter(f=>(f.grp||"Thông tin")===g).length;
                const hasError=fields.filter(f=>(f.grp||"Thông tin")===g&&errors[f.k]).length>0;
                const isActive=gi===safeIdx;
                return(
                  <div key={g} onClick={()=>setActiveGrpIdx(gi)}
                    style={{display:"flex",alignItems:"flex-start",gap:9,padding:"9px 14px",cursor:"pointer",
                      background:isActive?"#fff":"transparent",
                      borderLeft:isActive?`3px solid ${meta.color}`:"3px solid transparent",
                      borderBottom:"1px solid #eee",transition:"all .12s"}}>
                    <span style={{fontSize:15,flexShrink:0,marginTop:1}}>{meta.icon}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:11.5,fontWeight:isActive?700:500,color:isActive?meta.color:"#444",lineHeight:1.3,wordBreak:"break-word"}}>{g}</div>
                      <div style={{display:"flex",alignItems:"center",gap:4,marginTop:3}}>
                        <div style={{flex:1,height:3,background:"#e0e0e0",borderRadius:2,overflow:"hidden"}}>
                          <div style={{width:(cnt/total*100)+"%",height:"100%",background:hasError?"#e53935":isActive?meta.color:"#90caf9",borderRadius:2}}/>
                        </div>
                        <span style={{fontSize:9.5,color:hasError?"#e53935":"#999",fontWeight:600}}>{filledCount(g)}/{totalInGrp(g)}</span>
                        {hasError&&<span style={{fontSize:11,color:"#e53935"}}>⚠</span>}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Form body */}
          <div ref={bodyRef} style={{flex:1,overflowY:"auto",padding:"18px 20px"}}>
            {visibleGroups.filter(Boolean).map(grp=>{
              const meta=getGrpMeta(grp);
              const grpFields=fields.filter(f=>(f.grp||"Thông tin")===grp);
              return(
                <div key={grp} style={{marginBottom:isMultiGroup?0:22}}>
                  {/* Group header */}
                  <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:10,
                    padding:"8px 14px",background:meta.bg,borderRadius:8,
                    border:`1px solid ${meta.color}22`}}>
                    <span style={{fontSize:18}}>{meta.icon}</span>
                    <span style={{fontSize:13,fontWeight:700,color:meta.color}}>{grp}</span>
                    <span style={{fontSize:11,color:meta.color,opacity:.7,marginLeft:"auto"}}>
                      {filledCount(grp)}/{totalInGrp(grp)} đã điền
                    </span>
                  </div>
                  {grp==="🎯 Phân nhóm quản lý"&&selectedNhom.length===0&&(
                    <div style={{background:"#fffbeb",border:"1px solid #fcd34d",borderRadius:8,
                      padding:"10px 14px",marginBottom:12,fontSize:12.5,lineHeight:1.6,color:"#92400e"}}>
                      👆 <b>Chọn ít nhất 1 nhóm</b> để hiển thị các trường thông tin phù hợp (SD, Nghiện, Sau cai, VPPL)
                    </div>
                  )}
                  {grp==="Nghiệp vụ quản lý (TB136 PL1B)"&&(
                    <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:12,padding:"8px 10px",background:"#fff9c4",borderRadius:7,border:"1px solid #f0c000"}}>
                      <span style={{fontSize:10,fontWeight:700,color:"#7c5c00",width:"100%",marginBottom:3}}>📋 Tương ứng cột PL1B:</span>
                      {[["(7)","Tiền án CT"],["(8)","Hành vi"],["(9)","Dấu hiệu"],["(10)","Địa bàn"],["(11)","Diện QL/HS"],["(12)","Đối sách"],["(13)","ĐV quản"],["(14)","Số lượt GH"],["(15)","Tần suất GH"],["(16)","Lĩnh vực"],["(17)","TĐ đưa vào"],["(18)","Cán bộ TD"],["(19)","Chỉ huy TD"],["(20)","Tăng/Giảm"]].map(([col,lbl])=>(
                        <span key={col} style={{padding:"1px 6px",background:"#fff",border:"1px solid #f0c000",borderRadius:4,fontSize:10,color:"#5a4000",fontWeight:600,whiteSpace:"nowrap"}}>{col} {lbl}</span>
                      ))}
                    </div>
                  )}

                  {/* Fields grid */}
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:"14px 18px"}}>
                    {grpFields.filter(f=>isFieldVisible(f)&&matchFilter(f)).map(f=>{
                      const isWide=f.type==="textarea"||f.wide||f.type==="nhom_selector"||f.type==="photo3x4";
                      const hasVal=data[f.k]&&data[f.k]!==false&&data[f.k]!=="";
                      return(
                        <div key={f.k} style={{gridColumn:isWide?"1/-1":"auto",display:"flex",flexDirection:"column",gap:5}}>
                          {/* Label row */}
                          <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                            <label style={{fontSize:12,fontWeight:600,color:errors[f.k]?"#c62828":hasVal?"#1565c0":"#444",transition:"color .15s"}}>
                              {f.lbl}
                              {f.req&&<span style={{color:"#e53935",marginLeft:3}}>*</span>}
                            </label>
                            {hasVal&&!errors[f.k]&&<span style={{fontSize:11,color:"#43a047"}}>✓</span>}
                            {f.k==="ngay_sinh"&&data.ngay_sinh&&_pd(data.ngay_sinh)&&
                              <span style={{fontSize:10.5,fontWeight:700,color:"#1565c0",background:"#e3f2fd",padding:"1px 7px",borderRadius:9}}>
                                {new Date().getFullYear()-_pd(data.ngay_sinh).getFullYear()} tuổi
                              </span>}
                            {f.k==="noi_o_ht"&&data.hktt&&data.hktt!==data.noi_o_ht&&
                              <button type="button" onClick={copyHktt}
                                style={{fontSize:10.5,fontWeight:600,color:"#1565c0",background:"#e3f2fd",border:"1px solid #bbdefb",
                                  borderRadius:9,padding:"1px 7px",cursor:"pointer"}}>⤵ Giống HKTT</button>}
                            {f.k==="cccd"&&data.cccd&&<span style={{fontSize:10.5,color:"#94a3b8"}}>
                              {String(data.cccd).replace(/\D/g,"").length} chữ số
                            </span>}
                          </div>
                          {/* Input */}
                          <FieldInput f={f} value={data[f.k]} valueOther={data[f.k+"_other"]}
                            error={errors[f.k]} onChange={v=>set(f.k,v)} onChangeOther={v=>set(f.k+"_other",v)}/>
                          {/* Hint / Error */}
                          {errors[f.k]
                            ?<span style={{fontSize:11,color:"#c62828",display:"flex",alignItems:"center",gap:3}}>⚠️ {errors[f.k]}</span>
                            :warns[f.k]
                              ?<span style={{fontSize:11,color:"#b45309",lineHeight:1.5}}>{warns[f.k]}</span>
                              :f.ph&&f.type!=="text"&&<span style={{fontSize:10.5,color:"#999",fontStyle:"italic"}}>VD: {f.ph}</span>
                          }
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* ── Footer ── */}
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 20px",
          borderTop:"1px solid #eee",background:"#f8f9fc",borderRadius:"0 0 14px 14px",flexShrink:0}}>

          {/* Prev / Next for multi-group */}
          {isMultiGroup&&(
            <div style={{display:"flex",gap:6,flex:1,alignItems:"center"}}>
              <button className="btn btn-ghost btn-sm" disabled={activeGrpIdx===0}
                onClick={()=>setActiveGrpIdx(i=>i-1)} style={{gap:4}}>← Trước</button>
              {/* Step dots */}
              <div style={{display:"flex",gap:4,padding:"0 6px"}}>
                {groups.map((_,gi)=>{
                  const hasErr=fields.filter(f=>(f.grp||"Thông tin")===groups[gi]&&errors[f.k]).length>0;
                  return <div key={gi} onClick={()=>setActiveGrpIdx(gi)}
                    title={groups[gi]}
                    style={{width:gi===safeIdx?20:8,height:8,borderRadius:4,cursor:"pointer",
                      transition:"all .2s",
                      background:hasErr?"#e53935":gi===safeIdx?"#0d1b3e":gi<safeIdx?"#90caf9":"#ddd"}}/>;
                })}
              </div>
              <button className="btn btn-ghost btn-sm" disabled={activeGrpIdx===groups.length-1}
                onClick={()=>setActiveGrpIdx(i=>i+1)} style={{gap:4}}>Tiếp →</button>
              <span style={{fontSize:11,color:"#888",marginLeft:4}}>{safeIdx+1} / {groups.length}</span>
            </div>
          )}
          {!isMultiGroup&&<div style={{flex:1}}/>}

          {totalReq>filledReq&&
            <span style={{fontSize:11.5,fontWeight:700,color:"#b45309",cursor:"pointer",marginRight:6}}
              onClick={()=>{setViewMode("req");setSearch("");}}
              title="Bấm để chỉ hiển thị các trường bắt buộc chưa điền">
              ⚠️ Còn {totalReq-filledReq} trường bắt buộc
            </span>}
          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-ghost" onClick={handleClose}>Hủy</button>
            {isMultiGroup&&safeIdx<groups.length-1
              ?<button className="btn btn-primary" onClick={()=>setActiveGrpIdx(i=>Math.min(groups.length-1,i+1))}>Tiếp theo →</button>
              :<button className="btn" onClick={handleSave}
                  style={{background:"linear-gradient(135deg,#0d1b3e,#1e3a6e)",color:"#fff",gap:6}}>
                  💾 Lưu bản ghi
                </button>
            }
          </div>
        </div>
      </div>
    </div>
  );
}


// ── Date display helper ──────────────────────────────────────
function DateChip({val}){
  if(!val)return<span style={{color:"#cbd5e1",fontSize:11}}>—</span>;
  return(
    <span style={{display:"inline-block",padding:"2px 8px",background:"#f0f6ff",
      border:"1px solid #bfdbfe",borderRadius:6,fontSize:11.5,color:"#1e40af",fontWeight:500,
      whiteSpace:"nowrap"}}>
      📅 {fmtDate(val)}
    </span>
  );
}
function NumBadge({val,color}){
  if(!val&&val!==0)return<span style={{color:"#cbd5e1"}}>—</span>;
  return(
    <span style={{display:"inline-block",padding:"2px 9px",background:color||"#f1f5f9",
      borderRadius:20,fontSize:12,fontWeight:700,color:color?"#fff":"var(--text2)"}}>
      {val}
    </span>
  );
}

// ── Global table cell helpers (used by GroupPage, GroupViewPage, UnifiedPage) ──
function PmBadge({v}){
  return v==="Đã nhập"
    ?<span className="badge badge-green">✓ Đã nhập</span>
    :<span className="badge badge-orange">⏳ Chưa nhập</span>;
}
function BoolBadge({v,yes,no}){
  yes=yes||"✓";no=no||"";
  return v
    ?<span className="badge badge-green">{yes}</span>
    :(no?<span className="badge badge-gray">{no}</span>:<span style={{color:"#cbd5e1"}}>—</span>);
}
function GtBadge({v}){
  if(!v)return<span style={{color:"#cbd5e1"}}>—</span>;
  return<span className="badge" style={{
    background:v==="Nam"?"#dbeafe":"#fce7f3",
    color:v==="Nam"?"#1e40af":"#9d174d",fontSize:11
  }}>{v==="Nam"?"♂ Nam":"♀ Nữ"}</span>;
}
function TextCell({v,max}){
  max=max||30;
  if(!v)return<span style={{color:"#cbd5e1"}}>—</span>;
  const s=String(v);
  return<span title={s.length>max?s:undefined}>{s.length>max?s.slice(0,max)+"…":s}</span>;
}

// ── NhomBadge ────────────────────────────────────────────────
function NhomBadge({nhom}){
  if(!nhom||!nhom.length)return<span className="badge badge-gray">Chưa phân nhóm</span>;
  return(
    <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
      {nhom.map(id=>{
        const n=NHOM_MAP[id];if(!n)return null;
        return(
          <span key={id} style={{display:"inline-flex",alignItems:"center",gap:3,
            padding:"2px 7px",borderRadius:20,fontSize:10.5,fontWeight:700,
            background:n.color+"18",color:n.color,border:"1px solid "+n.color+"35"}}>
            {n.icon} {n.lbl}
          </span>
        );
      })}
    </div>
  );
}
// ── NhomSelector (multi-checkbox) ────────────────────────────
function NhomSelector({value,onChange}){
  const selected=Array.isArray(value)?value:[];
  const toggle=(id)=>{
    if(selected.includes(id))onChange(selected.filter(x=>x!==id));
    else onChange([...selected,id]);
  };
  return(
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
      {NHOM_LIST.map(n=>{
        const on=selected.includes(n.id);
        return(
          <label key={n.id} onClick={()=>toggle(n.id)} style={{
            display:"flex",alignItems:"center",gap:9,
            padding:"10px 12px",borderRadius:10,cursor:"pointer",userSelect:"none",
            border:"2px solid "+(on?n.color:"#e2e8f0"),
            background:on?n.color+"12":"#fafbfd",
            transition:"all .15s",
            boxShadow:on?"0 2px 8px "+n.color+"30":"0 1px 3px rgba(0,0,0,.04)",
          }}>
            <span style={{
              width:22,height:22,borderRadius:6,flexShrink:0,
              border:"2px solid "+(on?n.color:"#cbd5e1"),
              background:on?n.color:"#fff",
              display:"flex",alignItems:"center",justifyContent:"center",
              transition:"all .15s",
            }}>
              {on&&<span style={{color:"#fff",fontSize:14,lineHeight:1,fontWeight:800}}>✓</span>}
            </span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:16,lineHeight:1,marginBottom:2}}>{n.icon}</div>
              <div style={{fontSize:11,fontWeight:on?700:500,color:on?n.color:"#64748b",lineHeight:1.3,wordBreak:"break-word"}}>{n.lbl}</div>
            </div>
          </label>
        );
      })}
    </div>
  );
}
function DataTable({title,icon,records,allRecords,onAdd,onEdit,onView,onEditPwd,onDelete,onLoai,onPhucHoi,onBulkDelete,columns,dateRange,showLoai=true}){
  const [search,setSearch]=useState("");
  const [tabLoai,setTabLoai]=useState(false);
  const [pg,setPg]=useState(1);
  const [selIds,setSelIds]=useState(()=>new Set());
  const [bulkDel,setBulkDel]=useState(false);
  const PER=15;
  useEffect(()=>{setPg(1);},[search,records.length,tabLoai]);
  // Tự xoá bộ lọc tìm kiếm khi có bản ghi mới được thêm (số lượng tăng), để bản ghi
  // mới không bị "mất tích" do đang lọc theo từ khoá không khớp — tránh phải bấm F5.
  const prevLenRef=useRef(records.length);
  useEffect(()=>{
    if(records.length>prevLenRef.current&&search)setSearch("");
    prevLenRef.current=records.length;
  },[records.length]);
  const active=records;
  const loai=(allRecords||[]).filter(r=>r.da_loai);
  const show=tabLoai?loai:active;
  const filtered=show.filter(r=>!search||Object.values(r).some(v=>String(v||"").toLowerCase().includes(search.toLowerCase())));
  const pages=Math.max(1,Math.ceil(filtered.length/PER));
  const paged=filtered.slice((pg-1)*PER,pg*PER);
  return(
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">{icon} {title}</div>
          <div className="page-sub">
            <span style={{background:"#f0f6ff",padding:"2px 8px",borderRadius:5,border:"1px solid #bfdbfe",fontSize:11.5}}>
              {dateRange.from&&dateRange.to?`📅 ${fmtDate(dateRange.from)} → ${fmtDate(dateRange.to)}`:"📋 Toàn bộ thời gian"}
            </span>
            <span className="badge badge-navy">✓ {active.length} đang QL</span>
            {showLoai&&loai.length>0&&<span className="badge badge-gray">🚫 {loai.length} đã loại</span>}
          </div>
        </div>
        <div className="btn-grp">
          <div className="srch-wrap">
            <span className="srch-icon">🔍</span>
            <input className="srch" autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false" name="q_1_nofill" placeholder="Tìm kiếm..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          {!tabLoai&&<button className="btn btn-primary btn-sm" onClick={onAdd}>＋ Thêm mới</button>}
        </div>
      </div>
      {showLoai&&<div className="tab-bar">
        <button className={`tab-btn${!tabLoai?" active":""}`} onClick={()=>{setTabLoai(false);setSearch("");}}>
          <span>📋</span> Đang quản lý &nbsp;<span style={{background:!tabLoai?"var(--navy)":"#e2e8f0",color:!tabLoai?"#fff":"var(--muted)",padding:"1px 7px",borderRadius:10,fontSize:11,fontWeight:700}}>{active.length}</span>
        </button>
        <button className={`tab-btn${tabLoai?" active":""}`} onClick={()=>{setTabLoai(true);setSearch("");}}>
          <span>🚫</span> Đã loại &nbsp;<span style={{background:tabLoai?"var(--navy)":"#e2e8f0",color:tabLoai?"#fff":"var(--muted)",padding:"1px 7px",borderRadius:10,fontSize:11,fontWeight:700}}>{loai.length}</span>
        </button>
      </div>}
      {onBulkDelete&&selIds.size>0&&
        <div style={{display:"flex",alignItems:"center",gap:10,background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,padding:"9px 14px",marginBottom:12}}>
          <span style={{fontSize:12.5,fontWeight:700,color:"#7f1d1d"}}>☑️ Đã chọn {selIds.size} bản ghi</span>
          <button className="btn btn-sm" style={{background:"#ef4444",color:"#fff"}} onClick={()=>setBulkDel(true)}>🗑️ Xóa vĩnh viễn đã chọn</button>
          <button className="btn btn-sm btn-ghost" onClick={()=>setSelIds(new Set())}>Bỏ chọn</button>
        </div>}
      <div className="card">
        <div className="tbl-wrap">
          <table>
            <thead><tr>
              {onBulkDelete&&<th style={{width:32,textAlign:"center"}}>
                <input type="checkbox" title="Chọn tất cả trong trang này"
                  checked={paged.length>0&&paged.every(r=>selIds.has(r._id))}
                  onChange={e=>setSelIds(p=>{const n=new Set(p);paged.forEach(r=>e.target.checked?n.add(r._id):n.delete(r._id));return n;})}/>
              </th>}
              {columns.map((c,i)=><th key={i} style={{minWidth:c.w||80}}>{c.label}</th>)}<th style={{width:110,textAlign:"center"}}>Thao tác</th></tr></thead>
            <tbody>
              {paged.length===0&&<tr><td colSpan={columns.length+1+(onBulkDelete?1:0)}>
                <div style={{textAlign:"center",padding:"48px 20px",color:"var(--muted)"}}>
                  <div style={{fontSize:52,marginBottom:12,opacity:.4}}>📂</div>
                  <p style={{fontSize:14,fontWeight:600,color:"var(--text2)",marginBottom:4}}>Chưa có dữ liệu</p>
                  <p style={{fontSize:12,color:"var(--muted2)"}}>Nhấn <b>＋ Thêm mới</b> để bắt đầu nhập liệu</p>
                </div>
              </td></tr>}
              {paged.map((r,ri)=>(
                <tr key={r._id} className={r.da_loai?"da-loai":""}>
                  {onBulkDelete&&<td style={{textAlign:"center"}}>
                    <input type="checkbox" checked={selIds.has(r._id)} onChange={()=>setSelIds(p=>{const n=new Set(p);n.has(r._id)?n.delete(r._id):n.add(r._id);return n;})}/>
                  </td>}
                  {columns.map((c,ci)=><td key={ci}>{c.render?c.render(r,(pg-1)*PER+ri):r[c.key]||""}</td>)}
                  <td><div className="actions">
                    <button className="btn btn-sm btn-icon act-view" title="Xem chi tiết" onClick={()=>onView(r)}>👁</button>
                    <button className="btn btn-sm btn-icon act-edit" title="Sửa (yêu cầu mật khẩu)" onClick={()=>onEditPwd(r)}>✏️</button>
                    {!r.da_loai&&showLoai&&<button className="btn btn-sm btn-icon act-loai" title="Loại khỏi DS" onClick={()=>onLoai(r)}>🚫</button>}
                    {r.da_loai&&showLoai&&<button className="btn btn-sm btn-icon act-restore" title="Phục hồi" onClick={()=>onPhucHoi(r)}>♻️</button>}
                    <button className="btn btn-sm btn-icon act-delete" title="Xóa vĩnh viễn" onClick={()=>onDelete(r)}>🗑️</button>
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="pag">
          <span className="pag-info">
            <b style={{color:"var(--navy)"}}>{filtered.length}</b> bản ghi &nbsp;·&nbsp; Trang <b>{pg}</b> / {pages}
          </span>
          <div style={{display:"flex",gap:4,alignItems:"center"}}>
            <button className="pag-btn" disabled={pg===1} onClick={()=>setPg(1)} title="Trang đầu">«</button>
            <button className="pag-btn" disabled={pg===1} onClick={()=>setPg(p=>p-1)}>‹</button>
            {Array.from({length:Math.min(5,pages)},(_, i)=>{
              const start=Math.max(1,Math.min(pages-4,pg-2));
              const n=start+i;
              return n<=pages&&<button key={n} className={`pag-btn${pg===n?" active":""}`} onClick={()=>setPg(n)}>{n}</button>;
            }).filter(Boolean)}
            <button className="pag-btn" disabled={pg===pages} onClick={()=>setPg(p=>p+1)}>›</button>
            <button className="pag-btn" disabled={pg===pages} onClick={()=>setPg(pages)} title="Trang cuối">»</button>
          </div>
        </div>
      </div>
      {onBulkDelete&&bulkDel&&
        <BulkDeleteConfirm
          records={(allRecords||records).filter(r=>selIds.has(r._id)).map(r=>({_id:r._id,ho_ten:r.ho_ten||r.ten_bang_nhom||r.ten_dia_chi||r.so_ho_so||"(bản ghi)",cccd:r.cccd}))}
          onOk={async()=>{await onBulkDelete([...selIds]);setSelIds(new Set());setBulkDel(false);}}
          onCancel={()=>setBulkDel(false)}/>}
    </div>
  );
}

  const save=async rec=>{
    let next;
    if(form.mode==="add"){next=[{...rec,_id:uid(),_created:new Date().toISOString()},...data];}
    else{next=data.map(r=>r._id===form.rec._id?{...r,...rec}:r);}
    try{await saveStore(storeKey,next);setData(next);setForm(null);toast(form.mode==="add"?"Đã thêm bản ghi mới!":"Đã cập nhật bản ghi!","success");}
    catch(e){toast("❌ Lỗi lưu dữ liệu: "+e.message,"error");}
  };
  const del=async()=>{
    const next=data.filter(r=>r._id!==delRec._id);
    try{await saveStore(storeKey,next);setData(next);setDelRec(null);toast("Đã xóa bản ghi","info");}

// ══════════════════════════════════════════════════════════════
// BIỂU ĐỒ SVG THUẦN (không phụ thuộc thư viện ngoài)
// DonutChart – cơ cấu theo diện quản lý; BarRow – thanh xếp chồng theo diện
// ══════════════════════════════════════════════════════════════
function DonutChart({items,size=190,thickness=30,center}){
  const total=items.reduce((a,i)=>a+i.value,0);
  const R=size/2,r=R-thickness/2;
  let acc=0;
  const arcs=items.filter(i=>i.value>0).map((i,idx)=>{
    const frac=i.value/total;
    const a0=acc*2*Math.PI-Math.PI/2;acc+=frac;
    const a1=acc*2*Math.PI-Math.PI/2;
    const large=frac>0.5?1:0;
    const x0=R+r*Math.cos(a0),y0=R+r*Math.sin(a0);
    const x1=R+r*Math.cos(a1),y1=R+r*Math.sin(a1);
    // Trường hợp chỉ có 1 nhóm chiếm 100% → vẽ vòng tròn đầy
    if(frac>=0.999)return<circle key={idx} cx={R} cy={R} r={r} fill="none" stroke={i.color} strokeWidth={thickness}/>;
    return<path key={idx} d={`M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1}`} fill="none"
      stroke={i.color} strokeWidth={thickness} strokeLinecap="butt"><title>{`${i.label}: ${i.value}`}</title></path>;
  });
  return(
    <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
      <svg width={size} height={size} style={{flexShrink:0}}>
        <circle cx={R} cy={R} r={r} fill="none" stroke="#eef2f7" strokeWidth={thickness}/>
        {arcs}
        <text x={R} y={R-4} textAnchor="middle" style={{fontSize:26,fontWeight:800,fill:"#0c1b4d"}}>{center!=null?center:total}</text>
        <text x={R} y={R+16} textAnchor="middle" style={{fontSize:11,fill:"#64748b",fontWeight:600}}>lượt quản lý</text>
      </svg>
      <div style={{flex:1,minWidth:170}}>
        {items.map((i,idx)=>(
          <div key={idx} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0",fontSize:12.5}}>
            <span style={{width:11,height:11,borderRadius:3,background:i.color,flexShrink:0}}/>
            <span style={{flex:1,color:"var(--text2)"}}>{i.label}</span>
            <b style={{color:i.color}}>{i.value}</b>
            <span style={{width:44,textAlign:"right",color:"var(--muted)",fontSize:11.5}}>{total?Math.round(i.value/total*100):0}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}
function StackedBar({parts,total,max,height=16}){
  // Thanh ngang xếp chồng: mỗi đoạn là 1 diện quản lý
  const w=max?Math.max(3,Math.round(total/max*100)):0;
  return(
    <div style={{background:"#eef2f7",borderRadius:8,height,width:"100%",overflow:"hidden"}}>
      <div style={{display:"flex",height:"100%",width:w+"%",borderRadius:8,overflow:"hidden"}}>
        {parts.filter(p=>p.value>0).map((p,i)=>(
          <div key={i} title={`${p.label}: ${p.value}`}
            style={{width:(total?p.value/total*100:0)+"%",background:p.color}}/>
        ))}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════
// MÃ HÓA FILE SAO LƯU (AES-GCM 256, khóa dẫn xuất PBKDF2-SHA256)
// File .json backup chứa toàn bộ dữ liệu nhân thân (CCCD, HKTT…) – khi đặt
// mật khẩu, nội dung được mã hóa, người khác lấy được file cũng không đọc được.
// ══════════════════════════════════════════════════════════════════════
async function _aesKey(pwd,saltHex,iter){
  const enc=new TextEncoder();
  const salt=Uint8Array.from(saltHex.match(/.{2}/g).map(h=>parseInt(h,16)));
  const base=await crypto.subtle.importKey("raw",enc.encode(pwd),{name:"PBKDF2"},false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter||PWD_ITER,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
// _b64: chuyển ArrayBuffer → base64. Không dùng String.fromCharCode(...bytes) trực tiếp vì
// spread/apply một mảng lớn (file backup TOÀN BỘ dữ liệu — danh mục khu phố, danh sách cán bộ,
// đối tượng, v.v. — ciphertext có thể tới hàng trăm KB/vài MB) sẽ vượt quá giới hạn số tham số
// tối đa của hàm trong JS engine → "Maximum call stack size exceeded". Xử lý theo từng khối nhỏ
// (32KB/lần) để an toàn với file có kích thước bất kỳ.
const _b64=buf=>{
  const bytes=new Uint8Array(buf);
  let binary="";
  const CHUNK=0x8000; // 32768 bytes/lần – dưới ngưỡng an toàn của mọi engine JS phổ biến
  for(let i=0;i<bytes.length;i+=CHUNK){
    binary+=String.fromCharCode.apply(null,bytes.subarray(i,i+CHUNK));
  }
  return btoa(binary);
};
const _unb64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
async function encryptBackup(plainText,pwd){
  const salt=_rndHex(16);
  const ivArr=new Uint8Array(12);crypto.getRandomValues(ivArr);
  const key=await _aesKey(pwd,salt,PWD_ITER);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:ivArr},key,new TextEncoder().encode(plainText));
  return JSON.stringify({
    encrypted:true,alg:"AES-GCM-256/PBKDF2-SHA256",iter:PWD_ITER,
    salt,iv:_b64(ivArr.buffer),data:_b64(ct),
    app:CONFIG.version,donVi:CONFIG.donVi,timestamp:new Date().toISOString(),
  });
}
async function decryptBackup(obj,pwd){
  const key=await _aesKey(pwd,obj.salt,obj.iter||PWD_ITER);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:_unb64(obj.iv)},key,_unb64(obj.data));
  return new TextDecoder().decode(pt);
}

function BackupPage({data,onRestore,toast}){
  const [drag,setDrag]=useState(false);
  const [showPlaceholder,setShowPlaceholder]=useState(false);
  const [showTemplateFill,setShowTemplateFill]=useState(false);
  const [showExcelFill,setShowExcelFill]=useState(false);
  // Khoảng thời gian áp dụng cho "Xuất Excel theo nhóm" — để trống = xuất toàn bộ thời gian
  const [expFrom,setExpFrom]=useState("");
  const [expTo,setExpTo]=useState("");
  const fileRef=useRef();
  const [encPwd,setEncPwd]=useState("");
  const [encOn,setEncOn]=useState(true);
  const doBackup=async()=>{
    try{
      const plain=JSON.stringify({version:CONFIG.version,timestamp:new Date().toISOString(),donVi:CONFIG.donVi,data},null,2);
      let content=plain,suffix="";
      if(encOn){
        if(encPwd.length<8){toast("Mật khẩu mã hóa tối thiểu 8 ký tự (hoặc bỏ chọn mã hóa)","error");return;}
        content=await encryptBackup(plain,encPwd);suffix="_MAHOA";
      }
      const blob=new Blob([content],{type:"application/json"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);
      a.download=`BACKUP_${CONFIG.donVi.replace(/\s+/g,"_")}_${new Date().toISOString().slice(0,10)}${suffix}.json`;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      toast(encOn?"Đã tải file backup ĐÃ MÃ HÓA – hãy nhớ kỹ mật khẩu, mất mật khẩu là không khôi phục được!":"Đã tải xuống file backup!","success");
    }catch(e){toast("Lỗi tạo file backup: "+e.message,"error");}
  };
  const processFile=file=>{
    if(!file||!file.name.endsWith(".json")){toast("Vui lòng chọn file .json","error");return;}
    const reader=new FileReader();
    reader.onload=async e=>{
      try{
        let parsed=JSON.parse(e.target.result);
        if(parsed&&parsed.encrypted){
          const pw=window.prompt("File sao lưu đã được mã hóa. Nhập mật khẩu để khôi phục:");
          if(!pw)return;
          let txt;
          try{txt=await decryptBackup(parsed,pw);}
          catch{throw new Error("Mật khẩu không đúng hoặc file đã bị sửa đổi");}
          parsed=JSON.parse(txt);
        }
        if(!parsed.data)throw new Error("Không tìm thấy dữ liệu");
        const d=parsed.data;
        if(!d.su_dung||!d.nghien||!d.sau_cai||!d.vppl)throw new Error("Cấu trúc file không đúng");
        if(!window.confirm(`Xác nhận khôi phục từ backup?\nThời gian: ${parsed.timestamp?.slice(0,10)||"N/A"}\nDữ liệu hiện tại sẽ bị THAY THẾ!`))return;
        await onRestore(d);
        toast("Khôi phục dữ liệu thành công!","success");
      }catch(err){toast("Lỗi khôi phục: "+err.message,"error");}
    };reader.readAsText(file);
  };
  // Đếm bản ghi: tách rõ ĐANG QUẢN LÝ / ĐÃ LOẠI. Một người thuộc nhiều diện chỉ
  // tính 1 bản ghi ở dòng "Tất cả đối tượng" (các dòng diện bên dưới có thể trùng nhau).
  const A=l=>(l||[]).filter(r=>!r.da_loai).length;
  const L=l=>(l||[]).filter(r=>r.da_loai).length;
  const dtAllRec=data.doi_tuong||[];
  const counts=[

// ── Modal: liệt kê placeholder {{key}} của toàn bộ trường dữ liệu (F_UNIFIED) để chèn vào template mẫu ──
function PlaceholderModal({onClose,toast}){
  const [search,setSearch]=useState("");
  // Gom toàn bộ trường, loại trùng theo key (giữ field xuất hiện đầu tiên)
  const allFields=useMemo(()=>{
    const seen=new Set();const out=[];
    F_UNIFIED.forEach(f=>{
      if(!seen.has(f.k)){seen.add(f.k);out.push(f);}
      if((f.type==="select_other")&&!seen.has(f.k+"_other")){
        seen.add(f.k+"_other");out.push({k:f.k+"_other",lbl:f.lbl+" (khác - tự nhập)",grp:f.grp});
      }
    });
    TPL_DERIVED.forEach(f=>{if(!seen.has(f.k)){seen.add(f.k);out.push(f);}});
    TPL_GLOBAL.forEach(f=>{if(!seen.has(f.k)){seen.add(f.k);out.push(f);}});
    return out;
  },[]);
  // Tải file mẫu Excel demo: hàng tiêu đề + 1 dòng placeholder sẵn sàng chỉnh sửa
  const taiMauExcel=()=>{
    try{
      const cols=[
        ["STT","stt"],["Họ và tên","ho_ten"],["Ngày sinh","ngay_sinh"],["Giới tính","gioi_tinh"],
        ["Số CCCD","cccd"],["HKTT / Nơi ở","hktt_noi_o"],["Khu phố","khu_pho"],["Diện quản lý","dien_quan_ly"],
        ["Ngày vào sổ","ngay_vao_so"],["Loại ma túy","loai_ma_tuy"],["QĐ quản lý","qd_ql_so"],
        ["Thời hạn QL","qd_ql_tg"],["Có mặt","co_mat"],["Cập nhật PM","cap_nhat_pm"],["Ghi chú","ghi_chu"],
      ];
      const aoa=[
        [CONFIG.capTren.toUpperCase()],
        [CONFIG.donVi.toUpperCase()],
        [],
        ["DANH SÁCH ĐỐI TƯỢNG – {{ky_bao_cao}} (tổng số: {{so_luong}} đối tượng)"],
        [],
        cols.map(c=>c[0]),
        cols.map(c=>"{{"+c[1]+"}}"),
        [],
        ["","","","","","","","","","",CONFIG.quanHuyen+", ngày {{ngay_xuat_ngay}} tháng {{ngay_xuat_thang}} năm {{ngay_xuat_nam}}"],
        ["CÁN BỘ LẬP DANH SÁCH","","","","","","","","","","THỦ TRƯỞNG ĐƠN VỊ"],
      ];
      const ws=XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"]=cols.map((c,i)=>({wch:i===0?5:(i===1||i===5?26:16)}));
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,"Mau placeholder");
      XLSX.writeFile(wb,"MAU_PLACEHOLDER_EXCEL.xlsx");
      toast?.("Đã tải file mẫu Excel có sẵn placeholder","success");
    }catch(e){toast?.("Lỗi tạo file mẫu: "+e.message,"error");}
  };
  // Tải danh sách placeholder ra file .csv để tra cứu/copy khi soạn biểu mẫu
  const taiDanhSach=()=>{
    try{
      const rows=[["Placeholder","Ý nghĩa","Nhóm"],
        ...allFields.map(f=>["{{"+f.k+"}}",f.lbl||"",f.grp||""])];
      const ws=XLSX.utils.aoa_to_sheet(rows);
      ws["!cols"]=[{wch:34},{wch:70},{wch:34}];
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,"Placeholder");
      XLSX.writeFile(wb,"DANH_SACH_PLACEHOLDER.xlsx");
      toast?.("Đã tải danh sách "+allFields.length+" placeholder","success");
    }catch(e){toast?.("Lỗi tạo danh sách: "+e.message,"error");}
  };
  const groups=useMemo(()=>[...new Set(allFields.map(f=>f.grp||"Thông tin"))],[allFields]);
  const filtered=search.trim()
    ? allFields.filter(f=>(f.lbl||"").toLowerCase().includes(search.toLowerCase())||f.k.toLowerCase().includes(search.toLowerCase()))
    : allFields;

  const copyText=(t)=>{
    navigator.clipboard?.writeText(t).then(()=>toast?.("Đã sao chép!","success")).catch(()=>{});
  };
  const copyAll=()=>{
    const lines=allFields.map(f=>`{{${f.k}}} = ${f.lbl}`).join("\n");
    copyText(lines);
  };

  const {style:dragStyle,dragHandleProps}=useDraggableModal();
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(10,20,50,.6)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:1400,overflowY:"auto",padding:"12px 8px"}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:"#fff",borderRadius:14,width:"min(760px,98vw)",margin:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.3)",display:"flex",flexDirection:"column",maxHeight:"92vh",...dragStyle}}>
        <div {...dragHandleProps} style={{...dragHandleProps.style,background:"linear-gradient(135deg,#0d1b3e 0%,#1e3a6e 100%)",borderRadius:"14px 14px 0 0",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div>
            <div style={{color:"#fff",fontSize:15,fontWeight:700}}>🏷️ Placeholder tất cả các trường ({allFields.length})</div>

          Placeholder nhóm 🏛️ đặt ở tiêu đề/chữ ký sẽ <b>không</b> làm nhân dòng. &nbsp;

              <div key={g} style={{marginBottom:14}}>

                    <div key={f.k} style={{display:"flex",alignItems:"center",gap:8,background:"#f8fafd",border:"1px solid #e2e8f5",borderRadius:7,padding:"6px 10px"}}>

        </div>

    </div>
  );

// ── Chuyển 1 bản ghi đối tượng thành object {ten_truong: "giá trị hiển thị"} để điền vào template ──
// Lọc danh sách đối tượng theo khoảng ngày tạo hồ sơ trong hệ thống (_created).
// Để trống 1 hoặc cả 2 mốc = không giới hạn phía đó.
// Lọc theo NGÀY VÀO SỔ (mốc thống nhất toàn hệ thống); nếu bản ghi chưa có
// Ngày vào sổ thì lần lượt lấy Thời gian phát sinh mới → Ngày tạo bản ghi.
// Không chọn khoảng ngày = lấy toàn bộ.
function filterByDateRange(list,tuNgay,denNgay){
  if(!tuNgay&&!denNgay)return list.slice();
  return list.filter(r=>{
    const raw=r.ngay_vao_so||r.thoi_gian_ps||(r._created||"").slice(0,10);
    const d=_pd(raw);
    if(!d)return false;
    if(tuNgay){const f=_pd(tuNgay);if(f&&d<f)return false;}
    if(denNgay){const t=_pd(denNgay);if(t){t.setHours(23,59,59,999);if(d>t)return false;}}
    return true;
  });
}

// Giá trị các placeholder chung
function buildTemplateGlobals(ctx){
  const c=ctx||{};
  const d=new Date();
  const tu=c.tuNgay?fmtDate(c.tuNgay):"",den=c.denNgay?fmtDate(c.denNgay):"";
  return{
    don_vi:CONFIG.donVi,don_vi_hoa:String(CONFIG.donVi||"").toUpperCase(),
    cap_tren:CONFIG.capTren,quan_huyen:CONFIG.quanHuyen,
    so_luong:String(c.soLuong==null?"":c.soLuong),
    tu_ngay:tu||"Không giới hạn",den_ngay:den||"Không giới hạn",
    ky_bao_cao:(tu&&den)?`Từ ngày ${tu} đến ngày ${den}`:(tu?`Từ ngày ${tu}`:(den?`Đến ngày ${den}`:"Toàn bộ thời gian")),
    ngay_xuat:fmtDate(d.toISOString().slice(0,10)),
    ngay_xuat_ngay:String(d.getDate()).padStart(2,"0"),
    ngay_xuat_thang:String(d.getMonth()+1).padStart(2,"0"),
    ngay_xuat_nam:String(d.getFullYear()),
  };
}
function buildTemplateData(rec,idx,ctx){
  const out={};
  const seen=new Set();
  F_UNIFIED.forEach(f=>{
    if(seen.has(f.k))return;
    seen.add(f.k);
    let v=(f.type==="select"||f.type==="select_other")?dv(rec,f.k):rec[f.k];
    if(f.type==="bool")v=v?"X":"";
    else if(f.type==="date")v=v?fmtDate(v):"";
    else if(f.type==="nhom_selector")v=(rec.nhom||[]).map(id=>(NHOM_LIST.find(n=>n.id===id)||{}).lbl).filter(Boolean).join(", ");
    else if(v==null)v="";
    else v=String(v);
    out[f.k]=v;
    // Trường select_other còn có placeholder riêng {{ten_truong_other}} (chỉ chứa phần "tự nhập" khi chọn Khác)
    if(f.type==="select_other")out[f.k+"_other"]=rec[f.k+"_other"]||"";
  });
  // ── Placeholder phái sinh ──
  const nhom=rec.nhom||[];
  const ns=_pd(rec.ngay_sinh);
  const gt=String(rec.gioi_tinh||"");
  const hk=String(rec.hktt||"").trim(),no=String(rec.noi_o_ht||"").trim();
  const soLuot=rec.so_luot_goi_hoi||(rec.ngay_goi_hoi?String(rec.ngay_goi_hoi).split(",").filter(x=>x.trim()).length:"");
  out.stt=String((idx==null?0:idx)+1);
  out.nam_sinh=ns?String(ns.getFullYear()):"";
  out.tuoi=ns?String(new Date().getFullYear()-ns.getFullYear()):"";
  out.ngay_sinh_nam=gt==="Nam"?fmtDate(rec.ngay_sinh):"";
  out.ngay_sinh_nu=gt==="Nữ"?fmtDate(rec.ngay_sinh):"";
  out.x_nam=gt==="Nam"?"X":"";
  out.x_nu=gt==="Nữ"?"X":"";
  out.hktt_noi_o=(hk&&no&&hk!==no)?(hk+"\n"+no):(hk||no);
  out.dia_chi_rut_gon=no||hk;
  out.khu_pho=dv(rec,"khu_pho_moi")||dv(rec,"khu_pho_cu")||"";
  out.dien_quan_ly=nhom.map(id=>(NHOM_LIST.find(n=>n.id===id)||{}).lbl).filter(Boolean).join(", ");
  out.dien_quan_ly_ma=nhom.map(id=>(NHOM_LIST.find(n=>n.id===id)||{}).short).filter(Boolean).join(", ");
  NHOM_LIST.forEach(n=>{out["x_"+n.id]=nhom.includes(n.id)?"X":"";});
  out.tien_an_tien_su=rec.tien_an_ct||[rec.tien_an?"Tiền án":"",rec.tien_su?"Tiền sự":""].filter(Boolean).join(", ")||"";
  out.so_luot_goi_hoi_dem=String(soLuot||"");
  out.trang_thai=rec.da_loai?"Đã thanh loại":"Đang quản lý";
  out.ngay_loai=rec.ngay_loai?fmtDate(rec.ngay_loai):"";
  out.ly_do_loai=rec.ly_do_loai||"";
  // ── Placeholder chung (để dùng được cả bên trong vòng lặp) ──
  Object.assign(out,buildTemplateGlobals(ctx));
  return out;
}

// ── Modal: chọn 1 đối tượng + mở file mẫu Word (.docx) chứa placeholder {{...}} để tự động điền và tải xuống ──
function TemplateFillModal({onClose,toast,doiTuong}){
  const [tuNgay,setTuNgay]=useState("");
  const [denNgay,setDenNgay]=useState("");
  const [nhomLoc,setNhomLoc]=useState("");   // "" = tất cả các diện
  const [fileName,setFileName]=useState("");
  const [busy,setBusy]=useState(false);
  const fileInputRef=useRef();

  const matched=useMemo(()=>{
    const base=doiTuong.filter(r=>!r.da_loai&&(!nhomLoc||(r.nhom||[]).includes(nhomLoc)));
    return filterByDateRange(base,tuNgay,denNgay);
  },[doiTuong,tuNgay,denNgay,nhomLoc]);

  const pickFile=()=>fileInputRef.current&&fileInputRef.current.click();

  const doFill=(file)=>{
    if(matched.length===0){toast?.("Không có đối tượng nào phù hợp với khoảng ngày đã chọn","error");return;}
    if(!window.PizZip||!window.docxtemplater){toast?.("Chưa tải được thư viện điền mẫu Word. Kiểm tra kết nối mạng.","error");return;}
    setBusy(true);
    const reader=new FileReader();
    reader.onload=(e)=>{
      try{
        const zip=new window.PizZip(e.target.result);
        const doc=new window.docxtemplater(zip,{paragraphLoop:true,linebreaks:true,delimiters:{start:"{{",end:"}}"},nullGetter:()=>""});
        const ctx={soLuong:matched.length,tuNgay,denNgay};
        const items=matched.map((r,i)=>buildTemplateData(r,i,ctx));
        doc.render({items,...buildTemplateGlobals(ctx)});
        const out=doc.getZip().generate({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
        const url=URL.createObjectURL(out);
        const a=document.createElement("a");
        const base=(file.name||"mau").replace(/\.docx$/i,"");
        a.href=url;a.download=`${base} - ${items.length} đối tượng.docx`;
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),3000);
        toast?.(`Đã điền ${items.length} đối tượng vào mẫu và tải xuống!`,"success");
      }catch(err){
        console.error(err);
        const detail=err&&err.properties&&err.properties.errors
          ? err.properties.errors.map(e=>e.properties&&e.properties.explanation).filter(Boolean).join("; ")
          : (err&&err.message)||"";
        toast?.("Lỗi khi điền mẫu"+(detail?": "+detail:"")+". Kiểm tra file .docx có đúng cú pháp lặp {{#items}}...{{/items}} không.","error");
      }finally{
        setBusy(false);
      }
    };
    reader.onerror=()=>{setBusy(false);toast?.("Không đọc được file","error");};
    reader.readAsArrayBuffer(file);
  };

  const onFileChosen=(e)=>{
    const file=e.target.files&&e.target.files[0];
    if(!file)return;
    setFileName(file.name);
    doFill(file);
    e.target.value="";
  };

  const {style:dragStyle,dragHandleProps}=useDraggableModal();
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(10,20,50,.6)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:1400,overflowY:"auto",padding:"12px 8px"}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:"#fff",borderRadius:14,width:"min(600px,98vw)",margin:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.3)",display:"flex",flexDirection:"column",maxHeight:"92vh",...dragStyle}}>
        <div {...dragHandleProps} style={{...dragHandleProps.style,background:"linear-gradient(135deg,#0d1b3e 0%,#1e3a6e 100%)",borderRadius:"14px 14px 0 0",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div>
            <div style={{color:"#fff",fontSize:15,fontWeight:700}}>📝 Điền mẫu Word tự động (hàng loạt)</div>
            <div style={{color:"rgba(255,255,255,.6)",fontSize:11,marginTop:2}}>Chọn khoảng ngày → mở file mẫu .docx → tự động điền toàn bộ trường đã nhập</div>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.25)",cursor:"pointer",color:"#fff",width:30,height:30,borderRadius:7,fontSize:16}}>✕</button>
        </div>
        <div style={{padding:"18px 20px",overflowY:"auto"}}>
          {/* Bước 1: chọn khoảng ngày */}
          <div style={{fontSize:12.5,fontWeight:700,color:"#1e3a6e",marginBottom:6}}>Bước 1 – Chọn diện quản lý và khoảng ngày vào sổ</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
            {[{id:"",lbl:"Tất cả các diện",icon:"👥"},...NHOM_LIST].map(n=>(
              <button key={n.id||"all"} className="btn btn-sm"
                style={{background:nhomLoc===n.id?"#1e3a6e":"#fff",color:nhomLoc===n.id?"#fff":"#1e3a6e",
                  border:"1px solid #c7d2fe",fontSize:11.5}}
                onClick={()=>setNhomLoc(n.id)}>{n.icon} {n.lbl}</button>
            ))}
          </div>
          <DateRangeFilterBox tuNgay={tuNgay} setTuNgay={setTuNgay} denNgay={denNgay} setDenNgay={setDenNgay} count={matched.length}/>

          {/* Bước 2: mở file mẫu */}
          <div style={{fontSize:12.5,fontWeight:700,color:"#1e3a6e",marginBottom:6}}>Bước 2 – Mở file mẫu Word (.docx)</div>

            <code>{"{{#items}}"}</code> … <code>{"{{/items}}"}</code> (thẻ mở đặt ở ô đầu dòng, thẻ đóng ở ô cuối dòng).
            Trong dòng đó chèn placeholder theo tên trường, VD: <code>{"{{stt}}"}</code>, <code>{"{{ho_ten}}"}</code>,
            <code>{"{{ngay_sinh}}"}</code>, <code>{"{{cccd}}"}</code> (xem đầy đủ ở nút "🏷️ Tạo Placeholder").
            <br/>✅ Trong dòng lặp dùng được cả placeholder chung: <code>{"{{don_vi}}"}</code>, <code>{"{{ky_bao_cao}}"}</code>…
            <br/>✅ Ngoài bảng (tiêu đề, chữ ký) dùng: <code>{"{{so_luong}}"}</code>, <code>{"{{tu_ngay}}"}</code>,
            <code>{"{{den_ngay}}"}</code>, <code>{"{{ky_bao_cao}}"}</code>, <code>{"{{ngay_xuat}}"}</code>,
            <code>{"{{don_vi}}"}</code>, <code>{"{{cap_tren}}"}</code>.
            <br/>⚠️ Lưu ý Word hay cắt placeholder thành nhiều đoạn khi gõ chèn giữa chừng — nên gõ liền một mạch
            <code>{"{{ho_ten}}"}</code> hoặc dán từ nút copy trong danh sách placeholder.
          </div>

          </button>

  );

// ── Điền placeholder {{key}} vào mọi ô chuỗi của workbook Excel (giữ nguyên định dạng gốc) ──
// Điền placeholder {{key}} vào 1 dòng mẫu (chứa {{...}}) rồi nhân dòng đó cho từng đối tượng trong danh sách.
// Các dòng bên dưới dòng mẫu (nếu có, VD dòng tổng) sẽ được đẩy xuống tương ứng, giữ nguyên style từng ô.
function fillExcelBulk(wb,dataList,globals){
  const RE=/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g;
  const G=globals||{};
  const apply=(txt,obj)=>String(txt).replace(RE,(m,k)=>
    Object.prototype.hasOwnProperty.call(obj,k)?String(obj[k]==null?"":obj[k]):
    (Object.prototype.hasOwnProperty.call(G,k)?String(G[k]==null?"":G[k]):""));
  let totalFilled=0,sheetsDone=0;

  wb.SheetNames.forEach(sheetName=>{
    const ws=wb.Sheets[sheetName];
    if(!ws||!ws["!ref"])return;
    const range=XLSX.utils.decode_range(ws["!ref"]);

    // 1) Tìm dòng mẫu: dòng ĐẦU TIÊN có ô chứa placeholder của TRƯỜNG ĐỐI TƯỢNG
    //    (placeholder chung như {{don_vi}}, {{ngay_xuat}} không được coi là dòng mẫu,
    //    nếu không tiêu đề văn bản sẽ bị nhân bản theo số đối tượng).
    let templateRow=-1;
    for(let R=range.s.r;R<=range.e.r&&templateRow===-1;R++){
      for(let C=range.s.c;C<=range.e.c;C++){
        const cell=ws[XLSX.utils.encode_cell({r:R,c:C})];
        if(!cell||typeof cell.v!=="string")continue;
        let m;RE.lastIndex=0;
        while((m=RE.exec(cell.v))){
          if(!Object.prototype.hasOwnProperty.call(G,m[1])){templateRow=R;break;}
        }
        if(templateRow>=0)break;
      }
    }

    // 2) Không có dòng mẫu → chỉ thay các placeholder chung rồi sang sheet khác
    if(templateRow===-1){
      Object.keys(ws).forEach(addr=>{
        if(addr[0]==="!")return;
        const cell=ws[addr];
        if(cell&&typeof cell.v==="string"&&cell.v.indexOf("{{")!==-1){
          cell.v=apply(cell.v,G);cell.t="s";if(cell.f)delete cell.f;if(cell.w)delete cell.w;
        }
      });
      return;
    }

    // 3) Lưu lại các ô của dòng mẫu (giữ nguyên style), chiều cao và merge nằm trong dòng mẫu
    const templateCells={};
    for(let C=range.s.c;C<=range.e.c;C++){
      const addr=XLSX.utils.encode_cell({r:templateRow,c:C});
      if(ws[addr])templateCells[C]=ws[addr];
    }
    const tplHeight=(ws["!rows"]&&ws["!rows"][templateRow])?{...ws["!rows"][templateRow]}:null;
    const tplMerges=(ws["!merges"]||[]).filter(m=>m.s.r===templateRow&&m.e.r===templateRow)
      .map(m=>({c0:m.s.c,c1:m.e.c}));

    const n=Math.max(dataList.length,1);
    const shift=n-1;

    // 4) Đẩy các dòng nằm DƯỚI dòng mẫu xuống để chừa chỗ
    if(shift>0){
      const moved={};
      Object.keys(ws).forEach(addr=>{
        if(addr[0]==="!")return;
        const c=XLSX.utils.decode_cell(addr);
        if(c.r>templateRow){
          moved[XLSX.utils.encode_cell({r:c.r+shift,c:c.c})]=ws[addr];
          delete ws[addr];
        }
      });
      Object.assign(ws,moved);
      if(ws["!merges"]){
        ws["!merges"]=ws["!merges"].map(m=>({
          s:{r:m.s.r>templateRow?m.s.r+shift:m.s.r,c:m.s.c},
          e:{r:m.e.r>templateRow?m.e.r+shift:m.e.r,c:m.e.c},
        }));
      }
      if(ws["!rows"]&&ws["!rows"].length>templateRow){
        const rows=ws["!rows"];
        const head=rows.slice(0,templateRow+1);
        const tail=rows.slice(templateRow+1);
        ws["!rows"]=[...head,...Array(shift).fill(tplHeight||undefined),...tail];
      }
    }

    // 5) Ghi dữ liệu từng đối tượng, giữ nguyên style ô mẫu; nhân bản cả merge của dòng mẫu
    const merges=ws["!merges"]||[];
    dataList.forEach((dataObj,idx)=>{
      const R=templateRow+idx;
      Object.keys(templateCells).forEach(cKeyStr=>{
        const C=Number(cKeyStr);
        const tmplCell=templateCells[C];
        const addr=XLSX.utils.encode_cell({r:R,c:C});
        const newCell=Object.assign({},tmplCell);
        if(typeof tmplCell.v==="string"){
          newCell.v=apply(tmplCell.v,dataObj);
          newCell.t="s";
          if(newCell.f)delete newCell.f;
          if(newCell.w)delete newCell.w;
        }
        ws[addr]=newCell;
      });
      if(idx>0&&tplMerges.length)
        tplMerges.forEach(m=>merges.push({s:{r:R,c:m.c0},e:{r:R,c:m.c1}}));
      if(tplHeight){ws["!rows"]=ws["!rows"]||[];ws["!rows"][R]=ws["!rows"][R]||{...tplHeight};}
    });
    if(tplMerges.length)ws["!merges"]=merges;

    // 6) Thay placeholder chung ở phần còn lại của sheet (tiêu đề, kỳ báo cáo, chữ ký…)
    Object.keys(ws).forEach(addr=>{
      if(addr[0]==="!")return;
      const cRef=XLSX.utils.decode_cell(addr);
      if(cRef.r>=templateRow&&cRef.r<templateRow+dataList.length)return; // vùng dữ liệu đã xử lý
      const cell=ws[addr];
      if(cell&&typeof cell.v==="string"&&cell.v.indexOf("{{")!==-1){
        cell.v=apply(cell.v,G);cell.t="s";if(cell.f)delete cell.f;if(cell.w)delete cell.w;
      }
    });

    // 7) Cập nhật lại vùng dữ liệu (!ref)
    const newMaxRow=Math.max(range.e.r+Math.max(shift,0),templateRow+dataList.length-1);
    ws["!ref"]=XLSX.utils.encode_range({s:{r:range.s.r,c:range.s.c},e:{r:newMaxRow,c:range.e.c}});
    totalFilled=dataList.length;sheetsDone++;
  });

  if(!sheetsDone)throw new Error("Không tìm thấy ô nào chứa placeholder {{...}} trong file mẫu. Hãy chèn placeholder theo danh sách ở nút \"🏷️ Tạo Placeholder\".");
  return totalFilled;
}

// ── Modal: chọn khoảng ngày + mở file mẫu Excel (.xlsx) chứa 1 dòng placeholder {{...}} để tự động nhân bản & điền hàng loạt ──
function ExcelTemplateFillModal({onClose,toast,doiTuong}){
  const [tuNgay,setTuNgay]=useState("");
  const [denNgay,setDenNgay]=useState("");
  const [nhomLoc,setNhomLoc]=useState("");   // "" = tất cả các diện
  const [fileName,setFileName]=useState("");
  const [busy,setBusy]=useState(false);
  const fileInputRef=useRef();

  const matched=useMemo(()=>{
    const base=doiTuong.filter(r=>!r.da_loai&&(!nhomLoc||(r.nhom||[]).includes(nhomLoc)));
    return filterByDateRange(base,tuNgay,denNgay);
  },[doiTuong,tuNgay,denNgay,nhomLoc]);

  const pickFile=()=>fileInputRef.current&&fileInputRef.current.click();

  const doFill=(file)=>{
    if(matched.length===0){toast?.("Không có đối tượng nào phù hợp với khoảng ngày đã chọn","error");return;}
    if(!window.XLSX){toast?.("Chưa tải được thư viện xử lý Excel. Kiểm tra kết nối mạng.","error");return;}
    setBusy(true);
    const reader=new FileReader();
    reader.onload=(e)=>{
      try{
        const wb=XLSX.read(e.target.result,{type:"array",cellStyles:true,cellNF:true});
        const ctx={soLuong:matched.length,tuNgay,denNgay};
        const dataList=matched.map((r,i)=>buildTemplateData(r,i,ctx));
        const n=fillExcelBulk(wb,dataList,buildTemplateGlobals(ctx));
        const out=XLSX.write(wb,{bookType:"xlsx",type:"array",cellStyles:true});
        const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        const base=(file.name||"mau").replace(/\.xlsx$/i,"");
        a.href=url;a.download=`${base} - ${n} doi tuong.xlsx`;
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),3000);
        toast?.(`Đã điền ${n} đối tượng vào mẫu và tải xuống!`,"success");
      }catch(err){
        console.error(err);
        toast?.("Lỗi khi điền mẫu Excel: "+((err&&err.message)||"")+". Kiểm tra file .xlsx có đúng định dạng không.","error");
      }finally{
        setBusy(false);
      }
    };
    reader.onerror=()=>{setBusy(false);toast?.("Không đọc được file","error");};
    reader.readAsArrayBuffer(file);
  };

  const onFileChosen=(e)=>{
    const file=e.target.files&&e.target.files[0];
    if(!file)return;
    setFileName(file.name);
    doFill(file);
    e.target.value="";
  };

  const {style:dragStyle,dragHandleProps}=useDraggableModal();
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(10,20,50,.6)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:1400,overflowY:"auto",padding:"12px 8px"}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:"#fff",borderRadius:14,width:"min(600px,98vw)",margin:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.3)",display:"flex",flexDirection:"column",maxHeight:"92vh",...dragStyle}}>
        <div {...dragHandleProps} style={{...dragHandleProps.style,background:"linear-gradient(135deg,#7c3f00 0%,#f57c00 100%)",borderRadius:"14px 14px 0 0",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div>
            <div style={{color:"#fff",fontSize:15,fontWeight:700}}>📊 Điền mẫu Excel tự động (hàng loạt)</div>
            <div style={{color:"rgba(255,255,255,.75)",fontSize:11,marginTop:2}}>Chọn khoảng ngày → mở file mẫu .xlsx → tự động điền toàn bộ trường đã nhập</div>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.25)",cursor:"pointer",color:"#fff",width:30,height:30,borderRadius:7,fontSize:16}}>✕</button>
        </div>
        <div style={{padding:"18px 20px",overflowY:"auto"}}>
          {/* Bước 1: chọn khoảng ngày */}
          <div style={{fontSize:12.5,fontWeight:700,color:"#7c3f00",marginBottom:6}}>Bước 1 – Chọn diện quản lý và khoảng ngày vào sổ</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
            {[{id:"",lbl:"Tất cả các diện",icon:"👥"},...NHOM_LIST].map(n=>(
              <button key={n.id||"all"} className="btn btn-sm"
                style={{background:nhomLoc===n.id?"#f57c00":"#fff",color:nhomLoc===n.id?"#fff":"#7c3f00",
                  border:"1px solid #f0d878",fontSize:11.5}}
                onClick={()=>setNhomLoc(n.id)}>{n.icon} {n.lbl}</button>
            ))}
          </div>
          <DateRangeFilterBox tuNgay={tuNgay} setTuNgay={setTuNgay} denNgay={denNgay} setDenNgay={setDenNgay} count={matched.length} accent="#fff7ed"/>

          {/* Bước 2: mở file mẫu */}
          <div style={{fontSize:12.5,fontWeight:700,color:"#7c3f00",marginBottom:6}}>Bước 2 – Mở file mẫu Excel (.xlsx)</div>
          <div style={{background:"#fff9e6",border:"1px solid #f0d878",borderRadius:8,padding:"10px 12px",marginBottom:12,fontSize:11.5,lineHeight:1.6,color:"#7c5c00"}}>
            ⚠️ File mẫu cần có <b>1 dòng mẫu</b> chứa placeholder dạng <code>{"{{ten_truong}}"}</code> ở các ô cột cần điền
            (dùng danh sách ở nút "🏷️ Tạo Placeholder" để lấy đúng tên trường). Hệ thống tự nhân dòng đó cho từng đối tượng,
            giữ nguyên định dạng ô/viền/màu/chiều cao và cả ô đã gộp trong dòng; các dòng bên dưới (dòng tổng, chữ ký) tự đẩy xuống.
            <br/>✅ Đánh số thứ tự tự động bằng <code>{"{{stt}}"}</code>.
            <br/>✅ Các placeholder chung như <code>{"{{don_vi}}"}</code>, <code>{"{{ky_bao_cao}}"}</code>, <code>{"{{so_luong}}"}</code>,
            <code>{"{{ngay_xuat}}"}</code> đặt ở tiêu đề/chữ ký cũng được điền, và <b>không</b> làm nhân dòng.
            <br/>✅ Xử lý được nhiều sheet trong cùng một file mẫu.
          </div>
          <input ref={fileInputRef} type="file" accept=".xlsx" style={{display:"none"}} onChange={onFileChosen}/>
          <button className="btn btn-sm" style={{width:"100%",justifyContent:"center",background:"#f57c00",color:"#fff",padding:"9px"}} disabled={matched.length===0||busy} onClick={pickFile}>
            {busy?"⏳ Đang điền mẫu...":`📂 Mở file mẫu Excel & Xuất ${matched.length} đối tượng`}
          </button>
          {fileName&&!busy&&<div style={{fontSize:11.5,color:"#78909c",marginTop:8,textAlign:"center"}}>Mẫu đã dùng gần nhất: {fileName}</div>}
        </div>
      </div>
    </div>
  );
}

// SyncPage Component
function cellRef(r,c){return XLSX.utils.encode_cell({r,c});}
function setCell(ws,r,c,v){
  const ref=cellRef(r,c);
  const t=typeof v==="number"?"n":"s";
  // Preserve existing style
  const ex=ws[ref]||{};
  ws[ref]={...ex,v,t};
  if(!ws["!ref"]){ws["!ref"]=ref;}else{
    const range=XLSX.utils.decode_range(ws["!ref"]);
    const cr=XLSX.utils.decode_cell(ref);
    range.e.r=Math.max(range.e.r,cr.r);range.e.c=Math.max(range.e.c,cr.c);
    range.s.r=Math.min(range.s.r,cr.r);range.s.c=Math.min(range.s.c,cr.c);
    ws["!ref"]=XLSX.utils.encode_range(range);
  }
}
function findRow(ws,keyword,maxRows){
  if(!ws||!ws["!ref"])return -1;
  maxRows=maxRows||200;
  const range=XLSX.utils.decode_range(ws["!ref"]);
  const kw=keyword.toLowerCase();
  for(let r=0;r<=Math.min(range.e.r,maxRows);r++){
    for(let c=0;c<=Math.min(range.e.c,30);c++){
      const cell=ws[cellRef(r,c)];
      if(cell&&String(cell.v||"").toLowerCase().includes(kw))return r;
    }
  }
  return -1;
}
