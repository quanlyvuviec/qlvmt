// ── RaSoatPage: Rà soát kết quả xây dựng địa bàn không ma túy theo Khu phố ──
// Phần D,E,J,K,L,M,N,O,P,Q tự tính từ DS Người sử dụng/Người nghiện (đã gắn Khu phố).
// Phần F,G,H,I,R,S,T,U,V,X,Z là số liệu KHÔNG có sẵn trong hệ thống (nhân khẩu, truy nã,
// điểm tổ chức trong tháng, 5 tiêu chí phân loại mới...) – cán bộ nhập tay tại đây theo từng Khu phố.
function RaSoatPage({khuPho,raSoat,setRaSoat,data,dateRange,toast}){
  const allSD=(data.su_dung||[]).filter(r=>!r.da_loai);
  const allNG=(data.nghien||[]).filter(r=>!r.da_loai);
  const dr=dateRange||{from:"",to:""};

  const getRs=kpId=>raSoat.find(x=>x.khu_pho_id===kpId)||{khu_pho_id:kpId};
  const setField=async(kpId,key,val)=>{
    const exists=raSoat.some(x=>x.khu_pho_id===kpId);
    const next=exists
      ? raSoat.map(x=>x.khu_pho_id===kpId?{...x,[key]:val}:x)
      : [...raSoat,{khu_pho_id:kpId,id:uid(),[key]:val}];
    try{
      await saveStore(KEYS.ra_soat,next);setRaSoat(next);
    }catch(e){toast&&toast("❌ Lỗi lưu rà soát: "+e.message,"error");}
  };

  const computeRow=kp=>{
    const inKp=list=>list.filter(r=>r.khu_pho_moi===kp.ten_moi);
    const sdKp=inKp(allSD),ngKp=inKp(allNG);
    const sdPSkp=filterActive(sdKp,dr.from,dr.to,"thoi_gian_ps");
    const ngPSkpAll=filterActive(ngKp,dr.from,dr.to,"thoi_gian_ps");
    const ngPSkp=ngPSkpAll.filter(r=>r.hinh_thuc_cai!=="Điều trị Methadone");
    const ngMethadoneKp=ngKp.filter(r=>r.hinh_thuc_cai==="Điều trị Methadone");
    const ngKhongMethaKp=ngKp.filter(r=>r.hinh_thuc_cai!=="Điều trị Methadone");
    const ngThamGiaCai=ngKp.filter(r=>r.hinh_thuc_cai&&r.hinh_thuc_cai!=="Khác");
    const D=sdPSkp.length,E=ngPSkp.length;
    const J=sdPSkp.filter(r=>r.do_dv_khac_phat_hien).length;
    const K=ngPSkp.filter(r=>r.do_dv_khac_phat_hien).length;
    const L=sdKp.length,M=ngKhongMethaKp.length,N=ngMethadoneKp.length,O=ngThamGiaCai.length;
    return{D,E,J,K,L,M,N,O,tongNghien:ngKp.length};
  };

  const NumCell=({kp,field,width=64})=>{
    const rs=getRs(kp.id);
    const [v,setV]=useState(rs[field]??"");
    useEffect(()=>{setV(rs[field]??"");},[kp.id,raSoat.length]);
    return <input type="number" value={v} onChange={e=>setV(e.target.value)}
      onBlur={()=>setField(kp.id,field,e2val(v))}
      style={{width,padding:"5px 6px",border:"1.5px solid #dde3f0",borderRadius:6,fontSize:12,textAlign:"center"}}/>;
  };
  const e2val=v=>v===""?0:Number(v)||0;

  const totals=khuPho.reduce((acc,kp)=>{
    const c=computeRow(kp);const rs=getRs(kp.id);
    acc.D+=c.D;acc.E+=c.E;acc.L+=c.L;acc.M+=c.M;acc.N+=c.N;acc.O+=c.O;
    acc.I+=Number(rs.so_nhan_khau||0);
    return acc;
  },{D:0,E:0,L:0,M:0,N:0,O:0,I:0});

  return(
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">🗺️ Rà soát xây dựng địa bàn không ma túy</div>
          <div className="page-sub">
            <span className="badge badge-navy">{khuPho.length} khu phố</span>
            <span className="badge badge-teal">PS mới: {totals.D} SD / {totals.E} Nghiện</span>
            <span style={{fontSize:12,color:"var(--muted)"}}>Cột nền trắng = tự tính từ dữ liệu · Cột nền vàng = nhập tay</span>
          </div>
        </div>
      </div>

      {khuPho.length===0?(
        <div className="card" style={{padding:36,textAlign:"center",color:"var(--muted)"}}>
          <div style={{fontSize:46,marginBottom:10,opacity:.4}}>🏘️</div>
          <p style={{fontWeight:600,marginBottom:6}}>Chưa có danh mục Khu phố</p>
          <p style={{fontSize:12.5}}>Vào mục <b>"Danh mục Khu phố"</b> ở thanh menu để khai báo các khu phố/ấp của phường trước khi rà soát.</p>
        </div>
      ):(
      <div className="card">
        <div className="tbl-wrap">
          <table style={{fontSize:12}}>
            <thead>
              <tr>
                <th rowSpan={2} style={{minWidth:140}}>Khu phố</th>
                <th colSpan={2} style={{textAlign:"center",background:"#e3f2fd",color:"var(--navy)"}}>Phát sinh mới trong kỳ (tự tính)</th>
                <th rowSpan={2} style={{minWidth:70,background:"#fff8e1",color:"var(--navy)"}}>VPPL cư trú trên ĐB</th>
                <th rowSpan={2} style={{minWidth:60,background:"#fff8e1",color:"var(--navy)"}}>Truy nã</th>
                <th rowSpan={2} style={{minWidth:70,background:"#fff8e1",color:"var(--navy)"}}>Điểm TC trong tháng</th>
                <th rowSpan={2} style={{minWidth:80,background:"#fff8e1",color:"var(--navy)"}}>Tổng nhân khẩu</th>
                <th colSpan={2} style={{textAlign:"center",background:"#e3f2fd",color:"var(--navy)"}}>PS do ĐV khác bắt (tự tính)</th>
                <th colSpan={4} style={{textAlign:"center",background:"#e8f5e9",color:"var(--navy)"}}>Đang quản lý hiện hành (tự tính)</th>
                <th rowSpan={2} style={{minWidth:60,background:"#e8f5e9",color:"var(--navy)"}}>Tỷ lệ % tham gia cai</th>
                <th rowSpan={2} style={{minWidth:60,background:"#e8f5e9",color:"var(--navy)"}}>Tỷ lệ PS/nhân khẩu</th>
                <th colSpan={5} style={{textAlign:"center",background:"#fff8e1",color:"var(--navy)"}}>Tiêu chí 2 (mới) – 5 tiêu chí</th>
                <th rowSpan={2} style={{minWidth:50,background:"#fff8e1",color:"var(--navy)"}}>Truy nã ≥30 ngày</th>
                <th rowSpan={2} style={{minWidth:90,background:"#fff8e1",color:"var(--navy)"}}>Đăng ký XD địa bàn</th>
              </tr>
              <tr>
                <th style={{background:"#e3f2fd",color:"var(--navy)"}}>SD</th><th style={{background:"#e3f2fd",color:"var(--navy)"}}>Nghiện</th>
                <th style={{background:"#e3f2fd",color:"var(--navy)"}}>SD</th><th style={{background:"#e3f2fd",color:"var(--navy)"}}>Nghiện</th>
                <th style={{background:"#e8f5e9",color:"var(--navy)"}}>SD</th><th style={{background:"#e8f5e9",color:"var(--navy)"}}>Nghiện</th><th style={{background:"#e8f5e9",color:"var(--navy)"}}>Methadone</th><th style={{background:"#e8f5e9",color:"var(--navy)"}}>Tham gia cai</th>
                <th style={{background:"#fff8e1",color:"var(--navy)"}}>2.1</th><th style={{background:"#fff8e1",color:"var(--navy)"}}>2.2</th><th style={{background:"#fff8e1",color:"var(--navy)"}}>2.3</th><th style={{background:"#fff8e1",color:"var(--navy)"}}>2.4</th><th style={{background:"#fff8e1",color:"var(--navy)"}}>2.5</th>
              </tr>
            </thead>
            <tbody>
              {khuPho.map(kp=>{
                const c=computeRow(kp);
                const rs=getRs(kp.id);
                const pctTG=c.tongNghien?pct(c.O,c.tongNghien):0;
                const pctPS=rs.so_nhan_khau?(((c.D+c.E)/rs.so_nhan_khau*100).toFixed(2)):"0";
                return(
                  <tr key={kp.id}>
                    <td style={{fontWeight:700}}>{kp.ten_moi||kp.ten_cu}</td>
                    <td style={{textAlign:"center"}}>{c.D}</td><td style={{textAlign:"center"}}>{c.E}</td>
                    <td><NumCell kp={kp} field="so_vphp_cu_tru"/></td>
                    <td><NumCell kp={kp} field="so_truy_na"/></td>
                    <td><NumCell kp={kp} field="so_diem_tc_thang"/></td>
                    <td><NumCell kp={kp} field="so_nhan_khau" width={76}/></td>
                    <td style={{textAlign:"center"}}>{c.J}</td><td style={{textAlign:"center"}}>{c.K}</td>
                    <td style={{textAlign:"center"}}>{c.L}</td><td style={{textAlign:"center"}}>{c.M}</td><td style={{textAlign:"center"}}>{c.N}</td><td style={{textAlign:"center"}}>{c.O}</td>
                    <td style={{textAlign:"center",fontWeight:700}}>{pctTG}%</td>
                    <td style={{textAlign:"center",fontWeight:700}}>{pctPS}%</td>
                    <td><NumCell kp={kp} field="tc2_1"/></td>
                    <td><NumCell kp={kp} field="tc2_2"/></td>
                    <td><NumCell kp={kp} field="tc2_3"/></td>
                    <td><NumCell kp={kp} field="tc2_4"/></td>
                    <td><NumCell kp={kp} field="tc2_5"/></td>
                    <td><NumCell kp={kp} field="truy_na_30ngay"/></td>
                    <td>
                      <select value={rs.dang_ky_xd||""} onChange={e=>setField(kp.id,"dang_ky_xd",e.target.value)}
                        style={{width:"100%",padding:"5px 6px",border:"1.5px solid #dde3f0",borderRadius:6,fontSize:12}}>
                        <option value="">—</option><option value="Có">Có</option><option value="Không">Không</option>
                      </select>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      )}
      <div style={{background:"#e3f2fd",border:"1px solid #90caf9",borderRadius:8,padding:"10px 14px",fontSize:12,lineHeight:1.7,marginTop:12}}>
        💡 Vào mục <b>"Đồng bộ template"</b>, tải lên file mẫu gốc <b>MẪU RÀ SOÁT XÂY DỰNG ĐỊA BÀN KHÔNG MA TÚY.xlsx</b> –
        hệ thống sẽ tự nhận diện và điền đầy đủ các khu phố + số liệu (tự tính lẫn nhập tay) ở trên vào đúng vị trí.<br/>
        ⚠️ Bộ lọc ngày ở thanh bên trái (📅) quyết định khoảng thời gian tính "phát sinh mới" – hãy đặt đúng kỳ báo cáo trước khi xuất.
      </div>
    </div>
  );
}

// ── KhuPhoPage: Danh mục Khu phố/ấp/khu dân cư – CRUD tập trung ──
// Dùng chung làm dropdown cho mọi nhóm (SD/Nghiện/Sau cai) và làm trục
// nhóm dữ liệu cho báo cáo "Rà soát xây dựng địa bàn không ma túy".
function KhuPhoPage({khuPho,setKhuPho,toast}){
  const [form,setForm]=useState(null); // {mode,rec}
  const [delRec,setDelRec]=useState(null);

  const save=async rec=>{
    if(!String(rec.ten_moi||"").trim()){toast("Vui lòng nhập tên Khu phố (theo phương án sắp xếp mới)","error");return;}
    let next;
    if(form.mode==="add") next=[...khuPho,{...rec,id:uid()}];
    else next=khuPho.map(k=>k.id===form.rec.id?{...k,...rec}:k);
    try{
      await saveStore(KEYS.khu_pho,next);setKhuPho(next);syncKhuPhoOptions(next);
      setForm(null);toast(form.mode==="add"?"✅ Đã thêm Khu phố!":"✅ Đã cập nhật!","success");
    }catch(e){toast("❌ Lỗi lưu Khu phố: "+e.message,"error");}
  };
  const del=async()=>{
    const next=khuPho.filter(k=>k.id!==delRec.id);
    try{
      await saveStore(KEYS.khu_pho,next);setKhuPho(next);syncKhuPhoOptions(next);
      setDelRec(null);toast("Đã xóa Khu phố","info");
    }catch(e){toast("❌ Lỗi xóa Khu phố: "+e.message,"error");}
  };

  const Row=({rec})=>{
    const [tc,setTc]=useState(rec.ten_cu||"");
    const [tm,setTm]=useState(rec.ten_moi||"");
    return(
      <tr>
        <td><input value={tc} onChange={e=>setTc(e.target.value)} onBlur={()=>tc!==rec.ten_cu&&save0(rec,{ten_cu:tc})}
          style={{width:"100%",padding:"6px 8px",border:"1.5px solid #dde3f0",borderRadius:7,fontSize:12.5}}/></td>
        <td><input value={tm} onChange={e=>setTm(e.target.value)} onBlur={()=>tm!==rec.ten_moi&&save0(rec,{ten_moi:tm})}
          style={{width:"100%",padding:"6px 8px",border:"1.5px solid #dde3f0",borderRadius:7,fontSize:12.5,fontWeight:700}}/></td>
      </tr>
    );
  };
  const save0=async(rec,patch)=>{
    const next=khuPho.map(k=>k.id===rec.id?{...k,...patch}:k);
    try{
      await saveStore(KEYS.khu_pho,next);setKhuPho(next);syncKhuPhoOptions(next);
    }catch(e){toast("❌ Lỗi lưu Khu phố: "+e.message,"error");}
  };

  return(
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">🏘️ Danh mục Khu phố / ấp / khu dân cư</div>
          <div className="page-sub">
            <span className="badge badge-navy">{khuPho.length} khu phố</span>
            <span style={{fontSize:12,color:"var(--muted)"}}>Dùng chung cho DS Sử dụng / Nghiện / Sau cai &amp; báo cáo Rà soát địa bàn</span>
          </div>
        </div>
        <div className="btn-grp">
          <button className="btn btn-primary btn-sm" onClick={()=>setForm({mode:"add",rec:{ten_cu:"",ten_moi:""}})}>＋ Thêm khu phố</button>
        </div>
      </div>
      <div className="card">
        <div className="tbl-wrap">
          <table>
            <thead><tr>
              <th style={{minWidth:60}}>STT</th>
              <th style={{minWidth:220}}>Khu phố/ấp/khu dân cư CŨ</th>
              <th style={{minWidth:220}}>Khu phố/ấp/khu dân cư theo phương án sắp xếp MỚI</th>
              <th style={{width:90,textAlign:"center"}}>Thao tác</th>
            </tr></thead>
            <tbody>
              {khuPho.length===0&&<tr><td colSpan={4}>
                <div style={{textAlign:"center",padding:"40px",color:"var(--muted)"}}>
                  <div style={{fontSize:44,marginBottom:10,opacity:.4}}>🏘️</div>
                  <p style={{fontWeight:600}}>Chưa có Khu phố nào trong danh mục</p>
                  <p style={{fontSize:12}}>Nhấn <b>＋ Thêm khu phố</b> để bắt đầu (VD: Khu phố 1, Khu phố 2...)</p>
                </div>
              </td></tr>}
              {khuPho.map((k,i)=>(
                <tr key={k.id}>
                  <td>{i+1}</td>
                  <td><input defaultValue={k.ten_cu} onBlur={e=>e.target.value!==k.ten_cu&&save0(k,{ten_cu:e.target.value})}
                    style={{width:"100%",padding:"6px 8px",border:"1.5px solid #dde3f0",borderRadius:7,fontSize:12.5}}/></td>
                  <td><input defaultValue={k.ten_moi} onBlur={e=>e.target.value!==k.ten_moi&&save0(k,{ten_moi:e.target.value})}
                    style={{width:"100%",padding:"6px 8px",border:"1.5px solid #dde3f0",borderRadius:7,fontSize:12.5,fontWeight:700}}/></td>
                  <td><div className="actions">
                    <button className="btn btn-sm btn-icon act-delete" title="Xóa" onClick={()=>setDelRec(k)}>🗑️</button>
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      <div style={{background:"#e3f2fd",border:"1px solid #90caf9",borderRadius:8,padding:"10px 14px",fontSize:12,lineHeight:1.6,marginTop:12}}>
        💡 Sửa trực tiếp trong bảng (gõ rồi bấm ra ngoài ô để lưu). Tên khu phố này sẽ xuất hiện trong ô chọn "Khu phố" khi
        thêm/sửa hồ sơ Người sử dụng, Người nghiện, Quản lý sau cai – và là trục dữ liệu của báo cáo <b>Rà soát địa bàn không ma túy</b>.
      </div>
      {form&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:1800,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:"#fff",borderRadius:14,width:"min(420px,96vw)",padding:20}}>
            <h3 style={{marginBottom:14,fontSize:15,color:"var(--navy)"}}>＋ Thêm Khu phố</h3>
            <label style={{fontSize:11.5,fontWeight:700,color:"#475569"}}>Khu phố/ấp/khu dân cư cũ</label>
            <input autoFocus defaultValue={form.rec.ten_cu} onChange={e=>form.rec.ten_cu=e.target.value}
              style={{width:"100%",padding:"9px 10px",border:"1.5px solid #dde3f0",borderRadius:8,fontSize:13,margin:"5px 0 12px",boxSizing:"border-box"}}/>
            <label style={{fontSize:11.5,fontWeight:700,color:"#475569"}}>Khu phố/ấp/khu dân cư theo phương án sắp xếp mới *</label>
            <input defaultValue={form.rec.ten_moi} onChange={e=>form.rec.ten_moi=e.target.value}
              style={{width:"100%",padding:"9px 10px",border:"1.5px solid #dde3f0",borderRadius:8,fontSize:13,margin:"5px 0 16px",boxSizing:"border-box"}}/>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button className="btn btn-ghost btn-sm" onClick={()=>setForm(null)}>Hủy</button>
              <button className="btn btn-primary btn-sm" onClick={()=>save(form.rec)}>💾 Lưu</button>
            </div>
          </div>
        </div>
      )}
      {delRec&&<Confirm msg={`Xóa khu phố "${delRec.ten_moi||delRec.ten_cu}"? (Các hồ sơ đã gán khu phố này sẽ không bị xóa, chỉ mất khỏi danh mục)`} onOk={del} onCancel={()=>setDelRec(null)}/>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════
// DanhSachCanBoPage – Danh mục Cán bộ/Chỉ huy, CRUD tập trung
// Dùng chung cho ô chọn "Cán bộ được phân công theo dõi" và
// "Chỉ huy được phân công theo dõi" ở mọi nhóm quản lý (cột 18/19 PL1B).
// ══════════════════════════════════════════════════════════════
function DanhSachCanBoPage({canBoData,setCanBoData,toast}){
  const [form,setForm]=useState(null); // {mode,rec}
  const [delRec,setDelRec]=useState(null);
  const [importBusy,setImportBusy]=useState(false);
  const [importResult,setImportResult]=useState(null); // {added,updated,total}
  const importRef=useRef();

  const save=async rec=>{
    if(!String(rec.ho_ten||"").trim()){toast("Vui lòng nhập họ tên cán bộ","error");return;}
    let next;
    if(form.mode==="add") next=[...canBoData,{...rec,id:uid()}];
    else next=canBoData.map(c=>c.id===form.rec.id?{...c,...rec}:c);
    try{
      await saveStore(KEYS.can_bo,next);setCanBoData(next);syncCanBoOptions(next);
      setForm(null);toast(form.mode==="add"?"✅ Đã thêm cán bộ!":"✅ Đã cập nhật!","success");
    }catch(e){toast("❌ Lỗi lưu cán bộ: "+e.message,"error");}
  };
  const del=async()=>{
    const next=canBoData.filter(c=>c.id!==delRec.id);
    try{
      await saveStore(KEYS.can_bo,next);setCanBoData(next);syncCanBoOptions(next);
      setDelRec(null);toast("Đã xóa khỏi danh mục","info");
    }catch(e){toast("❌ Lỗi xóa cán bộ: "+e.message,"error");}
  };
  const save0=async(rec,patch)=>{
    const next=canBoData.map(c=>c.id===rec.id?{...c,...patch}:c);
    try{
      await saveStore(KEYS.can_bo,next);setCanBoData(next);syncCanBoOptions(next);
    }catch(e){toast("❌ Lỗi lưu cán bộ: "+e.message,"error");}
  };

  // ── Nhập/cập nhật danh sách từ file Excel có sẵn ──
  // Tự dò dòng tiêu đề chứa "Họ và Tên" / "Chức vụ" (không phụ thuộc vị trí cột/dòng cố định),
  // bỏ qua dòng trống (do các dòng dữ liệu trong mẫu bị merge cách dòng). Cán bộ trùng họ tên
  // (không phân biệt hoa/thường, khoảng trắng) sẽ được CẬP NHẬT chức vụ thay vì tạo trùng.
  // Chức vụ có chứa "trưởng" (Trưởng CAP, Phó trưởng CAP, Đội trưởng...) tự đánh dấu là chỉ huy.
  const normTen=n=>String(n||"").toLowerCase().replace(/\s+/g," ").trim();
  const importFromExcel=async file=>{
    if(!file||!/\.xlsx?$/i.test(file.name)){toast("Vui lòng chọn file .xlsx / .xls","error");return;}
    setImportBusy(true);setImportResult(null);
    const reader=new FileReader();
    reader.onload=async e=>{
      try{
        const b64=e.target.result.split(",")[1];
        const wb=XLSX.read(b64,{type:"base64"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
        // Dò dòng tiêu đề: có 1 ô khớp "họ...tên" và 1 ô khớp "chức vụ"
        let headerRow=-1,colHoTen=-1,colChucVu=-1;
        for(let i=0;i<aoa.length;i++){
          const row=aoa[i];
          let hTen=-1,hCv=-1;
          row.forEach((cell,ci)=>{
            const s=normTen(cell);
            if(hTen===-1&&/^h[ọo]\s*(và|va)?\s*t[êe]n/.test(s))hTen=ci;
            if(hCv===-1&&/ch[ứu]c\s*v[ụu]/.test(s))hCv=ci;
          });
          if(hTen!==-1&&hCv!==-1){headerRow=i;colHoTen=hTen;colChucVu=hCv;break;}
        }
        if(headerRow===-1)throw new Error('Không tìm thấy dòng tiêu đề có cột "Họ và Tên" và "Chức vụ" trong file.');

        const existingMap={};
        canBoData.forEach(c=>{existingMap[normTen(c.ho_ten)]=c;});
        let next=[...canBoData];
        let added=0,updated=0;
        for(let i=headerRow+1;i<aoa.length;i++){
          const row=aoa[i];
          const hoTen=String(row[colHoTen]||"").trim();
          if(!hoTen)continue; // bỏ qua dòng trống (do merge cách dòng trong file mẫu)
          const chucVu=String(row[colChucVu]||"").trim();
          const laChiHuy=/trưởng|chỉ huy/i.test(chucVu);
          const key=normTen(hoTen);
          const existed=existingMap[key];
          if(existed){
            next=next.map(c=>c.id===existed.id?{...c,ho_ten:hoTen,chuc_vu:chucVu||c.chuc_vu,la_chi_huy:chucVu?laChiHuy:c.la_chi_huy}:c);
            updated++;
          }else{
            const rec={id:uid(),ho_ten:hoTen,chuc_vu:chucVu,la_chi_huy:laChiHuy};
            next.push(rec);
            existingMap[key]=rec; // tránh trùng nếu file có tên lặp lại
            added++;
          }
        }
        await saveStore(KEYS.can_bo,next);
        setCanBoData(next);syncCanBoOptions(next);
        setImportResult({added,updated,total:added+updated});
        toast(`✅ Đã nhập: thêm mới ${added}, cập nhật ${updated}`,"success");
      }catch(err){
        toast("Lỗi đọc file: "+err.message,"error");
      }
      setImportBusy(false);
    };
    reader.onerror=()=>{setImportBusy(false);toast("Không đọc được file","error");};
    reader.readAsDataURL(file);
  };

  return(
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">👮 Danh sách cán bộ / chỉ huy</div>
          <div className="page-sub">
            <span className="badge badge-navy">{canBoData.length} người</span>
            <span style={{fontSize:12,color:"var(--muted)"}}>Dùng cho ô chọn "Cán bộ/Chỉ huy được phân công theo dõi" (cột 18/19 PL1B) ở mọi nhóm quản lý</span>
          </div>
        </div>
        <div className="btn-grp">
          <input ref={importRef} type="file" accept=".xlsx,.xls" style={{display:"none"}}
            onChange={e=>{const f=e.target.files&&e.target.files[0];if(f)importFromExcel(f);e.target.value="";}}/>
          <button className="btn btn-sm" style={{background:"#0d9488",color:"#fff"}} disabled={importBusy} onClick={()=>importRef.current&&importRef.current.click()}>
            {importBusy?"⏳ Đang nhập...":"📥 Nhập từ Excel"}
          </button>
          <button className="btn btn-primary btn-sm" onClick={()=>setForm({mode:"add",rec:{ho_ten:"",chuc_vu:"",la_chi_huy:false,la_cskv:false,la_pctp:false}})}>＋ Thêm cán bộ</button>
        </div>
      </div>
      {importResult&&(
        <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,padding:"10px 14px",marginBottom:16,fontSize:12.5,color:"#166534",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span>✅ Kết quả nhập file: thêm mới <b>{importResult.added}</b>, cập nhật <b>{importResult.updated}</b> (tổng {importResult.total} dòng hợp lệ).</span>
          <button className="btn btn-ghost btn-sm" onClick={()=>setImportResult(null)}>✕</button>
        </div>
      )}
      <div className="card">
        <div className="tbl-wrap">
          <table>
            <thead><tr>
              <th style={{minWidth:50}}>STT</th>
              <th style={{minWidth:220}}>Họ và tên</th>
              <th style={{minWidth:200}}>Chức vụ</th>
              <th style={{width:130,textAlign:"center"}}>Là chỉ huy?</th>
              <th style={{width:80,textAlign:"center"}}>CSKV</th>
              <th style={{width:80,textAlign:"center"}}>PCTP</th>
              <th style={{width:90,textAlign:"center"}}>Thao tác</th>
            </tr></thead>
            <tbody>
              {canBoData.length===0&&<tr><td colSpan={7}>
                <div style={{textAlign:"center",padding:"40px",color:"var(--muted)"}}>
                  <div style={{fontSize:44,marginBottom:10,opacity:.4}}>👮</div>
                  <p style={{fontWeight:600}}>Chưa có cán bộ nào trong danh mục</p>
                  <p style={{fontSize:12}}>Nhấn <b>＋ Thêm cán bộ</b> để bắt đầu</p>
                </div>
              </td></tr>}
              {canBoData.map((c,i)=>(
                <tr key={c.id}>
                  <td>{i+1}</td>
                  <td><input defaultValue={c.ho_ten} onBlur={e=>e.target.value!==c.ho_ten&&save0(c,{ho_ten:e.target.value})}
                    style={{width:"100%",padding:"6px 8px",border:"1.5px solid #dde3f0",borderRadius:7,fontSize:12.5,fontWeight:700}}/></td>
                  <td><input defaultValue={c.chuc_vu} placeholder="VD: Cán bộ, Đội trưởng, Trưởng CAP..."
                    onBlur={e=>e.target.value!==c.chuc_vu&&save0(c,{chuc_vu:e.target.value})}
                    style={{width:"100%",padding:"6px 8px",border:"1.5px solid #dde3f0",borderRadius:7,fontSize:12.5}}/></td>
                  <td style={{textAlign:"center"}}>
                    <input type="checkbox" checked={!!c.la_chi_huy} onChange={e=>save0(c,{la_chi_huy:e.target.checked})} style={{width:17,height:17,cursor:"pointer"}}/>
                  </td>
                  <td style={{textAlign:"center"}}>
                    <input type="checkbox" checked={!!c.la_cskv} onChange={e=>save0(c,{la_cskv:e.target.checked,la_pctp:e.target.checked?false:c.la_pctp})} style={{width:17,height:17,cursor:"pointer"}}/>
                  </td>
                  <td style={{textAlign:"center"}}>
                    <input type="checkbox" checked={!!c.la_pctp} onChange={e=>save0(c,{la_pctp:e.target.checked,la_cskv:e.target.checked?false:c.la_cskv})} style={{width:17,height:17,cursor:"pointer"}}/>
                  </td>
                  <td><div className="actions">
                    <button className="btn btn-sm btn-icon act-delete" title="Xóa" onClick={()=>setDelRec(c)}>🗑️</button>
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
      <div style={{background:"#e3f2fd",border:"1px solid #90caf9",borderRadius:8,padding:"10px 14px",fontSize:12,lineHeight:1.6,marginTop:12}}>
        💡 Sửa trực tiếp trong bảng (gõ rồi bấm ra ngoài ô để lưu). Tick <b>"Là chỉ huy?"</b> để người này chỉ xuất hiện trong ô chọn
        <b> "Chỉ huy được phân công theo dõi"</b> (không hiện trong ô "Cán bộ được phân công theo dõi").
        Tick <b>CSKV</b> hoặc <b>PCTP</b> (chỉ chọn 1 trong 2) để khi thêm người này vào ô "Cán bộ được phân công theo dõi",
        tên sẽ tự kèm nhãn, VD: <code>Nguyễn Hoàng Duy (CSKV) - Đặng Ngọc Thành (PCTP)</code>.<br/>
        📥 <b>Nhập từ Excel:</b> chọn file có cột "Họ và Tên" và "Chức vụ" (không cần đúng vị trí cột/dòng cố định, hệ thống tự dò).
        Người trùng họ tên sẽ được <b>cập nhật</b> chức vụ thay vì tạo bản ghi mới. Chức vụ có chữ "trưởng" (Trưởng CAP, Phó trưởng CAP...) sẽ tự động tick "Là chỉ huy?".
      </div>
      {form&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.45)",zIndex:1800,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div style={{background:"#fff",borderRadius:14,width:"min(420px,96vw)",padding:20}}>
            <h3 style={{marginBottom:14,fontSize:15,color:"var(--navy)"}}>＋ Thêm cán bộ</h3>
            <label style={{fontSize:11.5,fontWeight:700,color:"#475569"}}>Họ và tên *</label>
            <input autoFocus defaultValue={form.rec.ho_ten} onChange={e=>form.rec.ho_ten=e.target.value}
              style={{width:"100%",padding:"9px 10px",border:"1.5px solid #dde3f0",borderRadius:8,fontSize:13,margin:"5px 0 12px",boxSizing:"border-box"}}/>
            <label style={{fontSize:11.5,fontWeight:700,color:"#475569"}}>Chức vụ</label>
            <input defaultValue={form.rec.chuc_vu} placeholder="VD: Cán bộ, Đội trưởng, Trưởng CAP..." onChange={e=>form.rec.chuc_vu=e.target.value}
              style={{width:"100%",padding:"9px 10px",border:"1.5px solid #dde3f0",borderRadius:8,fontSize:13,margin:"5px 0 12px",boxSizing:"border-box"}}/>
            <label style={{fontSize:12.5,display:"flex",alignItems:"center",gap:8,marginBottom:10,cursor:"pointer"}}>
              <input type="checkbox" defaultChecked={form.rec.la_chi_huy} onChange={e=>form.rec.la_chi_huy=e.target.checked} style={{width:16,height:16}}/>
              Là chỉ huy (hiện trong ô chọn "Chỉ huy được phân công theo dõi")
            </label>
            <div style={{display:"flex",gap:16,marginBottom:16}}>
              <label style={{fontSize:12.5,display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
                <input type="checkbox" defaultChecked={form.rec.la_cskv} onChange={e=>{form.rec.la_cskv=e.target.checked;if(e.target.checked)form.rec.la_pctp=false;}} style={{width:16,height:16}}/>
                CSKV
              </label>
              <label style={{fontSize:12.5,display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
                <input type="checkbox" defaultChecked={form.rec.la_pctp} onChange={e=>{form.rec.la_pctp=e.target.checked;if(e.target.checked)form.rec.la_cskv=false;}} style={{width:16,height:16}}/>
                PCTP
              </label>
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button className="btn btn-ghost btn-sm" onClick={()=>setForm(null)}>Hủy</button>
              <button className="btn btn-primary btn-sm" onClick={()=>save(form.rec)}>💾 Lưu</button>
            </div>
          </div>
        </div>
      )}
      {delRec&&<Confirm msg={`Xóa "${delRec.ho_ten}" khỏi danh mục cán bộ? (Các hồ sơ đã ghi tên này sẽ không bị xóa, chỉ mất khỏi danh sách chọn)`} onOk={del} onCancel={()=>setDelRec(null)}/>}
    </div>
  );
}

// CauHinhPage – Cấu hình hệ thống & Firebase
// ══════════════════════════════════════════════════════════════
function CauHinhPage({toast,onConfigChange}){
  const initCfg=loadSysCfg();
  const [donVi,setDonVi]=useState(initCfg.donVi||CONFIG.donVi);
  const [capTren,setCapTren]=useState(initCfg.capTren||CONFIG.capTren);
  const [quanHuyen,setQuanHuyen]=useState(initCfg.quanHuyen||CONFIG.quanHuyen);
  const [fbCfg,setFbCfg]=useState(initCfg.firebase||{
    apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:"",
    sharedEmail:"",sharedPassword:""
  });
  const [fbStatus,setFbStatus]=useState(()=>_fbDb?(_fbAuthOk?"Đã kết nối Firebase + đăng nhập OK":"Đã kết nối Firebase (đang đăng nhập...)"):"Chưa kết nối");
  const [testLoading,setTestLoading]=useState(false);
  const [localFileName,setLocalFileName]=useState(null);
  const [localBusy,setLocalBusy]=useState(false);
  // Khoá trang Cấu hình bằng mật khẩu đăng nhập (dùng chung với mật khẩu vào app)
  const [unlocked,setUnlocked]=useState(false);
  const [lockPwd,setLockPwd]=useState("");
  const [lockErr,setLockErr]=useState("");

  useEffect(()=>{
    (async()=>{
      const h=await getLocalFileHandle();
      setLocalFileName(h?h.name:null);
    })();
  },[]);

  // ── Tự động lưu cấu hình Firebase ngay khi người dùng nhập, KHÔNG cần bấm nút ──
  // Mỗi khi các trường Kết nối Firebase Firestore thay đổi, sau khi người dùng
  // ngừng gõ ~900ms, bản nháp được lưu ngay vào localStorage (để không bao giờ
  // mất khi đóng/mở lại trang), và nếu đã đủ 2 trường bắt buộc (API Key +
  // Project ID) thì tự động kết nối + đăng nhập luôn, không cần bấm "Kết nối Firebase".
  const isFirstFbRender=useRef(true);
  const autoSaveFb=useRef(debounce(async(cfgToSave)=>{
    const cfg=loadSysCfg();
    saveSysCfg({...cfg,firebase:cfgToSave});
    if(cfgToSave.apiKey&&cfgToSave.projectId){
      const ok=initFirebase(cfgToSave);
      if(ok){
        if(cfgToSave.sharedEmail&&cfgToSave.sharedPassword){
          setFbStatus("Đang đăng nhập tài khoản Firebase Auth (tự động lưu)...");
          const authOk=await _fbAuthReady;
          setFbStatus(authOk
            ?"✅ Đã kết nối Firebase + đăng nhập thành công (đã tự động lưu)"
            :"⚠️ Kết nối Firestore OK nhưng ĐĂNG NHẬP THẤT BẠI – kiểm tra Email/Mật khẩu.");
        }else{
          setFbStatus("Đã kết nối Firestore (đã tự động lưu) – CHƯA có tài khoản dùng chung");
        }
      }
    }
  },900)).current;
  useEffect(()=>{
    if(isFirstFbRender.current){isFirstFbRender.current=false;return;} // bỏ qua lần nạp ban đầu từ storage
    autoSaveFb(fbCfg);
  },[fbCfg]);
  // Huỷ lịch tự-lưu còn treo khi rời trang Cấu hình, tránh cập nhật state
  // sau khi component đã unmount (VD người dùng gõ dở rồi chuyển trang ngay).
  useEffect(()=>()=>autoSaveFb.cancel(),[]);

  const chonFileCucBo=async()=>{
    setLocalBusy(true);
    try{
      const h=await pickLocalSyncFile();
      setLocalFileName(h.name);
      await writeLocalBackup(_localSyncSnapshot); // ghi ngay bản hiện tại vào file vừa chọn
      toast("✅ Đã gắn file sao lưu trên máy: "+h.name,"success");
    }catch(e){
      if(e && e.name!=="AbortError")toast("❌ "+e.message,"error");
    }
    setLocalBusy(false);
  };

  const ngatFileCucBo=async()=>{
    await clearLocalFileHandle();
    setLocalFileName(null);
    toast("Đã ngắt kết nối file sao lưu trên máy.","info");
  };

  const khoiPhucTuFile=async()=>{
    if(!window.confirm("Toàn bộ dữ liệu hiện tại sẽ được GHI ĐÈ bằng nội dung trong file đã chọn (và đẩy lên Firebase nếu đang kết nối). Tiếp tục?"))return;
    setLocalBusy(true);
    try{
      const backup=await readLocalBackup();
      const entries=Object.entries(backup.data||{});
      if(entries.length===0)throw new Error("File sao lưu trống hoặc không hợp lệ.");
      for(const[k,v]of entries){
        await window.storage.set(k,v); // ghi thẳng vào storage đang hoạt động (Firebase nếu đã kết nối, ngược lại localStorage)
      }
      toast("✅ Đã khôi phục "+entries.length+" mục dữ liệu. Đang tải lại trang...","success");
      setTimeout(()=>window.location.reload(),1200);
    }catch(e){
      toast("❌ Lỗi khôi phục: "+e.message,"error");
    }
    setLocalBusy(false);
  };

  const saveGeneral=()=>{
    const cfg=loadSysCfg();
    const next={...cfg,donVi,capTren,quanHuyen};
    saveSysCfg(next);
    CONFIG.donVi=donVi;CONFIG.capTren=capTren;CONFIG.quanHuyen=quanHuyen;
    toast("✅ Đã lưu thông tin đơn vị!","success");
  };

  const saveFb=async()=>{
    if(!!fbCfg.sharedEmail!==!!fbCfg.sharedPassword){
      toast("⚠️ Cần điền đủ cả Email và Mật khẩu tài khoản dùng chung (hoặc để trống cả hai).","error");
      return;
    }
    const cfg=loadSysCfg();
    const next={...cfg,firebase:fbCfg};
    saveSysCfg(next);
    const ok=initFirebase(fbCfg);
    if(!ok){setFbStatus("Lỗi – kiểm tra lại cấu hình");toast("❌ Lỗi kết nối Firebase – kiểm tra lại API Key / Project ID","error");return;}
    if(fbCfg.sharedEmail&&fbCfg.sharedPassword){
      setFbStatus("Đang đăng nhập tài khoản Firebase Auth...");
      const authOk=await _fbAuthReady;
      if(authOk){
        setFbStatus("✅ Đã kết nối Firebase + đăng nhập thành công");
        toast("✅ Kết nối & đăng nhập Firebase thành công! Reload để áp dụng.","success");
        saveSysCfg(next); // đẩy lại cấu hình lên Firebase ngay khi vừa kết nối lần đầu thành công
      }
      else{setFbStatus("⚠️ Kết nối Firestore OK nhưng ĐĂNG NHẬP THẤT BẠI – kiểm tra Email/Mật khẩu, hoặc tài khoản chưa được tạo trong Firebase Console → Authentication → Users.");toast("❌ Đăng nhập Firebase Auth thất bại – xem chi tiết bên dưới","error");}
    }else{
      setFbStatus("Đã kết nối Firestore – CHƯA có tài khoản dùng chung (chỉ nên dùng khi Rules đang mở tạm thời)");
      toast("✅ Đã kết nối Firebase. Lưu ý: chưa nhập tài khoản dùng chung nên sẽ KHÔNG đăng nhập được nếu Rules yêu cầu xác thực.","info");
    }
  };

  const testFb=async()=>{
    setTestLoading(true);
    try{
      const authOk=await _fbAuthReady;
      if(fbCfg.sharedEmail&&!authOk)throw new Error("Đăng nhập Firebase Auth thất bại (kiểm tra Email/Mật khẩu tài khoản dùng chung, hoặc Rules yêu cầu xác thực nhưng chưa đăng nhập được)");
      await window.storage.set("_fb_test","ok");
      const r=await window.storage.get("_fb_test");
      await window.storage.delete("_fb_test");
      if(r&&r.value==="ok"){setFbStatus("✅ Kết nối OK – đang dùng "+getStorageMode()+(authOk?" (đã đăng nhập Firebase Auth)":""));toast("✅ Firebase hoạt động tốt!","success");}
      else throw new Error("Không đọc được dữ liệu");
    }catch(e){setFbStatus("❌ Lỗi: "+e.message);toast("❌ "+e.message,"error");}
    setTestLoading(false);
  };

  const clearFb=()=>{
    const cfg=loadSysCfg();
    const next={...cfg,firebase:{}};
    saveSysCfg(next);
    if(_fbAuth)_fbAuth.signOut().catch(()=>{});
    _fbDb=null;_fbApp=null;_fbAuth=null;_fbAuthOk=false;_fbAuthReady=Promise.resolve(false);
    setFbCfg({apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:"",sharedEmail:"",sharedPassword:""});
    setFbStatus("Chưa kết nối – đang dùng localStorage");
    toast("Đã xóa cấu hình Firebase. Hệ thống dùng localStorage.","info");
  };

  // ── Nạp / xuất cấu hình Firebase bằng file .txt ──
  // Dùng cho trường hợp trình duyệt (đặc biệt trên điện thoại) không giữ được
  // localStorage giữa các lần mở file (Safari/WebView trong app Zalo, Messenger...
  // thường xoá dữ liệu trang khi đóng, hoặc mỗi lần mở lại là 1 bản file tải mới).
  // Giải pháp: xuất cấu hình đã nhập đúng 1 lần ra 1 file .txt nhỏ, lưu trong máy/Drive,
  // rồi mỗi lần mở app chỉ cần bấm "Nạp từ file .txt" để tự điền + tự kết nối lại,
  // không cần gõ tay từng trường nữa.
  const fbTxtFileRef=useRef();
  const FB_TXT_KEYS=["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId","sharedEmail","sharedPassword"];
  const parseFbTxt=(text)=>{
    const out={};
    text.split(/\r?\n/).forEach(line=>{
      const s=line.trim();
      if(!s||s.startsWith("#")||s.startsWith("//"))return;
      const m=s.match(/^([A-Za-z0-9_]+)\s*[:=]\s*(.*)$/);
      if(!m)return;
      let key=m[1].trim();
      let val=m[2].trim();
      if((val.startsWith('"')&&val.endsWith('"'))||(val.startsWith("'")&&val.endsWith("'")))val=val.slice(1,-1);
      // chấp nhận cả tên viết hoa/thường/có gạch dưới, map về đúng key trong fbCfg
      const found=FB_TXT_KEYS.find(k=>k.toLowerCase()===key.toLowerCase()||key.toLowerCase()===k.replace(/([A-Z])/g,"_$1").toLowerCase());
      if(found)out[found]=val;
    });
    return out;
  };
  const importFbFromTxtFile=(file)=>{
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(e)=>{
      try{
        const parsed=parseFbTxt(String(e.target.result||""));
        const gotKeys=Object.keys(parsed);
        if(gotKeys.length===0){
          toast("Không đọc được trường cấu hình nào trong file. Kiểm tra định dạng key=value.","error");
          return;
        }
        setFbCfg(p=>({...p,...parsed}));
        toast(`Đã nạp ${gotKeys.length} trường từ file .txt — đang tự động kết nối...`,"success");
      }catch(err){
        toast("Lỗi đọc file .txt: "+err.message,"error");
      }
    };
    reader.onerror=()=>toast("Không thể đọc file .txt đã chọn.","error");

  const exportFbToTxtFile=()=>{

      +lines.join("\n")+"\n";
    const blob=new Blob([content],{type:"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="cauhinh_firebase.txt";

  const fbFields=[
    {k:"apiKey",lbl:"API Key *"},
    {k:"authDomain",lbl:"Auth Domain"},
    {k:"projectId",lbl:"Project ID *"},

        else{setLockErr(res.lockedFor>0?`Sai quá nhiều lần – thử lại sau ${res.lockedFor} giây`:"Mật khẩu không đúng");setLockPwd("");}

          <input className="fi" type="password" name="unlock_pwd" autoComplete="current-password" autoFocus value={lockPwd}

        </p>
      </div>

      {/* Đồng bộ ổ cứng máy tính (File System Access API) */}
      <div style={cardStyle}>
        <div style={{fontWeight:700,fontSize:14,color:"var(--navy)",marginBottom:6,display:"flex",alignItems:"center",gap:8}}>

          <b>Chuyển dữ liệu sang trình duyệt khác trên cùng máy</b> (khi chưa cấu hình Firebase): mở app ở trình duyệt kia → vào Cấu hình → gắn <i>cùng file</i> này → bấm "Khôi phục từ file".<br/>
          ⚠️ Trình duyệt không tự "theo dõi" thay đổi bên ngoài của file, nên việc đọc lại luôn là thao tác chủ động (bấm nút Khôi phục), không tự động âm thầm ghi đè dữ liệu đang dùng.<br/>
          Nếu đã kết nối Firebase, Firebase mới là nơi đồng bộ <b>thời gian thực</b> giữa nhiều máy/trình duyệt; file cục bộ chỉ là lớp sao lưu dự phòng thêm.

        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>

          {localFileName&&<>
            <button className="btn btn-blue" onClick={khoiPhucTuFile} disabled={localBusy}>

            <button className="btn btn-ghost" onClick={ngatFileCucBo} disabled={localBusy}>✕ Ngắt kết nối file</button>

      </div>

      {/* Firestore Rules hint */}
      <div style={{background:"#f8f9fe",borderRadius:12,border:"1px solid var(--border)",padding:"16px 20px"}}>
        <div style={{fontWeight:700,fontSize:13,color:"var(--navy)",marginBottom:10}}>📋 Firestore Security Rules (tham khảo)</div>
        <pre style={{background:"#1e293b",color:"#e2e8f0",padding:"14px 16px",borderRadius:8,fontSize:11.5,overflow:"auto",lineHeight:1.7}}>{`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /cap_data/{document=**} {
      allow read, write: if request.auth != null;
    }
  }
}`}</pre>
        <p style={{fontSize:11.5,color:"var(--muted)",marginTop:8}}>Hoặc dùng <code>allow read, write: if true;</code> trong môi trường nội bộ (không khuyến nghị cho production).</p>
      </div>
    </div>
  );
}

// THEO DÕI NGHIỆP VỤ – Tiện ích: tải file, đọc Word để tự điền,
// và xuất báo cáo thống kê .docx đúng thể thức văn bản hành chính
// (tự tạo file .docx bằng OOXML, KHÔNG cần file mẫu đính kèm).
// ══════════════════════════════════════════════════════════════
function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},400);
}

// ── Đọc thô nội dung văn bản từ 1 file .docx (để tự điền form) ──
function readDocxRawText(file){
  return new Promise((resolve,reject)=>{
    if(!window.PizZip){reject(new Error("Chưa tải được thư viện đọc file Word. Kiểm tra kết nối mạng."));return;}
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const zip=new window.PizZip(e.target.result);
        const xmlFile=zip.file("word/document.xml");
        if(!xmlFile){reject(new Error("File không đúng định dạng .docx hợp lệ."));return;}
        let xml=xmlFile.asText();
        xml=xml.replace(/<\/w:p>/g,"\n").replace(/<w:tab\/>/g,"\t");
        let text=xml.replace(/<[^>]+>/g,"");
        text=text.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'");
        resolve(text);
      }catch(err){reject(err);}
    };
    reader.onerror=()=>reject(new Error("Không đọc được file."));
    reader.readAsArrayBuffer(file);
  });
}

  [/trọng\s*lượng/i,"subject","trong_luong_thu_giu"],
  [/kết\s*quả\s*xử\s*lý\s*đối\s*tượng/i,"subject","ket_qua_xu_ly_dt"],
  [/ngày\s*mời\s*làm\s*việc/i,"subject","ngay_moi_lam_viec"],
  [/ngày\s*chuyển/i,"subject","ngay_chuyen"],
  [/nơi\s*chuyển/i,"subject","noi_chuyen"],
  [/ngày\s*đưa\s*đi\s*cai/i,"subject","ngay_dua_di_cai"],
  [/hình\s*thức\s*cai/i,"subject","hinh_thuc_cai"],
  [/nơi\s*cai\s*nghiện/i,"subject","noi_cai_nghien"],
];
function autofillFromDocxText(text){
  const lines=text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const out={case:{},subject:{}};
  lines.forEach(line=>{
    const m=line.match(/^([^:：]{2,40})[:：]\s*(.+)$/);
    if(!m)return;
    const label=m[1],val=m[2].trim();
    if(!val)return;
    for(const[re,target,key]of NV_AUTOFILL_LABELS){
      if(re.test(label)&&!out[target][key]){
        if(["ngay_phat_hien","ngay_bat_moi","nam_sinh","ngay_cap","ngay_moi_lam_viec","ngay_chuyen","ngay_dua_di_cai"].includes(key)){
          const iso=parseExcelDateG(val);
          out[target][key]=iso||"";
        }else out[target][key]=val;
        break;
      }
    }
  });
  // ── Lớp nhận diện chuyên biệt cho mẫu "Lý lịch" (Nghị định 30) ──
  // Mẫu này ghi nhãn+giá trị liền nhau trong cùng 1 ô/đoạn (không có dạng "Nhãn: Giá trị" theo từng dòng
  // riêng biệt như biên bản), nên cần dò trên toàn bộ văn bản đã gộp khoảng trắng.
  const flat=text.replace(/\s+/g," ").trim();
  const grab=(re)=>{const m=flat.match(re);return m?m[1].trim().replace(/\s+/g," "):"";};
  const lyLich={};
  lyLich.ho_ten=grab(/Họ\s*tên\s*:?\s*(.+?)\s*Giới\s*tính\s*:/i);
  const gt=grab(/Giới\s*tính\s*:?\s*(Nam|Nữ)/i);if(gt)lyLich.gioi_tinh=gt;
  const sinhM=flat.match(/Sinh\s*ngày\s*(\d{1,2})\s*tháng\s*(\d{1,2})\s*năm\s*(\d{4})/i);
  if(sinhM)lyLich.nam_sinh=`${sinhM[3]}-${sinhM[2].padStart(2,"0")}-${sinhM[1].padStart(2,"0")}`;
  lyLich.quoc_tich=grab(/Quốc\s*tịch\s*:?\s*(.+?)\s*Dân\s*tộc\s*:/i);
  lyLich.dan_toc=grab(/Dân\s*tộc\s*:?\s*(.+?)\s*Tôn\s*giáo\s*:/i);
  lyLich.ton_giao=grab(/Tôn\s*giáo\s*:?\s*(.+?)\s*Số\s*CMND/i);
  lyLich.cccd=grab(/Số\s*CMND\/?Thẻ?\s*CCCD\/?Thẻ?\s*CC\/?Hộ?\s*chiếu\s*:?\s*(\d{8,14})/i)||grab(/Số\s*(?:CMND|CCCD|CC|Hộ\s*chiếu)[^:]*:?\s*(\d{8,14})/i);
  const capM=flat.match(/cấp\s*ngày\s*(\d{1,2})\s*tháng\s*(\d{1,2})\s*năm\s*(\d{4})/i);
  if(capM)lyLich.ngay_cap=`${capM[3]}-${capM[2].padStart(2,"0")}-${capM[1].padStart(2,"0")}`;
  lyLich.noi_cap=grab(/Nơi\s*cấp\s*:?\s*(.+?)\s*Trình\s*độ\s*học\s*vấn\s*:/i);
  lyLich.thuong_tru=grab(/Nơi\s*thường\s*trú\s*:?\s*(.+?)\s*Nơi\s*tạm\s*trú\s*:/i);
  lyLich.tam_tru=grab(/Nơi\s*tạm\s*trú\s*:?\s*(.+?)\s*(?:Nơi\s*ở\s*hiện\s*tại\s*:|Nội\s*dung\s*vụ\s*việc\s*:|$)/i);
  const noiDung=grab(/Nội\s*dung\s*vụ\s*việc\s*:?\s*(.+)$/i);
  // Nhận diện sơ bộ loại ma túy nhắc tới trong nội dung vụ việc
  if(noiDung){
    const found=[];
    if(/methamphetamine|ma\s*túy\s*đá|\bMET\b/i.test(noiDung))found.push("Ma túy đá (MET)");
    if(/ketamine|\bKET\b/i.test(noiDung))found.push("Ketamine (KET)");
    if(/heroin/i.test(noiDung))found.push("Heroin");
    if(/thuốc\s*lắc|MDMA/i.test(noiDung))found.push("Thuốc lắc (MDMA)");
    if(/cần\s*sa|THC/i.test(noiDung))found.push("Cần sa (THC)");
    if(/etomidate|\bETO\b/i.test(noiDung))found.push("Etomidate (ETO)");
    if(found.length===1)lyLich.loai_ma_tuy=found[0];
    else if(found.length>1){lyLich.loai_ma_tuy="Khác";lyLich.loai_ma_tuy_other=found.join(", ");}
  }
  // Điền vào out: ưu tiên dữ liệu đã nhận diện được ở lớp "Nhãn: Giá trị" phía trên,
  // lớp Lý lịch chỉ bổ sung phần còn thiếu.
  Object.entries(lyLich).forEach(([k,v])=>{if(v&&!out.subject[k])out.subject[k]=v;});
  if(noiDung){
    if(!out.case.noi_dung_vu_viec)out.case.noi_dung_vu_viec=noiDung;
    if(!out.subject.hanh_vi_pham_toi)out.subject.hanh_vi_pham_toi=noiDung;
  }
  return out;
}

// ── Xây dựng file .docx (OOXML) đúng thể thức văn bản hành chính, không cần mẫu ──
const _xmlEsc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;");
const _docxRun=(text,{bold,italic,sz=24}={})=>
  `<w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>${bold?"<w:b/>":""}${italic?"<w:i/>":""}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${_xmlEsc(text)}</w:t></w:r>`;
const _docxP=(runs,{align,before=0,after=120}={})=>{
  const jc=align?`<w:jc w:val="${align}"/>`:"";
  const runsXml=(Array.isArray(runs)?runs:[{text:runs}]).map(r=>_docxRun(r.text,r)).join("");
  return `<w:p><w:pPr>${jc}<w:spacing w:before="${before}" w:after="${after}"/></w:pPr>${runsXml}</w:p>`;
};
const _docxCell=(text,{width,bold,align="left"}={})=>{
  const jc=align==="center"?'<w:jc w:val="center"/>':align==="right"?'<w:jc w:val="right"/>':"";
  const tcW=width?`<w:tcW w:w="${width}" w:type="dxa"/>`:'<w:tcW w:w="0" w:type="auto"/>';
  return `<w:tc><w:tcPr>${tcW}<w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr>${jc}<w:spacing w:before="20" w:after="20"/></w:pPr>${_docxRun(text,{bold,sz:22})}</w:p></w:tc>`;
};
const _docxTable=(header,rows,widths)=>{
  const borders=`<w:tblBorders><w:top w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:left w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:bottom w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:right w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:insideH w:val="single" w:sz="4" w:space="0" w:color="000000"/><w:insideV w:val="single" w:sz="4" w:space="0" w:color="000000"/></w:tblBorders>`;
  const tblPr=`<w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblLayout w:type="fixed"/>${borders}</w:tblPr>`;
  const grid=`<w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>`;
  const headTr=`<w:tr>${header.map((h,i)=>_docxCell(h,{width:widths[i],bold:true,align:"center"})).join("")}</w:tr>`;
  const bodyTr=rows.map(row=>`<w:tr>${row.map((c,i)=>_docxCell(String(c??""),{width:widths[i],align:"left"})).join("")}</w:tr>`).join("");
  return `<w:tbl>${tblPr}${grid}${headTr}${bodyTr}</w:tbl>`;
};
function buildOfficialDocxBlob({title,subtitle,tableHeader,tableRows,widths,landscape}){
  const now=new Date();
  const dd=String(now.getDate()).padStart(2,"0"),mm=String(now.getMonth()+1).padStart(2,"0"),yyyy=now.getFullYear();
  const body=[
    _docxP([{text:"CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM",bold:true,sz:26}],{align:"center",after:0}),
    _docxP([{text:"Độc lập - Tự do - Hạnh phúc",bold:true,sz:24}],{align:"center",after:200}),
    _docxP([{text:CONFIG.donVi.toUpperCase(),bold:true,sz:24}],{align:"center",after:0}),
    _docxP([{text:CONFIG.capTren||"",italic:true,sz:22}],{align:"center",after:260}),
    _docxP([{text:title.toUpperCase(),bold:true,sz:30}],{align:"center",after:60}),
    subtitle?_docxP([{text:subtitle,italic:true,sz:22}],{align:"center",after:220}):_docxP("",{after:120}),
    _docxTable(tableHeader,tableRows,widths),
    _docxP("",{after:200}),
    _docxP([{text:`${CONFIG.quanHuyen||"Tân Bình"}, ngày ${dd} tháng ${mm} năm ${yyyy}`,italic:true,sz:22}],{align:"right",before:300,after:0}),
    _docxP([{text:"NGƯỜI LẬP BÁO CÁO",bold:true,sz:24}],{align:"right",after:0}),
    _docxP([{text:"(Ký, ghi rõ họ tên)",italic:true,sz:20}],{align:"right",after:1200}),
  ].join("");
  // Khổ A4: 11906x16838 (twips). Khi landscape=true, hoán đổi w/h và thêm w:orient="landscape".
  const pgW=landscape?16838:11906, pgH=landscape?11906:16838;
  const sectPr=`<w:sectPr><w:pgSz w:w="${pgW}" w:h="${pgH}"${landscape?' w:orient="landscape"':""}/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1701" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr>`;
  const docXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}${sectPr}</w:body></w:document>`;
  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
  const rootRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>`;
  const zip=new window.PizZip();
  zip.file("[Content_Types].xml",contentTypes);
  zip.file("_rels/.rels",rootRels);
  zip.file("word/_rels/document.xml.rels",docRels);
  zip.file("word/document.xml",docXml);
  return zip.generate({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

const emptyNvSubject=()=>{const o={_id:uid()};F_NV_DOITUONG.forEach(f=>{o[f.k]=f.def||"";o[f.k+"_other"]="";});return o;};

// ── Modal Thêm/Sửa Vụ việc (kèm nhiều Đối tượng bên trong) ──
// ── Xuất báo cáo thống kê Nghiệp vụ ra Excel (đầy đủ mọi trường, đúng thể thức văn bản) ──
function fieldValNV(rec,f){
  const raw=dv(rec,f.k);
  if(!raw)return"";
  if(f.type==="date")return fmtDate(raw)||"";
  return raw;
}
// Gộp thông tin nhiều đối tượng của CÙNG 1 vụ việc vào chung 1 ô (mỗi đối tượng 1 dòng,
// đánh số "1. / 2. / 3." khi có từ 2 đối tượng trở lên) để cả vụ việc nằm gọn trên 1 hàng
// Excel duy nhất — thay vì lặp lại mã vụ việc/nội dung vụ việc trên nhiều hàng.
function joinSubjectField(subs,f){
  if(subs.length<=1)return fieldValNV(subs[0]||{},f);
  return subs.map((s,si)=>`${si+1}. ${fieldValNV(s,f)||"—"}`).join("\n");
}
function buildNghiepVuExportRows(records){
  const headers=["STT",...F_NV_VUVIEC.map(f=>f.lbl),...F_NV_DOITUONG.map(f=>f.lbl)];
  const rows=[];
  const subCounts=[]; // số đối tượng trong mỗi hàng — dùng để tính chiều cao hàng
  records.forEach((r,i)=>{
    const caseVals=F_NV_VUVIEC.map(f=>fieldValNV(r,f));
    const subs=(r.doi_tuong&&r.doi_tuong.length)?r.doi_tuong:[{}];
    const subjectVals=F_NV_DOITUONG.map(f=>joinSubjectField(subs,f));
    rows.push([String(i+1),...caseVals,...subjectVals]);
    subCounts.push(subs.length);
  });
  return{headers,rows,subCounts};
}
function exportNghiepVuExcel(title,records,period,toast){
  if(!window.XLSX){toast("Chưa tải được thư viện xuất Excel. Kiểm tra kết nối mạng.","error");return;}
  if(!records.length){toast("Không có dữ liệu phù hợp bộ lọc để xuất báo cáo","error");return;}
  try{
    const{headers,rows,subCounts}=buildNghiepVuExportRows(records);
    const ws=buildSheet(`BÁO CÁO THỐNG KÊ ${title.toUpperCase()}`,period,headers,rows);
    const fieldsAll=[null,...F_NV_VUVIEC,...F_NV_DOITUONG]; // null = cột STT
    ws["!cols"]=fieldsAll.map(f=>{
      if(!f)return{wch:6};
      if(f.type==="textarea")return{wch:38};
      if(f.type==="date")return{wch:13};
      if(f.type==="select"||f.type==="select_other")return{wch:20};
      return{wch:22};
    });
    // Mỗi hàng ứng với 1 vụ việc (có thể gồm nhiều dòng nội dung đối tượng bên trong ô) →
    // tính lại chiều cao hàng theo số đối tượng, và căn lề TRÊN cho dễ đọc danh sách nhiều dòng.
    const dataStartRow=7; // = cap.length(6) + 1 dòng tiêu đề cột (khớp với buildSheet)
    const NC=headers.length;
    subCounts.forEach((n,i)=>{
      const R=dataStartRow+i;
      if(n>1){
        ws["!rows"]=ws["!rows"]||[];
        ws["!rows"][R]={hpt:Math.max(30,n*20)};
        for(let C=0;C<NC;C++){
          const addr=XLSX.utils.encode_cell({r:R,c:C});
          if(ws[addr]&&ws[addr].s&&ws[addr].s.alignment)ws[addr].s.alignment.vertical="top";
        }
      }
    });
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"BaoCao");
    saveWorkbookA4(wb,`BaoCao_${title.replace(/\s+/g,"_")}_${new Date().toISOString().slice(0,10)}.xlsx`);
    toast("✅ Đã xuất báo cáo Excel!","success");
  }catch(e){toast("❌ Lỗi tạo báo cáo: "+e.message,"error");}
}

function NghiepVuExportModal({title,data,dateRange,onClose,toast}){
  const [mode,setMode]=useState("all"); // all | code | range
  const [code,setCode]=useState("");
  const [from,setFrom]=useState(dateRange?.from||"");
  const [to,setTo]=useState(dateRange?.to||"");
  const {style:dragStyle,dragHandleProps}=useDraggableModal();
  const inpStyle={width:"100%",padding:"8px 11px",border:"1.5px solid #d0d7e8",borderRadius:7,fontSize:13,color:"#1a2340",outline:"none",boxSizing:"border-box"};

  const matched=useMemo(()=>{
    let list=data;
    if(mode==="code"){
      const q=code.trim().toLowerCase();
      list=q?data.filter(r=>String(r.ma_vu_viec||"").toLowerCase().includes(q)):[];
    }else if(mode==="range"){
      list=data.filter(r=>{
        if(!from&&!to)return true;
        const d=new Date(r.ngay_phat_hien||r._created||"");
        if(isNaN(d))return false;
        if(from&&d<new Date(from))return false;
        if(to&&d>new Date(to+"T23:59:59"))return false;
        return true;
      });
    }
    return list.sort((a,b)=>new Date(b.ngay_phat_hien||b._created||0)-new Date(a.ngay_phat_hien||a._created||0));
  },[mode,code,from,to,data]);

  const doExport=()=>{
    let period="(Toàn bộ dữ liệu)";
    if(mode==="code")period=`(Mã vụ việc: "${code.trim()}")`;
    else if(mode==="range")period=(from&&to)?`(Từ ngày ${fmtDate(from)} đến ngày ${fmtDate(to)})`:"(Toàn bộ thời gian)";
    exportNghiepVuExcel(title,matched,period,toast);
    onClose();
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(10,20,50,.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1100,padding:16}}>
      <div style={{background:"#fff",borderRadius:14,width:"min(440px,96vw)",boxShadow:"0 20px 60px rgba(0,0,0,.3)",overflow:"hidden",...dragStyle}}>
        <div {...dragHandleProps} style={{...dragHandleProps.style,background:"linear-gradient(135deg,#0d1b3e 0%,#1e3a6e 100%)",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{color:"#fff",fontSize:15,fontWeight:700}}>📊 Xuất báo cáo thống kê</div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.25)",cursor:"pointer",color:"#fff",width:30,height:30,borderRadius:7,fontSize:16}}>✕</button>
        </div>
        <div style={{padding:"18px 20px"}}>

            <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13,cursor:"pointer"}}>
              <input type="radio" checked={mode==="range"} onChange={()=>setMode("range")}/> Theo khoảng thời gian
            </label>
            {mode==="range"&&
              <div style={{marginLeft:24,display:"flex",gap:8,alignItems:"center"}}>
                <input type="date" style={inpStyle} value={from} onChange={e=>setFrom(e.target.value)}/>
                <span style={{color:"#94a3b8",fontSize:12}}>→</span>
                <input type="date" style={inpStyle} value={to} onChange={e=>setTo(e.target.value)}/>

          </div>
          <div style={{background:"#f0f6ff",border:"1px solid #bfdbfe",borderRadius:8,padding:"8px 12px",fontSize:12.5,color:"#1e3a6e",fontWeight:600,marginBottom:16}}>
            📋 Sẽ xuất <b>{matched.length}</b> vụ việc — đầy đủ tất cả các trường (vụ việc + từng đối tượng) ra file Excel.
          </div>
          <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
            <button className="btn btn-ghost" onClick={onClose}>Hủy</button>
            <button className="btn btn-primary" disabled={matched.length===0} onClick={doExport}>📊 Xuất Excel</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function NghiepVuFormModal({title,initial,onSave,onClose,toast}){
  const [caseData,setCaseData]=useState(()=>{
    const base={};F_NV_VUVIEC.forEach(f=>{base[f.k]=f.def||"";base[f.k+"_other"]="";});
    return initial?{...base,...initial}:base;
  });
  const [subjects,setSubjects]=useState(()=>(initial&&initial.doi_tuong&&initial.doi_tuong.length?initial.doi_tuong:[emptyNvSubject()]));
  const [errors,setErrors]=useState({});
  const [importBusy,setImportBusy]=useState(false);
  const importRef=useRef();
  const [collapsedSet,setCollapsedSet]=useState(()=>new Set());
  const toggleCollapse=i=>setCollapsedSet(p=>{const n=new Set(p);n.has(i)?n.delete(i):n.add(i);return n;});
  const collapseAll=()=>setCollapsedSet(new Set(subjects.map((_,i)=>i)));
  const expandAll=()=>setCollapsedSet(new Set());

  const setCase=(k,v)=>{setCaseData(p=>({...p,[k]:v}));if(errors[k])setErrors(p=>{const e={...p};delete e[k];return e;});};
  const updateSubject=(i,next)=>setSubjects(p=>p.map((s,si)=>si===i?next:s));
  const addSubject=()=>setSubjects(p=>[...p,emptyNvSubject()]);
  const removeSubject=i=>setSubjects(p=>p.filter((_,si)=>si!==i));

  const importWord=file=>{
    if(!file)return;
    if(!/\.docx$/i.test(file.name)){toast("Vui lòng chọn file .docx","error");return;}
    setImportBusy(true);
    readDocxRawText(file)
      .then(text=>{
        const {case:c,subject:s}=autofillFromDocxText(text);
        if(Object.keys(c).length===0&&Object.keys(s).length===0){
          toast("Không nhận diện được trường dữ liệu nào trong file. Vui lòng nhập tay.","error");
        }else{
          setCaseData(p=>({...p,...c}));
          setSubjects(p=>{const next=[...p];next[0]={...next[0],...s};return next;});
          toast("✅ Đã tự động điền theo file Word — vui lòng kiểm tra lại thông tin trước khi lưu!","success");
        }
      })
      .catch(err=>toast("❌ Lỗi đọc file Word: "+err.message,"error"))
      .finally(()=>setImportBusy(false));
  };

  const validate=()=>{
    const e={};
    F_NV_VUVIEC.filter(f=>f.req).forEach(f=>{if(!caseData[f.k])e[f.k]="Bắt buộc nhập";});
    if(!subjects.some(s=>String(s.ho_ten||"").trim()))e._subjects="Cần ít nhất 1 đối tượng có họ tên";
    setErrors(e);
    return Object.keys(e).length===0;
  };
  const handleSave=()=>{
    if(!validate())return;
    onSave({...caseData,doi_tuong:subjects.filter(s=>String(s.ho_ten||"").trim())});
  };
  const {style:dragStyle,dragHandleProps}=useDraggableModal();

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(10,20,50,.6)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:1000,overflowY:"auto",padding:"12px 8px"}}>
      <div style={{background:"#fff",borderRadius:14,width:"min(920px,98vw)",margin:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.3)",display:"flex",flexDirection:"column",maxHeight:"95vh",...dragStyle}}>
        <div {...dragHandleProps} style={{...dragHandleProps.style,background:"linear-gradient(135deg,#0d1b3e 0%,#1e3a6e 100%)",borderRadius:"14px 14px 0 0",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div style={{color:"#fff",fontSize:15,fontWeight:700}}>{title}</div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.25)",cursor:"pointer",color:"#fff",width:30,height:30,borderRadius:7,fontSize:16}}>✕</button>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"18px 20px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
            <div style={{fontWeight:800,fontSize:13.5,color:"var(--navy)"}}>📋 Thông tin vụ việc</div>
            <div>
              <input ref={importRef} type="file" accept=".docx" style={{display:"none"}} onChange={e=>{importWord(e.target.files[0]);e.target.value="";}}/>
              <button type="button" className="btn btn-ghost btn-sm" disabled={importBusy} onClick={()=>importRef.current?.click()}>
                {importBusy?"⏳ Đang đọc...":"📄 Tự điền từ file Word"}
              </button>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:"10px 14px",marginBottom:18,paddingBottom:16,borderBottom:"1.5px dashed #dde3f0"}}>
            {F_NV_VUVIEC.map(f=>(
              <div key={f.k} style={{gridColumn:(f.type==="textarea")?"1 / -1":undefined}}>
                <label style={{fontSize:11.5,fontWeight:700,color:"#475569",display:"block",marginBottom:4}}>
                  {f.lbl}{f.req&&<span style={{color:"#e53935"}}> *</span>}
                </label>
                <FieldInput f={f} value={caseData[f.k]} valueOther={caseData[f.k+"_other"]}
                  onChange={v=>setCase(f.k,v)} onChangeOther={v=>setCase(f.k+"_other",v)} error={errors[f.k]}/>
                {errors[f.k]&&<div style={{color:"#e53935",fontSize:11,marginTop:3}}>{errors[f.k]}</div>}
              </div>
            ))}
          </div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
            <div style={{fontWeight:800,fontSize:13.5,color:"var(--navy)"}}>👥 Thông tin đối tượng ({subjects.length})</div>
            <div style={{display:"flex",gap:6}}>
              {subjects.length>1&&<button type="button" className="btn btn-ghost btn-sm" onClick={collapseAll}>⤡ Thu gọn tất cả</button>}
              {subjects.length>1&&<button type="button" className="btn btn-ghost btn-sm" onClick={expandAll}>⤢ Mở rộng tất cả</button>}
              <button type="button" className="btn btn-primary btn-sm" onClick={addSubject}>＋ Thêm đối tượng</button>
            </div>
          </div>
          {errors._subjects&&<div style={{color:"#e53935",fontSize:12,fontWeight:600,marginBottom:8}}>⚠️ {errors._subjects}</div>}
          {subjects.map((s,i)=>(
            <NghiepVuSubjectBlock key={s._id||i} rec={s} idx={i}
              onChange={next=>updateSubject(i,next)} onRemove={()=>removeSubject(i)}
              canRemove={subjects.length>1}
              collapsed={collapsedSet.has(i)} onToggleCollapse={()=>toggleCollapse(i)}/>
          ))}
        </div>
        <div style={{padding:"12px 20px",borderTop:"1px solid #eee",display:"flex",justifyContent:"flex-end",gap:8,flexShrink:0}}>
          <button className="btn btn-ghost" onClick={onClose}>Hủy</button>
          <button className="btn btn-primary" onClick={handleSave}>💾 Lưu vụ việc</button>
        </div>
      </div>
    </div>
  );
}

// ── Trang danh sách "Theo dõi nghiệp vụ": Đối tượng bị bắt trên địa bàn / Vụ việc ma túy mới ──
function NghiepVuPage({title,icon,storeKey,data,setData,dateRange,toast}){
  const [form,setForm]=useState(null); // {mode,rec}
  const [viewRec,setViewRec]=useState(null);
  const [pwdAction,setPwdAction]=useState(null); // {type:"edit"|"delete", rec}
  const [search,setSearch]=useState(""); // lọc theo mã vụ việc
  const [pg,setPg]=useState(1);
  const PER=15;

  const byDate=data.filter(r=>{
    if(!dateRange.from&&!dateRange.to)return true;
    const d=new Date(r.ngay_phat_hien||r._created||"");
    if(isNaN(d))return true;
    if(dateRange.from&&d<new Date(dateRange.from))return false;
    if(dateRange.to&&d>new Date(dateRange.to+"T23:59:59"))return false;
    return true;
  });
  const filtered=byDate.filter(r=>{
    const q=search.trim();
    if(!q)return true;
    // Khớp mã vụ việc (nguyên trạng, không cần bỏ dấu)
    if(String(r.ma_vu_viec||"").toLowerCase().includes(q.toLowerCase()))return true;
    // Khớp tên đối tượng (không phân biệt hoa/thường, không dấu) hoặc số CCCD (chỉ so số)
    const needle=stripDiacriticsVN(q).toLowerCase();
    const digits=q.replace(/\D/g,"");
    return (r.doi_tuong||[]).some(s=>{
      if(needle&&stripDiacriticsVN(s.ho_ten||"").toLowerCase().includes(needle))return true;
      if(digits&&String(s.cccd||"").includes(digits))return true;
      return false;
    });
  })
    .sort((a,b)=>new Date(b.ngay_phat_hien||b._created||0)-new Date(a.ngay_phat_hien||a._created||0));
  useEffect(()=>{setPg(1);},[search,filtered.length]);
  const pages=Math.max(1,Math.ceil(filtered.length/PER));
  const paged=filtered.slice((pg-1)*PER,pg*PER);

  const save=async rec=>{
    let next;
    if(form.mode==="add")next=[{...rec,_id:uid(),_created:new Date().toISOString()},...data];
    else next=data.map(r=>r._id===form.rec._id?{...r,...rec}:r);
    try{
      await saveStore(storeKey,next);setData(next);setForm(null);
      // Xoá bộ lọc tìm kiếm khi vừa thêm mới, để bản ghi mới không bị "biến mất"
      // nếu ô tìm kiếm đang có sẵn từ khoá (gõ dở hoặc trình duyệt tự điền) không
      // khớp với bản ghi vừa nhập — trước đây phải bấm F5 mới thấy lại được.
      if(form.mode==="add"&&search)setSearch("");
      toast(form.mode==="add"?"✅ Đã thêm vụ việc!":"✅ Đã cập nhật vụ việc!","success");
    }catch(e){toast("❌ Lỗi lưu: "+e.message,"error");}
  };
  const del=async rec=>{
    const next=data.filter(r=>r._id!==rec._id);
    try{
      await saveStore(storeKey,next);setData(next);
      toast("Đã xóa vụ việc","info");
    }catch(e){toast("❌ Lỗi xóa: "+e.message,"error");}
  };

  const [exportOpen,setExportOpen]=useState(false);

  const doPwdConfirm=()=>{
    if(!pwdAction)return;
    if(pwdAction.type==="edit")setForm({mode:"edit",rec:pwdAction.rec});
    else del(pwdAction.rec);
    setPwdAction(null);
  };

  return(
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">{icon} {title}</div>
          <div className="page-sub">
            <span style={{background:"#f0f6ff",padding:"2px 8px",borderRadius:5,border:"1px solid #bfdbfe",fontSize:11.5}}>
              {dateRange.from&&dateRange.to?`📅 ${fmtDate(dateRange.from)} → ${fmtDate(dateRange.to)}`:"📋 Toàn bộ thời gian"}
            </span>
            <span className="badge badge-navy">{filtered.length} vụ việc</span>
            <span className="badge" style={{background:"#f0fdf4",color:"#15803d",border:"1px solid #bbf7d0"}}>
              👤 {filtered.reduce((sum,r)=>sum+(r.doi_tuong||[]).length,0)} đối tượng
            </span>
          </div>
        </div>
        <div className="btn-grp">
          <div className="srch-wrap">
            <span className="srch-icon">🔍</span>
            <input className="srch" autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false" name="q_6_nofill" placeholder="Tìm theo mã vụ việc / tên đối tượng / CCCD..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>setExportOpen(true)}>📊 Xuất báo cáo thống kê</button>
          <button className="btn btn-primary btn-sm" onClick={()=>setForm({mode:"add",rec:null})}>＋ Thêm vụ việc</button>
        </div>
      </div>
      <div className="card">
        <div className="tbl-wrap" style={{maxHeight:640,overflowY:"auto"}}>
          <table>
            <thead><tr>
              <th style={{minWidth:44}}>STT</th>
              <th style={{minWidth:110}}>Mã vụ việc</th>
              <th style={{minWidth:100}}>Ngày phát hiện</th>
              <th style={{minWidth:200}}>Loại vụ việc</th>
              <th style={{minWidth:200}}>Nội dung vụ việc</th>
              <th style={{minWidth:160}}>Đối tượng</th>
              {storeKey===KEYS.bat_dia_ban?(
                <>
                  <th style={{minWidth:160}}>Đơn vị bắt/mời</th>
                  <th style={{minWidth:110}}>Ngày bắt/mời</th>
                </>
              ):(
                <>
                  <th style={{minWidth:110}}>Ngày bắt/mời</th>
                  <th style={{minWidth:120}}>ĐTV thụ lý chính</th>
                </>
              )}
              <th style={{width:120,textAlign:"center"}}>Thao tác</th>
            </tr></thead>
            <tbody>
              {paged.length===0&&<tr><td colSpan={9}>
                <div style={{textAlign:"center",padding:"48px 20px",color:"var(--muted)"}}>
                  <div style={{fontSize:52,marginBottom:12,opacity:.4}}>📂</div>
                  <p style={{fontSize:14,fontWeight:600,color:"var(--text2)",marginBottom:4}}>Chưa có vụ việc nào</p>
                  <p style={{fontSize:12,color:"var(--muted2)"}}>Nhấn <b>＋ Thêm vụ việc</b> để bắt đầu nhập liệu</p>
                </div>
              </td></tr>}
              {paged.map((r,ri)=>(
                <tr key={r._id}>
                  <td>{(pg-1)*PER+ri+1}</td>
                  <td style={{fontWeight:700,color:"var(--navy)"}}>{r.ma_vu_viec||"—"}</td>
                  <td><DateChip val={r.ngay_phat_hien}/></td>
                  <td><TextCell v={dv(r,"loai_vu_viec")} max={40}/></td>
                  <td><TextCell v={r.noi_dung_vu_viec} max={60}/></td>
                  <td>
                    {(r.doi_tuong||[]).length===0?<span style={{color:"#cbd5e1"}}>—</span>:
                      <div style={{display:"flex",flexDirection:"column",gap:2}}>
                        {(r.doi_tuong||[]).map((s,si)=><span key={si} style={{fontWeight:600,color:"var(--navy)"}}>{s.ho_ten||"—"}</span>)}
                      </div>}
                  </td>
                  {storeKey===KEYS.bat_dia_ban?(
                    <>
                      <td>{r.don_vi_bat_moi||"—"}</td>
                      <td><DateChip val={r.ngay_bat_moi}/></td>
                    </>
                  ):(
                    <>
                      <td><DateChip val={r.ngay_bat_moi}/></td>
                      <td>{r.dtv_thu_ly_chinh||"—"}</td>
                    </>
                  )}
                  <td><div className="actions">
                    <button className="btn btn-sm btn-icon act-view" title="Xem chi tiết" onClick={()=>setViewRec(r)}>👁</button>
                    <button className="btn btn-sm btn-icon act-edit" title="Sửa (yêu cầu mật khẩu)" onClick={()=>setPwdAction({type:"edit",rec:r})}>✏️</button>
                    <button className="btn btn-sm btn-icon act-delete" title="Xóa (yêu cầu mật khẩu)" onClick={()=>setPwdAction({type:"delete",rec:r})}>🗑️</button>
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="pag">
          <span className="pag-info">
            <b style={{color:"var(--navy)"}}>{filtered.length}</b> vụ việc &nbsp;·&nbsp; Trang <b>{pg}</b> / {pages}
          </span>
          <div style={{display:"flex",gap:4,alignItems:"center"}}>
            <button className="pag-btn" disabled={pg===1} onClick={()=>setPg(1)} title="Trang đầu">«</button>
            <button className="pag-btn" disabled={pg===1} onClick={()=>setPg(p=>p-1)}>‹</button>
            {Array.from({length:Math.min(5,pages)},(_, i)=>{
              const start=Math.max(1,Math.min(pages-4,pg-2));
              const n=start+i;
              return n<=pages&&<button key={n} className={`pag-btn${pg===n?" active":""}`} onClick={()=>setPg(n)}>{n}</button>;
            }).filter(Boolean)}
            <button className="pag-btn" disabled={pg===pages} onClick={()=>setPg(p=>p+1)}>›</button>
            <button className="pag-btn" disabled={pg===pages} onClick={()=>setPg(pages)} title="Trang cuối">»</button>
          </div>
        </div>
      </div>
      {form&&<NghiepVuFormModal title={form.mode==="add"?`➕ Thêm – ${title}`:`✏️ Sửa – ${title}`} initial={form.rec} onSave={save} onClose={()=>setForm(null)} toast={toast}/>}
      {viewRec&&<NghiepVuViewModal rec={viewRec} onClose={()=>setViewRec(null)} onEdit={r=>{setViewRec(null);setPwdAction({type:"edit",rec:r});}}/>}
      {pwdAction&&<EditPwdModal onConfirm={doPwdConfirm} onClose={()=>setPwdAction(null)}/>}
      {exportOpen&&<NghiepVuExportModal title={title} data={data} dateRange={dateRange} onClose={()=>setExportOpen(false)} toast={toast}/>}
    </div>
  );
}

const IDLE_LOCK_MIN=15;
function App(){
  const [currentUser,setCurrentUser]=useState(()=>getSession()||null);

  //    đăng nhập, tránh người khác dùng máy đọc dữ liệu đang mở ──
  useEffect(()=>{
    if(!currentUser)return;
    let timer=null;
    const lock=()=>{clearSession();setCurrentUser(null);};
    const reset=()=>{if(timer)clearTimeout(timer);timer=setTimeout(lock,IDLE_LOCK_MIN*60*1000);};
    const evs=["mousedown","keydown","touchstart","wheel","visibilitychange"];
    evs.forEach(e=>window.addEventListener(e,reset,{passive:true}));
    reset();
    return()=>{if(timer)clearTimeout(timer);evs.forEach(e=>window.removeEventListener(e,reset));};

  const [doiTuong,setDoiTuong]=useState([]);
  const [su_dung,setSuDung]=useState([]);

  const [nghi_van,setNghiVan]=useState([]);

  const [diem_tc,setDiemTC]=useState([]);
  const [hd26_dt,setHd26Dt]=useState([]);

  const [loadAttempt,setLoadAttempt]=useState(0); // tăng để kích hoạt tải lại (nút "Thử lại")
  const toastTimer=useRef(null);

        const [sd,ng,sc,vp,vu,bn,dtc,hd]=await Promise.all([
          loadStore(KEYS.su_dung,[]),loadStore(KEYS.nghien,[]),loadStore(KEYS.sau_cai,[]),

        ]);
        const [kp,rs,cb,bdb,vvm]=await Promise.all([loadStore(KEYS.khu_pho,[]),loadStore(KEYS.ra_soat,[]),loadStore(KEYS.can_bo,[]),loadStore(KEYS.bat_dia_ban,[]),loadStore(KEYS.vu_viec_moi,[])]);
        if(cancelled)return;
        setKhuPho(kp);syncKhuPhoOptions(kp);setRaSoat(rs);
        setBatDiaBan(bdb);setVuViecMoi(vvm);
        setCanBo(cb);syncCanBoOptions(cb);

        // migrateToUnified NÉM LỖI nếu không đọc được dữ liệu (vd mất mạng khi
        // đang dùng Firebase) — TUYỆT ĐỐI không được coi lỗi này là "chưa có dữ
        // liệu" rồi lưu đè mảng rỗng lên, nên phải bắt lỗi ở đây và dừng lại,
        // không setDoiTuong/không lưu gì cả, để dữ liệu thật trên server luôn an toàn.
        const unified=await migrateToUnified(sd,ng,sc,vp);
        if(cancelled)return;
        setDoiTuong(unified);
        // Keep legacy stores in sync for backward-compat exports
        setSuDung(unified.filter(r=>(r.nhom||[]).includes("su_dung")));
        setNghien(unified.filter(r=>(r.nhom||[]).includes("nghien")));
        setSauCai(unified.filter(r=>(r.nhom||[]).includes("sau_cai")));

        setVuAn(vu);setBangNhom(bn);setDiemTC(dtc);setHd26Dt(hd);
        // Reports
        const rptDefault={b4:{},b5:{},b6:{},b7:{},b2x:{},tb136:{},pl2_tb136:{},pl3_tb136:{},hd26:{},b8:{}};
        const rptLoaded=await loadReportAll(null);
        let finalRpt=rptLoaded||rptDefault;

          const [b4,b5,b6,b7,b2x,tb136,pl2,pl3,hd26s,b8]=await Promise.all([
            loadStore(KEYS.b4,{}),loadStore(KEYS.b5,{}),loadStore(KEYS.b6,{}),loadStore(KEYS.b7,{}),
            loadStore(KEYS.b2x,{}),loadStore(KEYS.tb136,{}),

        setRpt(finalRpt);
        setLoaded(true);

        console.error("Lỗi tải dữ liệu ban đầu:",e);

    const kp=d.khu_pho||[],rs=d.ra_soat||[],cb=d.can_bo||[],bdb=d.bat_dia_ban||[],vvm=d.vu_viec_moi||[];

          {page==="sync"&&<SyncPage data={allData} toast={toast}/>}
          {page==="backup"&&<BackupPage data={allData} onRestore={doRestore} toast={toast}/>}
          {page==="cau_hinh"&&<CauHinhPage toast={toast} onConfigChange={()=>window.location.reload()}/>}

      </div>
      {toastMsg&&<Toast msg={toastMsg.msg} type={toastMsg.type}/>}

        <SettingsPanel
          currentUser={currentUser}
          onLogout={()=>setCurrentUser(null)}
          onClose={()=>setShowSettings(false)}

}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
