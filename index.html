function UnifiedPage({doiTuong,setDoiTuong,dateRange,toast,khuPho,setKhuPho}){
  const [form,setForm]=useState(null);
  const [viewRec,setViewRec]=useState(null);
  const [editPwdTarget,setEditPwdTarget]=useState(null);
  const [delRec,setDelRec]=useState(null);
  const [loaiRec,setLoaiRec]=useState(null);
  const [filterNhom,setFilterNhom]=useState("all"); // "all"|"su_dung"|"nghien"|"sau_cai"|"vppl"
  const [search,setSearch]=useState("");
  const [tabLoai,setTabLoai]=useState(false);
  const [pg,setPg]=useState(1);
  const [selIds,setSelIds]=useState(()=>new Set());
  const [bulkDel,setBulkDel]=useState(false);
  const PER=15;
  const importRef=useRef();
  const [importPreview,setImportPreview]=useState(null); // {newRows,updatable,fileName}
  const active=doiTuong.filter(r=>!r.da_loai);
  // Tự xoá bộ lọc tìm kiếm khi có đối tượng mới được thêm (số đang QL tăng),
  // để đối tượng mới không bị "mất tích" do đang lọc theo từ khoá không khớp.
  const prevActiveLenRef=useRef(active.length);
  useEffect(()=>{
    if(active.length>prevActiveLenRef.current&&search)setSearch("");
    prevActiveLenRef.current=active.length;
  },[active.length]);

  // Normalize name for duplicate detection
  const normName=n=>String(n||"").toLowerCase().replace(/\s+/g," ").trim();

  // Parse date from Excel cell value (string "dd/mm/yyyy", date object, or year number)
  const parseExcelDate=v=>{
    if(!v)return "";
    if(v instanceof Date)return v.toISOString().slice(0,10);
    const s=String(v).trim();
    // dd/mm/yyyy or dd/mm/yy
    const m1=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if(m1){
      const y=m1[3].length===2?"20"+m1[3]:m1[3];
      return `${y}-${m1[2].padStart(2,"0")}-${m1[1].padStart(2,"0")}`;
    }
    // yyyy-mm-dd
    const m2=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m2)return s.slice(0,10);
    // Just year: 1985
    if(/^\d{4}$/.test(s))return s+"-01-01";
    // Excel serial number
    if(/^\d+$/.test(s)&&Number(s)>1000){
      const d=new Date((Number(s)-25569)*86400000);
      if(!isNaN(d))return d.toISOString().slice(0,10);
    }
    return "";
  };

  const importFromExcel=file=>{
    if(!file||!/\.xlsx?$/i.test(file.name)){toast("Vui lòng chọn file .xlsx / .xls","error");return;}
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:true});
        // Ưu tiên sheet "PL 1B"/"PL1B", nếu không có thì sheet có dòng tiêu đề "Họ và tên"
        const normSn=x=>String(x).replace(/\s+/g,"").toUpperCase();
        let sheetName=wb.SheetNames.find(n=>normSn(n)==="PL1B")||wb.SheetNames.find(n=>/PL1B/.test(normSn(n)));
        if(!sheetName)sheetName=wb.SheetNames.find(n=>{const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:""}).slice(0,15);return a.some(r=>r.some(c=>/họ và tên/i.test(String(c))));})||wb.SheetNames[0];
        const ws=wb.Sheets[sheetName];
        const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});
        // Dòng dữ liệu bắt đầu ngay sau dòng số thứ tự cột "(1) (2) … (20)"
        let dataStart=10;
        for(let i=0;i<Math.min(aoa.length,30);i++){
          if(String(aoa[i][0]).trim()==="(1)"){dataStart=i+1;break;}
          if(String(aoa[i][0]).trim()==="STT"){dataStart=i+2;}
        }
        const dsKhuPho=(Array.isArray(khuPho)&&khuPho.length?khuPho.map(k=>k.ten_moi||k.ten_cu||""):OPT.khuPhoMoi)||[];
        const keyName=n=>stripDiacriticsVN(String(n||"")).toLowerCase().replace(/\s+/g," ").trim();
        const keyCccd=c=>String(c||"").replace(/\D/g,"");
        const txt=v=>(v instanceof Date)?tb136D(v):String(v==null?"":v).replace(/\r/g,"").trim();
        const newRows=[],updatable=[],canhBao=[];
        const seenInFile=new Set();
        for(let i=dataStart;i<aoa.length;i++){
          const row=aoa[i]||[];
          const sttRaw=String(row[0]||"").trim();
          if(!/^\d+$/.test(sttRaw))continue;            // chỉ dòng có STT là số
          const hoTen=String(row[1]||"").replace(/\s+/g," ").trim();
          if(!hoTen)continue;
          // (3)(4) Năm sinh theo giới tính
          const namV=row[2],nuV=row[3];
          const gioiTinh=(namV!==""&&namV!=null)?"Nam":((nuV!==""&&nuV!=null)?"Nữ":"");
          const ns=tb136ParseDate(gioiTinh==="Nữ"?nuV:namV);
          // (5) HKTT / Nơi ở → Nơi đăng ký HKTT / Nơi ở hiện tại + Khu phố mới
          const dc=tb136TachDiaChi(txt(row[4]));
          const kp=tb136KhuPhoTuDiaChi(dc.noi_o_ht||dc.hktt,dsKhuPho);
          // (11) Diện quản lý → nhóm quản lý + trường chi tiết
          const dienRaw=txt(row[10]);
          const dq=tb136ParseDienQL(dienRaw);
          if(!dq.recognized)canhBao.push(`Dòng ${sttRaw} – ${hoTen}: không nhận diện được diện quản lý "${dienRaw}" → xếp nhóm Nghi vấn`);
          // (14) Số lượt gọi hỏi: số → số lượt; chữ → tần suất
          const n14=txt(row[13]);
          // (16) Lĩnh vực: mã 1-5 → nội dung đầy đủ
          // (17) Thời điểm đưa vào ≡ Ngày vào sổ (mốc tính TĂNG khi xuất báo cáo)
          const tdv=tb136ParseDate(row[16]).iso;
          const recData={
            ho_ten:hoTen,ngay_sinh:ns.iso,ngay_sinh_chi_nam:ns.yearOnly,gioi_tinh:gioiTinh,
            hktt:dc.hktt,noi_o_ht:dc.noi_o_ht,
            ...(kp?{khu_pho_moi:kp}:{}),
            cccd:txt(row[5]).replace(/^'+/,""),
            tien_an_ct:txt(row[6]),hanh_vi_nv:txt(row[7]),
            dau_hieu_nghi_van:txt(row[8]),dia_ban_nghi_van:txt(row[9]),
            dien_ql_so_hs:dienRaw,
            doi_sach_xl:txt(row[11]),
            don_vi_ql_nv:txt(row[12])||CONFIG.donVi,
            so_luot_goi_hoi_import:n14,
            ...(n14&&!/^\d+$/.test(n14)?{tan_suat_goi_hoi:n14}:{}),
            thoi_diem_vang_mat:txt(row[14]),
            linh_vuc_nv:tb136LinhVucFromExcel(row[15]),
            thoi_diem_dua_vao_ql:tdv,ngay_vao_so:tdv,
            can_bo_theo_doi:tb136CanBoFromExcel(txt(row[17])),
            chi_huy_theo_doi:txt(row[18]),
            ...dq.fields,
          };
          if(recData.gioi_tinh==="")delete recData.gioi_tinh;
          const nhomMoi=dq.nhom;
          // Nhóm Nghi vấn: lấy Hành vi / Dấu hiệu làm nội dung & cơ sở nghi vấn
          if(nhomMoi.includes("nghi_van")){
            if(recData.hanh_vi_nv)recData.noi_dung_nghi_van=recData.hanh_vi_nv;
            if(recData.dau_hieu_nghi_van)recData.co_so_nghi_van=recData.dau_hieu_nghi_van;
          }
          // Trùng trong chính file
          const kf=keyName(hoTen)+"|"+keyCccd(recData.cccd);
          if(seenInFile.has(kf)){canhBao.push(`Dòng ${sttRaw} – ${hoTen}: trùng với dòng trước trong file, bỏ qua`);continue;}
          seenInFile.add(kf);
          // Đối tượng đã có: cùng họ tên VÀ (cùng CCCD hoặc 1 bên chưa có CCCD)
          const ex=doiTuong.find(r=>keyName(r.ho_ten)===keyName(hoTen)&&(!keyCccd(r.cccd)||!keyCccd(recData.cccd)||keyCccd(r.cccd)===keyCccd(recData.cccd)));
          if(ex){updatable.push({existId:ex._id,recData,nhomMoi,name:hoTen});continue;}
          newRows.push({_id:uid(),_created:new Date().toISOString(),co_mat:true,
            phuong_xa:String(CONFIG.donVi||"").replace(/^Công an\s*(phường|xã|thị trấn)\s*/i,"").trim(),
            quan_huyen:CONFIG.quanHuyen,...recData,nhom:nhomMoi});
        }
        if(newRows.length===0&&updatable.length===0){toast("Không tìm thấy dữ liệu hợp lệ trong file","warning");return;}
        setImportPreview({newRows,updatable,canhBao,fileName:file.name+" – sheet "+sheetName});
      }catch(err){toast("Lỗi đọc file: "+err.message,"error");}
    };
    reader.readAsArrayBuffer(file);
  };

  const confirmImport=async(updateSelected={})=>{
    if(!importPreview)return;
    let list=[...doiTuong];
    // Add new records
    if(importPreview.newRows.length>0)list=[...importPreview.newRows,...list];
    // Update selected existing records
    const updateIds=Object.keys(updateSelected).filter(id=>updateSelected[id]);
    if(updateIds.length>0){
      const updateMap={};
      (importPreview.updatable||[]).forEach(u=>{updateMap[u.existId]=u;});
      // 4 nhóm do cột "Diện quản lý" quyết định được đặt lại theo Excel; các nhóm khác (VPPL, …) giữ nguyên
      const TB_NHOM=["nghi_van","nghien","sau_cai","suu_tra"];
      list=list.map(r=>{
        if(!updateIds.includes(r._id))return r;
        const u=updateMap[r._id];
        const giu=(r.nhom||[]).filter(n=>!TB_NHOM.includes(n)&&!(n==="su_dung"&&u.nhomMoi.includes("su_dung")));
        const nhom=[...new Set([...giu,...u.nhomMoi])];
        return {...r,...u.recData,nhom,_updated:new Date().toISOString()};
      });
    }
    try{
      await saveStore(KEYS.doi_tuong,list);
      setDoiTuong(list);
      // Tự bổ sung Khu phố mới (nếu chưa có) vào danh mục dùng chung
      if(setKhuPho&&Array.isArray(khuPho)){
        const used=[...importPreview.newRows.map(r=>r.khu_pho_moi),...(importPreview.updatable||[]).filter(u=>updateIds.includes(u.existId)).map(u=>u.recData.khu_pho_moi)].filter(Boolean);
        const known=new Set(khuPho.map(k=>stripDiacriticsVN(k.ten_moi||"").toLowerCase().trim()));
        const add=[...new Set(used)].filter(v=>!known.has(stripDiacriticsVN(v).toLowerCase().trim()));
        if(add.length){
          const nextKp=[...khuPho,...add.map(ten_moi=>({id:uid(),ten_moi,ten_cu:""}))];
          await saveStore(KEYS.khu_pho,nextKp);setKhuPho(nextKp);syncKhuPhoOptions(nextKp);
        }
      }
      const msgs=[];
      if(importPreview.newRows.length>0)msgs.push("thêm "+importPreview.newRows.length+" mới");
      if(updateIds.length>0)msgs.push("cập nhật "+updateIds.length+" đối tượng");
      toast("✅ Đã "+msgs.join(", ")+" từ Excel!","success");
      setImportPreview(null);
    }catch(e){toast("❌ Lỗi lưu dữ liệu nhập từ Excel: "+e.message,"error");}
  };

  const loai=doiTuong.filter(r=>r.da_loai);
  const base=tabLoai?loai:active;

  // Filter by nhom
  const byNhom=filterNhom==="all"?base:base.filter(r=>(r.nhom||[]).includes(filterNhom));

  // Filter by date
  const byDate=byNhom.filter(r=>{
    if(!dateRange.from&&!dateRange.to)return true;
    const d=new Date(r.ngay_vao_so||r.ngay_ph_hv||r._created||"");
    if(isNaN(d))return true;
    if(dateRange.from&&d<new Date(dateRange.from))return false;
    if(dateRange.to&&d>new Date(dateRange.to+"T23:59:59"))return false;
    return true;
  });

  // Search – chỉ khớp theo họ tên/CCCD/SĐT, không phân biệt dấu tiếng Việt
  const filtered=byDate.filter(r=>matchesNguoiSearch(r,search));
  const pages=Math.max(1,Math.ceil(filtered.length/PER));
  const paged=filtered.slice((pg-1)*PER,pg*PER);
  // Cảnh báo Số CCCD bị trùng giữa 2 tên khác nhau — nhiều khả năng do gõ nhầm
  // CCCD ở 1 trong 2 bản ghi, cần cán bộ kiểm tra và sửa lại cho đúng.
  const cccdConflicts=useMemo(()=>findCccdConflicts(doiTuong.filter(r=>!r.da_loai)),[doiTuong]);

  const save=async rec=>{
    let next;
    if(form.mode==="add") next=[{...rec,_id:uid(),_created:new Date().toISOString()},...doiTuong];
    else next=doiTuong.map(r=>r._id===form.rec._id?{...r,...rec}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);setForm(null);toast(form.mode==="add"?"✅ Đã thêm đối tượng!":"✅ Đã cập nhật!","success");}
    catch(e){toast("❌ Lỗi lưu: "+e.message,"error");}
  };
  const del=async()=>{
    const next=doiTuong.filter(r=>r._id!==delRec._id);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);setDelRec(null);toast("Đã xóa bản ghi","info");}
    catch(e){toast("❌ Lỗi xóa: "+e.message,"error");}
  };
  const toggleSel=id=>setSelIds(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});
  const selRecords=doiTuong.filter(r=>selIds.has(r._id));
  const bulkDelete=async()=>{
    const next=doiTuong.filter(r=>!selIds.has(r._id));
    try{
      await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);
      toast("🗑️ Đã xóa vĩnh viễn "+selRecords.length+" đối tượng đã chọn","success");
      setSelIds(new Set());setBulkDel(false);
    }catch(e){toast("❌ Lỗi xóa hàng loạt: "+e.message,"error");}
  };
  const loaiDT=async extra=>{
    const next=doiTuong.map(r=>r._id===loaiRec._id?{...r,...extra}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);setLoaiRec(null);toast("Đã loại đối tượng","info");}
    catch(e){toast("❌ Lỗi loại: "+e.message,"error");}
  };
  const phucHoi=async rec=>{
    const next=doiTuong.map(r=>r._id===rec._id?{...r,da_loai:false}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);toast("Đã phục hồi","success");}
    catch(e){toast("❌ Lỗi phục hồi: "+e.message,"error");}
  };

  // Counts per nhom
  const nhomCounts=Object.fromEntries(
    NHOM_LIST.map(n=>[n.id,active.filter(r=>(r.nhom||[]).includes(n.id)).length])
  );

  return(
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">👤 Danh sách đối tượng quản lý</div>
          <div className="page-sub">
            <span className="badge badge-navy" title="Đếm không trùng theo CCCD/họ tên">✓ {countUniqueSubjects(active)} đang QL</span>
            {loai.length>0&&<span className="badge badge-gray">🚫 {countUniqueSubjects(loai)} đã loại</span>}
          </div>
        </div>
        <div className="btn-grp">
          <div className="srch-wrap">
            <span className="srch-icon">🔍</span>
            <input className="srch" autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false" name="q_4_nofill" placeholder="Tìm kiếm..." value={search} onChange={e=>{setSearch(e.target.value);setPg(1);}}/>
          </div>
          {!tabLoai&&<button className="btn btn-green btn-sm" onClick={()=>importRef.current?.click()}>📥 Nhập từ Excel TB136</button>}
          {!tabLoai&&<button className="btn btn-blue btn-sm" onClick={()=>exportDoiTuongQuanLyExcel(filtered,toast)} title="Xuất Excel toàn bộ đối tượng đang hiển thị (theo bộ lọc hiện tại)">📊 Xuất Excel danh sách</button>}
          {!tabLoai&&<button className="btn btn-primary btn-sm" onClick={()=>setForm({mode:"add",rec:null})}>＋ Thêm đối tượng</button>}
          <input ref={importRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={e=>{if(e.target.files[0])importFromExcel(e.target.files[0]);e.target.value="";}}/>
        </div>
      </div>

      {cccdConflicts.length>0&&
        <div style={{background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:10,padding:"10px 16px",marginBottom:14,fontSize:12.5,color:"#9a3412"}}>
          <b>⚠️ Phát hiện {cccdConflicts.length} Số CCCD bị dùng chung cho ≥2 tên khác nhau</b> — nhiều khả năng do gõ nhầm CCCD ở 1 trong 2 bản ghi, xin kiểm tra và sửa lại cho đúng (những trường hợp này KHÔNG bị gộp vào tổng số đối tượng để tránh làm mất người thật khỏi thống kê):
          <ul style={{margin:"6px 0 0 18px",padding:0}}>
            {cccdConflicts.map(c=>(
              <li key={c.cccd}>CCCD <b>{c.cccd}</b>: {c.records.map(r=>r.ho_ten).join(" ↔ ")}</li>
            ))}
          </ul>
        </div>}

      {/* Nhom filter tabs */}
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        <button onClick={()=>{setFilterNhom("all");setPg(1);}}
          style={{padding:"7px 14px",borderRadius:8,border:"1.5px solid "+(filterNhom==="all"?"var(--navy)":"var(--border)"),
            background:filterNhom==="all"?"var(--navy)":"#fff",color:filterNhom==="all"?"#fff":"var(--text2)",
            cursor:"pointer",fontSize:12.5,fontWeight:700,fontFamily:"inherit"}}>
          Tất cả ({active.length})
        </button>
        {NHOM_LIST.map(n=>(
          <button key={n.id} onClick={()=>{setFilterNhom(n.id);setPg(1);}}
            style={{padding:"7px 14px",borderRadius:8,
              border:"1.5px solid "+(filterNhom===n.id?n.color:"var(--border)"),
              background:filterNhom===n.id?n.color+"14":"#fff",
              color:filterNhom===n.id?n.color:"var(--text2)",
              cursor:"pointer",fontSize:12.5,fontWeight:700,fontFamily:"inherit"}}>
            {n.icon} {n.lbl} ({nhomCounts[n.id]||0})
          </button>
        ))}
      </div>

      {/* Đã loại tab */}
      <div className="tab-bar">
        <button className={"tab-btn"+(!tabLoai?" active":"")} onClick={()=>{setTabLoai(false);setSearch("");setPg(1);}}>
          📋 Đang quản lý &nbsp;<span style={{background:!tabLoai?"var(--navy)":"#e2e8f0",color:!tabLoai?"#fff":"var(--muted)",padding:"1px 7px",borderRadius:10,fontSize:11,fontWeight:700}}>{active.length}</span>
        </button>
        <button className={"tab-btn"+(tabLoai?" active":"")} onClick={()=>{setTabLoai(true);setSearch("");setPg(1);}}>
          🚫 Đã loại &nbsp;<span style={{background:tabLoai?"var(--navy)":"#e2e8f0",color:tabLoai?"#fff":"var(--muted)",padding:"1px 7px",borderRadius:10,fontSize:11,fontWeight:700}}>{loai.length}</span>
        </button>
      </div>

      {/* Thanh xóa hàng loạt */}
      {selIds.size>0&&
        <div style={{display:"flex",alignItems:"center",gap:10,background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,padding:"9px 14px",marginBottom:12}}>
          <span style={{fontSize:12.5,fontWeight:700,color:"#7f1d1d"}}>☑️ Đã chọn {selIds.size} đối tượng</span>
          <button className="btn btn-sm" style={{background:"#ef4444",color:"#fff"}} onClick={()=>setBulkDel(true)}>🗑️ Xóa vĩnh viễn đã chọn</button>
          <button className="btn btn-sm btn-ghost" onClick={()=>setSelIds(new Set())}>Bỏ chọn</button>
        </div>}

      {/* Table */}
      <div className="card">
        <div className="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th style={{width:32,textAlign:"center"}}>
                  <input type="checkbox" title="Chọn tất cả trong trang này"
                    checked={paged.length>0&&paged.every(r=>selIds.has(r._id))}
                    onChange={e=>setSelIds(p=>{const n=new Set(p);paged.forEach(r=>e.target.checked?n.add(r._id):n.delete(r._id));return n;})}/>
                </th>
                <th style={{width:38}}>STT</th>
                <th style={{width:44,textAlign:"center"}}>Ảnh</th>
                <th style={{minWidth:160}}>Họ và tên</th>
                <th style={{minWidth:130}}>Nhóm quản lý</th>
                <th style={{minWidth:100}}>Ngày sinh</th>
                <th style={{width:70}}>GT</th>
                <th style={{minWidth:120}}>CCCD</th>
                <th style={{minWidth:180}}>HKTT / Nơi ở</th>
                <th style={{minWidth:100}}>Ngày vào sổ</th>
                <th style={{minWidth:100}}>Cập nhật PM</th>
                <th style={{width:110,textAlign:"center"}}>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              {paged.length===0&&<tr><td colSpan={11}>
                <div style={{textAlign:"center",padding:"48px 20px",color:"var(--muted)"}}>
                  <div style={{fontSize:52,marginBottom:12,opacity:.4}}>👤</div>
                  <p style={{fontSize:14,fontWeight:600,color:"var(--text2)",marginBottom:4}}>Chưa có đối tượng</p>
                  <p style={{fontSize:12,color:"var(--muted2)"}}>Nhấn <b>＋ Thêm đối tượng</b> để bắt đầu</p>
                </div>
              </td></tr>}
              {paged.map((r,ri)=>(
                <tr key={r._id} className={r.da_loai?"da-loai":""}>
                  <td style={{textAlign:"center"}}><input type="checkbox" checked={selIds.has(r._id)} onChange={()=>toggleSel(r._id)}/></td>
                  <td style={{color:"var(--muted2)",fontSize:12}}>{(pg-1)*PER+ri+1}</td>
                  <td style={{textAlign:"center",verticalAlign:"middle",padding:"4px 6px"}}>
                    {r.anh_the
                      ?<img src={r.anh_the} alt="" style={{width:30,height:40,objectFit:"cover",borderRadius:4,border:"1px solid #dde3f0",display:"inline-block"}}/>
                      :<span style={{display:"inline-flex",width:30,height:40,background:"#f0f4f8",borderRadius:4,border:"1px dashed #c7d2fe",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>👤</span>
                    }
                  </td>
                  <td><b style={{color:"var(--navy)",fontSize:13}}>{r.ho_ten||"—"}</b></td>
                  <td><NhomBadge nhom={r.nhom}/></td>
                  <td><DateChip val={r.ngay_sinh}/></td>
                  <td><GtBadge v={r.gioi_tinh}/></td>
                  <td><span style={{fontFamily:"monospace",fontSize:12}}>{r.cccd||"—"}</span></td>
                  <td style={{fontSize:12,maxWidth:200}}>
                    <div title={r.hktt||""} style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:200}}>
                      {r.hktt||"—"}
                    </div>
                    {r.noi_o_ht&&r.noi_o_ht!==r.hktt&&<div style={{fontSize:10.5,color:"var(--muted2)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:200}}>📍 {r.noi_o_ht}</div>}
                  </td>
                  <td><DateChip val={r.ngay_vao_so}/></td>
                  <td><PmBadge v={r.cap_nhat_pm}/></td>
                  <td>
                    <div className="actions">
                      <button className="btn btn-sm btn-icon act-view" title="Xem chi tiết" onClick={()=>setViewRec(r)}>👁</button>
                      <button className="btn btn-sm btn-icon act-edit" title="Sửa (yêu cầu mật khẩu)" onClick={()=>setEditPwdTarget(r)}>✏️</button>
                      {!r.da_loai&&<button className="btn btn-sm btn-icon act-loai" title="Loại" onClick={()=>setLoaiRec(r)}>🚫</button>}
                      {r.da_loai&&<button className="btn btn-sm btn-icon act-restore" title="Phục hồi" onClick={()=>phucHoi(r)}>♻️</button>}
                      <button className="btn btn-sm btn-icon act-delete" title="Xóa" onClick={()=>setDelRec(r)}>🗑️</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="pag">
          <span className="pag-info"><b style={{color:"var(--navy)"}}>{filtered.length}</b> đối tượng · Trang <b>{pg}</b>/{pages}</span>
          <div style={{display:"flex",gap:4}}>
            <button className="pag-btn" disabled={pg===1} onClick={()=>setPg(1)}>«</button>
            <button className="pag-btn" disabled={pg===1} onClick={()=>setPg(p=>p-1)}>‹</button>
            {Array.from({length:Math.min(5,pages)},(_,i)=>{
              const n=Math.max(1,Math.min(pages-4,pg-2))+i;
              return n<=pages&&<button key={n} className={"pag-btn"+(pg===n?" active":"")} onClick={()=>setPg(n)}>{n}</button>;
            }).filter(Boolean)}
            <button className="pag-btn" disabled={pg===pages} onClick={()=>setPg(p=>p+1)}>›</button>
            <button className="pag-btn" disabled={pg===pages} onClick={()=>setPg(pages)}>»</button>
          </div>
        </div>
      </div>

      {/* Modals */}
      {form&&(
        <FormModal fields={F_UNIFIED} initial={form.rec} allRecords={doiTuong}
          title={form.mode==="add"?"＋ Thêm đối tượng mới":"✏️ Sửa thông tin đối tượng"}
          onSave={save} onClose={()=>setForm(null)}/>
      )}
      {loaiRec&&<LoaiModal rec={loaiRec} onSave={loaiDT} onClose={()=>setLoaiRec(null)}/>}
      {delRec&&<Confirm msg={`Xóa vĩnh viễn đối tượng "${delRec.ho_ten||"?"}"?`} onOk={del} onCancel={()=>setDelRec(null)}/>}
      {bulkDel&&<BulkDeleteConfirm records={selRecords} onOk={bulkDelete} onCancel={()=>setBulkDel(false)}/>}
      {viewRec&&<ViewModal rec={viewRec} fields={F_UNIFIED} onClose={()=>setViewRec(null)} onEdit={r=>setEditPwdTarget(r)}/>}
      {editPwdTarget&&<EditPwdModal onConfirm={()=>{setForm({mode:"edit",rec:editPwdTarget});setEditPwdTarget(null);}} onClose={()=>setEditPwdTarget(null)}/>}
      {importPreview&&<ImportPreviewModal importPreview={importPreview} setImportPreview={setImportPreview} confirmImport={confirmImport}/> }
    </div>
  );
}

// ── Filtered group view (readonly from unified) ───────────────
function GroupViewPage({nhomId,doiTuong,setDoiTuong,dateRange,toast,khuPho,setKhuPho}){
  const nhom=NHOM_MAP[nhomId];
  const [form,setForm]=useState(null);
  const [delRec,setDelRec]=useState(null);
  const [loaiRec,setLoaiRec]=useState(null);
  const [viewRec,setViewRec]=useState(null);
  const [editPwdTarget,setEditPwdTarget]=useState(null);
  const [search,setSearch]=useState("");
  const [tabLoai,setTabLoai]=useState(false);
  const [showRemovedGroup,setShowRemovedGroup]=useState(false);
  const [pg,setPg]=useState(1);
  const [importBusy,setImportBusy]=useState(false);
  const [importResult,setImportResult]=useState(null); // {added,updated,total}
  const importRef=useRef();
  const [selIds,setSelIds]=useState(()=>new Set());
  const [bulkDel,setBulkDel]=useState(false);
  const PER=15;
  const canImportHD26=["su_dung","nghien","sau_cai"].includes(nhomId);

  const normKey=r=>(String(r.ho_ten||"").toLowerCase().trim()+"|"+String(r.ngay_sinh||"").trim());

  const importHD26=file=>{
    if(!file||!/\.xlsx?$/i.test(file.name)){toast("Vui lòng chọn file .xlsx","error");return;}
    setImportBusy(true);
    const reader=new FileReader();
    reader.onload=async e=>{
      try{
        const b64=e.target.result.split(",")[1];
        const wb=XLSX.read(b64,{type:"base64",cellDates:true});
        const {records,error}=parseHD26ListFile(wb,nhomId);
        if(error){toast(error,"error");setImportBusy(false);return;}
        if(!records.length){toast("Không tìm thấy dòng dữ liệu hợp lệ trong file","error");setImportBusy(false);return;}
        // Khớp trùng theo Họ tên + Ngày sinh trong nhóm hiện tại → cập nhật, ngược lại thêm mới
        const existingMap={};
        doiTuong.filter(r=>(r.nhom||[]).includes(nhomId)).forEach(r=>{existingMap[normKey(r)]=r._id;});
        let added=0,updated=0;
        let next=[...doiTuong];
        records.forEach(rec=>{
          const k=normKey(rec);
          const exId=existingMap[k];
          if(exId){
            next=next.map(r=>r._id===exId?{...r,...rec,nhom:[...new Set([...(r.nhom||[]),nhomId])]}:r);
            updated++;
          }else{
            next=[{...rec,_id:uid(),_created:new Date().toISOString()},...next];
            added++;
          }
        });
        await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);
        // Tự động bổ sung Khu phố mới (nếu có) vào danh mục dùng chung
        if(setKhuPho&&khuPho){
          const known=new Set(khuPho.map(k=>k.ten_moi));
          const newKp=[...new Set(records.map(r=>r.khu_pho_moi).filter(Boolean))].filter(v=>!known.has(v));
          if(newKp.length){
            const toAdd=newKp.map(ten_moi=>({id:uid(),ten_moi,ten_cu:(records.find(r=>r.khu_pho_moi===ten_moi)||{}).khu_pho_cu||""}));
            const nextKp=[...khuPho,...toAdd];
            await saveStore(KEYS.khu_pho,nextKp);setKhuPho(nextKp);syncKhuPhoOptions(nextKp);
          }
        }
        setImportResult({added,updated,total:records.length});
        toast(`✅ Đã nhập ${records.length} dòng (${added} mới, ${updated} cập nhật)`,"success");
      }catch(err){
        toast("Lỗi đọc file: "+err.message,"error");
      }
      setImportBusy(false);
    };
    reader.readAsDataURL(file);
  };

  const inGroup=doiTuong.filter(r=>(r.nhom||[]).includes(nhomId));
  const active=inGroup.filter(r=>!r.da_loai);
  const loai=inGroup.filter(r=>r.da_loai);
  const base=tabLoai?loai:active;
  // Tự xoá bộ lọc tìm kiếm khi có đối tượng mới được thêm vào nhóm này (số đang
  // QL tăng), để đối tượng mới không bị "mất tích" do đang lọc theo từ khoá cũ.
  const prevActiveLenRef=useRef(active.length);
  useEffect(()=>{
    if(active.length>prevActiveLenRef.current&&search)setSearch("");
    prevActiveLenRef.current=active.length;
  },[active.length]);

  // Đối tượng ĐÃ bị loại khỏi RIÊNG nhóm này (khi trước đó thuộc nhiều nhóm) nhưng vẫn còn
  // hoạt động ở (các) nhóm khác — không tính vào "Tổng"/"đã loại" phía trên vì không thuộc
  // inGroup nữa, chỉ thống kê riêng để biết đối tượng từng bị loại khỏi nhóm này.
  const removedFromThisGroup=doiTuong
    .filter(r=>!r.da_loai&&!(r.nhom||[]).includes(nhomId)&&(r.nhom_loai_history||[]).some(h=>h.nhom===nhomId))
    .map(r=>{
      const hist=(r.nhom_loai_history||[]).filter(h=>h.nhom===nhomId).slice(-1)[0];
      return{rec:r,hist};
    });

  const byDate=base.filter(r=>{
    if(!dateRange.from&&!dateRange.to)return true;
    const d=new Date(r.ngay_vao_so||r.ngay_ph_hv||r._created||"");
    if(isNaN(d))return true;
    if(dateRange.from&&d<new Date(dateRange.from))return false;
    if(dateRange.to&&d>new Date(dateRange.to+"T23:59:59"))return false;
    return true;
  });

  const filtered=byDate.filter(r=>matchesNguoiSearch(r,search));
  const pages=Math.max(1,Math.ceil(filtered.length/PER));
  const paged=filtered.slice((pg-1)*PER,pg*PER);

  const save=async rec=>{
    let next;
    // Ensure nhom includes this group
    const nhomArr=Array.isArray(rec.nhom)?rec.nhom:[nhomId];
    if(!nhomArr.includes(nhomId))nhomArr.push(nhomId);
    const recFinal={...rec,nhom:nhomArr};
    if(form.mode==="add") next=[{...recFinal,_id:uid(),_created:new Date().toISOString()},...doiTuong];
    else next=doiTuong.map(r=>r._id===form.rec._id?{...r,...recFinal}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);setForm(null);toast("✅ Đã lưu đối tượng!","success");}
    catch(e){toast("❌ Lỗi lưu: "+e.message,"error");}
  };
  const del=async()=>{
    const next=doiTuong.filter(r=>r._id!==delRec._id);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);setDelRec(null);toast("Đã xóa","info");}
    catch(e){toast("❌ Lỗi xóa: "+e.message,"error");}
  };
  const toggleSel=id=>setSelIds(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});
  const selRecords=doiTuong.filter(r=>selIds.has(r._id));
  const bulkDelete=async()=>{
    const next=doiTuong.filter(r=>!selIds.has(r._id));
    try{
      await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);
      toast("🗑️ Đã xóa vĩnh viễn "+selRecords.length+" đối tượng đã chọn","success");
      setSelIds(new Set());setBulkDel(false);
    }catch(e){toast("❌ Lỗi xóa hàng loạt: "+e.message,"error");}
  };
  const loaiDT=async extra=>{
    const next=doiTuong.map(r=>r._id===loaiRec._id?{...r,...extra}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);setLoaiRec(null);toast("Đã loại","info");}
    catch(e){toast("❌ Lỗi loại: "+e.message,"error");}
  };
  const phucHoi=async rec=>{
    const next=doiTuong.map(r=>r._id===rec._id?{...r,da_loai:false}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);toast("Đã phục hồi","success");}
    catch(e){toast("❌ Lỗi phục hồi: "+e.message,"error");}
  };

  // Thêm lại đối tượng vào nhóm này sau khi trước đó đã bị loại riêng khỏi nhóm này
  // (đối tượng vẫn hoạt động bình thường ở (các) nhóm khác trong lúc chờ thêm lại)
  const themLaiVaoNhom=async rec=>{
    const nhomMoi=(rec.nhom||[]).includes(nhomId)?rec.nhom:[...(rec.nhom||[]),nhomId];
    const next=doiTuong.map(r=>r._id===rec._id?{...r,nhom:nhomMoi}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);toast("Đã thêm lại vào nhóm "+(nhom?.lbl||""),"success");}
    catch(e){toast("❌ Lỗi: "+e.message,"error");}
  };

  // Default nhom for new record in this view
  const defaultRec={nhom:[nhomId]};

  const colMap={
    su_dung:[
      {label:"STT",w:38,render:(_,i)=>i+1},
      {label:"Họ và tên",w:160,render:r=><b style={{color:"var(--navy)"}}>{r.ho_ten||"—"}</b>},
      {label:"Nhóm",w:120,render:r=><NhomBadge nhom={r.nhom}/>},
      {label:"Khu phố",w:110,render:r=><TextCell v={r.khu_pho_moi||r.khu_pho_cu} max={16}/>},
      {label:"Ngày sinh",w:100,render:r=><DateChip val={r.ngay_sinh}/>},
      {label:"GT",w:70,render:r=><GtBadge v={r.gioi_tinh}/>},
      {label:"CCCD",w:120,render:r=><span style={{fontFamily:"monospace",fontSize:12}}>{r.cccd||"—"}</span>},
      {label:"Loại ma túy",w:120,render:r=>r.loai_ma_tuy?<span className="badge badge-red">{dv(r,"loai_ma_tuy").slice(0,20)}</span>:<span style={{color:"#cbd5e1"}}>—</span>},
      {label:"Ngày vào sổ",w:108,render:r=><DateChip val={r.ngay_vao_so}/>},
      {label:"PM",w:100,render:r=><PmBadge v={r.cap_nhat_pm}/>},
    ],
    nghien:[
      {label:"STT",w:38,render:(_,i)=>i+1},
      {label:"Họ và tên",w:160,render:r=><b style={{color:"var(--navy)"}}>{r.ho_ten||"—"}</b>},
      {label:"Nhóm",w:100,render:r=><NhomBadge nhom={r.nhom}/>},
      {label:"Khu phố",w:110,render:r=><TextCell v={r.khu_pho_moi||r.khu_pho_cu} max={16}/>},
      {label:"Ngày sinh",w:100,render:r=><DateChip val={r.ngay_sinh}/>},
      {label:"CCCD",w:120,render:r=><span style={{fontFamily:"monospace",fontSize:12}}>{r.cccd||"—"}</span>},
      {label:"Loại ma túy",w:120,render:r=>r.loai_ma_tuy?<span className="badge badge-orange">{dv(r,"loai_ma_tuy").slice(0,20)}</span>:<span style={{color:"#cbd5e1"}}>—</span>},
      {label:"Hình thức cai",w:150,render:r=><TextCell v={dv(r,"hinh_thuc_cai")} max={25}/>},
      {label:"PM",w:100,render:r=><PmBadge v={r.cap_nhat_pm}/>},
    ],
    sau_cai:[
      {label:"STT",w:38,render:(_,i)=>i+1},
      {label:"Họ và tên",w:160,render:r=><b style={{color:"var(--navy)"}}>{r.ho_ten||"—"}</b>},
      {label:"Nhóm",w:100,render:r=><NhomBadge nhom={r.nhom}/>},
      {label:"Khu phố",w:110,render:r=><TextCell v={r.khu_pho_moi||r.khu_pho_cu} max={16}/>},
      {label:"Ngày sinh",w:100,render:r=><DateChip val={r.ngay_sinh}/>},
      {label:"CCCD",w:120,render:r=><span style={{fontFamily:"monospace",fontSize:12}}>{r.cccd||"—"}</span>},
      {label:"QĐ Sau cai",w:140,render:r=><TextCell v={r.qd_sau_cai_so} max={22}/>},
      {label:"Ngày vào sổ",w:108,render:r=><DateChip val={r.ngay_vao_so}/>},
      {label:"PM",w:100,render:r=><PmBadge v={r.cap_nhat_pm}/>},
    ],
    vppl:[
      {label:"STT",w:38,render:(_,i)=>i+1},
      {label:"Họ tên",w:150,render:r=><b style={{color:"var(--navy)"}}>{r.ho_ten||"—"}</b>},
      {label:"Nhóm",w:100,render:r=><NhomBadge nhom={r.nhom}/>},
      {label:"Ngày PH",w:108,render:r=><DateChip val={r.ngay_ph_hv}/>},
      {label:"Ngày sinh",w:100,render:r=><DateChip val={r.ngay_sinh}/>},
      {label:"CCCD",w:120,render:r=><span style={{fontFamily:"monospace",fontSize:12}}>{r.cccd||"—"}</span>},
      {label:"Hành vi chính",w:140,render:r=>r.hanh_vi_chinh?<span className="badge badge-purple">{r.hanh_vi_chinh.slice(0,20)}</span>:<span style={{color:"#cbd5e1"}}>—</span>},
      {label:"Kết quả XL",w:130,render:r=>{const v=dv(r,"kq_xlhc_bpxp");return v?<span className="badge badge-teal">{v.slice(0,20)}</span>:<span className="badge badge-gray">Chưa có KQ</span>;}},
    ],
    suu_tra:[
      {label:"STT",w:38,render:(_,i)=>i+1},
      {label:"Họ và tên",w:160,render:r=><b style={{color:"var(--navy)"}}>{r.ho_ten||"—"}</b>},
      {label:"Nhóm",w:100,render:r=><NhomBadge nhom={r.nhom}/>},
      {label:"Khu phố",w:110,render:r=><TextCell v={r.khu_pho_moi||r.khu_pho_cu} max={16}/>},
      {label:"Ngày sinh",w:100,render:r=><DateChip val={r.ngay_sinh}/>},
      {label:"GT",w:70,render:r=><GtBadge v={r.gioi_tinh}/>},
      {label:"CCCD",w:120,render:r=><span style={{fontFamily:"monospace",fontSize:12}}>{r.cccd||"—"}</span>},
      {label:"Số hồ sơ ST",w:140,render:r=><TextCell v={r.so_ho_so_suu_tra} max={20}/>},
      {label:"Trạng thái hồ sơ",w:130,render:r=>r.so_nop_luu
        ?<span style={{fontWeight:700,fontSize:11.5,padding:"3px 9px",borderRadius:20,background:"#fee2e2",color:"#dc2626",border:"1px solid #fecaca",whiteSpace:"nowrap"}}>🔴 Đã nộp lưu</span>
        :<span style={{fontWeight:700,fontSize:11.5,padding:"3px 9px",borderRadius:20,background:"#dcfce7",color:"#16a34a",border:"1px solid #bbf7d0",whiteSpace:"nowrap"}}>🟢 Đang hiện hành</span>},
      {label:"Cảnh báo",w:170,render:r=>{
        if(r.so_nop_luu)return<span style={{color:"#cbd5e1"}}>—</span>;
        const c=calcSuuTraExpiry(r);
        if(!c)return<span style={{color:"#cbd5e1"}}>—</span>;
        if(c.daysLeft<0)return<span className="badge badge-red">⛔ Quá hạn {Math.abs(c.daysLeft)} ngày</span>;
        if(c.daysLeft<=30)return<span className="badge badge-orange">⚠️ Còn {c.daysLeft} ngày</span>;
        return<span style={{color:"#94a3b8",fontSize:11.5}}>Còn {c.daysLeft} ngày</span>;
      }},
    ],
  };
  const cols=colMap[nhomId]||colMap.su_dung;

  return(
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">{nhom?.icon} {nhom?.lbl}</div>
          <div className="page-sub">
            <span style={{background:nhom?.color+"14",color:nhom?.color,padding:"2px 9px",borderRadius:6,fontSize:11.5,fontWeight:700,border:"1px solid "+nhom?.color+"30"}}>
              Lọc từ DS đối tượng chung
            </span>
            <span className="badge badge-navy">{active.length} trong nhóm</span>
            {loai.length>0&&<span className="badge badge-gray">{loai.length} đã loại</span>}
          </div>
        </div>
        <div className="btn-grp">
          <div className="srch-wrap">
            <span className="srch-icon">🔍</span>
            <input className="srch" autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false" name="q_5_nofill" placeholder="Tìm kiếm..." value={search} onChange={e=>{setSearch(e.target.value);setPg(1);}}/>
          </div>
          {!tabLoai&&canImportHD26&&<>
            <input ref={importRef} type="file" accept=".xlsx,.xls" style={{display:"none"}}
              onChange={e=>{if(e.target.files[0])importHD26(e.target.files[0]);e.target.value="";}}/>
            <button className="btn btn-ghost btn-sm" disabled={importBusy} onClick={()=>importRef.current.click()}>
              {importBusy?"⏳ Đang nhập...":"📥 Nhập từ Excel (HD26)"}
            </button>
          </>}
          {!tabLoai&&<button className="btn btn-primary btn-sm"
            style={{background:nhom?.color}}
            onClick={()=>setForm({mode:"add",rec:defaultRec})}>＋ Thêm vào nhóm này</button>}
        </div>
      </div>

      <div className="tab-bar">
        <button className={"tab-btn"+(!tabLoai?" active":"")} onClick={()=>{setTabLoai(false);setSearch("");setPg(1);}}>
          📋 Đang QL <span style={{background:!tabLoai?"var(--navy)":"#e2e8f0",color:!tabLoai?"#fff":"var(--muted)",padding:"1px 7px",borderRadius:10,fontSize:11,fontWeight:700,marginLeft:5}}>{active.length}</span>
        </button>
        <button className={"tab-btn"+(tabLoai?" active":"")} onClick={()=>{setTabLoai(true);setSearch("");setPg(1);}}>
          🚫 Đã loại <span style={{background:tabLoai?"var(--navy)":"#e2e8f0",color:tabLoai?"#fff":"var(--muted)",padding:"1px 7px",borderRadius:10,fontSize:11,fontWeight:700,marginLeft:5}}>{loai.length}</span>
        </button>
        {removedFromThisGroup.length>0&&(
          <button className="tab-btn" onClick={()=>setShowRemovedGroup(true)}
            style={{marginLeft:"auto",color:"#b45309",background:"#fef3c7",border:"1px solid #fde68a"}}>
            🔀 Loại khỏi nhóm này <span style={{background:"#f59e0b",color:"#fff",padding:"1px 7px",borderRadius:10,fontSize:11,fontWeight:700,marginLeft:5}}>{removedFromThisGroup.length}</span>
          </button>
        )}
      </div>

      {showRemovedGroup&&(
        <div style={{position:"fixed",inset:0,background:"rgba(10,20,50,.6)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:1300,overflowY:"auto",padding:"12px 8px"}}
          onClick={e=>e.target===e.currentTarget&&setShowRemovedGroup(false)}>
          <div style={{background:"#fff",borderRadius:14,width:"min(640px,98vw)",margin:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.3)",maxHeight:"90vh",display:"flex",flexDirection:"column"}}>
            <div style={{background:"linear-gradient(135deg,#92400e,#b45309)",borderRadius:"14px 14px 0 0",padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
              <div>
                <div style={{color:"#fff",fontSize:15,fontWeight:700}}>🔀 Đã loại khỏi nhóm "{nhom?.lbl}"</div>
                <div style={{color:"rgba(255,255,255,.75)",fontSize:11,marginTop:2}}>Các đối tượng này vẫn còn hoạt động ở nhóm khác — không tính vào danh sách tổng ở trên</div>
              </div>
              <button onClick={()=>setShowRemovedGroup(false)} style={{background:"rgba(255,255,255,.2)",border:"none",cursor:"pointer",color:"#fff",width:28,height:28,borderRadius:6,fontSize:16}}>✕</button>
            </div>
            <div style={{padding:"14px 18px",overflowY:"auto"}}>
              {removedFromThisGroup.map(({rec,hist})=>{
                const conLai=(rec.nhom||[]).map(id=>(NHOM_LIST.find(n=>n.id===id)||{}).lbl).filter(Boolean);
                return(
                  <div key={rec._id} style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10,padding:"11px 14px",marginBottom:9,display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:13.5,color:"#78350f"}}>{rec.ho_ten||"—"}</div>
                      <div style={{fontSize:11.5,color:"#92400e",marginTop:2}}>
                        {rec.cccd?"CCCD: "+rec.cccd+"  •  ":""}
                        Loại ngày {hist?fmtDate(hist.ngay_loai):"?"} — Lý do: {hist?hist.ly_do_loai:"—"}
                      </div>
                      <div style={{fontSize:11.5,color:"#166534",marginTop:2}}>
                        ✓ Hiện còn quản lý ở: {conLai.length?conLai.join(", "):"(không còn nhóm nào — kiểm tra lại)"}
                      </div>
                    </div>
                    <button className="btn btn-sm" style={{background:"#16a34a",color:"#fff",flexShrink:0}} onClick={()=>themLaiVaoNhom(rec)}>➕ Thêm lại vào nhóm này</button>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {selIds.size>0&&
        <div style={{display:"flex",alignItems:"center",gap:10,background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,padding:"9px 14px",marginBottom:12}}>
          <span style={{fontSize:12.5,fontWeight:700,color:"#7f1d1d"}}>☑️ Đã chọn {selIds.size} đối tượng</span>
          <button className="btn btn-sm" style={{background:"#ef4444",color:"#fff"}} onClick={()=>setBulkDel(true)}>🗑️ Xóa vĩnh viễn đã chọn</button>
          <button className="btn btn-sm btn-ghost" onClick={()=>setSelIds(new Set())}>Bỏ chọn</button>
        </div>}
      <div className="card">
        <div className="tbl-wrap">
          <table>
            <thead><tr>
              <th style={{width:32,textAlign:"center"}}>
                <input type="checkbox" title="Chọn tất cả trong trang này"
                  checked={paged.length>0&&paged.every(r=>selIds.has(r._id))}
                  onChange={e=>setSelIds(p=>{const n=new Set(p);paged.forEach(r=>e.target.checked?n.add(r._id):n.delete(r._id));return n;})}/>
              </th>
              {cols.map((c,i)=><th key={i} style={{minWidth:c.w||80}}>{c.label}</th>)}<th style={{width:110,textAlign:"center"}}>Thao tác</th></tr></thead>
            <tbody>
              {paged.length===0&&<tr><td colSpan={cols.length+2}>
                <div style={{textAlign:"center",padding:"48px",color:"var(--muted)"}}>
                  <div style={{fontSize:52,marginBottom:12,opacity:.4}}>{nhom?.icon}</div>
                  <p style={{fontSize:14,fontWeight:600,color:"var(--text2)",marginBottom:4}}>Chưa có đối tượng trong nhóm</p>
                  <p style={{fontSize:12,color:"var(--muted2)"}}>Nhấn <b>＋ Thêm</b> hoặc mở đối tượng trong DS chung và chọn nhóm này</p>
                </div>
              </td></tr>}
              {paged.map((r,ri)=>(
                <tr key={r._id} className={r.da_loai?"da-loai":""}>
                  <td style={{textAlign:"center"}}><input type="checkbox" checked={selIds.has(r._id)} onChange={()=>toggleSel(r._id)}/></td>
                  {cols.map((c,ci)=><td key={ci}>{c.render?c.render(r,(pg-1)*PER+ri):r[c.key]||""}</td>)}
                  <td><div className="actions">
                    <button className="btn btn-sm btn-icon act-view" title="Xem chi tiết" onClick={()=>setViewRec(r)}>👁</button>
                    <button className="btn btn-sm btn-icon act-edit" title="Sửa (yêu cầu mật khẩu)" onClick={()=>setEditPwdTarget(r)}>✏️</button>
                    {!r.da_loai&&<button className="btn btn-sm btn-icon act-loai" title="Loại" onClick={()=>setLoaiRec(r)}>🚫</button>}
                    {r.da_loai&&<button className="btn btn-sm btn-icon act-restore" title="Phục hồi" onClick={()=>phucHoi(r)}>♻️</button>}
                    <button className="btn btn-sm btn-icon act-delete" title="Xóa" onClick={()=>setDelRec(r)}>🗑️</button>
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="pag">
          <span className="pag-info"><b style={{color:"var(--navy)"}}>{filtered.length}</b> · Trang <b>{pg}</b>/{pages}</span>
          <div style={{display:"flex",gap:4}}>
            <button className="pag-btn" disabled={pg===1} onClick={()=>setPg(1)}>«</button>
            <button className="pag-btn" disabled={pg===1} onClick={()=>setPg(p=>p-1)}>‹</button>
            {Array.from({length:Math.min(5,pages)},(_,i)=>{const n=Math.max(1,Math.min(pages-4,pg-2))+i;return n<=pages&&<button key={n} className={"pag-btn"+(pg===n?" active":"")} onClick={()=>setPg(n)}>{n}</button>;}).filter(Boolean)}
            <button className="pag-btn" disabled={pg===pages} onClick={()=>setPg(p=>p+1)}>›</button>
            <button className="pag-btn" disabled={pg===pages} onClick={()=>setPg(pages)}>»</button>
          </div>
        </div>
      </div>

      {form&&<FormModal fields={F_UNIFIED} initial={form.rec} allRecords={doiTuong} khuPhoList={khuPho}
        title={form.mode==="add"?`＋ Thêm – ${nhom?.lbl}`:`✏️ Sửa – ${nhom?.lbl}`}
        onSave={save} onClose={()=>setForm(null)}/>}
      {loaiRec&&<LoaiModal rec={loaiRec} onSave={loaiDT} onClose={()=>setLoaiRec(null)} currentNhomId={nhomId}/>}
      {delRec&&<Confirm msg={`Xóa vĩnh viễn "${delRec.ho_ten||"?"}"?`} onOk={del} onCancel={()=>setDelRec(null)}/>}
      {bulkDel&&<BulkDeleteConfirm records={selRecords} onOk={bulkDelete} onCancel={()=>setBulkDel(false)}/>}
      {viewRec&&<ViewModal rec={viewRec} fields={F_UNIFIED} onClose={()=>setViewRec(null)} onEdit={r=>setEditPwdTarget(r)}/>}
      {editPwdTarget&&<EditPwdModal onConfirm={()=>{setForm({mode:"edit",rec:editPwdTarget});setEditPwdTarget(null);}} onClose={()=>setEditPwdTarget(null)}/>}
    </div>
  );
}

// ── Photo3x4Input component ──────────────────────────────────
function Photo3x4Input({value,onChange}){
  const ref=useRef();
  const compress=(file,cb)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      // Target: 3x4 ratio = 0.75, max width 480px, quality adaptive
      const TARGET_W=480,RATIO=4/3;
      const sw=img.width,sh=img.height;
      // Crop to 3x4 center
      let sx=0,sy=0,sW=sw,sH=sh;
      if(sw/sh>0.75){sW=Math.round(sh*0.75);sx=Math.round((sw-sW)/2);}
      else{sH=Math.round(sw/0.75);sy=Math.round((sh-sH)/2);}
      const dW=TARGET_W,dH=Math.round(TARGET_W*RATIO);
      const canvas=document.createElement("canvas");
      canvas.width=dW;canvas.height=dH;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,sx,sy,sW,sH,0,0,dW,dH);
      URL.revokeObjectURL(url);
      // Adaptive quality: start 0.85, reduce until < 120KB
      let q=0.85;
      const tryEncode=()=>{
        const d=canvas.toDataURL("image/jpeg",q);
        const kb=(d.length*3/4)/1024;
        if(kb>120&&q>0.4){q=Math.max(0.4,q-0.1);tryEncode();}
        else cb(d);
      };
      tryEncode();
    };
    img.src=url;
  };
  const onFile=e=>{
    const f=e.target.files[0];
    if(!f)return;
    if(!f.type.startsWith("image/")){alert("Vui lòng chọn file ảnh!");return;}
    compress(f,b64=>onChange(b64));
    e.target.value="";
  };
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10}}>
      <div
        onClick={()=>ref.current?.click()}
        style={{
          width:96,height:128,border:value?"2px solid #3b5bdb":"2.5px dashed #b0bec5",
          borderRadius:8,overflow:"hidden",cursor:"pointer",
          background:value?"#000":"#f5f7fa",
          display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
          position:"relative",transition:"border .2s",
          boxShadow:value?"0 2px 10px rgba(0,0,0,.18)":"none",
        }}
        title="Nhấn để chọn ảnh"
      >
        {value
          ?<img src={value} alt="Ảnh thẻ" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
          :<>
            <span style={{fontSize:28,marginBottom:4}}>📷</span>
            <span style={{fontSize:10,color:"#90a4ae",textAlign:"center",lineHeight:1.3,padding:"0 6px"}}>Ảnh 3×4<br/>Nhấn để chọn</span>
          </>
        }
        {value&&(
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0)",display:"flex",alignItems:"center",justifyContent:"center",opacity:0,transition:"opacity .2s"}}
            onMouseEnter={e=>{e.currentTarget.style.background="rgba(0,0,0,.45)";e.currentTarget.style.opacity=1;}}
            onMouseLeave={e=>{e.currentTarget.style.background="rgba(0,0,0,0)";e.currentTarget.style.opacity=0;}}
          >
            <span style={{color:"#fff",fontSize:11,fontWeight:700}}>Đổi ảnh</span>
          </div>
        )}
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"center"}}>
        <button type="button" className="btn btn-ghost btn-sm" style={{fontSize:11,padding:"4px 10px"}} onClick={()=>ref.current?.click()}>
          {value?"🔄 Đổi ảnh":"📷 Chọn ảnh"}
        </button>
        {value&&<button type="button" className="btn btn-sm" style={{fontSize:11,padding:"4px 10px",background:"#fff0f0",border:"1.5px solid #ffcdd2",color:"#e53935",borderRadius:8,cursor:"pointer"}} onClick={()=>onChange("")}>🗑 Xóa ảnh</button>}
      </div>
      <input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={onFile}/>
    </div>
  );
}


// ── SidebarDateInput – dark bg date picker ───────────────────
function SidebarDateInput({value,onChange,placeholder}){
  const toDisplay=iso=>{
    if(!iso)return"";
    const m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m?m[3]+"/"+m[2]+"/"+m[1]:"";
  };
  const ref=useRef();
  const openPicker=()=>{try{ref.current.showPicker();}catch(e){ref.current.focus();}};
  return(
    <div style={{position:"relative",marginBottom:4}}>
      <div onClick={openPicker} style={{
        padding:"6px 28px 6px 10px",border:"1px solid rgba(255,255,255,.18)",
        borderRadius:7,background:"rgba(255,255,255,.08)",color:value?"#fff":"rgba(255,255,255,.4)",
        fontSize:11.5,cursor:"pointer",fontFamily:"monospace",letterSpacing:.4,userSelect:"none",
      }}>
        {toDisplay(value)||placeholder}
      </div>
      <span onClick={openPicker} style={{position:"absolute",right:7,top:"50%",transform:"translateY(-50%)",
        fontSize:12,cursor:"pointer",color:"rgba(255,255,255,.5)"}}>📅</span>
      <input ref={ref} type="date" value={value||""} onChange={e=>onChange(e.target.value||"")}
        style={{position:"absolute",opacity:0,pointerEvents:"none",width:1,height:1,top:0,left:0}}
        tabIndex={-1}/>
    </div>
  );
}

// ── SettingsPanel (đổi mật khẩu + đăng xuất) ───────────────
function SettingsPanel({currentUser,onLogout,onClose}){
  const [tab,setTab]=useState("info"); // "info"|"pwd"
  const [oldPwd,setOldPwd]=useState("");
  const [newPwd,setNewPwd]=useState("");
  const [confirmPwd,setConfirmPwd]=useState("");
  const [showOld,setShowOld]=useState(false);
  const [showNew,setShowNew]=useState(false);
  const [msg,setMsg]=useState(null); // {text,ok}

  const handleChangePwd=()=>{
    if(!oldPwd||!newPwd||!confirmPwd){setMsg({text:"Vui lòng điền đầy đủ",ok:false});return;}
    if(newPwd.length<8){setMsg({text:"Mật khẩu mới tối thiểu 8 ký tự",ok:false});return;}
    if(!/[a-zA-Z]/.test(newPwd)||!/[0-9]/.test(newPwd)){setMsg({text:"Mật khẩu mới phải có cả chữ và số",ok:false});return;}
    if(newPwd===
      "admin"){setMsg({text:"Không dùng mật khẩu mặc định",ok:false});return;}
    if(newPwd!==confirmPwd){setMsg({text:"Xác nhận mật khẩu không khớp",ok:false});return;}
    verifyAdminPwd(oldPwd).then(res=>{
      if(!res.ok){setMsg({text:res.lockedFor>0?`Sai quá nhiều lần – thử lại sau ${res.lockedFor} giây`:"Mật khẩu hiện tại không đúng",ok:false});return;}
      return setAdminPwd(newPwd).then(()=>{
        setOldPwd("");setNewPwd("");setConfirmPwd("");
        setMsg({text:"✅ Đổi mật khẩu thành công! Mật khẩu được lưu dưới dạng băm PBKDF2, không thể đọc ngược.",ok:true});
      });
    }).catch(()=>setMsg({text:"Lỗi khi đổi mật khẩu",ok:false}));
  };

  const inputSt=(err)=>({
    width:"100%",padding:"10px 38px 10px 12px",border:`1.5px solid ${err?"#e53935":"#dde3f0"}`,
    borderRadius:9,fontSize:13,outline:"none",boxSizing:"border-box",background:"#f8fafd"

    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>

        {/* Tabs */}
        <div style={{display:"flex",borderBottom:"1px solid #e2e8f0"}}>
          {[["info","👤 Tài khoản"],["pwd","🔑 Đổi mật khẩu"]].map(([k,lbl])=>(
            <button key={k} onClick={()=>{setTab(k);setMsg(null);}}

              </div>
