function buildTemplateData(rec){
  const out={};
  const seen=new Set();
  F_UNIFIED.forEach(f=>{
    if(seen.has(f.k))return;
    seen.add(f.k);
    let v=(f.type==="select"||f.type==="select_other")?dv(rec,f.k):rec[f.k];
    if(f.type==="bool")v=v?"X":"";
    else if(f.type==="date")v=v?fmtDate(v):"";
    else if(f.type==="nhom_selector")v=(rec.nhom||[]).map(id=>(NHOM_LIST.find(n=>n.id===id)||{}).lbl).filter(Boolean).join(", ");
    else if(v==null)v="";
    else v=String(v);
    out[f.k]=v;
    // Trường select_other còn có placeholder riêng {{ten_truong_other}} (chỉ chứa phần "tự nhập" khi chọn Khác)
    if(f.type==="select_other")out[f.k+"_other"]=rec[f.k+"_other"]||"";
  });
  out["ngay_xuat"]=fmtDate(new Date().toISOString().slice(0,10));
  return out;
}

// ── Modal: chọn 1 đối tượng + mở file mẫu Word (.docx) chứa placeholder {{...}} để tự động điền và tải xuống ──
function TemplateFillModal({onClose,toast,doiTuong}){
  const [tuNgay,setTuNgay]=useState("");
  const [denNgay,setDenNgay]=useState("");
  const [fileName,setFileName]=useState("");
  const [busy,setBusy]=useState(false);
  const fileInputRef=useRef();

  const matched=useMemo(()=>filterByDateRange(doiTuong.filter(r=>!r.da_loai),tuNgay,denNgay),[doiTuong,tuNgay,denNgay]);

  const pickFile=()=>fileInputRef.current&&fileInputRef.current.click();

  const doFill=(file)=>{
    if(matched.length===0){toast?.("Không có đối tượng nào phù hợp với khoảng ngày đã chọn","error");return;}
    if(!window.PizZip||!window.docxtemplater){toast?.("Chưa tải được thư viện điền mẫu Word. Kiểm tra kết nối mạng.","error");return;}
    setBusy(true);
    const reader=new FileReader();
    reader.onload=(e)=>{
      try{
        const zip=new window.PizZip(e.target.result);
        const doc=new window.docxtemplater(zip,{paragraphLoop:true,linebreaks:true,delimiters:{start:"{{",end:"}}"},nullGetter:()=>""});
        const items=matched.map(buildTemplateData);
        doc.render({
          items,
          so_luong:String(items.length),
          tu_ngay:tuNgay?fmtDate(tuNgay):"Không giới hạn",
          den_ngay:denNgay?fmtDate(denNgay):"Không giới hạn",
          ngay_xuat:fmtDate(new Date().toISOString().slice(0,10)),
        });
        const out=doc.getZip().generate({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
        const url=URL.createObjectURL(out);
        const a=document.createElement("a");
        const base=(file.name||"mau").replace(/\.docx$/i,"");
        a.href=url;a.download=`${base} - ${items.length} đối tượng.docx`;
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),3000);
        toast?.(`Đã điền ${items.length} đối tượng vào mẫu và tải xuống!`,"success");
      }catch(err){
        console.error(err);
        const detail=err&&err.properties&&err.properties.errors
          ? err.properties.errors.map(e=>e.properties&&e.properties.explanation).filter(Boolean).join("; ")
          : (err&&err.message)||"";
        toast?.("Lỗi khi điền mẫu"+(detail?": "+detail:"")+". Kiểm tra file .docx có đúng cú pháp lặp {{#items}}...{{/items}} không.","error");
      }finally{
        setBusy(false);
      }
    };
    reader.onerror=()=>{setBusy(false);toast?.("Không đọc được file","error");};
    reader.readAsArrayBuffer(file);
  };

  const onFileChosen=(e)=>{
    const file=e.target.files&&e.target.files[0];
    if(!file)return;
    setFileName(file.name);
    doFill(file);
    e.target.value="";
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(10,20,50,.6)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:1400,overflowY:"auto",padding:"12px 8px"}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:"#fff",borderRadius:14,width:"min(600px,98vw)",margin:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.3)",display:"flex",flexDirection:"column",maxHeight:"92vh"}}>
        <div style={{background:"linear-gradient(135deg,#0d1b3e 0%,#1e3a6e 100%)",borderRadius:"14px 14px 0 0",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div>
            <div style={{color:"#fff",fontSize:15,fontWeight:700}}>📝 Điền mẫu Word tự động (hàng loạt)</div>
            <div style={{color:"rgba(255,255,255,.6)",fontSize:11,marginTop:2}}>Chọn khoảng ngày → mở file mẫu .docx → tự động điền toàn bộ trường đã nhập</div>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.25)",cursor:"pointer",color:"#fff",width:30,height:30,borderRadius:7,fontSize:16}}>✕</button>
        </div>
        <div style={{padding:"18px 20px",overflowY:"auto"}}>
          {/* Bước 1: chọn khoảng ngày */}
          <div style={{fontSize:12.5,fontWeight:700,color:"#1e3a6e",marginBottom:6}}>Bước 1 – Chọn khoảng ngày cần xuất</div>
          <DateRangeFilterBox tuNgay={tuNgay} setTuNgay={setTuNgay} denNgay={denNgay} setDenNgay={setDenNgay} count={matched.length}/>

          {/* Bước 2: mở file mẫu */}
          <div style={{fontSize:12.5,fontWeight:700,color:"#1e3a6e",marginBottom:6}}>Bước 2 – Mở file mẫu Word (.docx)</div>
          <div style={{background:"#fff9e6",border:"1px solid #f0d878",borderRadius:8,padding:"10px 12px",marginBottom:12,fontSize:11.5,lineHeight:1.6,color:"#7c5c00"}}>
            ⚠️ File mẫu cần có 1 <b>bảng (table)</b> với 1 dòng dữ liệu mẫu được bọc trong cặp thẻ lặp <code>{"{{#items}}"}</code> ... <code>{"{{/items}}"}</code> (thẻ mở đặt ở ô đầu dòng, thẻ đóng đặt ở ô cuối dòng). Bên trong dòng đó, chèn placeholder theo tên trường như bình thường, VD: <code>{"{{ho_ten}}"}</code>, <code>{"{{cccd}}"}</code> (dùng danh sách ở nút "🏷️ Tạo Placeholder"). Ngoài bảng có thể dùng thêm <code>{"{{so_luong}}"}</code>, <code>{"{{tu_ngay}}"}</code>, <code>{"{{den_ngay}}"}</code>, <code>{"{{ngay_xuat}}"}</code>.
          </div>
          <input ref={fileInputRef} type="file" accept=".docx" style={{display:"none"}} onChange={onFileChosen}/>
          <button className="btn btn-green" style={{width:"100%"}} disabled={matched.length===0||busy} onClick={pickFile}>
            {busy?"⏳ Đang điền mẫu...":`📂 Mở file mẫu Word & Xuất ${matched.length} đối tượng`}
          </button>
          {fileName&&!busy&&<div style={{fontSize:11.5,color:"#78909c",marginTop:8,textAlign:"center"}}>Mẫu đã dùng gần nhất: {fileName}</div>}
        </div>
      </div>
    </div>
  );
}

// ── Điền placeholder {{key}} vào mọi ô chuỗi của workbook Excel (giữ nguyên định dạng gốc) ──
// Điền placeholder {{key}} vào 1 dòng mẫu (chứa {{...}}) rồi nhân dòng đó cho từng đối tượng trong danh sách.
// Các dòng bên dưới dòng mẫu (nếu có, VD dòng tổng) sẽ được đẩy xuống tương ứng, giữ nguyên style từng ô.
function fillExcelBulk(wb,dataList){
  const sheetName=wb.SheetNames[0];
  const ws=wb.Sheets[sheetName];
  if(!ws||!ws["!ref"])throw new Error("File mẫu không có dữ liệu.");
  const range=XLSX.utils.decode_range(ws["!ref"]);

  // 1) Tìm dòng đầu tiên có ô chứa placeholder {{...}} — dùng làm dòng mẫu để nhân bản
  let templateRow=-1;
  for(let R=range.s.r;R<=range.e.r&&templateRow===-1;R++){
    for(let C=range.s.c;C<=range.e.c;C++){
      const cell=ws[XLSX.utils.encode_cell({r:R,c:C})];
      if(cell&&typeof cell.v==="string"&&cell.v.indexOf("{{")!==-1){templateRow=R;break;}
    }
  }
  if(templateRow===-1)throw new Error("Không tìm thấy dòng chứa placeholder {{...}} trong file mẫu.");

  // 2) Lưu lại các ô của dòng mẫu (giữ style)
  const templateCells={};
  for(let C=range.s.c;C<=range.e.c;C++){
    const addr=XLSX.utils.encode_cell({r:templateRow,c:C});
    if(ws[addr])templateCells[C]=ws[addr];
  }

  const n=dataList.length;
  const shift=n-1;

  // 3) Nếu có nhiều hơn 1 đối tượng, đẩy các dòng NẰM DƯỚI dòng mẫu xuống để chừa chỗ
  if(shift>0){
    const moved={};
    Object.keys(ws).forEach(addr=>{
      if(addr[0]==="!")return;
      const c=XLSX.utils.decode_cell(addr);
      if(c.r>templateRow){
        moved[XLSX.utils.encode_cell({r:c.r+shift,c:c.c})]=ws[addr];
        delete ws[addr];
      }
    });
    Object.assign(ws,moved);
    if(ws["!merges"]){
      ws["!merges"]=ws["!merges"].map(m=>({
        s:{r:m.s.r>templateRow?m.s.r+shift:m.s.r,c:m.s.c},
        e:{r:m.e.r>templateRow?m.e.r+shift:m.e.r,c:m.e.c},
      }));
    }
  }

  // 4) Ghi dữ liệu từng đối tượng vào các dòng bắt đầu từ dòng mẫu, thay placeholder, giữ nguyên style ô
  dataList.forEach((dataObj,idx)=>{
    const R=templateRow+idx;
    Object.keys(templateCells).forEach(cKeyStr=>{
      const C=Number(cKeyStr);
      const tmplCell=templateCells[C];
      const addr=XLSX.utils.encode_cell({r:R,c:C});
      const newCell=Object.assign({},tmplCell);
      if(typeof tmplCell.v==="string"){
        newCell.v=tmplCell.v.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g,(m,k)=>
          Object.prototype.hasOwnProperty.call(dataObj,k)?dataObj[k]:"");
        newCell.t="s";
        if(newCell.f)delete newCell.f;
      }
      ws[addr]=newCell;
    });
  });

  // 5) Cập nhật lại vùng dữ liệu (!ref) cho khớp số dòng mới
  const newMaxRow=Math.max(range.e.r+Math.max(shift,0),templateRow+n-1);
  ws["!ref"]=XLSX.utils.encode_range({s:{r:range.s.r,c:range.s.c},e:{r:newMaxRow,c:range.e.c}});

  return n;
}

// ── Modal: chọn khoảng ngày + mở file mẫu Excel (.xlsx) chứa 1 dòng placeholder {{...}} để tự động nhân bản & điền hàng loạt ──
function ExcelTemplateFillModal({onClose,toast,doiTuong}){
  const [tuNgay,setTuNgay]=useState("");
  const [denNgay,setDenNgay]=useState("");
  const [fileName,setFileName]=useState("");
  const [busy,setBusy]=useState(false);
  const fileInputRef=useRef();

  const matched=useMemo(()=>filterByDateRange(doiTuong.filter(r=>!r.da_loai),tuNgay,denNgay),[doiTuong,tuNgay,denNgay]);

  const pickFile=()=>fileInputRef.current&&fileInputRef.current.click();

  const doFill=(file)=>{
    if(matched.length===0){toast?.("Không có đối tượng nào phù hợp với khoảng ngày đã chọn","error");return;}
    if(!window.XLSX){toast?.("Chưa tải được thư viện xử lý Excel. Kiểm tra kết nối mạng.","error");return;}
    setBusy(true);
    const reader=new FileReader();
    reader.onload=(e)=>{
      try{
        const wb=XLSX.read(e.target.result,{type:"array",cellStyles:true,cellNF:true});
        const dataList=matched.map(buildTemplateData);
        const n=fillExcelBulk(wb,dataList);
        const out=XLSX.write(wb,{bookType:"xlsx",type:"array",cellStyles:true});
        const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        const base=(file.name||"mau").replace(/\.xlsx$/i,"");
        a.href=url;a.download=`${base} - ${n} doi tuong.xlsx`;
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),3000);
        toast?.(`Đã điền ${n} đối tượng vào mẫu và tải xuống!`,"success");
      }catch(err){
        console.error(err);
        toast?.("Lỗi khi điền mẫu Excel: "+((err&&err.message)||"")+". Kiểm tra file .xlsx có đúng định dạng không.","error");
      }finally{
        setBusy(false);
      }
    };
    reader.onerror=()=>{setBusy(false);toast?.("Không đọc được file","error");};
    reader.readAsArrayBuffer(file);
  };

  const onFileChosen=(e)=>{
    const file=e.target.files&&e.target.files[0];
    if(!file)return;
    setFileName(file.name);
    doFill(file);
    e.target.value="";
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(10,20,50,.6)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:1400,overflowY:"auto",padding:"12px 8px"}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:"#fff",borderRadius:14,width:"min(600px,98vw)",margin:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.3)",display:"flex",flexDirection:"column",maxHeight:"92vh"}}>
        <div style={{background:"linear-gradient(135deg,#7c3f00 0%,#f57c00 100%)",borderRadius:"14px 14px 0 0",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div>
            <div style={{color:"#fff",fontSize:15,fontWeight:700}}>📊 Điền mẫu Excel tự động (hàng loạt)</div>
            <div style={{color:"rgba(255,255,255,.75)",fontSize:11,marginTop:2}}>Chọn khoảng ngày → mở file mẫu .xlsx → tự động điền toàn bộ trường đã nhập</div>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.25)",cursor:"pointer",color:"#fff",width:30,height:30,borderRadius:7,fontSize:16}}>✕</button>
        </div>
        <div style={{padding:"18px 20px",overflowY:"auto"}}>
          {/* Bước 1: chọn khoảng ngày */}
          <div style={{fontSize:12.5,fontWeight:700,color:"#7c3f00",marginBottom:6}}>Bước 1 – Chọn khoảng ngày cần xuất</div>
          <DateRangeFilterBox tuNgay={tuNgay} setTuNgay={setTuNgay} denNgay={denNgay} setDenNgay={setDenNgay} count={matched.length} accent="#fff7ed"/>

          {/* Bước 2: mở file mẫu */}
          <div style={{fontSize:12.5,fontWeight:700,color:"#7c3f00",marginBottom:6}}>Bước 2 – Mở file mẫu Excel (.xlsx)</div>
          <div style={{background:"#fff9e6",border:"1px solid #f0d878",borderRadius:8,padding:"10px 12px",marginBottom:12,fontSize:11.5,lineHeight:1.6,color:"#7c5c00"}}>
            ⚠️ File mẫu cần có <b>1 dòng mẫu duy nhất</b> chứa placeholder dạng <code>{"{{ten_truong}}"}</code> trong các ô cột cần điền (dùng danh sách ở nút "🏷️ Tạo Placeholder" để lấy đúng tên trường). Hệ thống sẽ tự nhân dòng này cho từng đối tượng phù hợp, giữ nguyên định dạng ô/viền/màu. Nếu file có dòng tổng ở dưới, dòng đó sẽ tự đẩy xuống.
          </div>
          <input ref={fileInputRef} type="file" accept=".xlsx" style={{display:"none"}} onChange={onFileChosen}/>
          <button className="btn btn-sm" style={{width:"100%",justifyContent:"center",background:"#f57c00",color:"#fff",padding:"9px"}} disabled={matched.length===0||busy} onClick={pickFile}>
            {busy?"⏳ Đang điền mẫu...":`📂 Mở file mẫu Excel & Xuất ${matched.length} đối tượng`}
          </button>
          {fileName&&!busy&&<div style={{fontSize:11.5,color:"#78909c",marginTop:8,textAlign:"center"}}>Mẫu đã dùng gần nhất: {fileName}</div>}
        </div>
      </div>
    </div>
  );
}

// SyncPage Component
function cellRef(r,c){return XLSX.utils.encode_cell({r,c});}
function setCell(ws,r,c,v){
  const ref=cellRef(r,c);
  const t=typeof v==="number"?"n":"s";
  // Preserve existing style
  const ex=ws[ref]||{};
  ws[ref]={...ex,v,t};
  if(!ws["!ref"]){ws["!ref"]=ref;}else{
    const range=XLSX.utils.decode_range(ws["!ref"]);
    const cr=XLSX.utils.decode_cell(ref);
    range.e.r=Math.max(range.e.r,cr.r);range.e.c=Math.max(range.e.c,cr.c);
    range.s.r=Math.min(range.s.r,cr.r);range.s.c=Math.min(range.s.c,cr.c);
    ws["!ref"]=XLSX.utils.encode_range(range);
  }
}
function findRow(ws,keyword,maxRows){
  if(!ws||!ws["!ref"])return -1;
  maxRows=maxRows||200;
  const range=XLSX.utils.decode_range(ws["!ref"]);
  const kw=keyword.toLowerCase();
  for(let r=0;r<=Math.min(range.e.r,maxRows);r++){
    for(let c=0;c<=Math.min(range.e.c,30);c++){
      const cell=ws[cellRef(r,c)];
      if(cell&&String(cell.v||"").toLowerCase().includes(kw))return r;
    }
  }
  return -1;
}
// ════════════════════════════════════════════════════════════════════════
// SMART TEMPLATE FILL ENGINE v2
// Pipeline duy nhất: scan → style → fill → seal
// ════════════════════════════════════════════════════════════════════════

// ── 1. Helpers ────────────────────────────────────────────────────────

// Xây dựng map slave→master từ merges của ws
function buildSlaveMap(ws){
  const m=new Map();
  (ws["!merges"]||[]).forEach(mg=>{
    for(let r=mg.s.r;r<=mg.e.r;r++)
      for(let c=mg.s.c;c<=mg.e.c;c++)
        if(r!==mg.s.r||c!==mg.s.c) m.set(r+":"+c,{r:mg.s.r,c:mg.s.c});
  });
  return m;
}

// Xóa merge trong vùng data (giữ merge header)
function clearDataMerges(ws,startRow){
  if(ws["!merges"])
    ws["!merges"]=ws["!merges"].filter(m=>m.s.r<startRow);
}

// Xóa hàng placeholder (chứa "không" hoặc ký tự -) trong vùng data
function clearPlaceholderRows(ws,startRow){
  if(!ws["!ref"])return;
  const range=XLSX.utils.decode_range(ws["!ref"]);
  for(let r=startRow;r<=Math.min(range.e.r,startRow+15);r++){
    let isPH=false;
    for(let c=0;c<=Math.min(range.e.c,4);c++){
      const v=String((ws[cellRef(r,c)]||{}).v||"").trim().toLowerCase();
      if(v==="không"||v==="-"||v==="...") {isPH=true;break;}
    }
    if(isPH) for(let c=0;c<=range.e.c;c++) delete ws[cellRef(r,c)];
  }
}

// ── 2. Style constants ────────────────────────────────────────────────
const ST={
  thin  :{style:"thin",  color:{rgb:"000000"}},
  medium:{style:"medium",color:{rgb:"000000"}},
  none  :{style:"none"},
};
function bdr(t,b,l,r){return{top:t,bottom:b,left:l,right:r};}
const BDR={
  none : bdr(ST.none,ST.none,ST.none,ST.none),
  data : bdr(ST.thin, ST.thin, ST.thin, ST.thin),
  hdr  : bdr(ST.medium,ST.medium,ST.thin,ST.thin),
  sub  : bdr(ST.thin, ST.medium,ST.thin,ST.thin),
};
const FILL={
  none  :{patternType:"none"},
  hdr   :{patternType:"solid",fgColor:{rgb:"BDD7EE"}},  // xanh chuẩn header
  sub   :{patternType:"solid",fgColor:{rgb:"D9E1F2"}},  // tím nhạt sub-header
  numTT :{patternType:"solid",fgColor:{rgb:"E2EFDA"}},  // xanh lá số TT
  alt   :{patternType:"solid",fgColor:{rgb:"EBF3FB"}},  // xen kẽ hàng data
  white :{patternType:"none"},
};
function font(sz,bold,italic){
  return{name:"Times New Roman",sz:sz||13,bold:!!bold,italic:!!italic};
}
function align(h,v,wrap){
  return{horizontal:h||"left",vertical:v||"center",wrapText:wrap!==false};
}

// Ghi style vào 1 ô (bỏ qua slave, giữ value gốc)
function writeStyle(ws,r,c,s,slaveMap){
  if(slaveMap&&slaveMap.has(r+":"+c))return;
  const ref=cellRef(r,c);
  const ex=ws[ref]||{v:"",t:"s"};
  ws[ref]={...ex,s};
}

// ── 3. scanHeader: tự động nhận diện cấu trúc header file gốc ─────────
// Trả về: {titleRows, headerRow, subRows, numTTRow, dataStartRow, colOffset}
function scanHeader(ws){
  const range=XLSX.utils.decode_range(ws["!ref"]||"A1");
  const NC=range.e.c+1;
  let result={
    titleRows:[],        // các hàng tiêu đề đơn vị/tên BC (không có border)
    headerRow:-1,        // hàng header cột chính (có border, fill)
    subRows:[],          // hàng sub-header (giữa header và data)
    numTTRow:-1,         // hàng số thứ tự (1)(2)...
    dataStartRow:-1,     // hàng data đầu tiên
    colOffset:0,         // offset cột (0 = từ A, 3 = từ D như mẫu rà soát)
    NC,
  };

  // Phân tích từng hàng từ trên xuống
  for(let r=0;r<=Math.min(range.e.r,20);r++){
    // Thu thập giá trị hàng (bỏ null)
    const vals=[];
    let firstValCol=NC;
    for(let c=0;c<NC;c++){
      const v=String((ws[cellRef(r,c)]||{}).v||"").trim();
      if(v){vals.push(v.toLowerCase());if(c<firstValCol)firstValCol=c;}
    }
    if(!vals.length)continue;

    // Hàng border? (ít nhất 1/3 số cột có border)
    let borderCount=0;
    for(let c=0;c<NC;c++){
      const cell=ws[cellRef(r,c)];
      if(cell&&cell.s&&cell.s.border&&
         (cell.s.border.top||{}).style&&
         (cell.s.border.top||{}).style!=="none") borderCount++;
    }
    const hasBorder=borderCount>NC/3;

    // Hàng fill? (ít nhất 1 ô có fill solid)
    let hasFill=false;
    for(let c=0;c<NC;c++){
      const cell=ws[cellRef(r,c)];
      if(cell&&cell.s&&cell.s.fill&&cell.s.fill.patternType==="solid"){hasFill=true;break;}
    }

    // Hàng số thứ tự: tất cả giá trị là số hoặc dạng (1)(2)
    const isNumTT=vals.every(v=>/^[\(\d\)\.]+$/.test(v));

    // Hàng header: có border HOẶC fill HOẶC chứa "họ" "tên" "ngày" "địa chỉ"
    const headerKW=["họ","tên","ngày","địa chỉ","cccd","khu phố","đơn vị","stt"];
    const isHeaderLike=headerKW.some(kw=>vals.some(v=>v.includes(kw)));

    // Hàng tiêu đề: chứa "công an","cộng hòa","phụ lục","danh sách","thống kê","độc lập"
    const titleKW=["công an","cộng hòa","phụ lục","danh sách","thống kê","độc lập","hòa xã hội","toàn bộ"];
    const isTitleLike=titleKW.some(kw=>vals.some(v=>v.includes(kw)));

    if(result.dataStartRow>=0) break; // đã tìm thấy data → dừng

    if(isNumTT&&hasBorder){
      result.numTTRow=r;
      // Hàng tiếp theo là dataStart
      result.dataStartRow=r+1;
      if(result.colOffset===0) result.colOffset=firstValCol;
    } else if((hasBorder||hasFill)&&isHeaderLike&&result.headerRow<0){
      result.headerRow=r;
      if(result.colOffset===0) result.colOffset=firstValCol;
    } else if((hasBorder||hasFill)&&result.headerRow>=0){
      result.subRows.push(r);
    } else if(isTitleLike||(!hasBorder&&!hasFill&&vals.length>0)){
      result.titleRows.push(r);
    }
  }

  // Fallback nếu không tìm được header có border
  if(result.headerRow<0&&result.titleRows.length>0){
    // Hàng ngay sau titleRows cuối có giá trị → header
    const lastTitle=Math.max(...result.titleRows);
    for(let r=lastTitle+1;r<=Math.min(range.e.r,15);r++){
      const vals=[];
      for(let c=0;c<NC;c++){
        const v=String((ws[cellRef(r,c)]||{}).v||"").trim();
        if(v)vals.push(v.toLowerCase());
      }
      if(vals.length>2){result.headerRow=r;break;}
    }
  }

  // Nếu vẫn chưa có dataStart, lấy headerRow + subRows.length + 1 + numTT
  if(result.dataStartRow<0&&result.headerRow>=0){
    result.dataStartRow=result.headerRow+result.subRows.length+(result.numTTRow>=0?2:1);
  }

  return result;
}

// ── 4. applyHeaderStyle: style phần tiêu đề theo chuẩn VN ───────────
function applyHeaderStyle(ws,info){
  const {titleRows,headerRow,subRows,numTTRow,NC}=info;
  const slaveMap=buildSlaveMap(ws);

  // Tiêu đề (không border)
  titleRows.forEach(ri=>{
    for(let c=0;c<NC;c++){
      const ref=cellRef(ri,c);
      const ex=ws[ref];
      if(!ex||ex.v==null||ex.v==="")continue;
      const val=String(ex.v).toLowerCase();
      const isTitle=val.includes("phụ lục")||val.includes("danh sách")||
                    val.includes("thống kê")||val.includes("kết quả");
      const isPeriod=val.startsWith("(")||val.includes("toàn bộ")||
                     val.includes("từ ngày")||val.includes("tuần");
      const isCap=val.includes("cộng hòa")||val.includes("độc lập");
      const isDonVi=!isCap&&c<NC/2&&ri<=3;

      let sz=13,bold=false,italic=false;
      if(isTitle){sz=14;bold=true;}
      else if(isPeriod){sz=13;italic=true;}
      else if(isCap||isDonVi){sz=13;bold=true;}

      writeStyle(ws,ri,c,{
        font:font(sz,bold,italic),
        alignment:align("center","center"),
        border:BDR.none,
        fill:FILL.none,
      },slaveMap);
    }
    if(!ws["!rows"])ws["!rows"]=[];
    ws["!rows"][ri]=ws["!rows"][ri]||{hpt:ri<=1?22:(ri<=3?36:20)};
  });

  // Header cột chính
  if(headerRow>=0){
    for(let c=0;c<NC;c++){
      if(slaveMap.has(headerRow+":"+c))continue;
      const ref=cellRef(headerRow,c);
      const ex=ws[ref]||{v:"",t:"s"};
      ws[ref]={...ex,v:ex.v!=null?ex.v:"",t:"s",s:{
        font:font(13,true),
        alignment:align("center","center"),
        border:BDR.hdr,
        fill:FILL.hdr,
      }};
    }
    ws["!rows"]=ws["!rows"]||[];
    ws["!rows"][headerRow]={hpt:40};
  }

  // Sub-header rows
  subRows.forEach((ri,idx)=>{
    for(let c=0;c<NC;c++){
      if(slaveMap.has(ri+":"+c))continue;
      const ref=cellRef(ri,c);
      const ex=ws[ref]||{v:"",t:"s"};
      ws[ref]={...ex,v:ex.v!=null?ex.v:"",t:"s",s:{
        font:font(12,idx===0),
        alignment:align("center","center"),
        border:BDR.sub,
        fill:idx===0?FILL.sub:FILL.numTT,
      }};
    }
    ws["!rows"]=ws["!rows"]||[];
    ws["!rows"][ri]={hpt:idx===0?36:22};
  });

  // Số thứ tự row
  if(numTTRow>=0){
    for(let c=0;c<NC;c++){
      if(slaveMap.has(numTTRow+":"+c))continue;
      const ref=cellRef(numTTRow,c);
      const ex=ws[ref]||{v:"",t:"s"};
      ws[ref]={...ex,v:ex.v!=null?ex.v:"",t:"s",s:{
        font:font(11,false),
        alignment:align("center","center"),
        border:BDR.sub,
        fill:FILL.numTT,
      }};
    }
    ws["!rows"]=ws["!rows"]||[];
    ws["!rows"][numTTRow]={hpt:20};
  }
}

// ── 5. fillDataRows: ghi data + style đồng thời ──────────────────────
function fillDataRows(ws,dataStartRow,rows,NC){
  if(!rows||!rows.length)return;
  const slaveMap=buildSlaveMap(ws);
  const numCols=NC||Math.max(...rows.map(r=>r.length));
  const written=new Set();

  rows.forEach((row,ri)=>{
    const isAlt=ri%2===1;
    const fillData=isAlt?FILL.alt:FILL.white;
    const absR=dataStartRow+ri;

    // Lấy border từ hàng header gốc nếu có (để outer border đúng)
    const getBdr=()=>BDR.data;

    for(let ci=0;ci<numCols;ci++){
      let r=absR,c=ci;
      const master=slaveMap.get(r+":"+c);
      if(master){r=master.r;c=master.c;}
      const mk=r+":"+c;
      if(written.has(mk))continue;
      written.add(mk);

      const val=row[ci];
      const v=(val==null||val===undefined)?"":val;
      const t=typeof val==="number"?"n":"s";
      const isNum=typeof val==="number"||(ci===3&&!isNaN(Number(v))&&v!=="");
      const ref=cellRef(r,c);
      const ex=ws[ref]||{};

      ws[ref]={...ex,v,t,s:{
        font:font(13,false),
        alignment:align(isNum?"center":"left","center"),
        border:getBdr(),
        fill:fillData,
      }};
    }

    // Row height
    ws["!rows"]=ws["!rows"]||[];
    ws["!rows"][absR]={hpt:32};
  });

  // Mở rộng !ref
  const nr=XLSX.utils.decode_range(ws["!ref"]);
  nr.e.r=Math.max(nr.e.r,dataStartRow+rows.length-1);
  nr.e.c=Math.max(nr.e.c,numCols-1);
  ws["!ref"]=XLSX.utils.encode_range(nr);
}

// ── 6. Public API (dùng trong doFillTemplate) ─────────────────────────
// Hàm duy nhất được gọi từ bên ngoài: tự scan → style → fill
function fillTemplate(ws,rows){
  if(!ws||!ws["!ref"])return;
  // Scan cấu trúc header
  const info=scanHeader(ws);
  const dataStart=info.dataStartRow>=0?info.dataStartRow:8;
  // Xóa merges và placeholder trong vùng data
  clearDataMerges(ws,dataStart);
  clearPlaceholderRows(ws,dataStart);
  // Style header
  applyHeaderStyle(ws,info);
  // Ghi data với style
  fillDataRows(ws,dataStart,rows,info.NC);
}

// Legacy wrappers (giữ tương thích với các nơi gọi cũ)
function appendRows(ws,startRow,rows){
  // Dùng fillDataRows trực tiếp với startRow override
  const info=scanHeader(ws);
  applyHeaderStyle(ws,info);
  fillDataRows(ws,startRow,rows,info.NC);
}
function writeRowsExact(ws,startRow,rows){
  const info=scanHeader(ws);
  applyHeaderStyle(ws,info);
  fillDataRows(ws,startRow,rows,info.NC);
}
function styleHeaderRows(ws){
  const info=scanHeader(ws);
  applyHeaderStyle(ws,info);
}

// ── Helper functions cho doFillTemplate ─────────────────────────────
function wbContains(wb,kw){
  return wb.SheetNames.some(sn=>{
    const ws=wb.Sheets[sn];if(!ws||!ws["!ref"])return false;
    const range=XLSX.utils.decode_range(ws["!ref"]);
    for(let r=0;r<=Math.min(range.e.r,14);r++)
      for(let c=0;c<=Math.min(range.e.c,30);c++){
        const cell=ws[cellRef(r,c)];
        if(cell&&String(cell.v||"").toLowerCase().includes(kw))return true;
      }
    return false;
  });
}
function detectTemplateType(wb){
  const names=wb.SheetNames.map(s=>s.toLowerCase().replace(/\s/g,""));
  if(wbContains(wb,"địa bàn không ma túy")||wbContains(wb,"địa bàn không ma tuý"))return"rasoat";
  if(wbContains(wb,"người bị quản lý sau cai nghiện")&&wbContains(wb,"khu phố"))return"hd26ds_sc";
  if(wbContains(wb,"người nghiện ma túy")&&wbContains(wb,"khu phố")&&!wbContains(wb,"phụ lục 1b"))return"hd26ds_ng";
  if(wbContains(wb,"người sử dụng trái phép")&&wbContains(wb,"khu phố")&&!wbContains(wb,"phụ lục 1b"))return"hd26ds_sd";
  if(wbContains(wb,"bm tổng")||wbContains(wb,"bm1")||names.some(n=>n.includes("hd26")||n.includes("tb03")))return"hd26";
  if(wbContains(wb,"phụ lục 1b")||wbContains(wb,"pl1b")||names.some(n=>n.includes("pl1b")))return"tb136";
  if(names.some(n=>n.includes("pl1")||n.includes("pl2")||n.includes("pl3"))&&wbContains(wb,"tb136"))return"tb136";
  if(wbContains(wb,"b1")&&wbContains(wb,"rà soát")||names.some(n=>n.includes("483")||n.includes("tb807")||n.includes("b1")))return"tb807_thang";
  if(names.some(n=>n.includes("b2")||n.includes("b3")||n.includes("b4"))&&wbContains(wb,"phần mềm"))return"tb807_tuan";
  if(wbContains(wb,"phát sinh mới")||wbContains(wb,"qđ28")||wbContains(wb,"qd28"))return"qd28";
  return"unknown";
}
function setPreserveStyle(ws,r,c,v){
  const ref=cellRef(r,c);const ex=ws[ref]||{};
  const t=typeof v==="number"?"n":(v instanceof Date?"d":"s");
  const style=ex.s?{...ex.s,font:ex.s.font||{name:"Times New Roman",sz:14},
    alignment:ex.s.alignment||{horizontal:"center",vertical:"center"}}:{
    font:{name:"Times New Roman",sz:14},alignment:{horizontal:"center",vertical:"center"},
    border:{top:{style:"thin",color:{rgb:"000000"}},bottom:{style:"thin",color:{rgb:"000000"}},
            left:{style:"thin",color:{rgb:"000000"}},right:{style:"thin",color:{rgb:"000000"}}}};
  ws[ref]={...ex,v,t,s:style};
}
function getFillStartCol(ws,row){
  if(!ws||!ws["!ref"])return 1;
  const range=XLSX.utils.decode_range(ws["!ref"]);
  for(let c=0;c<=range.e.c;c++){
    const cell=ws[cellRef(row,c)];
    if(!cell||cell.v==null||String(cell.v).trim()==="")return c;
    const v=String(cell.v).toLowerCase();
    if(!v.includes("phường")&&!v.includes("tân bình")&&!v.includes("quận")&&
       !v.includes("thành phố")&&v.trim()!=="")return c;
  }
  return 1;
}
function fillUnitRow(ws,vals,uname){
  if(!ws||!ws["!ref"])return false;
  const range=XLSX.utils.decode_range(ws["!ref"]);
  let unitRow=-1;
  for(let r=0;r<=range.e.r;r++){
    for(let c=0;c<=Math.min(range.e.c,5);c++){
      const v=String((ws[cellRef(r,c)]||{}).v||"").toLowerCase();
      if(v.includes("phường")||v.includes("tân bình")||v.includes(uname.toLowerCase().slice(0,8))){
        unitRow=r;break;
      }
    }
    if(unitRow>=0)break;
  }
  if(unitRow<0)return false;
  const sc=getFillStartCol(ws,unitRow);
  vals.forEach((v,i)=>{if(v!==null&&v!==undefined)setPreserveStyle(ws,unitRow,sc+i,v);});
  return true;
}
function smartFillRow(ws,unitRow,vals,maxCols){
  const range=XLSX.utils.decode_range(ws["!ref"]||"A1");
  let startC=1;
  for(let c=0;c<=Math.min(range.e.c,maxCols||50);c++){
    const cell=ws[cellRef(unitRow,c)];
    const v=String((cell||{}).v||"").toLowerCase();
    if(v.includes("phường")||v.includes("tân bình")){startC=c+1;break;}
  }
  vals.forEach((v,i)=>{if(v!==null&&v!==undefined)setPreserveStyle(ws,unitRow,startC+i,v);});
}

    if(type==="tb136"){

// ════════════════════════════════════════════════════════════════
// NORMALIZE TEMPLATE: chuẩn hóa file mẫu mới ngay khi upload
// Áp dụng font TNR, border header, fill chuẩn → lưu lại base64
// Sau đó fillTemplate luôn cho ra file đẹp không phụ thuộc file gốc
// ════════════════════════════════════════════════════════════════
function normalizeTemplate(wb){
  wb.SheetNames.forEach(sn=>{
    const ws=wb.Sheets[sn];
    if(!ws||!ws["!ref"])return;
    const info=scanHeader(ws);
    if(info.dataStartRow<0)return;

    const range=XLSX.utils.decode_range(ws["!ref"]);
    const NC=range.e.c+1;
    const slaveMap=buildSlaveMap(ws);

    const THIN  ={style:"thin",  color:{rgb:"000000"}};
    const MEDIUM={style:"medium",color:{rgb:"000000"}};
    const NONE  ={style:"none"};
    const BDR_NONE={top:NONE,bottom:NONE,left:NONE,right:NONE};
    const BDR_HDR ={top:MEDIUM,bottom:MEDIUM,left:THIN,right:THIN};
    const BDR_SUB ={top:THIN,  bottom:THIN, left:THIN,right:THIN};
    const F=(sz,bold,italic)=>({name:"Times New Roman",sz,bold:!!bold,italic:!!italic});
    const ALN=(h)=>({horizontal:h,vertical:"center",wrapText:true});

    function norm(ri,ci,s){
      if(slaveMap.has(ri+":"+ci))return;
      const ref=XLSX.utils.encode_cell({r:ri,c:ci});
      const ex=ws[ref]||{};
      ws[ref]={...ex,v:ex.v!=null?ex.v:"",t:typeof ex.v==="number"?"n":"s",s};
    }

    // ── Hàng tiêu đề (không border, font TNR chuẩn VN) ──
    info.titleRows.forEach(ri=>{
      for(let c=0;c<NC;c++){
        const ref=XLSX.utils.encode_cell({r:ri,c});
        const ex=ws[ref];if(!ex||ex.v==null||ex.v==="")continue;
        const v=String(ex.v).toLowerCase();
        const isTitle=v.includes("phụ lục")||v.includes("danh sách")||
                      v.includes("thống kê")||v.includes("kết quả")||
                      v.includes("biểu mẫu")||v.includes("báo cáo");
        const isPeriod=v.startsWith("(")||v.includes("toàn bộ")||v.includes("từ ngày")||v.includes("tuần");
        const isCap=v.includes("cộng hòa")||v.includes("độc lập");
        norm(ri,c,{
          font: F(isTitle?14:13, isTitle||isCap, isPeriod),
          alignment: ALN("center"),
          border: BDR_NONE,
          fill: {patternType:"none"},
        });
      }
      ws["!rows"]=ws["!rows"]||[];
      if(!ws["!rows"][ri]) ws["!rows"][ri]={hpt:ri<=1?22:(ri<=3?36:20)};
    });

    // ── Header cột chính ──
    if(info.headerRow>=0){
      for(let c=0;c<NC;c++){
        if(slaveMap.has(info.headerRow+":"+c))continue;
        const ref=XLSX.utils.encode_cell({r:info.headerRow,c});
        const ex=ws[ref]||{};
        ws[ref]={...ex,v:ex.v!=null?ex.v:"",t:"s",s:{
          font:F(13,true),alignment:ALN("center"),border:BDR_HDR,
          fill:{patternType:"solid",fgColor:{rgb:"BDD7EE"}},
        }};
      }
      ws["!rows"]=ws["!rows"]||[];
      ws["!rows"][info.headerRow]={hpt:40};
    }

    // ── Sub-header rows ──
    info.subRows.forEach((ri,idx)=>{
      for(let c=0;c<NC;c++){
        if(slaveMap.has(ri+":"+c))continue;
        const ref=XLSX.utils.encode_cell({r:ri,c});
        const ex=ws[ref]||{};
        ws[ref]={...ex,v:ex.v!=null?ex.v:"",t:"s",s:{
          font:F(12,idx===0),alignment:ALN("center"),border:BDR_SUB,
          fill:{patternType:"solid",fgColor:{rgb:idx===0?"D9E1F2":"E2EFDA"}},
        }};
      }
      ws["!rows"]=ws["!rows"]||[];
      ws["!rows"][ri]={hpt:idx===0?36:22};
    });

    // ── Hàng số thứ tự cột ──
    if(info.numTTRow>=0){
      for(let c=0;c<NC;c++){
        if(slaveMap.has(info.numTTRow+":"+c))continue;
        const ref=XLSX.utils.encode_cell({r:info.numTTRow,c});
        const ex=ws[ref]||{};
        ws[ref]={...ex,v:ex.v!=null?ex.v:"",t:"s",s:{
          font:F(11,false),alignment:ALN("center"),border:BDR_SUB,
          fill:{patternType:"solid",fgColor:{rgb:"E2EFDA"}},
        }};
      }
      ws["!rows"]=ws["!rows"]||[];
      ws["!rows"][info.numTTRow]={hpt:20};
    }

    // ── Vùng data: chỉ chuẩn hóa border cho ô ĐÃ có dữ liệu (dữ liệu mẫu) ──
    // Ô trống trong template giữ nguyên (sẽ được fill khi xuất)
    for(let r=info.dataStartRow;r<=range.e.r;r++){
      for(let c=0;c<NC;c++){
        if(slaveMap.has(r+":"+c))continue;
        const ref=XLSX.utils.encode_cell({r,c});
        const ex=ws[ref];
        if(!ex||ex.v==null||ex.v==="")continue; // bỏ qua ô trống
        const isNum=typeof ex.v==="number";
        ws[ref]={...ex,s:{
          font:F(13,false),
          alignment:ALN(isNum?"center":"left"),
          border:{top:THIN,bottom:THIN,left:THIN,right:THIN},
          fill:{patternType:"none"},
        }};
      }
    }

    // ── Freeze panes tại hàng data ──
    if(info.dataStartRow>0&&!ws["!freeze"]){
      ws["!freeze"]={xSplit:0,ySplit:info.dataStartRow,topLeftCell:XLSX.utils.encode_cell({r:info.dataStartRow,c:0})};
    }
  });

  return wb;
}

// ── IndexedDB cache cho template base64 (tránh giới hạn 5MB localStorage) ──
const IDB_NAME="sync_tpl_store", IDB_VER=1, IDB_STORE="b64_cache";
function idbOpen(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(IDB_NAME,IDB_VER);
    req.onupgradeneeded=e=>e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess=e=>res(e.target.result);
    req.onerror=e=>rej(e.target.error);
  });
}
async function idbSet(key,val){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete=()=>res(true);
    tx.onerror=e=>rej(e.target.error);
  });
}
async function idbGet(key){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const req=db.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get(key);
    req.onsuccess=e=>res(e.target.result||null);
    req.onerror=e=>rej(e.target.error);
  });
}
async function idbDel(key){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete=()=>res(true);
    tx.onerror=e=>rej(e.target.error);
  });
}
async function idbHas(key){
  const v=await idbGet(key);return v!=null;
}

function SyncPage({data,toast}){
  const [templates,setTemplates]=useState([]);
  const [dr,setDr]=useState({from:"",to:""});
  const [logs,setLogs]=useState({});
  const [processing,setProcessing]=useState(null);
  const [dragging,setDragging]=useState(false);
  const [cachedMap,setCachedMap]=useState({}); // {templateId: boolean}
  const fileRef=useRef();
  useEffect(()=>{
    try{const saved=JSON.parse(localStorage.getItem("sync_tpl_meta")||"[]");setTemplates(saved);}catch{}
  },[]);
  // Quét trạng thái cache của TẤT CẢ template mỗi khi danh sách thay đổi
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      const entries=await Promise.all(
        templates.map(async tpl=>[tpl.id, await idbHas("sync_b64_"+tpl.id)])
      );
      if(!cancelled) setCachedMap(Object.fromEntries(entries));
    })();
    return()=>{cancelled=true;};
  },[templates]);
  const saveMeta=(list)=>{
    try{
      const stripped=list.map(t=>{
        const copy={};
        Object.keys(t).forEach(k=>{if(k!=="base64")copy[k]=t[k];});
        return copy;
      });
      localStorage.setItem("sync_tpl_meta",JSON.stringify(stripped));
    }catch{}
  };
  const uploadTemplate=(file)=>{
    if(!file||!/\.xlsx?$/i.test(file.name)){toast("Vui lòng chọn file .xlsx","error");return;}
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const b64raw=e.target.result.split(",")[1];
        const wb=XLSX.read(b64raw,{type:"base64",cellStyles:true,cellDates:true,cellNF:true});
        const type=detectTemplateType(wb);
        // ── CHUẨN HÓA TEMPLATE: font TNR, border header, fill chuẩn ──
        normalizeTemplate(wb);
        const b64=XLSX.write(wb,{type:"base64",bookType:"xlsx",cellStyles:true});
        const id="t"+Date.now();
        idbSet("sync_b64_"+id,b64)
          .then(()=>setCachedMap(p=>({...p,[id]:true})))
          .catch(e=>toast("Lỗi lưu cache: "+e.message,"error"));
        setTemplates(prev=>{
          const next=[...prev.filter(t=>t.type!==type||type==="unknown"),
            {id,name:file.name,type,size:Math.round(b64.length/1024),
             uploadedAt:new Date().toISOString(),sheets:wb.SheetNames,normalized:true}];
          saveMeta(next);return next;
        });
        toast("✅ "+( TPL_META[type]?.label||type)+" · "+wb.SheetNames.length+" sheet · ✨ Đã chuẩn hóa","success");
      }catch(err){toast("Lỗi đọc file: "+err.message,"error");}
    };reader.readAsDataURL(file);
  };
  const removeTemplate=(id)=>{
    setTemplates(prev=>{const next=prev.filter(t=>t.id!==id);saveMeta(next);return next;});
    idbDel("sync_b64_"+id).then(()=>setCachedMap(p=>{const n={...p};delete n[id];return n;})).catch(()=>{});
    toast("Đã xóa template","info");
  };
  const fillOne=async(tpl)=>{
    setProcessing(tpl.id);
    try{
      const b64=await idbGet("sync_b64_"+tpl.id);
      if(!b64){toast("⚠️ Không tìm thấy cache! Vui lòng tải lại file template.","error");setProcessing(null);return;}

        <div className="btn-grp">
          {templates.filter(t=>t.type!=="unknown").length>0&&<button className="btn btn-green" onClick={fillAll} disabled={!!processing}>⚡ Điền tất cả ({templates.filter(t=>t.type!=="unknown").length} file)</button>}
          <button className="btn btn-primary" onClick={()=>fileRef.current?.click()}>📁 Tải lên template</button>
        </div>

      <input ref={fileRef} type="file" accept=".xlsx,.xls" multiple style={{display:"none"}} onChange={e=>{Array.from(e.target.files||[]).forEach(uploadTemplate);e.target.value="";}}/>

        <div className="card-hd"><h3>📅 Kỳ báo cáo</h3></div>
        <div style={{padding:"12px 16px",display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
          {[["from","Từ ngày"],["to","Đến ngày"]].map(([k,lbl])=>(
            <div key={k} style={{display:"flex",gap:7,alignItems:"center"}}>
              <label style={{fontSize:12,fontWeight:600,color:"#555"}}>{lbl}</label>
              <DateInputVN value={dr[k]||""} onChange={v=>setDr(p=>({...p,[k]:v}))} style={{width:155,padding:"6px 9px",border:"1.5px solid #d0d7e8",borderRadius:8,fontSize:12,background:"#f8fafd",boxSizing:"border-box"}}/>
            </div>
          ))}
          <div style={{padding:"6px 14px",borderRadius:6,fontSize:12.5,fontWeight:600,background:dr.from&&dr.to?"#e8f5e9":"#fff3e0",border:"1px solid "+(dr.from&&dr.to?"#a5d6a7":"#ffb74d"),color:dr.from&&dr.to?"#2e7d32":"#e65100"}}>
            {dr.from&&dr.to?"✓ "+fmtDate(dr.from)+" → "+fmtDate(dr.to):"⚠️ Toàn bộ dữ liệu"}
          </div>
          <div style={{display:"flex",gap:5}}>

// ── CloudSyncIndicator ───────────────────────────────────────
// Nút hiển thị trạng thái đồng bộ dữ liệu với Firebase (cloud), cập nhật theo
// thời gian thực (poll mỗi giây) từ window.__cloudSync do window.storage ghi lại.
// Bấm vào nút sẽ chuyển tới trang "Cấu hình hệ thống" để xem/khắc phục chi tiết.
function CloudSyncIndicator({onGoToSettings}){
  const [tick,setTick]=useState(0);
  useEffect(()=>{
    const id=setInterval(()=>setTick(t=>t+1),1000);
    return()=>clearInterval(id);
  },[]);
  const configured=!!_fbDb;
  const s=window.__cloudSync||{status:"idle",lastSyncAt:null,lastError:null};
  const authPending=configured&&!_fbAuthOk&&(_fbAuth!=null);

  let color,bg,border,icon,label;
  if(!configured){
    color="#64748b";bg="#f1f5f9";border="#e2e8f0";icon="☁️";label="Chưa kết nối Cloud";
  }else if(s.status==="syncing"){
    color="#c2410c";bg="#fff7ed";border="#fed7aa";icon="🔄";label="Đang đồng bộ...";
  }else if(s.status==="error"){
    color="#dc2626";bg="#fef2f2";border="#fecaca";icon="⚠️";label="Lỗi đồng bộ Cloud";
  }else if(authPending){
    color="#dc2626";bg="#fef2f2";border="#fecaca";icon="⚠️";label="Chưa đăng nhập Cloud";
  }else{
    color="#16a34a";bg="#f0fdf4";border="#bbf7d0";icon="☁️";label="Đã đồng bộ Cloud";
  }

  const agoText=(()=>{
    if(!s.lastSyncAt)return"";
    const sec=Math.max(0,Math.round((Date.now()-s.lastSyncAt)/1000));
    if(sec<5)return"vừa xong";
    if(sec<60)return`${sec} giây trước`;
    const min=Math.round(sec/60);
    if(min<60)return`${min} phút trước`;
    const hr=Math.round(min/60);
    return`${hr} giờ trước`;
  })();

  const tooltip=!configured
    ? "Chưa cấu hình Firebase — dữ liệu chỉ đang lưu trên trình duyệt này.\nBấm để vào Cấu hình hệ thống."
    : s.status==="error"
      ? `Lần đồng bộ gần nhất bị lỗi: ${s.lastError||"không rõ nguyên nhân"}\nBấm để kiểm tra lại.`
      : authPending
        ? "Đã kết nối Firestore nhưng CHƯA đăng nhập được tài khoản dùng chung.\nBấm để kiểm tra lại."
        : `Dữ liệu đang được đồng bộ với Firebase.${agoText?"\nLần ghi gần nhất: "+agoText:""}`;

  return(
    <button onClick={onGoToSettings} title={tooltip}
      style={{display:"flex",alignItems:"center",gap:6,padding:"5px 11px",
        background:bg,borderRadius:8,border:`1.5px solid ${border}`,cursor:"pointer",flexShrink:0}}>
      <span style={{fontSize:14}}>{icon}</span>
      <span style={{fontSize:11.5,fontWeight:700,color}}>{label}</span>
      {configured&&s.status==="idle"&&agoText&&
        <span style={{fontSize:10,color:"#94a3b8",fontWeight:600}}>· {agoText}</span>}
    </button>
  );
}

// ── StorageIndicator ─────────────────────────────────────────
function StorageIndicator(){
  const [kb,setKb]=useState(0);
  useEffect(()=>{
    const update=()=>setKb(getStorageUsage());
    update();
    const id=setInterval(update,8000);
    return()=>clearInterval(id);
  },[]);
  const MAX=4800;
  const pctUsed=Math.min(100,Math.round(kb/MAX*100));
  const color=pctUsed>80?"#ef4444":pctUsed>60?"#f97316":"#22c55e";
  const label=pctUsed>80?"Sắp đầy":pctUsed>60?"Khá đầy":"Bình thường";
  return(
    <div title={`Bộ nhớ: ${kb} KB / ${MAX} KB (${pctUsed}%)
${label}`}
      style={{display:"flex",alignItems:"center",gap:7,padding:"5px 11px",
        background:"#f8faff",borderRadius:8,border:"1.5px solid #e2e8f0",cursor:"default",flexShrink:0}}>
      <div style={{display:"flex",flexDirection:"column",gap:3}}>
        <div style={{width:48,height:4,background:"#e2e8f0",borderRadius:2,overflow:"hidden"}}>
          <div style={{width:pctUsed+"%",height:"100%",background:color,borderRadius:2,transition:"width .5s"}}/>
        </div>
        <span style={{fontSize:10,color:"#94a3b8",fontWeight:600,textAlign:"center"}}>{kb} KB</span>
      </div>
      <span style={{fontSize:18,lineHeight:1}}>{pctUsed>80?"🔴":pctUsed>60?"🟡":"🟢"}</span>
    </div>
  );
}


// ── Alert Bell + Panel ────────────────────────────────────────
function AlertPanel({data,onClose,onNavigate}){

  });

  const all=collectAlerts(data,warnDays);
  const expired=all.filter(a=>a.daysLeft<=0);
  const critical=all.filter(a=>a.daysLeft>0&&a.daysLeft<=7);
  const warning=all.filter(a=>a.daysLeft>7&&a.daysLeft<=15);
  const soon=all.filter(a=>a.daysLeft>15&&a.daysLeft<=warnDays);

    {id:"expired",lbl:`🔴 Hết hạn (${expired.length})`},
    {id:"critical",lbl:`🟠 Khẩn (${critical.length})`},
    {id:"warning",lbl:`🟡 Sắp hết (${warning.length})`},

      {/* Tabs */}

        {tabs.map(t=>(
          <button key={t.id} className={"alert-tab"+(tab===t.id?" active":"")} onClick={()=>setTab(t.id)}>
            {t.lbl}

function AlertBell({data,onNavigate}){
  const [open,setOpen]=useState(false);
  const [warnDays,setWarnDays]=useState(()=>{
    try{return parseInt(localStorage.getItem("alert_warn_days")||"30");}catch{return 30;}
  });
  const [ringing,setRinging]=useState(false);
  const btnRef=useRef();

  // Recheck every time warnDays changes from panel
  const checkWarnDays=()=>{
    try{return parseInt(localStorage.getItem("alert_warn_days")||"30");}catch{return 30;}
  };

  const count=collectAlerts(data,checkWarnDays()).length;
  const hasUrgent=collectAlerts(data,7).length>0;

  // Ring bell if there are urgent items
  useEffect(()=>{
    if(hasUrgent){setRinging(true);setTimeout(()=>setRinging(false),700);}
  },[hasUrgent]);

  // Click outside to close
  useEffect(()=>{
    if(!open)return;
    const handler=(e)=>{
      if(btnRef.current&&!btnRef.current.contains(e.target)){
        // Check if click is inside alert panel
        const panel=document.querySelector(".alert-panel");
        if(panel&&panel.contains(e.target))return;
        setOpen(false);
      }
    };
    document.addEventListener("mousedown",handler);
    return()=>document.removeEventListener("mousedown",handler);
  },[open]);

  return(
    <>
      <div ref={btnRef} className={"alert-bell"+(ringing?" ringing":"")}
        onClick={()=>setOpen(o=>!o)}
        title={count>0?`${count} cảnh báo sắp hết hạn`:"Không có cảnh báo"}>
        <span style={{fontSize:18}}>{count>0?"🔔":"🔕"}</span>
        {count>0&&<span className="bell-badge">{count>99?"99+":count}</span>}
      </div>
      {open&&<AlertPanel data={data} onClose={()=>setOpen(false)} onNavigate={onNavigate}/>}
    </>
  );
}

// DATABOARD – Tổng hợp TẤT CẢ đối tượng đã Loại/Xóa khỏi mọi nhóm
// Tìm kiếm theo tên/CCCD/nhóm, cho phép Phục hồi hoặc Xóa vĩnh viễn
// Xóa vĩnh viễn → ghi lại toàn bộ mảng doiTuong (đã loại bỏ bản ghi)
// vào window.storage → tự động xóa sạch cả Firebase lẫn cache localStorage
// (theo đúng cơ chế set() hiện có: ghi đè Firebase + _lsClear key cũ)
// ══════════════════════════════════════════════════════════════
function DaLoaiDataboardPage({doiTuong,setDoiTuong,toast}){
  const [search,setSearch]=useState("");
  const [filterNhom,setFilterNhom]=useState("all");
  const [delRec,setDelRec]=useState(null);
  const [delConfirmText,setDelConfirmText]=useState("");
  const [busy,setBusy]=useState(false);

  const loaiList=useMemo(()=>doiTuong.filter(r=>r.da_loai),[doiTuong]);

  const filtered=loaiList.filter(r=>{
    if(filterNhom!=="all"&&!(r.nhom||[]).includes(filterNhom))return false;
    return matchesNguoiSearch(r,search);
  }).sort((a,b)=>new Date(b.ngay_loai||0)-new Date(a.ngay_loai||0));

  const groupCounts=NHOM_LIST.map(n=>({...n,n:loaiList.filter(r=>(r.nhom||[]).includes(n.id)).length}));

  const restore=async(rec)=>{
    const next=doiTuong.map(r=>r._id===rec._id?{...r,da_loai:false,ngay_loai:"",ly_do_loai:"",ghi_chu_loai:""}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);toast("Đã phục hồi đối tượng","success");}
    catch(e){toast("❌ Lỗi phục hồi: "+e.message,"error");}
  };

  const hardDelete=async()=>{
    if(!delRec)return;
    setBusy(true);
    const next=doiTuong.filter(r=>r._id!==delRec._id);
    try{
      // Ghi đè toàn bộ danh sách (không còn bản ghi này) lên Firebase + xóa cache localStorage tương ứng
      await saveStore(KEYS.doi_tuong,next);
      setDoiTuong(next);
      setDelRec(null);setDelConfirmText("");
      toast("🗑️ Đã xóa vĩnh viễn khỏi hệ thống (Firebase + bộ nhớ đệm trình duyệt)","success");
    }catch(e){
      toast("❌ Lỗi xóa vĩnh viễn: "+e.message,"error");
    }finally{setBusy(false);}
  };

  return(
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">🗑️ Đối tượng đã Loại / Xóa khỏi danh sách</div>

              <div style={{fontSize:13,color:"#1a2340",lineHeight:1.6,marginBottom:12}}>

                bao gồm cả <b>Firebase Firestore</b> và <b>bộ nhớ đệm trình duyệt (localStorage)</b>. Dữ liệu sẽ <b>không thể khôi phục</b> sau khi xóa.
              </div>
              <div style={{fontSize:12,color:"#64748b",marginBottom:6}}>Nhập <b>XÓA</b> để xác nhận:</div>
              <input autoFocus value={delConfirmText} onChange={e=>setDelConfirmText(e.target.value)}
                style={{width:"100%",padding:"9px 12px",border:"1.5px solid #fecaca",borderRadius:8,fontSize:14,outline:"none",marginBottom:14,boxSizing:"border-box"}}
                placeholder="Nhập XÓA để xác nhận"/>
              <div style={{display:"flex",gap:8}}>
                <button className="btn btn-ghost" style={{flex:1}} disabled={busy} onClick={()=>setDelRec(null)}>Hủy</button>
                <button style={{flex:2,padding:"10px",background:delConfirmText==="XÓA"?"linear-gradient(135deg,#ef4444,#b91c1c)":"#e0e0e0",
                    color:"#fff",border:"none",borderRadius:9,fontWeight:800,fontSize:13,cursor:delConfirmText==="XÓA"&&!busy?"pointer":"not-allowed"}}
                  disabled={delConfirmText!=="XÓA"||busy} onClick={hardDelete}>
                  {busy?"⏳ Đang xóa...":"🗑️ Xóa vĩnh viễn"}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function UnifiedPage({doiTuong,setDoiTuong,dateRange,toast}){
  const [form,setForm]=useState(null);
  const [viewRec,setViewRec]=useState(null);
  const [editPwdTarget,setEditPwdTarget]=useState(null);
  const [delRec,setDelRec]=useState(null);
  const [loaiRec,setLoaiRec]=useState(null);
  const [filterNhom,setFilterNhom]=useState("all"); // "all"|"su_dung"|"nghien"|"sau_cai"|"vppl"
  const [search,setSearch]=useState("");
  const [tabLoai,setTabLoai]=useState(false);
  const [pg,setPg]=useState(1);
  const PER=15;
  const importRef=useRef();
  const [importPreview,setImportPreview]=useState(null); // {newRows,updatable,fileName}

  // Normalize name for duplicate detection
  const normName=n=>String(n||"").toLowerCase().replace(/\s+/g," ").trim();

  // Parse date from Excel cell value (string "dd/mm/yyyy", date object, or year number)
  const parseExcelDate=v=>{
    if(!v)return "";
    if(v instanceof Date)return v.toISOString().slice(0,10);
    const s=String(v).trim();
    // dd/mm/yyyy or dd/mm/yy
    const m1=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if(m1){
      const y=m1[3].length===2?"20"+m1[3]:m1[3];
      return `${y}-${m1[2].padStart(2,"0")}-${m1[1].padStart(2,"0")}`;
    }
    // yyyy-mm-dd
    const m2=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m2)return s.slice(0,10);
    // Just year: 1985
    if(/^\d{4}$/.test(s))return s+"-01-01";
    // Excel serial number
    if(/^\d+$/.test(s)&&Number(s)>1000){
      const d=new Date((Number(s)-25569)*86400000);
      if(!isNaN(d))return d.toISOString().slice(0,10);
    }
    return "";
  };

  const importFromExcel=file=>{
    if(!file||!/\.xlsx?$/i.test(file.name)){toast("Vui lòng chọn file .xlsx / .xls","error");return;}
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const b64=e.target.result.split(",")[1];
        const wb=XLSX.read(b64,{type:"base64",cellDates:true,cellNF:true});
        // Try sheet named PL 1B, else first sheet
        const sheetName=wb.SheetNames.includes("PL 1B")?"PL 1B":wb.SheetNames[0];
        const ws=wb.Sheets[sheetName];
        const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
        // Find header row (row with "Họ và tên" or STT)
        let dataStart=10; // default
        for(let i=0;i<aoa.length;i++){
          const row=aoa[i];
          if(row[0]==="STT"||row[0]===(1)){dataStart=i+2;break;}
          if(String(row[0]).trim()==="(1)"){dataStart=i+1;break;}
        }
        // Existing names map (normName → _id)
        const existingMap={};
        doiTuong.forEach(r=>{existingMap[normName(r.ho_ten)]=r._id;});
        const newRows=[];
        const updatable=[]; // {excelData, existingId, name}
        for(let i=dataStart;i<aoa.length;i++){
          const row=aoa[i];
          // Chỉ xử lý hàng có STT là số nguyên dương (cột 0)
          const sttRaw=String(row[0]||"").trim();
          if(!sttRaw||!/^\d+$/.test(sttRaw))continue;
          const hoTen=String(row[1]||"").trim();
          if(!hoTen)continue;
          // Build record data
          const namVal=String(row[2]||"").trim();
          const nuVal=String(row[3]||"").trim();
          let gioiTinh="",ngaySinhRaw="";
          if(namVal){gioiTinh="Nam";ngaySinhRaw=namVal;}
          else if(nuVal){gioiTinh="Nữ";ngaySinhRaw=nuVal;}
          const hkttRaw=String(row[4]||"").trim();
          const hkttParts=hkttRaw.split(/\n/);
          const hktt=hkttParts.find(p=>/HKTT:/i.test(p))?hkttParts.find(p=>/HKTT:/i.test(p)).replace(/HKTT:\s*/i,""):hkttParts[0];
          const noiO=hkttParts.find(p=>/Nơi ở:/i.test(p))?hkttParts.find(p=>/Nơi ở:/i.test(p)).replace(/Nơi ở:\s*/i,""):"";
          const recData={
            ho_ten:hoTen,ngay_sinh:parseExcelDate(ngaySinhRaw),gioi_tinh:gioiTinh,
            hktt:hktt.trim(),noi_o_ht:noiO.trim(),cccd:String(row[5]||"").trim(),
            tien_an_ct:String(row[6]||"").trim(),hanh_vi_nv:String(row[7]||"").trim(),
            dau_hieu_nghi_van:String(row[8]||"").trim(),dia_ban_nghi_van:String(row[9]||"").trim(),
            dien_ql_so_hs:String(row[10]||"").trim(),doi_sach_xl:String(row[11]||"").trim(),
            don_vi_ql_nv:String(row[12]||"").trim()||"Công an phường Tân Bình",
            so_luot_goi_hoi_import:String(row[13]||"").trim(), // col N(14) = Số lượt gọi hỏi – lưu tham khảo
            thoi_diem_vang_mat:String(row[14]||"").trim(),  // col O(15) = Thời điểm vắng mặt
            linh_vuc_nv:String(row[15]||"").trim(),         // col P(16) = Lĩnh vực
            thoi_diem_dua_vao_ql:parseExcelDate(row[16]),
            can_bo_theo_doi:String(row[17]||"").trim(),chi_huy_theo_doi:String(row[18]||"").trim(),
            tang_giam_ly_do:String(row[19]||"").trim(),
          };
          // Check duplicate
          const existId=existingMap[normName(hoTen)];
          if(existId){updatable.push({existId,recData,name:hoTen});continue;}
          newRows.push({_id:uid(),_created:new Date().toISOString(),nhom:[],...recData});
        }
        if(newRows.length===0&&updatable.length===0){toast("Không tìm thấy dữ liệu hợp lệ trong file","warning");return;}
        setImportPreview({newRows,updatable,fileName:file.name});
      }catch(err){toast("Lỗi đọc file: "+err.message,"error");}
    };
    reader.readAsDataURL(file);
  };

  const confirmImport=async(updateSelected={})=>{
    if(!importPreview)return;
    let list=[...doiTuong];
    // Add new records
    if(importPreview.newRows.length>0)list=[...importPreview.newRows,...list];
    // Update selected existing records
    const updateIds=Object.keys(updateSelected).filter(id=>updateSelected[id]);
    if(updateIds.length>0){
      const updateMap={};
      (importPreview.updatable||[]).forEach(u=>{updateMap[u.existId]=u.recData;});
      list=list.map(r=>updateIds.includes(r._id)?{...r,...updateMap[r._id],_updated:new Date().toISOString()}:r);
    }
    // Lưu TRƯỚC, chỉ cập nhật giao diện SAU khi lưu thành công (tránh trường hợp
    // giao diện đã hiện dữ liệu mới nhưng thực tế chưa được ghi lại nếu lưu lỗi).
    try{
      await saveStore(KEYS.doi_tuong,list);
      setDoiTuong(list);
      const msgs=[];
      if(importPreview.newRows.length>0)msgs.push("thêm "+importPreview.newRows.length+" mới");
      if(updateIds.length>0)msgs.push("cập nhật "+updateIds.length+" đối tượng");
      toast("✅ Đã "+msgs.join(", ")+" từ Excel!","success");
      setImportPreview(null);
    }catch(e){toast("❌ Lỗi lưu dữ liệu nhập từ Excel: "+e.message,"error");}
  };

  const active=doiTuong.filter(r=>!r.da_loai);
  const loai=doiTuong.filter(r=>r.da_loai);
  const base=tabLoai?loai:active;

  // Filter by nhom
  const byNhom=filterNhom==="all"?base:base.filter(r=>(r.nhom||[]).includes(filterNhom));

  // Filter by date
  const byDate=byNhom.filter(r=>{
    if(!dateRange.from&&!dateRange.to)return true;
    const d=new Date(r.ngay_vao_so||r.ngay_ph_hv||r._created||"");
    if(isNaN(d))return true;
    if(dateRange.from&&d<new Date(dateRange.from))return false;
    if(dateRange.to&&d>new Date(dateRange.to+"T23:59:59"))return false;
    return true;
  });

  // Search – chỉ khớp theo họ tên/CCCD/SĐT, không phân biệt dấu tiếng Việt
  const filtered=byDate.filter(r=>matchesNguoiSearch(r,search));
  const pages=Math.max(1,Math.ceil(filtered.length/PER));
  const paged=filtered.slice((pg-1)*PER,pg*PER);

  const save=async rec=>{
    let next;
    if(form.mode==="add") next=[{...rec,_id:uid(),_created:new Date().toISOString()},...doiTuong];
    else next=doiTuong.map(r=>r._id===form.rec._id?{...r,...rec}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);setForm(null);toast(form.mode==="add"?"✅ Đã thêm đối tượng!":"✅ Đã cập nhật!","success");}
    catch(e){toast("❌ Lỗi lưu: "+e.message,"error");}
  };
  const del=async()=>{
    const next=doiTuong.filter(r=>r._id!==delRec._id);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);setDelRec(null);toast("Đã xóa bản ghi","info");}
    catch(e){toast("❌ Lỗi xóa: "+e.message,"error");}
  };
  const loaiDT=async extra=>{
    const next=doiTuong.map(r=>r._id===loaiRec._id?{...r,...extra}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);setLoaiRec(null);toast("Đã loại đối tượng","info");}
    catch(e){toast("❌ Lỗi loại: "+e.message,"error");}
  };
  const phucHoi=async rec=>{
    const next=doiTuong.map(r=>r._id===rec._id?{...r,da_loai:false}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);toast("Đã phục hồi","success");}
    catch(e){toast("❌ Lỗi phục hồi: "+e.message,"error");}
  };

  // Counts per nhom
  const nhomCounts=Object.fromEntries(
    NHOM_LIST.map(n=>[n.id,active.filter(r=>(r.nhom||[]).includes(n.id)).length])
  );

  return(
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">👤 Danh sách đối tượng quản lý</div>

        <div className="btn-grp">

          {!tabLoai&&<button className="btn btn-green btn-sm" onClick={()=>importRef.current?.click()}>📥 Nhập từ Excel TB136</button>}
          {!tabLoai&&<button className="btn btn-primary btn-sm" onClick={()=>setForm({mode:"add",rec:null})}>＋ Thêm đối tượng</button>}
          <input ref={importRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={e=>{if(e.target.files[0])importFromExcel(e.target.files[0]);e.target.value="";}}/>

      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        <button onClick={()=>{setFilterNhom("all");setPg(1);}}
          style={{padding:"7px 14px",borderRadius:8,border:"1.5px solid "+(filterNhom==="all"?"var(--navy)":"var(--border)"),
            background:filterNhom==="all"?"var(--navy)":"#fff",color:filterNhom==="all"?"#fff":"var(--text2)",
            cursor:"pointer",fontSize:12.5,fontWeight:700,fontFamily:"inherit"}}>
          Tất cả ({active.length})
        </button>
        {NHOM_LIST.map(n=>(
          <button key={n.id} onClick={()=>{setFilterNhom(n.id);setPg(1);}}
            style={{padding:"7px 14px",borderRadius:8,
              border:"1.5px solid "+(filterNhom===n.id?n.color:"var(--border)"),
              background:filterNhom===n.id?n.color+"14":"#fff",
              color:filterNhom===n.id?n.color:"var(--text2)",
              cursor:"pointer",fontSize:12.5,fontWeight:700,fontFamily:"inherit"}}>
            {n.icon} {n.lbl} ({nhomCounts[n.id]||0})
          </button>
        ))}
      </div>

      {/* Đã loại tab */}
      <div className="tab-bar">
        <button className={"tab-btn"+(!tabLoai?" active":"")} onClick={()=>{setTabLoai(false);setSearch("");setPg(1);}}>
          📋 Đang quản lý &nbsp;<span style={{background:!tabLoai?"var(--navy)":"#e2e8f0",color:!tabLoai?"#fff":"var(--muted)",padding:"1px 7px",borderRadius:10,fontSize:11,fontWeight:700}}>{active.length}</span>
        </button>
        <button className={"tab-btn"+(tabLoai?" active":"")} onClick={()=>{setTabLoai(true);setSearch("");setPg(1);}}>
          🚫 Đã loại &nbsp;<span style={{background:tabLoai?"var(--navy)":"#e2e8f0",color:tabLoai?"#fff":"var(--muted)",padding:"1px 7px",borderRadius:10,fontSize:11,fontWeight:700}}>{loai.length}</span>
        </button>
      </div>

      {/* Table */}
      <div className="card">
        <div className="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th style={{width:38}}>STT</th>
                <th style={{width:44,textAlign:"center"}}>Ảnh</th>
                <th style={{minWidth:160}}>Họ và tên</th>
                <th style={{minWidth:130}}>Nhóm quản lý</th>
                <th style={{minWidth:100}}>Ngày sinh</th>
                <th style={{width:70}}>GT</th>
                <th style={{minWidth:120}}>CCCD</th>
                <th style={{minWidth:180}}>HKTT / Nơi ở</th>
                <th style={{minWidth:100}}>Ngày vào sổ</th>
                <th style={{minWidth:100}}>Cập nhật PM</th>
                <th style={{width:110,textAlign:"center"}}>Thao tác</th>
              </tr>
            </thead>
            <tbody>
              {paged.length===0&&<tr><td colSpan={10}>
                <div style={{textAlign:"center",padding:"48px 20px",color:"var(--muted)"}}>
                  <div style={{fontSize:52,marginBottom:12,opacity:.4}}>👤</div>
                  <p style={{fontSize:14,fontWeight:600,color:"var(--text2)",marginBottom:4}}>Chưa có đối tượng</p>
                  <p style={{fontSize:12,color:"var(--muted2)"}}>Nhấn <b>＋ Thêm đối tượng</b> để bắt đầu</p>
                </div>
              </td></tr>}
              {paged.map((r,ri)=>(
                <tr key={r._id} className={r.da_loai?"da-loai":""}>
                  <td style={{color:"var(--muted2)",fontSize:12}}>{(pg-1)*PER+ri+1}</td>
                  <td style={{textAlign:"center",verticalAlign:"middle",padding:"4px 6px"}}>
                    {r.anh_the
                      ?<img src={r.anh_the} alt="" style={{width:30,height:40,objectFit:"cover",borderRadius:4,border:"1px solid #dde3f0",display:"inline-block"}}/>
                      :<span style={{display:"inline-flex",width:30,height:40,background:"#f0f4f8",borderRadius:4,border:"1px dashed #c7d2fe",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>👤</span>
                    }
                  </td>
                  <td><b style={{color:"var(--navy)",fontSize:13}}>{r.ho_ten||"—"}</b></td>
                  <td><NhomBadge nhom={r.nhom}/></td>
                  <td><DateChip val={r.ngay_sinh}/></td>
                  <td><GtBadge v={r.gioi_tinh}/></td>
                  <td><span style={{fontFamily:"monospace",fontSize:12}}>{r.cccd||"—"}</span></td>
                  <td style={{fontSize:12,maxWidth:200}}>
                    <div title={r.hktt||""} style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:200}}>
                      {r.hktt||"—"}
                    </div>
                    {r.noi_o_ht&&r.noi_o_ht!==r.hktt&&<div style={{fontSize:10.5,color:"var(--muted2)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:200}}>📍 {r.noi_o_ht}</div>}
                  </td>
                  <td><DateChip val={r.ngay_vao_so}/></td>
                  <td><PmBadge v={r.cap_nhat_pm}/></td>
                  <td>
                    <div className="actions">
                      <button className="btn btn-sm btn-icon act-view" title="Xem chi tiết" onClick={()=>setViewRec(r)}>👁</button>
                      <button className="btn btn-sm btn-icon act-edit" title="Sửa (yêu cầu mật khẩu)" onClick={()=>setEditPwdTarget(r)}>✏️</button>
                      {!r.da_loai&&<button className="btn btn-sm btn-icon act-loai" title="Loại" onClick={()=>setLoaiRec(r)}>🚫</button>}
                      {r.da_loai&&<button className="btn btn-sm btn-icon act-restore" title="Phục hồi" onClick={()=>phucHoi(r)}>♻️</button>}
                      <button className="btn btn-sm btn-icon act-delete" title="Xóa" onClick={()=>setDelRec(r)}>🗑️</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="pag">
          <span className="pag-info"><b style={{color:"var(--navy)"}}>{filtered.length}</b> đối tượng · Trang <b>{pg}</b>/{pages}</span>
          <div style={{display:"flex",gap:4}}>
            <button className="pag-btn" disabled={pg===1} onClick={()=>setPg(1)}>«</button>
            <button className="pag-btn" disabled={pg===1} onClick={()=>setPg(p=>p-1)}>‹</button>
            {Array.from({length:Math.min(5,pages)},(_,i)=>{
              const n=Math.max(1,Math.min(pages-4,pg-2))+i;
              return n<=pages&&<button key={n} className={"pag-btn"+(pg===n?" active":"")} onClick={()=>setPg(n)}>{n}</button>;
            }).filter(Boolean)}
            <button className="pag-btn" disabled={pg===pages} onClick={()=>setPg(p=>p+1)}>›</button>
            <button className="pag-btn" disabled={pg===pages} onClick={()=>setPg(pages)}>»</button>
          </div>
        </div>
      </div>

      {/* Modals */}
      {form&&(
        <FormModal fields={F_UNIFIED} initial={form.rec}
          title={form.mode==="add"?"＋ Thêm đối tượng mới":"✏️ Sửa thông tin đối tượng"}
          onSave={save} onClose={()=>setForm(null)}/>
      )}
      {loaiRec&&<LoaiModal rec={loaiRec} onSave={loaiDT} onClose={()=>setLoaiRec(null)}/>}
      {delRec&&<Confirm msg={`Xóa vĩnh viễn đối tượng "${delRec.ho_ten||"?"}"?`} onOk={del} onCancel={()=>setDelRec(null)}/>}
      {viewRec&&<ViewModal rec={viewRec} fields={F_UNIFIED} onClose={()=>setViewRec(null)} onEdit={r=>setEditPwdTarget(r)}/>}
      {editPwdTarget&&<EditPwdModal onConfirm={()=>{setForm({mode:"edit",rec:editPwdTarget});setEditPwdTarget(null);}} onClose={()=>setEditPwdTarget(null)}/>}
      {importPreview&&<ImportPreviewModal importPreview={importPreview} setImportPreview={setImportPreview} confirmImport={confirmImport}/> }
    </div>
  );
}

// ── Filtered group view (readonly from unified) ───────────────
function GroupViewPage({nhomId,doiTuong,setDoiTuong,dateRange,toast,khuPho,setKhuPho}){
  const nhom=NHOM_MAP[nhomId];
  const [form,setForm]=useState(null);
  const [delRec,setDelRec]=useState(null);
  const [loaiRec,setLoaiRec]=useState(null);
  const [viewRec,setViewRec]=useState(null);
  const [editPwdTarget,setEditPwdTarget]=useState(null);
  const [search,setSearch]=useState("");
  const [tabLoai,setTabLoai]=useState(false);
  const [showRemovedGroup,setShowRemovedGroup]=useState(false);
  const [pg,setPg]=useState(1);
  const [importBusy,setImportBusy]=useState(false);
  const [importResult,setImportResult]=useState(null); // {added,updated,total}
  const importRef=useRef();
  const PER=15;
  const canImportHD26=["su_dung","nghien","sau_cai"].includes(nhomId);

  const normKey=r=>(String(r.ho_ten||"").toLowerCase().trim()+"|"+String(r.ngay_sinh||"").trim());

  const importHD26=file=>{
    if(!file||!/\.xlsx?$/i.test(file.name)){toast("Vui lòng chọn file .xlsx","error");return;}
    setImportBusy(true);
    const reader=new FileReader();
    reader.onload=async e=>{
      try{
        const b64=e.target.result.split(",")[1];
        const wb=XLSX.read(b64,{type:"base64",cellDates:true});
        const {records,error}=parseHD26ListFile(wb,nhomId);
        if(error){toast(error,"error");setImportBusy(false);return;}
        if(!records.length){toast("Không tìm thấy dòng dữ liệu hợp lệ trong file","error");setImportBusy(false);return;}
        // Khớp trùng theo Họ tên + Ngày sinh trong nhóm hiện tại → cập nhật, ngược lại thêm mới
        const existingMap={};
        doiTuong.filter(r=>(r.nhom||[]).includes(nhomId)).forEach(r=>{existingMap[normKey(r)]=r._id;});
        let added=0,updated=0;
        let next=[...doiTuong];
        records.forEach(rec=>{
          const k=normKey(rec);
          const exId=existingMap[k];
          if(exId){
            next=next.map(r=>r._id===exId?{...r,...rec,nhom:[...new Set([...(r.nhom||[]),nhomId])]}:r);
            updated++;
          }else{
            next=[{...rec,_id:uid(),_created:new Date().toISOString()},...next];
            added++;
          }
        });
        await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);
        // Tự động bổ sung Khu phố mới (nếu có) vào danh mục dùng chung
        if(setKhuPho&&khuPho){
          const known=new Set(khuPho.map(k=>k.ten_moi));
          const newKp=[...new Set(records.map(r=>r.khu_pho_moi).filter(Boolean))].filter(v=>!known.has(v));
          if(newKp.length){
            const toAdd=newKp.map(ten_moi=>({id:uid(),ten_moi,ten_cu:(records.find(r=>r.khu_pho_moi===ten_moi)||{}).khu_pho_cu||""}));
            const nextKp=[...khuPho,...toAdd];
            await saveStore(KEYS.khu_pho,nextKp);setKhuPho(nextKp);syncKhuPhoOptions(nextKp);
          }
        }
        setImportResult({added,updated,total:records.length});
        toast(`✅ Đã nhập ${records.length} dòng (${added} mới, ${updated} cập nhật)`,"success");
      }catch(err){
        toast("Lỗi đọc file: "+err.message,"error");
      }
      setImportBusy(false);
    };
    reader.readAsDataURL(file);
  };

  const inGroup=doiTuong.filter(r=>(r.nhom||[]).includes(nhomId));
  const active=inGroup.filter(r=>!r.da_loai);
  const loai=inGroup.filter(r=>r.da_loai);
  const base=tabLoai?loai:active;

  // Đối tượng ĐÃ bị loại khỏi RIÊNG nhóm này (khi trước đó thuộc nhiều nhóm) nhưng vẫn còn
  // hoạt động ở (các) nhóm khác — không tính vào "Tổng"/"đã loại" phía trên vì không thuộc
  // inGroup nữa, chỉ thống kê riêng để biết đối tượng từng bị loại khỏi nhóm này.
  const removedFromThisGroup=doiTuong
    .filter(r=>!r.da_loai&&!(r.nhom||[]).includes(nhomId)&&(r.nhom_loai_history||[]).some(h=>h.nhom===nhomId))
    .map(r=>{
      const hist=(r.nhom_loai_history||[]).filter(h=>h.nhom===nhomId).slice(-1)[0];
      return{rec:r,hist};
    });

  const byDate=base.filter(r=>{
    if(!dateRange.from&&!dateRange.to)return true;
    const d=new Date(r.ngay_vao_so||r.ngay_ph_hv||r._created||"");
    if(isNaN(d))return true;
    if(dateRange.from&&d<new Date(dateRange.from))return false;
    if(dateRange.to&&d>new Date(dateRange.to+"T23:59:59"))return false;
    return true;
  });

  const filtered=byDate.filter(r=>matchesNguoiSearch(r,search));
  const pages=Math.max(1,Math.ceil(filtered.length/PER));
  const paged=filtered.slice((pg-1)*PER,pg*PER);

  const save=async rec=>{
    let next;
    // Ensure nhom includes this group
    const nhomArr=Array.isArray(rec.nhom)?rec.nhom:[nhomId];
    if(!nhomArr.includes(nhomId))nhomArr.push(nhomId);
    const recFinal={...rec,nhom:nhomArr};
    if(form.mode==="add") next=[{...recFinal,_id:uid(),_created:new Date().toISOString()},...doiTuong];
    else next=doiTuong.map(r=>r._id===form.rec._id?{...r,...recFinal}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);setForm(null);toast("✅ Đã lưu đối tượng!","success");}
    catch(e){toast("❌ Lỗi lưu: "+e.message,"error");}
  };
  const del=async()=>{
    const next=doiTuong.filter(r=>r._id!==delRec._id);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);setDelRec(null);toast("Đã xóa","info");}
    catch(e){toast("❌ Lỗi xóa: "+e.message,"error");}
  };
  const loaiDT=async extra=>{
    const next=doiTuong.map(r=>r._id===loaiRec._id?{...r,...extra}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);setLoaiRec(null);toast("Đã loại","info");}
    catch(e){toast("❌ Lỗi loại: "+e.message,"error");}
  };
  const phucHoi=async rec=>{
    const next=doiTuong.map(r=>r._id===rec._id?{...r,da_loai:false}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);toast("Đã phục hồi","success");}
    catch(e){toast("❌ Lỗi phục hồi: "+e.message,"error");}
  };

  // Thêm lại đối tượng vào nhóm này sau khi trước đó đã bị loại riêng khỏi nhóm này
  // (đối tượng vẫn hoạt động bình thường ở (các) nhóm khác trong lúc chờ thêm lại)
  const themLaiVaoNhom=async rec=>{
    const nhomMoi=(rec.nhom||[]).includes(nhomId)?rec.nhom:[...(rec.nhom||[]),nhomId];
    const next=doiTuong.map(r=>r._id===rec._id?{...r,nhom:nhomMoi}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);toast("Đã thêm lại vào nhóm "+(nhom?.lbl||""),"success");}
    catch(e){toast("❌ Lỗi: "+e.message,"error");}
  };

  // Default nhom for new record in this view
  const defaultRec={nhom:[nhomId]};

  const colMap={
    su_dung:[
      {label:"STT",w:38,render:(_,i)=>i+1},
      {label:"Họ và tên",w:160,render:r=><b style={{color:"var(--navy)"}}>{r.ho_ten||"—"}</b>},
      {label:"Nhóm",w:120,render:r=><NhomBadge nhom={r.nhom}/>},
      {label:"Khu phố",w:110,render:r=><TextCell v={r.khu_pho_moi||r.khu_pho_cu} max={16}/>},
      {label:"Ngày sinh",w:100,render:r=><DateChip val={r.ngay_sinh}/>},
      {label:"GT",w:70,render:r=><GtBadge v={r.gioi_tinh}/>},
      {label:"CCCD",w:120,render:r=><span style={{fontFamily:"monospace",fontSize:12}}>{r.cccd||"—"}</span>},
      {label:"Loại ma túy",w:120,render:r=>r.loai_ma_tuy?<span className="badge badge-red">{dv(r,"loai_ma_tuy").slice(0,20)}</span>:<span style={{color:"#cbd5e1"}}>—</span>},
      {label:"Ngày vào sổ",w:108,render:r=><DateChip val={r.ngay_vao_so}/>},
      {label:"PM",w:100,render:r=><PmBadge v={r.cap_nhat_pm}/>},
    ],
    nghien:[
      {label:"STT",w:38,render:(_,i)=>i+1},
      {label:"Họ và tên",w:160,render:r=><b style={{color:"var(--navy)"}}>{r.ho_ten||"—"}</b>},
      {label:"Nhóm",w:100,render:r=><NhomBadge nhom={r.nhom}/>},
      {label:"Khu phố",w:110,render:r=><TextCell v={r.khu_pho_moi||r.khu_pho_cu} max={16}/>},
      {label:"Ngày sinh",w:100,render:r=><DateChip val={r.ngay_sinh}/>},
      {label:"CCCD",w:120,render:r=><span style={{fontFamily:"monospace",fontSize:12}}>{r.cccd||"—"}</span>},
      {label:"Loại ma túy",w:120,render:r=>r.loai_ma_tuy?<span className="badge badge-orange">{dv(r,"loai_ma_tuy").slice(0,20)}</span>:<span style={{color:"#cbd5e1"}}>—</span>},
      {label:"Hình thức cai",w:150,render:r=><TextCell v={dv(r,"hinh_thuc_cai")} max={25}/>},
      {label:"PM",w:100,render:r=><PmBadge v={r.cap_nhat_pm}/>},
    ],
    sau_cai:[
      {label:"STT",w:38,render:(_,i)=>i+1},
      {label:"Họ và tên",w:160,render:r=><b style={{color:"var(--navy)"}}>{r.ho_ten||"—"}</b>},
      {label:"Nhóm",w:100,render:r=><NhomBadge nhom={r.nhom}/>},
      {label:"Khu phố",w:110,render:r=><TextCell v={r.khu_pho_moi||r.khu_pho_cu} max={16}/>},
      {label:"Ngày sinh",w:100,render:r=><DateChip val={r.ngay_sinh}/>},
      {label:"CCCD",w:120,render:r=><span style={{fontFamily:"monospace",fontSize:12}}>{r.cccd||"—"}</span>},
      {label:"QĐ Sau cai",w:140,render:r=><TextCell v={r.qd_sau_cai_so} max={22}/>},
      {label:"Ngày vào sổ",w:108,render:r=><DateChip val={r.ngay_vao_so}/>},
      {label:"PM",w:100,render:r=><PmBadge v={r.cap_nhat_pm}/>},
    ],
    vppl:[
      {label:"STT",w:38,render:(_,i)=>i+1},
      {label:"Họ tên",w:150,render:r=><b style={{color:"var(--navy)"}}>{r.ho_ten||"—"}</b>},
      {label:"Nhóm",w:100,render:r=><NhomBadge nhom={r.nhom}/>},
      {label:"Ngày PH",w:108,render:r=><DateChip val={r.ngay_ph_hv}/>},
      {label:"Ngày sinh",w:100,render:r=><DateChip val={r.ngay_sinh}/>},
      {label:"CCCD",w:120,render:r=><span style={{fontFamily:"monospace",fontSize:12}}>{r.cccd||"—"}</span>},
      {label:"Hành vi chính",w:140,render:r=>r.hanh_vi_chinh?<span className="badge badge-purple">{r.hanh_vi_chinh.slice(0,20)}</span>:<span style={{color:"#cbd5e1"}}>—</span>},
      {label:"Kết quả XL",w:130,render:r=>{const v=dv(r,"kq_xlhc_bpxp");return v?<span className="badge badge-teal">{v.slice(0,20)}</span>:<span className="badge badge-gray">Chưa có KQ</span>;}},
    ],
