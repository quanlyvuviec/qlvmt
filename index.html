// ── MultiDatePicker ──────────────────────────────────────────
function MultiDatePicker({value,onChange}){
  // value = comma-separated "yyyy-mm-dd,yyyy-mm-dd,..."
  const [showPicker,setShowPicker]=useState(false);
  const [pickerVal,setPickerVal]=useState("");
  const ref=useRef();

  const dates=value
    ?(value.split(",").map(d=>d.trim()).filter(Boolean))
    :[];

  const addDate=(d)=>{
    if(!d)return;
    if(dates.includes(d)){setPickerVal("");return;}
    const next=[...dates,d].sort();
    onChange(next.join(","));
    setPickerVal("");
    setShowPicker(false);
  };
  const removeDate=(d)=>{
    onChange(dates.filter(x=>x!==d).join(","));
  };

  useEffect(()=>{
    const handler=(e)=>{if(ref.current&&!ref.current.contains(e.target))setShowPicker(false);};
    document.addEventListener("mousedown",handler);
    return()=>document.removeEventListener("mousedown",handler);
  },[]);

  return(
    <div ref={ref} style={{position:"relative"}}>
      {/* Date chips */}
      <div style={{display:"flex",flexWrap:"wrap",gap:5,minHeight:36,padding:"5px 8px",
        border:"1.5px solid #d0d7e8",borderRadius:7,background:"#fff",cursor:"pointer",
        alignItems:"center"}} onClick={()=>setShowPicker(s=>!s)}>
        {dates.length===0&&<span style={{color:"#aaa",fontSize:12.5}}>Chưa có ngày nào – bấm để chọn</span>}
        {dates.map(d=>(
          <span key={d} style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",
            background:"#e3f2fd",border:"1px solid #90caf9",borderRadius:20,fontSize:12,fontWeight:600,color:"#1565c0"}}>
            {fmtDate(d)}
            <span onClick={(e)=>{e.stopPropagation();removeDate(d);}}
              style={{cursor:"pointer",color:"#e53935",fontWeight:700,fontSize:14,lineHeight:1}}>×</span>
          </span>
        ))}
        <span style={{marginLeft:"auto",color:"#1565c0",fontSize:18,lineHeight:1,flexShrink:0}}>
          {showPicker?"▲":"▼"}
        </span>
      </div>
      {/* Count badge */}
      {dates.length>0&&(
        <div style={{position:"absolute",top:-8,right:8,background:"#1565c0",color:"#fff",
          borderRadius:10,padding:"1px 7px",fontSize:10.5,fontWeight:700}}>{dates.length} ngày</div>
      )}
      {/* Dropdown calendar */}
      {showPicker&&(
        <div style={{position:"absolute",top:"calc(100% + 5px)",left:0,zIndex:500,
          background:"#fff",border:"1.5px solid #90caf9",borderRadius:10,padding:14,
          boxShadow:"0 8px 24px rgba(0,0,0,.18)",minWidth:260}}>
          <div style={{fontSize:12,fontWeight:700,color:"#1565c0",marginBottom:8}}>
            📅 Chọn ngày gọi hỏi, răn đe
          </div>
          <input type="date" style={{width:"100%",padding:"7px 10px",border:"1.5px solid #90caf9",
            borderRadius:7,fontSize:13,marginBottom:10,outline:"none"}}
            value={pickerVal} onChange={e=>setPickerVal(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter")addDate(pickerVal);}}
          />
          <button onClick={()=>addDate(pickerVal)}
            style={{width:"100%",padding:"7px",background:"#1565c0",color:"#fff",
              border:"none",borderRadius:7,fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:8}}>
            + Thêm ngày này
          </button>
          {/* Quick: today & yesterday */}
          <div style={{display:"flex",gap:6}}>
            {[["Hôm nay",0],["Hôm qua",1]].map(([lbl,offset])=>{
              const d=new Date();d.setDate(d.getDate()-offset);
              const iso=d.toISOString().slice(0,10);
              const already=dates.includes(iso);
              return(
                <button key={lbl} onClick={()=>addDate(iso)}
                  style={{flex:1,padding:"5px",background:already?"#e8f5e9":"#f0f4ff",
                    color:already?"#2e7d32":"#1565c0",border:"1px solid "+(already?"#a5d6a7":"#90caf9"),
                    borderRadius:6,fontSize:11.5,fontWeight:600,cursor:"pointer"}}>
                  {already?"✓ ":""}{lbl}
                </button>
              );
            })}
          </div>
          {dates.length>0&&(
            <button onClick={()=>onChange("")}
              style={{width:"100%",marginTop:8,padding:"4px",background:"#ffebee",
                color:"#e53935",border:"1px solid #ef9a9a",borderRadius:6,
                fontSize:11,fontWeight:600,cursor:"pointer"}}>
              🗑️ Xóa tất cả
            </button>
          )}
        </div>
      )}
    </div>
  );
}

// ── Smart FieldInput ─────────────────────────────────────────
// ── Ô chọn NHIỀU cán bộ có gợi ý theo tên đang gõ, hiện dạng chip, tự thêm nhãn (CSKV)/(PCTP) ──
// Giá trị lưu là 1 chuỗi: "Tên 1 (CSKV) - Tên 2 (PCTP) - Tên 3" — dùng chung được với báo cáo/xuất Excel hiện có.
function PersonMultiSelectInput({value,onChange,options}){
  const [search,setSearch]=useState("");
  const [showSug,setShowSug]=useState(false);
  const parseList=str=>{
    if(!str)return[];
    return String(str).split(" - ").map(s=>s.trim()).filter(Boolean).map(s=>{
      const m=s.match(/^(.*?)\s*\((CSKV|PCTP)\)\s*$/);
      return m?{ten:m[1].trim(),tag:m[2]}:{ten:s,tag:""};
    });
  };
  const buildStr=list=>list.map(p=>p.tag?`${p.ten} (${p.tag})`:p.ten).join(" - ");
  const selected=parseList(value);
  const selectedNames=new Set(selected.map(p=>p.ten));
  const suggestions=search.trim()
    ?(options||[]).filter(o=>!selectedNames.has(o.ho_ten)&&o.ho_ten.toLowerCase().includes(search.trim().toLowerCase())).slice(0,8)
    :[];
  const addPerson=(ten,tag)=>{onChange(buildStr([...selected,{ten,tag:tag||""}]));setSearch("");setShowSug(false);};
  const addCustom=()=>{if(search.trim())addPerson(search.trim(),"");};
  const removePerson=ten=>onChange(buildStr(selected.filter(p=>p.ten!==ten)));

  return(
    <div>
      {selected.length>0&&(
        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:7}}>
          {selected.map(p=>(
            <span key={p.ten} style={{display:"inline-flex",alignItems:"center",gap:5,background:"#eef2ff",border:"1px solid #c7d2fe",borderRadius:20,padding:"3px 6px 3px 11px",fontSize:12.5,fontWeight:600,color:"#3730a3"}}>
              {p.ten}{p.tag&&<span style={{color:"#6366f1",fontWeight:700}}>({p.tag})</span>}
              <button type="button" onClick={()=>removePerson(p.ten)}
                style={{border:"none",background:"none",cursor:"pointer",color:"#6366f1",fontSize:15,lineHeight:1,padding:"0 2px"}}>✕</button>
            </span>
          ))}
        </div>
      )}
      <div style={{position:"relative"}}>
        <input value={search} onChange={e=>{setSearch(e.target.value);setShowSug(true);}} onFocus={()=>setShowSug(true)}
          onBlur={()=>setTimeout(()=>setShowSug(false),150)}
          placeholder="Gõ tên để tìm và thêm cán bộ..."
          style={{width:"100%",padding:"8px 10px",border:"1.5px solid #d0d7e8",borderRadius:8,fontSize:13,boxSizing:"border-box",background:"#f8fafd"}}/>
        {showSug&&search.trim()&&(
          <div style={{position:"absolute",zIndex:30,top:"100%",left:0,right:0,background:"#fff",border:"1px solid #dde3f0",borderRadius:8,marginTop:3,maxHeight:190,overflowY:"auto",boxShadow:"0 8px 24px rgba(0,0,0,.15)"}}>
            {suggestions.map(o=>(
              <div key={o.ho_ten} onMouseDown={()=>addPerson(o.ho_ten,o.tag)}
                style={{padding:"7px 12px",cursor:"pointer",fontSize:12.5,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span>{o.ho_ten}</span>{o.tag&&<span style={{color:"#94a3b8",fontSize:11,fontWeight:600}}>{o.tag}</span>}
              </div>
            ))}
            <div onMouseDown={addCustom}
              style={{padding:"7px 12px",cursor:"pointer",fontSize:12.5,color:"#0d9488",fontWeight:600,borderTop:suggestions.length?"1px solid #eee":"none"}}>
              ＋ Thêm "{search.trim()}" (tên khác ngoài danh sách)
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function FieldInput({f,value,valueOther,onChange,onChangeOther,error}){
  const hasErr=!!error;
  const baseStyle={
    width:"100%",padding:"8px 11px",border:`1.5px solid ${hasErr?"#e53935":"#d0d7e8"}`,
    borderRadius:7,fontSize:13,color:"#1a2340",background:hasErr?"#fff8f8":"#fff",
    outline:"none",transition:"border .15s, box-shadow .15s",boxSizing:"border-box",
  };
  const focusStyle={"--fi-focus":"1"};

  // ALL selects automatically get "Khác" option
  const optsWithKhac=(opts)=>{
    if(!opts)return[];
    const has=opts.some(o=>o==="Khác"||o.toLowerCase()==="khác");
    return has?opts:[...opts,"Khác"];
  };

  if(f.type==="person_multi"){
    return <PersonMultiSelectInput value={value} onChange={onChange} options={f.detailOpts||[]}/>;
  }

  if(f.type==="textarea"){
    return(
      <textarea
        rows={f.rows||3}
        style={{...baseStyle,resize:"vertical",minHeight:f.rows===2?44:64,lineHeight:1.5,fontFamily:"inherit"}}
        value={value||""} onChange={e=>onChange(e.target.value)}
        placeholder={f.ph||`Nhập ${f.lbl.toLowerCase()}...`}
        onFocus={e=>e.target.style.borderColor="#3b5bdb"}
        onBlur={e=>e.target.style.borderColor=hasErr?"#e53935":"#d0d7e8"}
      />
    );
  }

  if(f.type==="select"){
    const opts=optsWithKhac(f.opts||[]);
    const isKhac=value==="Khác";
    return(
      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        <div style={{position:"relative"}}>
          <select
            style={{...baseStyle,paddingRight:30,appearance:"none",cursor:"pointer",
              background:value?`linear-gradient(135deg, #fff 0%, ${getGrpMeta(f.grp||"").bg||"#f8f9fc"} 100%)`:"#fff",
              fontWeight:value?600:400,color:value?"#1a2340":"#999"}}
            value={value||""} onChange={e=>onChange(e.target.value)}
            onFocus={e=>e.target.style.borderColor="#3b5bdb"}
            onBlur={e=>e.target.style.borderColor=hasErr?"#e53935":"#d0d7e8"}
          >
            <option value="">── Chọn ──</option>
            {opts.map(o=><option key={o} value={o}>{o}</option>)}
          </select>
          <span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",pointerEvents:"none",fontSize:11,color:"#888"}}>▼</span>
        </div>
        {isKhac&&(
          <input type="text" style={{...baseStyle,borderStyle:"dashed",background:"#fffde7"}}
            value={valueOther||""} onChange={e=>onChangeOther(e.target.value)}
            placeholder="✏️ Nhập nội dung khác..."
            autoFocus
          />
        )}
      </div>
    );
  }

  if(f.type==="select_other"){
    const opts=optsWithKhac(f.opts||[]);
    const isKhac=value==="Khác";
    return(
      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        <div style={{position:"relative"}}>
          <select
            style={{...baseStyle,paddingRight:30,appearance:"none",cursor:"pointer",
              background:value?`linear-gradient(135deg, #fff 0%, ${getGrpMeta(f.grp||"").bg||"#f8f9fc"} 100%)`:"#fff",
              fontWeight:value?600:400,color:value?"#1a2340":"#999"}}
            value={value||""} onChange={e=>onChange(e.target.value)}
            onFocus={e=>e.target.style.borderColor="#3b5bdb"}
            onBlur={e=>e.target.style.borderColor=hasErr?"#e53935":"#d0d7e8"}
          >
            <option value="">── Chọn hoặc chọn Khác ──</option>
            {opts.map(o=><option key={o} value={o}>{o}</option>)}
          </select>
          <span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",pointerEvents:"none",fontSize:11,color:"#888"}}>▼</span>
        </div>
        {isKhac&&(
          <input type="text" style={{...baseStyle,borderStyle:"dashed",background:"#fffde7"}}
            value={valueOther||""} onChange={e=>onChangeOther(e.target.value)}
            placeholder="✏️ Nhập nội dung khác..."
            autoFocus
          />
        )}
      </div>
    );
  }

  if(f.type==="bool"){
    return(
      <label style={{display:"inline-flex",alignItems:"center",gap:10,cursor:"pointer",
        padding:"7px 12px",borderRadius:7,border:`1.5px solid ${value?"#43a047":"#d0d7e8"}`,
        background:value?"#e8f5e9":"#f8f9fc",transition:"all .15s",userSelect:"none",width:"fit-content"}}>
        <span style={{width:20,height:20,borderRadius:5,border:`2px solid ${value?"#43a047":"#bbb"}`,
          background:value?"#43a047":"#fff",display:"flex",alignItems:"center",justifyContent:"center",
          transition:"all .15s",flexShrink:0}}>
          {value&&<span style={{color:"#fff",fontSize:14,lineHeight:1}}>✓</span>}
        </span>
        <input type="checkbox" checked={!!value} onChange={e=>onChange(e.target.checked)} style={{display:"none"}}/>
        <span style={{fontSize:13,fontWeight:600,color:value?"#2e7d32":"#666"}}>{value?"✓ Có":"Không"}</span>
      </label>
    );
  }

  if(f.type==="photo3x4"){
    return <Photo3x4Input value={value||""} onChange={onChange}/>;
  }
  if(f.type==="nhom_selector"){
    return(
      <div style={{background:"#f8faff",border:"1.5px solid #c7d2fe",borderRadius:12,padding:"12px 14px"}}>
        <NhomSelector value={value||[]} onChange={onChange}/>
        {(!value||value.length===0)&&(
          <div style={{marginTop:10,fontSize:11.5,color:"#94a3b8",textAlign:"center",fontStyle:"italic"}}>
            ⚠️ Chưa chọn nhóm — chọn ít nhất 1 nhóm để hiện đầy đủ các trường liên quan
          </div>
        )}
      </div>
    );
  }
  if(f.type==="multidate"){
    return <MultiDatePicker value={value||""} onChange={onChange}/>;
  }
  if(f.type==="computed"){
    // Read-only, auto-calculated from another field
    const count=value||"0";
    return(
      <div style={{...baseStyle,background:"#f0f4ff",cursor:"default",
        display:"flex",alignItems:"center",gap:8,fontWeight:700,color:"#1565c0"}}>
        <span style={{fontSize:20}}>🔢</span>
        <span style={{fontSize:16}}>{count}</span>
        <span style={{fontSize:12,color:"#666",fontWeight:400}}>lần (tự tính)</span>
      </div>
    );
  }
  if(f.type==="date"){
    return(
      <DateInputVN
        value={value||""}
        onChange={onChange}
        style={{...baseStyle,cursor:"text"}}
        onFocus={e=>e.target.style.borderColor="#3b5bdb"}
        onBlur={e=>e.target.style.borderColor=hasErr?"#e53935":"#d0d7e8"}
      />
    );
  }

  return(
    <input type={f.type||"text"}
      style={{...baseStyle}}
      value={value||""} onChange={e=>onChange(e.target.value)}
      placeholder={f.ph||""}
      onFocus={e=>e.target.style.borderColor="#3b5bdb"}
      onBlur={e=>e.target.style.borderColor=hasErr?"#e53935":"#d0d7e8"}
    />
  );
}


// ── ViewModal – xem chi tiết đối tượng (read-only) ──────────
function ViewModal({rec,fields,onClose,onEdit}){
  if(!rec)return null;
  const nhomInfo=(rec.nhom||[]).map(id=>NHOM_LIST.find(n=>n.id===id)).filter(Boolean);
  const grouped={};
  fields.forEach(f=>{
    if(f.type==="nhom_selector"||f.type==="computed")return;
    const nhs=f.nhomShow;
    if(nhs&&!(rec.nhom||[]).some(n=>nhs.includes(n)))return;
    const grp=f.grp||"Thông tin khác";
    if(!grouped[grp])grouped[grp]=[];
    grouped[grp].push(f);
  });
  const fmt=v=>{
    if(!v&&v!==0)return"—";
    if(typeof v==="boolean")return v?"✅ Có":"❌ Không";
    if(typeof v==="string"&&v.match(/^\d{4}-\d{2}-\d{2}/))return fmtDate(v);
    return String(v);
  };
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:1100,display:"flex",alignItems:"center",justifyContent:"center",padding:12}} onClick={onClose}>
      <div style={{background:"#fff",borderRadius:16,width:"min(720px,98vw)",maxHeight:"92vh",display:"flex",flexDirection:"column",boxShadow:"0 20px 60px rgba(0,0,0,.25)"}} onClick={e=>e.stopPropagation()}>
        <div style={{background:"linear-gradient(135deg,#1a2340,#1e3a5f)",padding:"16px 20px",display:"flex",alignItems:"center",gap:14,borderRadius:"16px 16px 0 0",flexShrink:0}}>
          {rec.anh_the
            ?<img src={rec.anh_the} alt="" style={{width:52,height:70,objectFit:"cover",borderRadius:6,border:"2px solid rgba(255,255,255,.3)",flexShrink:0}}/>
            :<div style={{width:52,height:70,background:"rgba(255,255,255,.1)",borderRadius:6,border:"2px dashed rgba(255,255,255,.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>👤</div>
          }
          <div style={{flex:1,minWidth:0}}>
            <div style={{color:"#fff",fontWeight:800,fontSize:17,lineHeight:1.3,marginBottom:4}}>{rec.ho_ten||"Chưa có tên"}</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              {nhomInfo.map(n=>(
                <span key={n.id} style={{background:"rgba(255,255,255,.15)",color:"#fff",borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:600}}>
                  {n.icon} {n.lbl}
                </span>
              ))}
              {rec.da_loai&&<span style={{background:"#e53935",color:"#fff",borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:700}}>⛔ Đã loại</span>}
            </div>
          </div>
          <div style={{display:"flex",gap:8,flexShrink:0}}>
            <button onClick={()=>{onClose();setTimeout(()=>onEdit(rec),50);}} style={{background:"rgba(255,255,255,.18)",border:"1px solid rgba(255,255,255,.3)",color:"#fff",borderRadius:9,padding:"7px 14px",cursor:"pointer",fontSize:12,fontWeight:700}}>✏️ Sửa</button>
            <button onClick={onClose} style={{background:"rgba(255,255,255,.12)",border:"none",color:"rgba(255,255,255,.7)",borderRadius:9,padding:"7px 12px",cursor:"pointer",fontSize:18,lineHeight:1}}>✕</button>
          </div>
        </div>
        <div style={{overflowY:"auto",flex:1,padding:"18px 20px"}}>
          {Object.entries(grouped).map(([grp,fs])=>(
            <div key={grp} style={{marginBottom:18}}>
              <div style={{fontSize:11.5,fontWeight:800,color:"#64748b",letterSpacing:.8,textTransform:"uppercase",marginBottom:10,paddingBottom:5,borderBottom:"1.5px solid #e2e8f0"}}>{grp}</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:"8px 16px"}}>
                {fs.map(f=>{
                  if(f.type==="photo3x4")return null;
                  const raw=rec[f.k]||(f.type==="select_other"&&rec[f.k+"_other"]?rec[f.k+"_other"]:"");
                  const val=f.type==="select_other"&&raw==="Khác"?rec[f.k+"_other"]||raw:raw;
                  return(
                    <div key={f.k} style={{background:"#f8fafc",borderRadius:8,padding:"8px 11px",border:"1px solid #e2e8f0"}}>
                      <div style={{fontSize:10.5,color:"#94a3b8",fontWeight:700,marginBottom:3}}>{f.lbl}</div>
                      <div style={{fontSize:12.5,color:"#1a2340",fontWeight:600,wordBreak:"break-word",lineHeight:1.4}}>{fmt(val)||"—"}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
        <div style={{padding:"12px 20px",borderTop:"1px solid #e2e8f0",display:"flex",justifyContent:"flex-end",flexShrink:0}}>
          <button onClick={onClose} className="btn btn-ghost">Đóng</button>
        </div>
      </div>
    </div>
  );
}

// ── EditPwdModal – yêu cầu mật khẩu trước khi sửa ───────────
function EditPwdModal({onConfirm,onClose}){
  const [pwd,setPwd]=useState("");
  const [showPwd,setShowPwd]=useState(false);
  const [err,setErr]=useState("");
  const check=()=>{
    if(pwd!==getAdminPwd()){setErr("Mật khẩu không đúng");setPwd("");return;}
    onConfirm();
  };
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:1200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
      <div style={{background:"#fff",borderRadius:14,width:"min(340px,96vw)",boxShadow:"0 16px 48px rgba(0,0,0,.25)",overflow:"hidden"}} onClick={e=>e.stopPropagation()}>
        <div style={{background:"linear-gradient(135deg,#1565c0,#0d47a1)",padding:"16px 20px",display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:22}}>🔐</span>
          <div style={{color:"#fff",fontWeight:800,fontSize:14}}>Xác thực để chỉnh sửa</div>
        </div>
        <div style={{padding:"20px"}}>
          <div style={{fontSize:12.5,color:"#64748b",marginBottom:14,lineHeight:1.5}}>Vui lòng nhập mật khẩu để được phép chỉnh sửa dữ liệu đối tượng.</div>
          <div style={{position:"relative",marginBottom:10}}>
            <input type={showPwd?"text":"password"} value={pwd} autoFocus
              onChange={e=>{setPwd(e.target.value);setErr("");}}
              onKeyDown={e=>e.key==="Enter"&&check()}
              style={{width:"100%",padding:"10px 38px 10px 12px",border:`1.5px solid ${err?"#e53935":"#dde3f0"}`,borderRadius:9,fontSize:13.5,outline:"none",boxSizing:"border-box"}}
              placeholder="Nhập mật khẩu..."/>
            <button type="button" onClick={()=>setShowPwd(p=>!p)} style={{position:"absolute",right:9,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:15,color:"#90a4ae"}}>{showPwd?"🙈":"👁"}</button>
          </div>
          {err&&<div style={{color:"#e53935",fontSize:12,fontWeight:600,padding:"6px 10px",background:"#fff8f8",borderRadius:7,marginBottom:10,border:"1px solid #ffcdd2"}}>⚠️ {err}</div>}
          <div style={{display:"flex",gap:8,marginTop:12}}>
            <button onClick={onClose} className="btn btn-ghost" style={{flex:1}}>Hủy</button>
            <button onClick={check} disabled={!pwd} style={{flex:2,padding:"10px",background:pwd?"linear-gradient(135deg,#1565c0,#1976d2)":"#b0bec5",color:"#fff",border:"none",borderRadius:9,fontWeight:800,fontSize:13,cursor:pwd?"pointer":"not-allowed"}}>
              🔓 Xác nhận
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Smart FormModal ──────────────────────────────────────────
function FormModal({fields,initial,title,onSave,onClose}){
  const [data,setData]=useState(()=>{
    const base={};
    fields.forEach(f=>{base[f.k]=f.def!=null?f.def:(f.type==="bool"?false:"");base[f.k+"_other"]="";});
    return initial?{...base,...initial}:base;
  });
  const [errors,setErrors]=useState({});
  const [activeGrpIdx,setActiveGrpIdx]=useState(0);
  const [dirty,setDirty]=useState(false);
  const ref=useRef();
  const bodyRef=useRef();

  const set=(k,v)=>{
    setData(p=>{
      const next={...p,[k]:v};
      if(k==="ngay_goi_hoi"){
        const count=v?v.split(",").filter(d=>d.trim()).length:0;
        next["so_luot_goi_hoi"]=String(count);
      }
      // Số hồ sơ sưu tra ↔ Diện QL – Số hồ sơ NV (cột 11 PL1B): tự động đồng bộ vì cùng một giá trị
      if(k==="so_ho_so_suu_tra"){
        next["dien_ql_so_hs"]=v;
      }
      return next;
    });
    setDirty(true);
    if(errors[k])setErrors(p=>{const e={...p};delete e[k];return e;});
  };
  // Derive which nhom are selected (for F_UNIFIED filtering)
  const selectedNhom=Array.isArray(data.nhom)?data.nhom:[];

  // ── Field visibility: nhomShow filter ──────────────────────
  // Fields with nhomShow only appear when matching nhom is selected
  const isFieldVisible=(f)=>{
    if(!f.nhomShow||f.nhomShow.length===0) return true;
    if(selectedNhom.length===0) return false;
    return f.nhomShow.some(id=>selectedNhom.includes(id));
  };
  // Only show groups that have ≥1 visible field
  const allGroupNames=[...new Set(fields.map(f=>f.grp||"Thông tin"))];
  const groups=allGroupNames.filter(grp=>
    fields.filter(f=>(f.grp||"Thông tin")===grp).some(isFieldVisible)
  );
  // Clamp index when groups shrink
  const safeIdx=Math.min(activeGrpIdx,Math.max(0,groups.length-1));
  const isMultiGroup=groups.length>3;
  const activeGrp=groups[safeIdx]||groups[0];
  const visibleGroups=isMultiGroup?[activeGrp]:groups;

  const validate=()=>{
    const e={};
    fields.filter(f=>f.req&&isFieldVisible(f)).forEach(f=>{
      if(!data[f.k]&&data[f.k]!==true)e[f.k]="Bắt buộc nhập";
    });
    setErrors(e);
    if(Object.keys(e).length>0){
      const firstErr=fields.find(f=>e[f.k]);
      if(firstErr){const gi=groups.indexOf(firstErr.grp||"Thông tin");if(gi>=0)setActiveGrpIdx(gi);}
    }
    return!Object.keys(e).length;
  };

  const handleSave=()=>{if(validate())onSave(data);};

  const handleClose=()=>{
    if(dirty&&!window.confirm("Bạn có thay đổi chưa lưu. Thoát?"))return;
    onClose();
  };

  // Scroll body to top on group change
  useEffect(()=>{if(bodyRef.current)bodyRef.current.scrollTop=0;},[activeGrpIdx]);

  // Filled count: only count VISIBLE fields
  const filledCount=(grp)=>{
    const fs=fields.filter(f=>(f.grp||"Thông tin")===grp&&isFieldVisible(f));
    return fs.filter(f=>data[f.k]&&data[f.k]!==false&&data[f.k]!=="").length;
  };
  const totalInGrp=(grp)=>fields.filter(f=>(f.grp||"Thông tin")===grp&&isFieldVisible(f)).length;

  const totalReq=fields.filter(f=>f.req&&isFieldVisible(f)).length;
  const filledReq=fields.filter(f=>f.req&&isFieldVisible(f)&&data[f.k]&&data[f.k]!==false&&data[f.k]!=="").length;
  const progress=totalReq>0?Math.round(filledReq/totalReq*100):100;

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(10,20,50,.6)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:1000,overflowY:"auto",padding:"12px 8px"}}
      ref={ref} onClick={e=>e.target===ref.current&&handleClose()}>
      <div style={{background:"#fff",borderRadius:14,width:"min(980px,98vw)",margin:"auto",
        boxShadow:"0 20px 60px rgba(0,0,0,.3)",display:"flex",flexDirection:"column",maxHeight:"95vh"}}>

        {/* ── Header ── */}
        <div style={{background:"linear-gradient(135deg,#0d1b3e 0%,#1e3a6e 100%)",borderRadius:"14px 14px 0 0",
          padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div>
            <div style={{color:"#fff",fontSize:15,fontWeight:700}}>{title}</div>
            {totalReq>0&&<div style={{color:"rgba(255,255,255,.6)",fontSize:11,marginTop:2}}>
              Bắt buộc: {filledReq}/{totalReq} trường đã điền
            </div>}
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {totalReq>0&&<div style={{width:80,height:6,background:"rgba(255,255,255,.2)",borderRadius:3,overflow:"hidden"}}>
              <div style={{width:progress+"%",height:"100%",background:progress===100?"#69f0ae":"#ffb300",borderRadius:3,transition:"width .3s"}}/>
            </div>}
            <button onClick={handleClose} style={{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.25)",
              cursor:"pointer",color:"#fff",width:30,height:30,borderRadius:7,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
          </div>
        </div>

        {/* ── Group nav (sidebar + content) ── */}
        <div style={{display:"flex",flex:1,overflow:"hidden",minHeight:0}}>

          {/* Sidebar nav for multi-group */}
          {isMultiGroup&&(
            <div style={{width:200,flexShrink:0,background:"#f4f6fb",borderRight:"1px solid #dde3ee",overflowY:"auto",padding:"10px 0"}}>
              {groups.map((g,gi)=>{
                const meta=getGrpMeta(g);
                const cnt=filledCount(g);
                const total=fields.filter(f=>(f.grp||"Thông tin")===g).length;
                const hasError=fields.filter(f=>(f.grp||"Thông tin")===g&&errors[f.k]).length>0;
                const isActive=gi===safeIdx;
                return(
                  <div key={g} onClick={()=>setActiveGrpIdx(gi)}
                    style={{display:"flex",alignItems:"flex-start",gap:9,padding:"9px 14px",cursor:"pointer",
                      background:isActive?"#fff":"transparent",
                      borderLeft:isActive?`3px solid ${meta.color}`:"3px solid transparent",
                      borderBottom:"1px solid #eee",transition:"all .12s"}}>
                    <span style={{fontSize:15,flexShrink:0,marginTop:1}}>{meta.icon}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:11.5,fontWeight:isActive?700:500,color:isActive?meta.color:"#444",lineHeight:1.3,wordBreak:"break-word"}}>{g}</div>
                      <div style={{display:"flex",alignItems:"center",gap:4,marginTop:3}}>
                        <div style={{flex:1,height:3,background:"#e0e0e0",borderRadius:2,overflow:"hidden"}}>
                          <div style={{width:(cnt/total*100)+"%",height:"100%",background:hasError?"#e53935":isActive?meta.color:"#90caf9",borderRadius:2}}/>
                        </div>
                        <span style={{fontSize:9.5,color:hasError?"#e53935":"#999",fontWeight:600}}>{filledCount(g)}/{totalInGrp(g)}</span>
                        {hasError&&<span style={{fontSize:11,color:"#e53935"}}>⚠</span>}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Form body */}
          <div ref={bodyRef} style={{flex:1,overflowY:"auto",padding:"18px 20px"}}>
            {visibleGroups.filter(Boolean).map(grp=>{
              const meta=getGrpMeta(grp);
              const grpFields=fields.filter(f=>(f.grp||"Thông tin")===grp);
              return(
                <div key={grp} style={{marginBottom:isMultiGroup?0:22}}>
                  {/* Group header */}
                  <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:10,
                    padding:"8px 14px",background:meta.bg,borderRadius:8,
                    border:`1px solid ${meta.color}22`}}>
                    <span style={{fontSize:18}}>{meta.icon}</span>
                    <span style={{fontSize:13,fontWeight:700,color:meta.color}}>{grp}</span>
                    <span style={{fontSize:11,color:meta.color,opacity:.7,marginLeft:"auto"}}>
                      {filledCount(grp)}/{totalInGrp(grp)} đã điền
                    </span>
                  </div>
                  {grp==="🎯 Phân nhóm quản lý"&&selectedNhom.length===0&&(
                    <div style={{background:"#fffbeb",border:"1px solid #fcd34d",borderRadius:8,
                      padding:"10px 14px",marginBottom:12,fontSize:12.5,lineHeight:1.6,color:"#92400e"}}>
                      👆 <b>Chọn ít nhất 1 nhóm</b> để hiển thị các trường thông tin phù hợp (SD, Nghiện, Sau cai, VPPL)
                    </div>
                  )}
                  {grp==="Nghiệp vụ quản lý (TB136 PL1B)"&&(
                    <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:12,padding:"8px 10px",background:"#fff9c4",borderRadius:7,border:"1px solid #f0c000"}}>
                      <span style={{fontSize:10,fontWeight:700,color:"#7c5c00",width:"100%",marginBottom:3}}>📋 Tương ứng cột PL1B:</span>
                      {[["(7)","Tiền án CT"],["(8)","Hành vi"],["(9)","Dấu hiệu"],["(10)","Địa bàn"],["(11)","Diện QL/HS"],["(12)","Đối sách"],["(13)","ĐV quản"],["(14)","Số lượt GH"],["(15)","Tần suất GH"],["(16)","Lĩnh vực"],["(17)","TĐ đưa vào"],["(18)","Cán bộ TD"],["(19)","Chỉ huy TD"],["(20)","Tăng/Giảm"]].map(([col,lbl])=>(
                        <span key={col} style={{padding:"1px 6px",background:"#fff",border:"1px solid #f0c000",borderRadius:4,fontSize:10,color:"#5a4000",fontWeight:600,whiteSpace:"nowrap"}}>{col} {lbl}</span>
                      ))}
                    </div>
                  )}

                  {/* Fields grid */}
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:"14px 18px"}}>
                    {grpFields.filter(isFieldVisible).map(f=>{
                      const isWide=f.type==="textarea"||f.wide||f.type==="nhom_selector"||f.type==="photo3x4";
                      const hasVal=data[f.k]&&data[f.k]!==false&&data[f.k]!=="";
                      return(
                        <div key={f.k} style={{gridColumn:isWide?"1/-1":"auto",display:"flex",flexDirection:"column",gap:5}}>
                          {/* Label row */}
                          <div style={{display:"flex",alignItems:"center",gap:5}}>
                            <label style={{fontSize:12,fontWeight:600,color:errors[f.k]?"#c62828":hasVal?"#1565c0":"#444",transition:"color .15s"}}>
                              {f.lbl}
                              {f.req&&<span style={{color:"#e53935",marginLeft:3}}>*</span>}
                            </label>
                            {hasVal&&!errors[f.k]&&<span style={{fontSize:11,color:"#43a047"}}>✓</span>}
                          </div>
                          {/* Input */}
                          <FieldInput f={f} value={data[f.k]} valueOther={data[f.k+"_other"]}
                            error={errors[f.k]} onChange={v=>set(f.k,v)} onChangeOther={v=>set(f.k+"_other",v)}/>
                          {/* Hint / Error */}
                          {errors[f.k]
                            ?<span style={{fontSize:11,color:"#c62828",display:"flex",alignItems:"center",gap:3}}>⚠️ {errors[f.k]}</span>
                            :f.ph&&f.type!=="text"&&<span style={{fontSize:10.5,color:"#999",fontStyle:"italic"}}>VD: {f.ph}</span>
                          }
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* ── Footer ── */}
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 20px",
          borderTop:"1px solid #eee",background:"#f8f9fc",borderRadius:"0 0 14px 14px",flexShrink:0}}>

          {/* Prev / Next for multi-group */}
          {isMultiGroup&&(
            <div style={{display:"flex",gap:6,flex:1,alignItems:"center"}}>
              <button className="btn btn-ghost btn-sm" disabled={activeGrpIdx===0}
                onClick={()=>setActiveGrpIdx(i=>i-1)} style={{gap:4}}>← Trước</button>
              {/* Step dots */}
              <div style={{display:"flex",gap:4,padding:"0 6px"}}>
                {groups.map((_,gi)=>{
                  const hasErr=fields.filter(f=>(f.grp||"Thông tin")===groups[gi]&&errors[f.k]).length>0;
                  return <div key={gi} onClick={()=>setActiveGrpIdx(gi)}
                    title={groups[gi]}
                    style={{width:gi===safeIdx?20:8,height:8,borderRadius:4,cursor:"pointer",
                      transition:"all .2s",
                      background:hasErr?"#e53935":gi===safeIdx?"#0d1b3e":gi<safeIdx?"#90caf9":"#ddd"}}/>;
                })}
              </div>
              <button className="btn btn-ghost btn-sm" disabled={activeGrpIdx===groups.length-1}
                onClick={()=>setActiveGrpIdx(i=>i+1)} style={{gap:4}}>Tiếp →</button>
              <span style={{fontSize:11,color:"#888",marginLeft:4}}>{safeIdx+1} / {groups.length}</span>
            </div>
          )}
          {!isMultiGroup&&<div style={{flex:1}}/>}

          <div style={{display:"flex",gap:8}}>
            <button className="btn btn-ghost" onClick={handleClose}>Hủy</button>
            {isMultiGroup&&safeIdx<groups.length-1
              ?<button className="btn btn-primary" onClick={()=>setActiveGrpIdx(i=>Math.min(groups.length-1,i+1))}>Tiếp theo →</button>
              :<button className="btn" onClick={handleSave}
                  style={{background:"linear-gradient(135deg,#0d1b3e,#1e3a6e)",color:"#fff",gap:6}}>
                  💾 Lưu bản ghi
                </button>
            }
          </div>
        </div>
      </div>
    </div>
  );
}


// ── Date display helper ──────────────────────────────────────
function DateChip({val}){
  if(!val)return<span style={{color:"#cbd5e1",fontSize:11}}>—</span>;
  return(
    <span style={{display:"inline-block",padding:"2px 8px",background:"#f0f6ff",
      border:"1px solid #bfdbfe",borderRadius:6,fontSize:11.5,color:"#1e40af",fontWeight:500,
      whiteSpace:"nowrap"}}>
      📅 {fmtDate(val)}
    </span>
  );
}
function NumBadge({val,color}){
  if(!val&&val!==0)return<span style={{color:"#cbd5e1"}}>—</span>;
  return(
    <span style={{display:"inline-block",padding:"2px 9px",background:color||"#f1f5f9",
      borderRadius:20,fontSize:12,fontWeight:700,color:color?"#fff":"var(--text2)"}}>
      {val}
    </span>
  );
}

// ── Global table cell helpers (used by GroupPage, GroupViewPage, UnifiedPage) ──
function PmBadge({v}){
  return v==="Đã nhập"
    ?<span className="badge badge-green">✓ Đã nhập</span>
    :<span className="badge badge-orange">⏳ Chưa nhập</span>;
}
function BoolBadge({v,yes,no}){
  yes=yes||"✓";no=no||"";
  return v
    ?<span className="badge badge-green">{yes}</span>
    :(no?<span className="badge badge-gray">{no}</span>:<span style={{color:"#cbd5e1"}}>—</span>);
}
function GtBadge({v}){
  if(!v)return<span style={{color:"#cbd5e1"}}>—</span>;
  return<span className="badge" style={{
    background:v==="Nam"?"#dbeafe":"#fce7f3",
    color:v==="Nam"?"#1e40af":"#9d174d",fontSize:11
  }}>{v==="Nam"?"♂ Nam":"♀ Nữ"}</span>;
}
function TextCell({v,max}){
  max=max||30;
  if(!v)return<span style={{color:"#cbd5e1"}}>—</span>;
  const s=String(v);
  return<span title={s.length>max?s:undefined}>{s.length>max?s.slice(0,max)+"…":s}</span>;
}

function NhomBadge({nhom}){

  return(
    <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>

        return(

            padding:"2px 7px",borderRadius:20,fontSize:10.5,fontWeight:700,
            background:n.color+"18",color:n.color,border:"1px solid "+n.color+"35"}}>
            {n.icon} {n.lbl}
          </span>
        );
      })}
    </div>
  );
}
// ── NhomSelector (multi-checkbox) ────────────────────────────
function NhomSelector({value,onChange}){
  const selected=Array.isArray(value)?value:[];
  const toggle=(id)=>{
    if(selected.includes(id))onChange(selected.filter(x=>x!==id));
    else onChange([...selected,id]);
  };
  return(
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
      {NHOM_LIST.map(n=>{
        const on=selected.includes(n.id);
        return(
          <label key={n.id} onClick={()=>toggle(n.id)} style={{
            display:"flex",alignItems:"center",gap:9,
            padding:"10px 12px",borderRadius:10,cursor:"pointer",userSelect:"none",
            border:"2px solid "+(on?n.color:"#e2e8f0"),
            background:on?n.color+"12":"#fafbfd",
            transition:"all .15s",
            boxShadow:on?"0 2px 8px "+n.color+"30":"0 1px 3px rgba(0,0,0,.04)",
          }}>
            <span style={{
              width:22,height:22,borderRadius:6,flexShrink:0,
              border:"2px solid "+(on?n.color:"#cbd5e1"),
              background:on?n.color:"#fff",
              display:"flex",alignItems:"center",justifyContent:"center",
              transition:"all .15s",
            }}>
              {on&&<span style={{color:"#fff",fontSize:14,lineHeight:1,fontWeight:800}}>✓</span>}
            </span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:16,lineHeight:1,marginBottom:2}}>{n.icon}</div>
              <div style={{fontSize:11,fontWeight:on?700:500,color:on?n.color:"#64748b",lineHeight:1.3,wordBreak:"break-word"}}>{n.lbl}</div>
            </div>
          </label>
        );
      })}
    </div>
  );
}
function DataTable({title,icon,records,allRecords,onAdd,onEdit,onDelete,onLoai,onPhucHoi,columns,dateRange,showLoai=true}){
  const [search,setSearch]=useState("");
  const [tabLoai,setTabLoai]=useState(false);
  const [pg,setPg]=useState(1);
  const PER=15;
  useEffect(()=>{setPg(1);},[search,records.length,tabLoai]);
  const active=records;
  const loai=(allRecords||[]).filter(r=>r.da_loai);
  const show=tabLoai?loai:active;
  const filtered=show.filter(r=>!search||Object.values(r).some(v=>String(v||"").toLowerCase().includes(search.toLowerCase())));
  const pages=Math.max(1,Math.ceil(filtered.length/PER));
  const paged=filtered.slice((pg-1)*PER,pg*PER);
  return(
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">{icon} {title}</div>
          <div className="page-sub">
            <span style={{background:"#f0f6ff",padding:"2px 8px",borderRadius:5,border:"1px solid #bfdbfe",fontSize:11.5}}>
              {dateRange.from&&dateRange.to?`📅 ${fmtDate(dateRange.from)} → ${fmtDate(dateRange.to)}`:"📋 Toàn bộ thời gian"}
            </span>
            <span className="badge badge-navy">✓ {active.length} đang QL</span>
            {showLoai&&loai.length>0&&<span className="badge badge-gray">🚫 {loai.length} đã loại</span>}
          </div>
        </div>
        <div className="btn-grp">
          <div className="srch-wrap">
            <span className="srch-icon">🔍</span>
            <input className="srch" placeholder="Tìm kiếm..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          {!tabLoai&&<button className="btn btn-primary btn-sm" onClick={onAdd}>＋ Thêm mới</button>}
        </div>
      </div>
      {showLoai&&<div className="tab-bar">
        <button className={`tab-btn${!tabLoai?" active":""}`} onClick={()=>{setTabLoai(false);setSearch("");}}>
          <span>📋</span> Đang quản lý &nbsp;<span style={{background:!tabLoai?"var(--navy)":"#e2e8f0",color:!tabLoai?"#fff":"var(--muted)",padding:"1px 7px",borderRadius:10,fontSize:11,fontWeight:700}}>{active.length}</span>
        </button>
        <button className={`tab-btn${tabLoai?" active":""}`} onClick={()=>{setTabLoai(true);setSearch("");}}>
          <span>🚫</span> Đã loại &nbsp;<span style={{background:tabLoai?"var(--navy)":"#e2e8f0",color:tabLoai?"#fff":"var(--muted)",padding:"1px 7px",borderRadius:10,fontSize:11,fontWeight:700}}>{loai.length}</span>
        </button>
      </div>}
      <div className="card">
        <div className="tbl-wrap">
          <table>
            <thead><tr>{columns.map((c,i)=><th key={i} style={{minWidth:c.w||80}}>{c.label}</th>)}<th style={{width:110,textAlign:"center"}}>Thao tác</th></tr></thead>
            <tbody>
              {paged.length===0&&<tr><td colSpan={columns.length+1}>
                <div style={{textAlign:"center",padding:"48px 20px",color:"var(--muted)"}}>
                  <div style={{fontSize:52,marginBottom:12,opacity:.4}}>📂</div>
                  <p style={{fontSize:14,fontWeight:600,color:"var(--text2)",marginBottom:4}}>Chưa có dữ liệu</p>
                  <p style={{fontSize:12,color:"var(--muted2)"}}>Nhấn <b>＋ Thêm mới</b> để bắt đầu nhập liệu</p>
                </div>
              </td></tr>}
              {paged.map((r,ri)=>(
                <tr key={r._id} className={r.da_loai?"da-loai":""}>
                  {columns.map((c,ci)=><td key={ci}>{c.render?c.render(r,(pg-1)*PER+ri):r[c.key]||""}</td>)}
                  <td><div className="actions">
                    <button className="btn btn-sm btn-icon act-view" title="Xem chi tiết" onClick={()=>onView(r)}>👁</button>
                    <button className="btn btn-sm btn-icon act-edit" title="Sửa (yêu cầu mật khẩu)" onClick={()=>onEditPwd(r)}>✏️</button>
                    {!r.da_loai&&showLoai&&<button className="btn btn-sm btn-icon act-loai" title="Loại khỏi DS" onClick={()=>onLoai(r)}>🚫</button>}
                    {r.da_loai&&showLoai&&<button className="btn btn-sm btn-icon act-restore" title="Phục hồi" onClick={()=>onPhucHoi(r)}>♻️</button>}
                    <button className="btn btn-sm btn-icon act-delete" title="Xóa vĩnh viễn" onClick={()=>onDelete(r)}>🗑️</button>
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="pag">
          <span className="pag-info">
            <b style={{color:"var(--navy)"}}>{filtered.length}</b> bản ghi &nbsp;·&nbsp; Trang <b>{pg}</b> / {pages}
          </span>
          <div style={{display:"flex",gap:4,alignItems:"center"}}>
            <button className="pag-btn" disabled={pg===1} onClick={()=>setPg(1)} title="Trang đầu">«</button>
            <button className="pag-btn" disabled={pg===1} onClick={()=>setPg(p=>p-1)}>‹</button>
            {Array.from({length:Math.min(5,pages)},(_, i)=>{
              const start=Math.max(1,Math.min(pages-4,pg-2));
              const n=start+i;
              return n<=pages&&<button key={n} className={`pag-btn${pg===n?" active":""}`} onClick={()=>setPg(n)}>{n}</button>;
            }).filter(Boolean)}
            <button className="pag-btn" disabled={pg===pages} onClick={()=>setPg(p=>p+1)}>›</button>
            <button className="pag-btn" disabled={pg===pages} onClick={()=>setPg(pages)} title="Trang cuối">»</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function GroupPage({groupKey,title,icon,fields,data,setData,storeKey,dateRange,toast,showLoai=true}){

  const [editPwdTarget,setEditPwdTarget]=useState(null);
  const records=data.filter(r=>!r.da_loai);

  const save=async rec=>{
    let next;
    if(form.mode==="add"){next=[{...rec,_id:uid(),_created:new Date().toISOString()},...data];}
    else{next=data.map(r=>r._id===form.rec._id?{...r,...rec}:r);}
    try{await saveStore(storeKey,next);setData(next);setForm(null);toast(form.mode==="add"?"Đã thêm bản ghi mới!":"Đã cập nhật bản ghi!","success");}
    catch(e){toast("❌ Lỗi lưu dữ liệu: "+e.message,"error");}
  };
  const del=async()=>{
    const next=data.filter(r=>r._id!==delRec._id);
    try{await saveStore(storeKey,next);setData(next);setDelRec(null);toast("Đã xóa bản ghi","info");}
    catch(e){toast("❌ Lỗi xóa: "+e.message,"error");}

  const [tab,setTab]=useState("tb807");

function BackupPage({data,onRestore,toast}){
  const [drag,setDrag]=useState(false);
  const [showPlaceholder,setShowPlaceholder]=useState(false);
  const [showTemplateFill,setShowTemplateFill]=useState(false);
  const [showExcelFill,setShowExcelFill]=useState(false);
  const fileRef=useRef();
  const doBackup=()=>{
    const blob=new Blob([JSON.stringify({version:CONFIG.version,timestamp:new Date().toISOString(),donVi:CONFIG.donVi,data},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=`BACKUP_${CONFIG.donVi.replace(/\s+/g,"_")}_${new Date().toISOString().slice(0,10)}.json`;a.click();
    toast("Đã tải xuống file backup!","success");
  };
  const processFile=file=>{
    if(!file||!file.name.endsWith(".json")){toast("Vui lòng chọn file .json","error");return;}
    const reader=new FileReader();
    reader.onload=async e=>{
      try{
        const parsed=JSON.parse(e.target.result);
        if(!parsed.data)throw new Error("Không tìm thấy dữ liệu");
        const d=parsed.data;
        if(!d.su_dung||!d.nghien||!d.sau_cai||!d.vppl)throw new Error("Cấu trúc file không đúng");
        if(!window.confirm(`Xác nhận khôi phục từ backup?\nThời gian: ${parsed.timestamp?.slice(0,10)||"N/A"}\nDữ liệu hiện tại sẽ bị THAY THẾ!`))return;
        await onRestore(d);
        toast("Khôi phục dữ liệu thành công!","success");
      }catch(err){toast("Lỗi khôi phục: "+err.message,"error");}
    };reader.readAsText(file);
  };
  const counts=[
    ["👤 Tất cả đối tượng",(data.doi_tuong||[]).length],
    ["💊 SD TPCMT",(data.su_dung||[]).length],
    ["⚕️ Nghiện",(data.nghien||[]).length],
    ["🏠 Sau cai",(data.sau_cai||[]).length],
    ["⚖️ VPPL",(data.vppl||[]).length],
    ["📁 Vụ án",(data.vu_an||[]).length],
  ];
  return(
    <div>
      <div className="page-header"><div><div className="page-title">🔒 Backup & Restore</div><div className="page-sub">Sao lưu và khôi phục dữ liệu</div></div></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:16}}>
        <div className="card"><div className="card-hd"><h3>📦 Sao lưu (Backup)</h3></div>
          <div style={{padding:"16px 14px"}}>
            <div style={{background:"#e8f5e9",border:"1px solid #a5d6a7",borderRadius:8,padding:"11px 13px",marginBottom:14}}>
              {counts.map(([lbl,n])=><div key={lbl} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"2px 0"}}><span>{lbl}</span><b>{n} bản ghi</b></div>)}
              <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,marginTop:6,paddingTop:6,borderTop:"1px solid #c8e6c9"}}><span>Tổng</span><span>{counts.reduce((s,[,n])=>s+n,0)} bản ghi</span></div>
            </div>
            <button className="btn btn-green" style={{width:"100%"}} onClick={doBackup}>📥 Tải xuống file Backup (.json)</button>
          </div>
        </div>
        <div className="card"><div className="card-hd"><h3>♻️ Khôi phục (Restore)</h3></div>
          <div style={{padding:"16px 14px"}}>
            <div style={{background:"#fff3e0",border:"1px solid #ffb74d",borderRadius:8,padding:"11px 13px",marginBottom:14,fontSize:12.5,lineHeight:1.6}}>
              ⚠️ Khôi phục sẽ <b>THAY THẾ HOÀN TOÀN</b> dữ liệu hiện tại.
            </div>
            <div className={`backup-zone${drag?" drag":""}`} onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);processFile(e.dataTransfer.files[0]);}} onClick={()=>fileRef.current?.click()}>
              <div style={{fontSize:32,marginBottom:8}}>📂</div>
              <p style={{fontSize:13,fontWeight:600}}>Kéo thả hoặc click chọn file .json</p>
            </div>
            <input ref={fileRef} type="file" accept=".json" style={{display:"none"}} onChange={e=>{processFile(e.target.files[0]);e.target.value="";}}/>
          </div>
        </div>
      </div>
      <div className="card"><div className="card-hd"><h3>📊 Xuất Excel theo nhóm</h3></div>
        <div style={{padding:"16px 14px"}}>
          <div className="export-grid">
            {[
              {type:"ds_sd",icon:"💊",title:"Sử dụng TPCMT",badge:"PL1",desc:`${data.su_dung?.filter(r=>!r.da_loai).length||0} đang QL`,clr:"var(--g-sd)",bg:"var(--g-sd-bg)"},
              {type:"ds_ng",icon:"⚕️",title:"Nghiện ma túy",badge:"PL2",desc:`${data.nghien?.filter(r=>!r.da_loai).length||0} đang QL`,clr:"var(--g-ng)",bg:"var(--g-ng-bg)"},
              {type:"ds_sc",icon:"🏠",title:"Quản lý sau cai",badge:"PL3",desc:`${data.sau_cai?.filter(r=>!r.da_loai).length||0} đang QL`,clr:"var(--g-sc)",bg:"var(--g-sc-bg)"},
              {type:"ds_vp",icon:"⚖️",title:"Đối tượng VPPL",badge:"PL8·43 cột",desc:`${data.vppl?.filter(r=>!r.da_loai).length||0} đối tượng`,clr:"var(--g-vp)",bg:"var(--g-vp-bg)"},
              {type:"ds_nv",icon:"🔍",title:"Đối tượng nghi vấn",badge:"DS-NV",desc:`${(data.nghi_van||[]).filter(r=>!r.da_loai).length} đối tượng`,clr:"var(--g-nv)",bg:"var(--g-nv-bg)"},
              {type:"ds_st",icon:"📂",title:"Đối tượng sưu tra",badge:"DS-ST",desc:`${(data.suu_tra||[]).filter(r=>!r.da_loai).length} đối tượng`,clr:"var(--g-st)",bg:"var(--g-st-bg)"},
              {type:"all_dt",icon:"👥",title:"Tất cả đối tượng",badge:"PL1+2+3+VPPL+NV+ST",desc:"1 file đầy đủ tất cả nhóm",clr:"#1b5e20",bg:"#f1f8e9"},
              {type:"ds_vu",icon:"📁",title:"Vụ án PC04",badge:"PL VỤ·155 cột",desc:`${data.vu_an?.filter(r=>!r.da_loai).length||0} vụ`,clr:"var(--g-vu)",bg:"var(--g-vu-bg)"},
              {type:"tb807",icon:"📊",title:"BC Tuần TB807",badge:"B2→B7",desc:"Quản lý + Xét nghiệm + Vụ án",clr:"#1565c0",bg:"#f0f6ff"},

// ── Modal: liệt kê placeholder {{key}} của toàn bộ trường dữ liệu (F_UNIFIED) để chèn vào template mẫu ──
function PlaceholderModal({onClose,toast}){
  const [search,setSearch]=useState("");
  // Gom toàn bộ trường, loại trùng theo key (giữ field xuất hiện đầu tiên)
  const allFields=useMemo(()=>{
    const seen=new Set();const out=[];
    F_UNIFIED.forEach(f=>{
      if(!seen.has(f.k)){seen.add(f.k);out.push(f);}
      if((f.type==="select_other")&&!seen.has(f.k+"_other")){
        seen.add(f.k+"_other");out.push({k:f.k+"_other",lbl:f.lbl+" (khác - tự nhập)",grp:f.grp});
      }
    });
    out.push({k:"ngay_xuat",lbl:"Ngày xuất file (tự động = ngày điền mẫu)",grp:"🗓️ Tiện ích"});
    return out;
  },[]);
  const groups=useMemo(()=>[...new Set(allFields.map(f=>f.grp||"Thông tin"))],[allFields]);
  const filtered=search.trim()
    ? allFields.filter(f=>(f.lbl||"").toLowerCase().includes(search.toLowerCase())||f.k.toLowerCase().includes(search.toLowerCase()))
    : allFields;

  const copyText=(t)=>{
    navigator.clipboard?.writeText(t).then(()=>toast?.("Đã sao chép!","success")).catch(()=>{});
  };
  const copyAll=()=>{
    const lines=allFields.map(f=>`{{${f.k}}} = ${f.lbl}`).join("\n");
    copyText(lines);
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(10,20,50,.6)",display:"flex",alignItems:"flex-start",justifyContent:"center",zIndex:1400,overflowY:"auto",padding:"12px 8px"}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:"#fff",borderRadius:14,width:"min(760px,98vw)",margin:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.3)",display:"flex",flexDirection:"column",maxHeight:"92vh"}}>
        <div style={{background:"linear-gradient(135deg,#0d1b3e 0%,#1e3a6e 100%)",borderRadius:"14px 14px 0 0",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div>
            <div style={{color:"#fff",fontSize:15,fontWeight:700}}>🏷️ Placeholder tất cả các trường ({allFields.length})</div>
            <div style={{color:"rgba(255,255,255,.6)",fontSize:11,marginTop:2}}>Chèn <code>{"{{ten_truong}}"}</code> vào file mẫu Word/Excel để điền tự động</div>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.25)",cursor:"pointer",color:"#fff",width:30,height:30,borderRadius:7,fontSize:16}}>✕</button>
        </div>
        <div style={{padding:"12px 20px",borderBottom:"1px solid #eee",display:"flex",gap:10,flexShrink:0}}>
          <input className="srch" style={{flex:1}} placeholder="Tìm theo tên trường hoặc nhãn..." value={search} onChange={e=>setSearch(e.target.value)}/>
          <button className="btn btn-green btn-sm" onClick={copyAll}>📋 Copy tất cả</button>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:"10px 20px 20px"}}>
          {groups.map(g=>{
            const fs=filtered.filter(f=>(f.grp||"Thông tin")===g);
            if(fs.length===0)return null;
            return(
              <div key={g} style={{marginBottom:14}}>
                <div style={{fontSize:12.5,fontWeight:700,color:"#1e3a6e",margin:"10px 0 6px"}}>{g}</div>
                <div style={{display:"flex",flexDirection:"column",gap:5}}>
                  {fs.map(f=>(
                    <div key={f.k} style={{display:"flex",alignItems:"center",gap:8,background:"#f8fafd",border:"1px solid #e2e8f5",borderRadius:7,padding:"6px 10px"}}>
                      <code style={{fontSize:12,color:"#b71c1c",fontWeight:700,flexShrink:0}}>{`{{${f.k}}}`}</code>
                      <span style={{fontSize:12,color:"#555",flex:1}}>{f.lbl}</span>
                      <button className="btn btn-ghost btn-sm" onClick={()=>copyText(`{{${f.k}}}`)}>📋</button>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
          {filtered.length===0&&<div style={{textAlign:"center",color:"#999",fontSize:13,padding:20}}>Không tìm thấy trường phù hợp</div>}
        </div>
      </div>
    </div>
  );
}

// ── Chuyển 1 bản ghi đối tượng thành object {ten_truong: "giá trị hiển thị"} để điền vào template ──
// Lọc danh sách đối tượng theo khoảng ngày tạo hồ sơ trong hệ thống (_created).
// Để trống 1 hoặc cả 2 mốc = không giới hạn phía đó.
function filterByDateRange(list,tuNgay,denNgay){
  return list.filter(r=>{
    const created=(r._created||"").slice(0,10);
    if(!created)return!tuNgay&&!denNgay; // bản ghi không có ngày tạo: chỉ lấy khi không lọc ngày
    if(tuNgay&&created<tuNgay)return false;
    if(denNgay&&created>denNgay)return false;
    return true;
  });
}
