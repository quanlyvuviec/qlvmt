// SMART TEMPLATE FILL ENGINE v2
// Pipeline duy nhất: scan → style → fill → seal
// ════════════════════════════════════════════════════════════════════════

// ── 1. Helpers ────────────────────────────────────────────────────────

// Xây dựng map slave→master từ merges của ws
function buildSlaveMap(ws){
  const m=new Map();
  (ws["!merges"]||[]).forEach(mg=>{
    for(let r=mg.s.r;r<=mg.e.r;r++)
      for(let c=mg.s.c;c<=mg.e.c;c++)
        if(r!==mg.s.r||c!==mg.s.c) m.set(r+":"+c,{r:mg.s.r,c:mg.s.c});
  });
  return m;
}

// Xóa merge trong vùng data (giữ merge header)
function clearDataMerges(ws,startRow){
  if(ws["!merges"])
    ws["!merges"]=ws["!merges"].filter(m=>m.s.r<startRow);
}

// Xóa hàng placeholder (chứa "không" hoặc ký tự -) trong vùng data
function clearPlaceholderRows(ws,startRow){
  if(!ws["!ref"])return;
  const range=XLSX.utils.decode_range(ws["!ref"]);
  for(let r=startRow;r<=Math.min(range.e.r,startRow+40);r++){
    let isPH=false,hasSign=false;
    for(let c=0;c<=Math.min(range.e.c,6);c++){
      const raw=(ws[cellRef(r,c)]||{}).v;
      // Lưu ý: số 0 là giá trị hợp lệ nên không dùng (v||"") — sẽ mất dòng mẫu toàn số 0
      const v=String(raw==null?"":raw).trim().toLowerCase();
      if(!v)continue;
      // Không đụng tới khối chữ ký / ghi chú ở cuối biểu
      if(/trưởng|cán bộ|thủ trưởng|lãnh đạo|ghi chú|ngày .* tháng|tổng cộng|tổng số/.test(v)){hasSign=true;break;}
      if(v==="không"||v==="-"||v==="..."||v==="…"||/^\(?\d+\)?$/.test(v))isPH=true;
    }
    if(hasSign)break;
    if(isPH) for(let c=0;c<=range.e.c;c++) delete ws[cellRef(r,c)];
  }
}

// ── 2. Style constants ────────────────────────────────────────────────
const ST={
  thin  :{style:"thin",  color:{rgb:"000000"}},
  medium:{style:"medium",color:{rgb:"000000"}},
  none  :{style:"none"},
};
function bdr(t,b,l,r){return{top:t,bottom:b,left:l,right:r};}
const BDR={
  none : bdr(ST.none,ST.none,ST.none,ST.none),
  data : bdr(ST.thin, ST.thin, ST.thin, ST.thin),
  hdr  : bdr(ST.medium,ST.medium,ST.thin,ST.thin),
  sub  : bdr(ST.thin, ST.medium,ST.thin,ST.thin),
};
const FILL={
  none  :{patternType:"none"},
  hdr   :{patternType:"solid",fgColor:{rgb:"BDD7EE"}},  // xanh chuẩn header
  sub   :{patternType:"solid",fgColor:{rgb:"D9E1F2"}},  // tím nhạt sub-header
  numTT :{patternType:"solid",fgColor:{rgb:"E2EFDA"}},  // xanh lá số TT
  alt   :{patternType:"solid",fgColor:{rgb:"EBF3FB"}},  // xen kẽ hàng data
  white :{patternType:"none"},
};
function font(sz,bold,italic){
  return{name:"Times New Roman",sz:sz||13,bold:!!bold,italic:!!italic};
}
function align(h,v,wrap){
  return{horizontal:h||"left",vertical:v||"center",wrapText:wrap!==false};
}

// Ghi style vào 1 ô (bỏ qua slave, giữ value gốc)
function writeStyle(ws,r,c,s,slaveMap){
  if(slaveMap&&slaveMap.has(r+":"+c))return;
  const ref=cellRef(r,c);
  const ex=ws[ref]||{v:"",t:"s"};
  ws[ref]={...ex,s};
}

// ── 3. scanHeader: tự động nhận diện cấu trúc header file gốc ─────────
// Trả về: {titleRows, headerRow, subRows, numTTRow, dataStartRow, colOffset}
function scanHeader(ws){
  const range=XLSX.utils.decode_range(ws["!ref"]||"A1");
  const NC=range.e.c+1;
  let result={
    titleRows:[],        // các hàng tiêu đề đơn vị/tên BC (không có border)
    headerRow:-1,        // hàng header cột chính (có border, fill)
    subRows:[],          // hàng sub-header (giữa header và data)
    numTTRow:-1,         // hàng số thứ tự (1)(2)...
    dataStartRow:-1,     // hàng data đầu tiên
    colOffset:0,         // offset cột (0 = từ A, 3 = từ D như mẫu rà soát)
    NC,
  };

  // Phân tích từng hàng từ trên xuống
  for(let r=0;r<=Math.min(range.e.r,20);r++){
    // Thu thập giá trị hàng (bỏ null)
    const vals=[];
    let firstValCol=NC;
    for(let c=0;c<NC;c++){
      const v=String((ws[cellRef(r,c)]||{}).v||"").trim();
      if(v){vals.push(v.toLowerCase());if(c<firstValCol)firstValCol=c;}
    }
    if(!vals.length)continue;

    // Hàng border? (ít nhất 1/3 số cột có border)
    let borderCount=0;
    for(let c=0;c<NC;c++){
      const cell=ws[cellRef(r,c)];
      if(cell&&cell.s&&cell.s.border&&
         (cell.s.border.top||{}).style&&
         (cell.s.border.top||{}).style!=="none") borderCount++;
    }
    const hasBorder=borderCount>NC/3;

    // Hàng fill? (ít nhất 1 ô có fill solid)
    let hasFill=false;
    for(let c=0;c<NC;c++){
      const cell=ws[cellRef(r,c)];
      if(cell&&cell.s&&cell.s.fill&&cell.s.fill.patternType==="solid"){hasFill=true;break;}
    }

    // Hàng số thứ tự: tất cả giá trị là số hoặc dạng (1)(2)
    const isNumTT=vals.length>2&&vals.every(v=>/^\(?-?\d+\)?\.?$/.test(v));

    // Hàng header: có border HOẶC fill HOẶC chứa "họ" "tên" "ngày" "địa chỉ"
    const headerKW=["họ","tên","ngày","địa chỉ","cccd","khu phố","đơn vị","stt"];
    const isHeaderLike=headerKW.some(kw=>vals.some(v=>v.includes(kw)));

    // Hàng tiêu đề: chứa "công an","cộng hòa","phụ lục","danh sách","thống kê","độc lập"
    const titleKW=["công an","cộng hòa","phụ lục","danh sách","thống kê","độc lập","hòa xã hội","toàn bộ"];
    const isTitleLike=titleKW.some(kw=>vals.some(v=>v.includes(kw)));

    if(result.dataStartRow>=0) break; // đã tìm thấy data → dừng

    if(isNumTT&&hasBorder){
      result.numTTRow=r;
      // Hàng tiếp theo là dataStart
      result.dataStartRow=r+1;
      if(result.colOffset===0) result.colOffset=firstValCol;
    } else if((hasBorder||hasFill)&&isHeaderLike&&result.headerRow<0){
      result.headerRow=r;
      if(result.colOffset===0) result.colOffset=firstValCol;
    } else if((hasBorder||hasFill)&&result.headerRow>=0){
      result.subRows.push(r);
    } else if(isTitleLike||(!hasBorder&&!hasFill&&vals.length>0)){
      result.titleRows.push(r);
    }
  }

  // Fallback nếu không tìm được header có border
  if(result.headerRow<0&&result.titleRows.length>0){
    // Hàng ngay sau titleRows cuối có giá trị → header
    const lastTitle=Math.max(...result.titleRows);
    for(let r=lastTitle+1;r<=Math.min(range.e.r,15);r++){
      const vals=[];
      for(let c=0;c<NC;c++){
        const v=String((ws[cellRef(r,c)]||{}).v||"").trim();
        if(v)vals.push(v.toLowerCase());
      }
      if(vals.length>2){result.headerRow=r;break;}
    }
  }

  // Nếu vẫn chưa có dataStart, lấy headerRow + subRows.length + 1 + numTT
  if(result.dataStartRow<0&&result.headerRow>=0){
    result.dataStartRow=result.headerRow+result.subRows.length+(result.numTTRow>=0?2:1);
  }

  return result;
}

// ── 4. applyHeaderStyle: style phần tiêu đề theo chuẩn VN ───────────
function applyHeaderStyle(ws,info){
  const {titleRows,headerRow,subRows,numTTRow,NC}=info;
  const slaveMap=buildSlaveMap(ws);

  // Tiêu đề (không border)
  titleRows.forEach(ri=>{
    for(let c=0;c<NC;c++){
      const ref=cellRef(ri,c);
      const ex=ws[ref];
      if(!ex||ex.v==null||ex.v==="")continue;
      const val=String(ex.v).toLowerCase();
      const isTitle=val.includes("phụ lục")||val.includes("danh sách")||
                    val.includes("thống kê")||val.includes("kết quả");
      const isPeriod=val.startsWith("(")||val.includes("toàn bộ")||
                     val.includes("từ ngày")||val.includes("tuần");
      const isCap=val.includes("cộng hòa")||val.includes("độc lập");
      const isDonVi=!isCap&&c<NC/2&&ri<=3;

      let sz=13,bold=false,italic=false;
      if(isTitle){sz=14;bold=true;}
      else if(isPeriod){sz=13;italic=true;}
      else if(isCap||isDonVi){sz=13;bold=true;}

      writeStyle(ws,ri,c,{
        font:font(sz,bold,italic),
        alignment:align("center","center"),
        border:BDR.none,
        fill:FILL.none,
      },slaveMap);
    }
    if(!ws["!rows"])ws["!rows"]=[];
    ws["!rows"][ri]=ws["!rows"][ri]||{hpt:ri<=1?22:(ri<=3?36:20)};
  });

  // Header cột chính
  if(headerRow>=0){
    for(let c=0;c<NC;c++){
      if(slaveMap.has(headerRow+":"+c))continue;
      const ref=cellRef(headerRow,c);
      const ex=ws[ref]||{v:"",t:"s"};
      ws[ref]={...ex,v:ex.v!=null?ex.v:"",t:"s",s:{
        font:font(13,true),
        alignment:align("center","center"),
        border:BDR.hdr,
        fill:FILL.hdr,
      }};
    }
    ws["!rows"]=ws["!rows"]||[];
    ws["!rows"][headerRow]={hpt:40};
  }

  // Sub-header rows
  subRows.forEach((ri,idx)=>{
    for(let c=0;c<NC;c++){
      if(slaveMap.has(ri+":"+c))continue;
      const ref=cellRef(ri,c);
      const ex=ws[ref]||{v:"",t:"s"};
      ws[ref]={...ex,v:ex.v!=null?ex.v:"",t:"s",s:{
        font:font(12,idx===0),
        alignment:align("center","center"),
        border:BDR.sub,
        fill:idx===0?FILL.sub:FILL.numTT,
      }};
    }
    ws["!rows"]=ws["!rows"]||[];
    ws["!rows"][ri]={hpt:idx===0?36:22};
  });

  // Số thứ tự row
  if(numTTRow>=0){
    for(let c=0;c<NC;c++){
      if(slaveMap.has(numTTRow+":"+c))continue;
      const ref=cellRef(numTTRow,c);
      const ex=ws[ref]||{v:"",t:"s"};
      ws[ref]={...ex,v:ex.v!=null?ex.v:"",t:"s",s:{
        font:font(11,false),
        alignment:align("center","center"),
        border:BDR.sub,
        fill:FILL.numTT,
      }};
    }
    ws["!rows"]=ws["!rows"]||[];
    ws["!rows"][numTTRow]={hpt:20};
  }
}

// ── 5. fillDataRows: ghi data + style đồng thời ──────────────────────
function fillDataRows(ws,dataStartRow,rows,NC){
  if(!rows||!rows.length)return;
  const slaveMap=buildSlaveMap(ws);
  const numCols=NC||Math.max(...rows.map(r=>r.length));
  const written=new Set();

  rows.forEach((row,ri)=>{
    const isAlt=ri%2===1;
    const fillData=isAlt?FILL.alt:FILL.white;
    const absR=dataStartRow+ri;

    // Lấy border từ hàng header gốc nếu có (để outer border đúng)
    const getBdr=()=>BDR.data;

    for(let ci=0;ci<numCols;ci++){
      let r=absR,c=ci;
      const master=slaveMap.get(r+":"+c);
      if(master){r=master.r;c=master.c;}
      const mk=r+":"+c;
      if(written.has(mk))continue;
      written.add(mk);

      const val=row[ci];
      const v=(val==null||val===undefined)?"":val;
      const t=typeof val==="number"?"n":"s";
      const isNum=typeof val==="number"||(ci===3&&!isNaN(Number(v))&&v!=="");
      const ref=cellRef(r,c);
      const ex=ws[ref]||{};

      ws[ref]={...ex,v,t,s:{
        font:font(13,false),
        alignment:align(isNum?"center":"left","center"),
        border:getBdr(),
        fill:fillData,
      }};
    }

    // Row height
    ws["!rows"]=ws["!rows"]||[];
    ws["!rows"][absR]={hpt:32};
  });

  // Mở rộng !ref
  const nr=XLSX.utils.decode_range(ws["!ref"]);
  nr.e.r=Math.max(nr.e.r,dataStartRow+rows.length-1);
  nr.e.c=Math.max(nr.e.c,numCols-1);
  ws["!ref"]=XLSX.utils.encode_range(nr);
}

// ĐỊNH VỊ DÒNG DỮ LIỆU ĐẦU TIÊN CỦA BIỂU DANH SÁCH (v8.1)
// Xác định theo cấu trúc thật của bảng thay vì đoán:
//   - Hàng tiêu đề cột: có ô "STT"/"TT" và ít nhất 1 ô tiêu đề đặc trưng.
//   - Bỏ qua các hàng tiêu đề phụ (ô STT trống nhưng các cột khác có chữ)
//     và hàng đánh số cột "(1)(2)(3)" / "-1 -2 -3".
//   - Hàng dữ liệu đầu tiên: hàng có STT là số, hoặc hàng trống, hoặc hàng
//     chứa chữ "không"/"-" (placeholder của file mẫu — sẽ được xóa trước khi ghi).
// ══════════════════════════════════════════════════════════════════════
function locateListStart(ws){
  if(!ws||!ws["!ref"])return null;
  const range=XLSX.utils.decode_range(ws["!ref"]);
  const maxC=Math.min(range.e.c,40);
  const txt=(r,c)=>String((ws[cellRef(r,c)]||{}).v==null?"":(ws[cellRef(r,c)]||{}).v).replace(/\s+/g," ").trim();
  const HDR_KW=/họ (và )?tên|tên băng nhóm|tên điểm|tên đối tượng|ngày thống kê|đơn vị|loại hình|năm sinh|khu phố|địa chỉ/i;
  let headerRow=-1,cSTT=-1;
  for(let r=0;r<=Math.min(range.e.r,20)&&headerRow<0;r++){
    let stt=-1,kw=0;
    for(let c=0;c<=maxC;c++){
      const t=txt(r,c);if(!t)continue;
      if(stt<0&&/^(stt|tt|số tt)$/i.test(t))stt=c;
      if(HDR_KW.test(t))kw++;
    }
    if(stt>=0&&kw>=1){headerRow=r;cSTT=stt;}
  }
  if(headerRow<0)return null;
  // Hàng ĐÁNH SỐ CỘT thực sự phải bắt đầu bằng (1)/1/-1 và toàn số.
  // Hàng toàn số 0 trong file mẫu là DÒNG DỮ LIỆU MẪU (placeholder) chứ không
  // phải hàng đánh số cột — trước đây bị bỏ qua khiến dữ liệu ghi lệch xuống dưới.
  const isNumRow=r=>{
    const cells=[];for(let c=0;c<=maxC;c++){const t=txt(r,c);if(t)cells.push(t);}
    if(cells.length<=2)return false;
    if(!cells.every(v=>/^\(?-?\d+\)?\.?$/.test(v)))return false;
    return /^\(?-?1\)?\.?$/.test(cells[0]);
  };
  const rowHasText=r=>{
    for(let c=0;c<=maxC;c++){if(/[a-zA-ZÀ-ỹ]/.test(txt(r,c)))return true;}
    return false;
  };
  let r=headerRow+1;
  const limit=Math.min(range.e.r,headerRow+6);
  while(r<=limit){
    if(isNumRow(r)){r++;continue;}                       // hàng đánh số cột
    const a=txt(r,cSTT).toLowerCase();
    if(!a&&rowHasText(r)){r++;continue;}                 // hàng tiêu đề phụ
    break;                                               // hàng dữ liệu đầu tiên
  }
  return{headerRow,dataStart:r,cSTT};
}

// ── 6. Public API (dùng trong doFillTemplate) ─────────────────────────
// Hàm duy nhất được gọi từ bên ngoài: tự scan → style → fill
function fillTemplate(ws,rows){
  if(!ws||!ws["!ref"])return;
  // Scan cấu trúc header
  const info=scanHeader(ws);
  const loc=locateListStart(ws);
  const dataStart=loc?loc.dataStart:(info.dataStartRow>=0?info.dataStartRow:8);
  // Xóa merges và placeholder trong vùng data
  clearDataMerges(ws,dataStart);
  clearPlaceholderRows(ws,dataStart);
  // Style header
  applyHeaderStyle(ws,info);
  // Ghi data với style
  fillDataRows(ws,dataStart,rows,info.NC);
}

// Legacy wrappers (giữ tương thích với các nơi gọi cũ)
function appendRows(ws,startRow,rows){
  // Dùng fillDataRows trực tiếp với startRow override
  const info=scanHeader(ws);
  applyHeaderStyle(ws,info);
  fillDataRows(ws,startRow,rows,info.NC);
}
function writeRowsExact(ws,startRow,rows){
  const info=scanHeader(ws);
  applyHeaderStyle(ws,info);
  fillDataRows(ws,startRow,rows,info.NC);
}
function styleHeaderRows(ws){
  const info=scanHeader(ws);
  applyHeaderStyle(ws,info);
}
function styleRaSoatHeader(ws){
  const info=scanHeader(ws);
  applyHeaderStyle(ws,info);
}


// ── Helper functions cho doFillTemplate ─────────────────────────────
function wbContains(wb,kw){
  return wb.SheetNames.some(sn=>{
    const ws=wb.Sheets[sn];if(!ws||!ws["!ref"])return false;
    const range=XLSX.utils.decode_range(ws["!ref"]);
    for(let r=0;r<=Math.min(range.e.r,14);r++)
      for(let c=0;c<=Math.min(range.e.c,30);c++){
        const cell=ws[cellRef(r,c)];
        if(cell&&String(cell.v||"").toLowerCase().includes(kw))return true;
      }
    return false;
  });
}
function detectTemplateType(wb){
  const names=wb.SheetNames.map(s=>s.toLowerCase().replace(/\s/g,""));
  if(wbContains(wb,"địa bàn không ma túy")||wbContains(wb,"địa bàn không ma tuý"))return"rasoat";
  if(wbContains(wb,"người bị quản lý sau cai nghiện")&&wbContains(wb,"khu phố"))return"hd26ds_sc";
  if(wbContains(wb,"người nghiện ma túy")&&wbContains(wb,"khu phố")&&!wbContains(wb,"phụ lục 1b"))return"hd26ds_ng";
  if(wbContains(wb,"người sử dụng trái phép")&&wbContains(wb,"khu phố")&&!wbContains(wb,"phụ lục 1b"))return"hd26ds_sd";
  if(wbContains(wb,"bm tổng")||wbContains(wb,"bm1")||
     names.some(n=>n.includes("hd26")||n.includes("tb03")||n.includes("bmtổng")||n.includes("bmtong")||n.includes("bm1")||n.includes("bm2"))||
     wbContains(wb,"hướng dẫn 26")||wbContains(wb,"26/hd-bca-c04"))return"hd26";
  if(wbContains(wb,"phụ lục 1b")||wbContains(wb,"pl1b")||names.some(n=>n.includes("pl1b")))return"tb136";
  if(names.some(n=>n.includes("pl1")||n.includes("pl2")||n.includes("pl3"))&&wbContains(wb,"tb136"))return"tb136";
  if(wbContains(wb,"b1")&&wbContains(wb,"rà soát")||names.some(n=>n.includes("483")||n.includes("tb807")||n.includes("b1")))return"tb807_thang";
  if(names.some(n=>n.includes("b2")||n.includes("b3")||n.includes("b4"))&&wbContains(wb,"phần mềm"))return"tb807_tuan";
  if(wbContains(wb,"phát sinh mới")||wbContains(wb,"qđ28")||wbContains(wb,"qd28"))return"qd28";
  return"unknown";
}
function setPreserveStyle(ws,r,c,v){
  const ref=cellRef(r,c);const ex=ws[ref]||{};
  const t=typeof v==="number"?"n":(v instanceof Date?"d":"s");
  const style=ex.s?{...ex.s,font:ex.s.font||{name:"Times New Roman",sz:14},
    alignment:ex.s.alignment||{horizontal:"center",vertical:"center"}}:{
    font:{name:"Times New Roman",sz:14},alignment:{horizontal:"center",vertical:"center"},
    border:{top:{style:"thin",color:{rgb:"000000"}},bottom:{style:"thin",color:{rgb:"000000"}},
            left:{style:"thin",color:{rgb:"000000"}},right:{style:"thin",color:{rgb:"000000"}}}};
  ws[ref]={...ex,v,t,s:style};
}
// ══════════════════════════════════════════════════════════════════════
// ĐỊNH VỊ HÀNG SỐ LIỆU TRONG FILE MẪU (v8.1)
// Trước đây hệ thống dò hàng bằng cách tìm chữ "phường/Tân Bình" ở 6 cột đầu
// nên rất dễ trúng ngay hàng TIÊU ĐỀ "CÔNG AN PHƯỜNG TÂN BÌNH" và ghi số liệu
// đè lên tiêu đề; đồng thời cột bắt đầu ghi bị tính thành cột A làm mất cột
// STT và Đơn vị. Bản mới xác định theo cấu trúc bảng:
//   1) Tìm HÀNG TIÊU ĐỀ CỘT: hàng có ô "STT"/"TT" và ô "Đơn vị"/"Địa phương".
//   2) Cột đơn vị = cột chứa chữ "Đơn vị"; số liệu ghi từ cột ngay sau đó.
//   3) Hàng số liệu = hàng đầu tiên BÊN DƯỚI khối tiêu đề có STT = 1
//      (bỏ qua hàng đánh số cột "(1)(2)(3)" hoặc "-1 -2 -3").
// ══════════════════════════════════════════════════════════════════════
function locateStatRow(ws){
  if(!ws||!ws["!ref"])return null;
  const range=XLSX.utils.decode_range(ws["!ref"]);
  const txt=(r,c)=>String((ws[cellRef(r,c)]||{}).v==null?"":(ws[cellRef(r,c)]||{}).v).replace(/\s+/g," ").trim();
  const maxC=Math.min(range.e.c,40),maxR=Math.min(range.e.r,30);
  let hdrRow=-1,cSTT=-1,cDV=-1;
  for(let r=0;r<=maxR&&hdrRow<0;r++){
    let stt=-1,dv=-1;
    for(let c=0;c<=maxC;c++){
      const t=txt(r,c).toLowerCase();
      if(!t)continue;
      if(stt<0&&/^(stt|tt|số tt)$/.test(t))stt=c;
      if(dv<0&&/^(đơn vị|đơn vị.*|địa phương|tỉnh, thành phố)$/.test(t)&&!/công an (tp|thành phố)/.test(t))dv=c;
    }
    if(stt>=0&&dv>=0){hdrRow=r;cSTT=stt;cDV=dv;}
  }
  if(hdrRow<0)return null;
  const isNumRow=r=>{
    const cells=[];
    for(let c=0;c<=maxC;c++){const t=txt(r,c);if(t)cells.push(t);}
    return cells.length>3&&cells.every(v=>/^\(?-?\d+\)?$/.test(v));
  };
  let dataRow=-1;
  for(let r=hdrRow+1;r<=Math.min(range.e.r,hdrRow+8);r++){
    if(isNumRow(r))continue;
    const a=txt(r,cSTT),b=txt(r,cDV);
    if(/^1$/.test(a)||(b&&!/^(phường\/xã|quận\/huyện|tỉnh|tp)$/i.test(b)&&!/^\(?\d+\)?$/.test(b))){dataRow=r;break;}
  }
  if(dataRow<0)return null;
  return{hdrRow,dataRow,cSTT,cDV,startCol:cDV+1};
}
// Ghi số liệu vào hàng đơn vị: không ghi đè ô có công thức, giữ nguyên định dạng ô
function fillUnitRow(ws,vals,uname){
  const loc=locateStatRow(ws);
  if(!loc)return false;
  const{dataRow,cSTT,cDV,startCol}=loc;
  const cur=k=>String((ws[cellRef(dataRow,k)]||{}).v||"").trim();
  const isPH=v=>!v||/^(không|khong|k|-|\.\.\.|…)$/i.test(v);
  if(isPH(cur(cSTT)))setPreserveStyle(ws,dataRow,cSTT,1);
  if(isPH(cur(cDV)))setPreserveStyle(ws,dataRow,cDV,uname||CONFIG.donVi);
  vals.forEach((v,i)=>{
    if(v===null||v===undefined)return;
    const ex=ws[cellRef(dataRow,startCol+i)]||{};
    if(ex.f)return;                       // giữ nguyên ô có công thức =SUM()
    setPreserveStyle(ws,dataRow,startCol+i,v);
  });
  return true;
}
function smartFillRow(ws,unitRow,vals){
  const loc=locateStatRow(ws);
  const startC=loc?loc.startCol:2;
  const r=(unitRow>=0?unitRow:(loc?loc.dataRow:-1));
  if(r<0)return false;
  vals.forEach((v,i)=>{if(v!==null&&v!==undefined)setPreserveStyle(ws,r,startC+i,v);});
  return true;
}
// findRow trả về -1 khi không thấy; -1 lại là giá trị "truthy" nên các chỗ dùng
// findRow(...)||fallback trước đây luôn nhận -1 → ghi vào hàng âm, hỏng file.
function findRowOr(ws,keywords,fallback){
  const list=Array.isArray(keywords)?keywords:[keywords];
  for(const kw of list){const r=findRow(ws,kw);if(r>=0)return r;}
  return fallback;
}



// Xóa merge cells trong vùng data (từ startRow trở xuống) trước khi ghi
function doFillTemplate(wb,data,dr){
  const LOG=[];

          ["I","Đối tượng mua, bán trái phép chất ma túy","","","","","","","","",""],
          ...ban.map(rowOf),
          ["","Tổng số: ",ban.length,"","","","","","","",""],
          ["II","Điểm tổ chức sử dụng, chứa chấp việc sử dụng trái phép chất ma túy","","","","","","","","",""],
          ...diem.map(rowOf),
          ["","Tổng số: ",diem.length,"","","","","","","",""],
        ];
        fillTemplate(ws,rows);
        LOG.push("BM1: "+ban.length+" đối tượng mua bán + "+diem.length+" điểm ✓");
      }
      // BM2 – BẢNG TỔNG HỢP kết quả đấu tranh (2 dòng: đối tượng mua bán / điểm)
      else if(sl.includes("BM2")){
        const rBan=findRowOr(ws,["đối tượng mua, bán","đối tượng mua bán"],-1);
        const rDiem=findRowOr(ws,["điểm tổ chức sử dụng","điểm tổ chức, chứa chấp"],-1);
        const wr=(row,vals)=>{if(row<0)return false;vals.forEach((v,i)=>{const ex=ws[cellRef(row,2+i)]||{};if(!ex.f)setPreserveStyle(ws,row,2+i,v);});return true;};
        const okB=wr(rBan,hd26Bm2Vals(hd26Agg(S,hd26IsBan)));
        const okD=wr(rDiem,hd26Bm2Vals(hd26Agg(S,r=>!hd26IsBan(r))));
        LOG.push("BM2: kết quả đấu tranh "+(okB?"đối tượng mua bán ✓ ":"")+(okD?"điểm tổ chức, chứa chấp ✓":""));
      }
    }
    if(type==="qd28"){
      if(sl.includes("PL1")||sl.includes("SD")||sl.includes("SUDUNG")){
        const hr=findRowOr(ws,["họ và tên","họ tên"],7);
        clearQD28Placeholder(ws,hr);
        fillTemplate(ws,sdPS.map((r,i)=>[i+1,r.phuong_xa||"Tân Bình",r.quan_huyen||CONFIG.quanHuyen,fmtDate(r.ngay_vao_so),r.ho_ten,fmtDate(r.ngay_sinh),r.gioi_tinh,r.hktt,r.noi_o_ht,r.cccd,r.trinh_do_hv,dv(r,"loai_ma_tuy"),r.qd_ql_so,r.qd_ql_tg,r.qd_xlhc_so,r.qd_xlhc_tg,boolX(r.co_mat),r.vang_mat,r.cap_nhat_pm,fmtDate(r.thoi_gian_ps)]));
        LOG.push("PL1 QĐ28: "+sdPS.length+" người SD ✓");
      }
      if(sl.includes("PL2")||sl.includes("NGHIEN")){
        const hr=findRowOr(ws,["họ và tên","họ tên"],7);
        clearQD28Placeholder(ws,hr);
        fillTemplate(ws,ngPS.map((r,i)=>[i+1,r.phuong_xa||"Tân Bình",r.quan_huyen||CONFIG.quanHuyen,fmtDate(r.ngay_vao_so),r.ho_ten,fmtDate(r.ngay_sinh),r.gioi_tinh,r.hktt,r.noi_o_ht,r.cccd,r.trinh_do_hv,dv(r,"loai_ma_tuy"),r.phieu_xd_nghien,dv(r,"hinh_thuc_cai"),boolX(r.co_mat),r.vang_mat,r.cap_nhat_pm,fmtDate(r.thoi_gian_ps)]));
        LOG.push("PL2 QĐ28: "+ngPS.length+" người nghiện ✓");
      }
      if(sl.includes("PL3")||sl.includes("VPPL")||sl.includes("VPHP")){
        const hr=findRowOr(ws,["họ và tên","họ tên"],7);
        clearQD28Placeholder(ws,hr);
        fillTemplate(ws,vpPS.map((r,i)=>[i+1,r.ho_ten,fmtDate(r.ngay_sinh),r.hktt,r.noi_o_truoc_bi_bat||r.dia_chi_cu_tru,fmtDate(r.kt_ngay_bat),r.trich_yeu||"",r.hanh_vi_chinh||"",dv(r,"kq_xlhc_bpxp"),fmtDate(r.ngay_ban_hanh_kq_xl),boolX(r.cu_tru_30ngay),r.ghi_chu_qd28||""]));
        LOG.push("PL3 QĐ28: "+vpPS.length+" VPPL ✓");
      }
    }
    // ══════════ MẪU HƯỚNG DẪN 26 MỚI – DS Người sử dụng / Người nghiện / Sau cai (có Khu phố) ══════════
    if(type==="hd26ds_sd"){
      const hr=findRow(ws,"họ và tên");
      const dataStart=(hr>=0?hr:5)+3;
      const rows=allSD.map((r,i)=>[
        r.phuong_xa?("Phường "+r.phuong_xa):tenPhuong,r.khu_pho_cu||"",r.khu_pho_moi||"",i+1,fmtDate(r.ngay_vao_so),
        r.ho_ten,fmtDate(r.ngay_sinh),r.gioi_tinh,r.hktt,r.noi_o_ht,r.cccd,r.trinh_do_hv,
        dv(r,"loai_ma_tuy"),r.qd_ql_so,r.qd_ql_tg,r.qd_xlhc_so,r.qd_xlhc_tg,
        boolX(r.co_mat),r.vang_mat,r.cap_nhat_pm,r.ghi_chu||""
      ]);
      fillTemplate(ws,rows);
      LOG.push("DS Người sử dụng (HD26): "+rows.length+" người ✓");
    }
    if(type==="hd26ds_ng"){
      const hr=findRow(ws,"họ và tên");
      const dataStart=(hr>=0?hr:5)+3;
      const rows=allNG.map((r,i)=>{
        const ht=r.hinh_thuc_cai||"";
        const xTuNguyen=(ht==="Cai tự nguyện tại gia đình"||ht==="Cai tự nguyện tại cộng đồng")?"X":"";
        const yMethadone=ht==="Điều trị Methadone"?"X":"";

          r.phuong_xa?("Phường "+r.phuong_xa):tenPhuong,r.khu_pho_cu||"",r.khu_pho_moi||"",i+1,fmtDate(r.ngay_vao_so),
          r.ho_ten,fmtDate(r.ngay_sinh),r.gioi_tinh,r.hktt,r.noi_o_ht,r.cccd,r.trinh_do_hv,
          dv(r,"loai_ma_tuy"),r.phieu_xd_nghien,dv(r,"hinh_thuc_cai"),
          boolX(r.co_mat),r.vang_mat,r.cap_nhat_pm,r.ghi_chu||"",
          r.qd_cai_tn_so||"",r.qd_cai_tn_cq||"",r.qd_cai_tn_th||"","",
          xTuNguyen,yMethadone,zChuaDK,"","","",""
        ];
      });
      fillTemplate(ws,rows);
      LOG.push("DS Người nghiện (HD26): "+rows.length+" người – lưu ý: 4 cột cuối (chờ thi hành án/đang lập HSBB/bỏ trốn/đã xác định diện) cần cán bộ rà soát điền tay ✓");
    }
    if(type==="hd26ds_sc"){
      const hr=findRow(ws,"họ và tên");
      const dataStart=(hr>=0?hr:5)+3;
      const rows=allSC.map((r,i)=>[
        r.phuong_xa?("Phường "+r.phuong_xa):tenPhuong,r.khu_pho_cu||"",r.khu_pho_moi||"",i+1,fmtDate(r.ngay_vao_so),
        r.ho_ten,fmtDate(r.ngay_sinh),r.gioi_tinh,r.hktt,r.noi_o_ht,r.cccd,r.trinh_do_hv,
        r.gcn_so||"",r.gcn_co_quan||"",r.gcn_hinh_thuc||"",r.gcn_thoi_gian||"",r.gcn_co_so||"",
        r.qd_sau_cai_so||"",r.qd_sau_cai_cq||"",r.qd_sau_cai_th||"",
        boolX(r.co_mat),r.vang_mat,r.cap_nhat_pm,r.ghi_chu||""
      ]);
      fillTemplate(ws,rows);
      LOG.push("DS Quản lý sau cai (HD26): "+rows.length+" người ✓");
    }
    // ══════════ Rà soát xây dựng địa bàn không ma túy (theo Khu phố) ══════════
    if(type==="rasoat"){
      const khuPhoList=data.khu_pho||[];
      const raSoatStore=data.ra_soat||[];
      // File mẫu rà soát: R1=capTren(C4), R6=tiêu đề(C4), R10=header nhóm, R11=header chi tiết, R12=data
      // Tìm hàng "khu phố" để xác định header row
      const hr=findRow(ws,"khu phố");
      const dataStart=(hr>=0?hr:10)+1;  // R11 0-based = R12 1-based
      const getRs=kpId=>raSoatStore.find(x=>x.khu_pho_id===kpId)||{};
      const rows=khuPhoList.map((kp,i)=>{
        const rs=getRs(kp.id);
        const inKp=list=>list.filter(r=>!r.da_loai&&r.khu_pho_moi===kp.ten_moi);
        const sdKp=inKp(allSD),ngKp=inKp(allNG);
        const sdPSkp=filterActive(sdKp,dr.from,dr.to,"thoi_gian_ps");
        const ngPSkpAll=filterActive(ngKp,dr.from,dr.to,"thoi_gian_ps");
        const ngPSkp=ngPSkpAll.filter(r=>r.hinh_thuc_cai!=="Điều trị Methadone");
        const ngMethadoneKp=ngKp.filter(r=>r.hinh_thuc_cai==="Điều trị Methadone");
        const ngKhongMethaKp=ngKp.filter(r=>r.hinh_thuc_cai!=="Điều trị Methadone");
        const ngThamGiaCai=ngKp.filter(r=>r.hinh_thuc_cai&&r.hinh_thuc_cai!=="Khác");
        const tongNghienAll=ngKp.length;
        const D=sdPSkp.length,E=ngPSkp.length;
        const J=sdPSkp.filter(r=>r.do_dv_khac_phat_hien).length;
        const K=ngPSkp.filter(r=>r.do_dv_khac_phat_hien).length;
        const L=sdKp.length,M=ngKhongMethaKp.length,N=ngMethadoneKp.length,O=ngThamGiaCai.length;
        const P=tongNghienAll?pct(O,tongNghienAll)+"%":"0%";
        const nhanKhau=rs.so_nhan_khau||0;
        const Q=nhanKhau?(((D+E)/nhanKhau*100).toFixed(2))+"%":"0%";
        const tc2sum=(rs.tc2_1||0)+(rs.tc2_2||0)+(rs.tc2_3||0)+(rs.tc2_4||0)+(rs.tc2_5||0);
        return[
          i===0?1:"", i===0?tenPhuong:"", kp.ten_moi||kp.ten_cu||"",
          D,E, rs.so_vphp_cu_tru||0, rs.so_truy_na||0, rs.so_diem_tc_thang||0,
          nhanKhau, J,K, L,M,N,O, P, Q,
          rs.tc2_1||0,rs.tc2_2||0,rs.tc2_3||0,rs.tc2_4||0,rs.tc2_5||0, tc2sum,
          rs.truy_na_30ngay||0, "", rs.dang_ky_xd||""
        ];
      });
      clearDataMerges(ws,dataStart);
      // Style riêng cho file rà soát (tiêu đề bắt đầu từ cột D, header ở R10+R11)
      // File rà soát: scanHeader tự nhận diện cấu trúc đặc biệt
      fillTemplate(ws,rows);
      LOG.push("Rà soát địa bàn không ma túy: "+rows.length+" khu phố ✓");
    }
  });
  return{type,LOG};
}

// ════════════════════════════════════════════════════════════════
// NORMALIZE TEMPLATE: chuẩn hóa file mẫu mới ngay khi upload
// Áp dụng font TNR, border header, fill chuẩn → lưu lại base64
// Sau đó fillTemplate luôn cho ra file đẹp không phụ thuộc file gốc
// ════════════════════════════════════════════════════════════════
function normalizeTemplate(wb){
  wb.SheetNames.forEach(sn=>{
    const ws=wb.Sheets[sn];
    if(!ws||!ws["!ref"])return;
    const info=scanHeader(ws);
    if(info.dataStartRow<0)return;

    const range=XLSX.utils.decode_range(ws["!ref"]);
    const NC=range.e.c+1;
    const slaveMap=buildSlaveMap(ws);

    const THIN  ={style:"thin",  color:{rgb:"000000"}};
    const MEDIUM={style:"medium",color:{rgb:"000000"}};
    const NONE  ={style:"none"};
    const BDR_NONE={top:NONE,bottom:NONE,left:NONE,right:NONE};
    const BDR_HDR ={top:MEDIUM,bottom:MEDIUM,left:THIN,right:THIN};
    const BDR_SUB ={top:THIN,  bottom:THIN, left:THIN,right:THIN};
    const F=(sz,bold,italic)=>({name:"Times New Roman",sz,bold:!!bold,italic:!!italic});
    const ALN=(h)=>({horizontal:h,vertical:"center",wrapText:true});

    function norm(ri,ci,s){
      if(slaveMap.has(ri+":"+ci))return;
      const ref=XLSX.utils.encode_cell({r:ri,c:ci});
      const ex=ws[ref]||{};
      ws[ref]={...ex,v:ex.v!=null?ex.v:"",t:typeof ex.v==="number"?"n":"s",s};
    }

    // ── Hàng tiêu đề (không border, font TNR chuẩn VN) ──
    info.titleRows.forEach(ri=>{
      for(let c=0;c<NC;c++){
        const ref=XLSX.utils.encode_cell({r:ri,c});
        const ex=ws[ref];if(!ex||ex.v==null||ex.v==="")continue;
        const v=String(ex.v).toLowerCase();
        const isTitle=v.includes("phụ lục")||v.includes("danh sách")||
                      v.includes("thống kê")||v.includes("kết quả")||
                      v.includes("biểu mẫu")||v.includes("báo cáo");
        const isPeriod=v.startsWith("(")||v.includes("toàn bộ")||v.includes("từ ngày")||v.includes("tuần");
        const isCap=v.includes("cộng hòa")||v.includes("độc lập");
        norm(ri,c,{
          font: F(isTitle?14:13, isTitle||isCap, isPeriod),
          alignment: ALN("center"),
          border: BDR_NONE,
          fill: {patternType:"none"},
        });
      }
      ws["!rows"]=ws["!rows"]||[];
      if(!ws["!rows"][ri]) ws["!rows"][ri]={hpt:ri<=1?22:(ri<=3?36:20)};
    });

    // ── Header cột chính ──
    if(info.headerRow>=0){
      for(let c=0;c<NC;c++){
        if(slaveMap.has(info.headerRow+":"+c))continue;
        const ref=XLSX.utils.encode_cell({r:info.headerRow,c});
        const ex=ws[ref]||{};
        ws[ref]={...ex,v:ex.v!=null?ex.v:"",t:"s",s:{
          font:F(13,true),alignment:ALN("center"),border:BDR_HDR,
          fill:{patternType:"solid",fgColor:{rgb:"BDD7EE"}},
        }};
      }
      ws["!rows"]=ws["!rows"]||[];
      ws["!rows"][info.headerRow]={hpt:40};
    }

    // ── Sub-header rows ──
    info.subRows.forEach((ri,idx)=>{
      for(let c=0;c<NC;c++){
        if(slaveMap.has(ri+":"+c))continue;
        const ref=XLSX.utils.encode_cell({r:ri,c});
        const ex=ws[ref]||{};
        ws[ref]={...ex,v:ex.v!=null?ex.v:"",t:"s",s:{
          font:F(12,idx===0),alignment:ALN("center"),border:BDR_SUB,
          fill:{patternType:"solid",fgColor:{rgb:idx===0?"D9E1F2":"E2EFDA"}},
        }};
      }
      ws["!rows"]=ws["!rows"]||[];
      ws["!rows"][ri]={hpt:idx===0?36:22};
    });

    // ── Hàng số thứ tự cột ──
    if(info.numTTRow>=0){
      for(let c=0;c<NC;c++){
        if(slaveMap.has(info.numTTRow+":"+c))continue;
        const ref=XLSX.utils.encode_cell({r:info.numTTRow,c});
        const ex=ws[ref]||{};
        ws[ref]={...ex,v:ex.v!=null?ex.v:"",t:"s",s:{
          font:F(11,false),alignment:ALN("center"),border:BDR_SUB,
          fill:{patternType:"solid",fgColor:{rgb:"E2EFDA"}},
        }};
      }
      ws["!rows"]=ws["!rows"]||[];
      ws["!rows"][info.numTTRow]={hpt:20};
    }

    // ── Vùng data: chỉ chuẩn hóa border cho ô ĐÃ có dữ liệu (dữ liệu mẫu) ──
    // Ô trống trong template giữ nguyên (sẽ được fill khi xuất)
    for(let r=info.dataStartRow;r<=range.e.r;r++){
      for(let c=0;c<NC;c++){
        if(slaveMap.has(r+":"+c))continue;
        const ref=XLSX.utils.encode_cell({r,c});
        const ex=ws[ref];
        if(!ex||ex.v==null||ex.v==="")continue; // bỏ qua ô trống
        const isNum=typeof ex.v==="number";
        ws[ref]={...ex,s:{
          font:F(13,false),
          alignment:ALN(isNum?"center":"left"),
          border:{top:THIN,bottom:THIN,left:THIN,right:THIN},
          fill:{patternType:"none"},
        }};
      }
    }

    // ── Freeze panes tại hàng data ──
    if(info.dataStartRow>0&&!ws["!freeze"]){
      ws["!freeze"]={xSplit:0,ySplit:info.dataStartRow,topLeftCell:XLSX.utils.encode_cell({r:info.dataStartRow,c:0})};
    }
  });

  return wb;
}

// ── IndexedDB cache cho template base64 (tránh giới hạn 5MB localStorage) ──
const IDB_NAME="sync_tpl_store", IDB_VER=1, IDB_STORE="b64_cache";
function idbOpen(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(IDB_NAME,IDB_VER);
    req.onupgradeneeded=e=>e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess=e=>res(e.target.result);
    req.onerror=e=>rej(e.target.error);
  });
}
async function idbSet(key,val){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete=()=>res(true);
    tx.onerror=e=>rej(e.target.error);
  });
}
async function idbGet(key){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const req=db.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get(key);
    req.onsuccess=e=>res(e.target.result||null);
    req.onerror=e=>rej(e.target.error);
  });
}
async function idbDel(key){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete=()=>res(true);
    tx.onerror=e=>rej(e.target.error);
  });
}
async function idbHas(key){
  const v=await idbGet(key);return v!=null;
}

function SyncPage({data,toast}){
  const [templates,setTemplates]=useState([]);
  const [dr,setDr]=useState({from:"",to:""});
  const [logs,setLogs]=useState({});
  const [processing,setProcessing]=useState(null);
  const [dragging,setDragging]=useState(false);
  const [cachedMap,setCachedMap]=useState({}); // {templateId: boolean}
  const fileRef=useRef();
  useEffect(()=>{
    try{const saved=JSON.parse(localStorage.getItem("sync_tpl_meta")||"[]");setTemplates(saved);}catch{}
  },[]);
  // Quét trạng thái cache của TẤT CẢ template mỗi khi danh sách thay đổi
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      const entries=await Promise.all(
        templates.map(async tpl=>[tpl.id, await idbHas("sync_b64_"+tpl.id)])
      );
      if(!cancelled) setCachedMap(Object.fromEntries(entries));
    })();
    return()=>{cancelled=true;};
  },[templates]);
  const saveMeta=(list)=>{
    try{
      const stripped=list.map(t=>{
        const copy={};
        Object.keys(t).forEach(k=>{if(k!=="base64")copy[k]=t[k];});
        return copy;
      });
      localStorage.setItem("sync_tpl_meta",JSON.stringify(stripped));
    }catch{}
  };
  const uploadTemplate=(file)=>{
    if(!file||!/\.xlsx?$/i.test(file.name)){toast("Vui lòng chọn file .xlsx","error");return;}
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const b64raw=e.target.result.split(",")[1];
        const wb=XLSX.read(b64raw,{type:"base64",cellStyles:true,cellDates:true,cellNF:true});
        const type=detectTemplateType(wb);
        // ── CHUẨN HÓA TEMPLATE: font TNR, border header, fill chuẩn ──
        normalizeTemplate(wb);
        const b64=XLSX.write(wb,{type:"base64",bookType:"xlsx",cellStyles:true});
        const id="t"+Date.now();
        idbSet("sync_b64_"+id,b64)
          .then(()=>setCachedMap(p=>({...p,[id]:true})))
          .catch(e=>toast("Lỗi lưu cache: "+e.message,"error"));
        setTemplates(prev=>{
          const next=[...prev.filter(t=>t.type!==type||type==="unknown"),
            {id,name:file.name,type,size:Math.round(b64.length/1024),
             uploadedAt:new Date().toISOString(),sheets:wb.SheetNames,normalized:true}];
          saveMeta(next);return next;
        });
        toast("✅ "+( TPL_META[type]?.label||type)+" · "+wb.SheetNames.length+" sheet · ✨ Đã chuẩn hóa","success");
      }catch(err){toast("Lỗi đọc file: "+err.message,"error");}
    };reader.readAsDataURL(file);

  const removeTemplate=(id)=>{
    setTemplates(prev=>{const next=prev.filter(t=>t.id!==id);saveMeta(next);return next;});
    idbDel("sync_b64_"+id).then(()=>setCachedMap(p=>{const n={...p};delete n[id];return n;})).catch(()=>{});

        <div className="btn-grp">
          {templates.filter(t=>t.type!=="unknown").length>0&&<button className="btn btn-green" onClick={fillAll} disabled={!!processing}>⚡ Điền tất cả ({templates.filter(t=>t.type!=="unknown").length} file)</button>}
          <button className="btn btn-primary" onClick={()=>fileRef.current?.click()}>📁 Tải lên template</button>

      <div className="card" style={{marginBottom:14}}>

        <div style={{padding:"12px 16px",display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>

            <div key={k} style={{display:"flex",gap:7,alignItems:"center"}}>
              <label style={{fontSize:12,fontWeight:600,color:"#555"}}>{lbl}</label>
              <DateInputVN value={dr[k]||""} onChange={v=>setDr(p=>({...p,[k]:v}))} style={{width:155,padding:"6px 9px",border:"1.5px solid #d0d7e8",borderRadius:8,fontSize:12,background:"#f8fafd",boxSizing:"border-box"}}/>
            </div>

          </div>
          <div style={{display:"flex",gap:5}}>

// ── CloudSyncIndicator ───────────────────────────────────────
// Nút hiển thị trạng thái đồng bộ dữ liệu với Firebase (cloud), cập nhật theo
// thời gian thực (poll mỗi giây) từ window.__cloudSync do window.storage ghi lại.
// Bấm vào nút sẽ chuyển tới trang "Cấu hình hệ thống" để xem/khắc phục chi tiết.
function CloudSyncIndicator({onGoToSettings}){
  const [tick,setTick]=useState(0);
  useEffect(()=>{
    const id=setInterval(()=>setTick(t=>t+1),1000);
    return()=>clearInterval(id);
  },[]);
  const configured=!!_fbDb;
  const s=window.__cloudSync||{status:"idle",lastSyncAt:null,lastError:null,pendingCount:0};
  const authPending=configured&&!_fbAuthOk&&(_fbAuth!=null);

  let color,bg,border,icon,label;
  if(!configured){
    color="#64748b";bg="#f1f5f9";border="#e2e8f0";icon="☁️";label="Chưa kết nối Cloud";
  }else if(s.status==="offline"||s.pendingCount>0){
    color="#c2410c";bg="#fff7ed";border="#fed7aa";icon="📴";
    label=`Mất mạng – ${s.pendingCount||0} thay đổi chờ đồng bộ`;
  }else if(s.status==="syncing"){
    color="#c2410c";bg="#fff7ed";border="#fed7aa";icon="🔄";label="Đang đồng bộ...";
  }else if(s.status==="error"){
    color="#dc2626";bg="#fef2f2";border="#fecaca";icon="⚠️";label="Lỗi đồng bộ Cloud";
  }else if(authPending){
    color="#dc2626";bg="#fef2f2";border="#fecaca";icon="⚠️";label="Chưa đăng nhập Cloud";
  }else{
    color="#16a34a";bg="#f0fdf4";border="#bbf7d0";icon="☁️";label="Đã đồng bộ Cloud";
  }

  const agoText=(()=>{
    if(!s.lastSyncAt)return"";
    const sec=Math.max(0,Math.round((Date.now()-s.lastSyncAt)/1000));
    if(sec<5)return"vừa xong";
    if(sec<60)return`${sec} giây trước`;
    const min=Math.round(sec/60);
    if(min<60)return`${min} phút trước`;
    const hr=Math.round(min/60);
    return`${hr} giờ trước`;
  })();

  const tooltip=!configured
    ? "Chưa cấu hình Firebase — dữ liệu chỉ đang lưu trên trình duyệt này.\nBấm để vào Cấu hình hệ thống."
    : (s.status==="offline"||s.pendingCount>0)
      ? `Đang mất kết nối mạng. Dữ liệu vẫn được lưu tạm trên máy (và ra file backup nếu đã gắn) —\nsẽ TỰ ĐỘNG đồng bộ lên Cloud ngay khi có mạng trở lại, không cần thao tác gì thêm.`
      : s.status==="error"
        ? `Lần đồng bộ gần nhất bị lỗi: ${s.lastError||"không rõ nguyên nhân"}\nBấm để kiểm tra lại.`
        : authPending
          ? "Đã kết nối Firestore nhưng CHƯA đăng nhập được tài khoản dùng chung.\nBấm để kiểm tra lại."
          : `Dữ liệu đang được đồng bộ với Firebase.${agoText?"\nLần ghi gần nhất: "+agoText:""}`;

  return(
    <button onClick={onGoToSettings} title={tooltip}
      style={{display:"flex",alignItems:"center",gap:6,padding:"5px 11px",
        background:bg,borderRadius:8,border:`1.5px solid ${border}`,cursor:"pointer",flexShrink:0}}>
      <span style={{fontSize:14}}>{icon}</span>
      <span style={{fontSize:11.5,fontWeight:700,color}}>{label}</span>
      {configured&&s.status==="idle"&&s.pendingCount===0&&agoText&&
        <span style={{fontSize:10,color:"#94a3b8",fontWeight:600}}>· {agoText}</span>}
    </button>
  );
}

// ── StorageIndicator ─────────────────────────────────────────
function StorageIndicator(){
  const [kb,setKb]=useState(0);
  useEffect(()=>{
    const update=()=>setKb(getStorageUsage());
    update();
    const id=setInterval(update,8000);
    return()=>clearInterval(id);
  },[]);
  const MAX=4800;
  const pctUsed=Math.min(100,Math.round(kb/MAX*100));
  const color=pctUsed>80?"#ef4444":pctUsed>60?"#f97316":"#22c55e";
  const label=pctUsed>80?"Sắp đầy":pctUsed>60?"Khá đầy":"Bình thường";
  return(
    <div title={`Bộ nhớ: ${kb} KB / ${MAX} KB (${pctUsed}%)
${label}`}
      style={{display:"flex",alignItems:"center",gap:7,padding:"5px 11px",
        background:"#f8faff",borderRadius:8,border:"1.5px solid #e2e8f0",cursor:"default",flexShrink:0}}>
      <div style={{display:"flex",flexDirection:"column",gap:3}}>
        <div style={{width:48,height:4,background:"#e2e8f0",borderRadius:2,overflow:"hidden"}}>
          <div style={{width:pctUsed+"%",height:"100%",background:color,borderRadius:2,transition:"width .5s"}}/>
        </div>
        <span style={{fontSize:10,color:"#94a3b8",fontWeight:600,textAlign:"center"}}>{kb} KB</span>
      </div>
      <span style={{fontSize:18,lineHeight:1}}>{pctUsed>80?"🔴":pctUsed>60?"🟡":"🟢"}</span>
    </div>
  );
}


// ── Alert Bell + Panel ────────────────────────────────────────
function AlertPanel({data,onClose,onNavigate}){
  const [tab,setTab]=useState("all");
  const [warnDays,setWarnDays]=useState(()=>{
    try{return parseInt(localStorage.getItem("alert_warn_days")||"30");}catch{return 30;}
  });
  const saveWarnDays=(v)=>{setWarnDays(v);try{localStorage.setItem("alert_warn_days",String(v));}catch{}};

  const all=collectAlerts(data,warnDays);
  const expired=all.filter(a=>a.daysLeft<=0);
  const critical=all.filter(a=>a.daysLeft>0&&a.daysLeft<=7);
  const warning=all.filter(a=>a.daysLeft>7&&a.daysLeft<=15);
  const soon=all.filter(a=>a.daysLeft>15&&a.daysLeft<=warnDays);
  const tabs=[
    {id:"all",lbl:`Tất cả (${all.length})`},
    {id:"expired",lbl:`🔴 Hết hạn (${expired.length})`},
    {id:"critical",lbl:`🟠 Khẩn (${critical.length})`},
    {id:"warning",lbl:`🟡 Sắp hết (${warning.length})`},
  ];
  const shown={all,expired,critical,warning,soon}[tab]||all;
  const groupIcons={su_dung:"💊",nghien:"⚕️",sau_cai:"🏠",hd26_dt:"🔍"};
  const groupNames={su_dung:"SD TPCMT",nghien:"Nghiện",sau_cai:"Sau cai",hd26_dt:"HD26"};
  const groupNavId={su_dung:"su_dung",nghien:"nghien",sau_cai:"sau_cai",hd26_dt:"hd26_dt"};

  return(
    <div className="alert-panel">
      <div className="alert-panel-hd">
        <span style={{fontSize:22}}>🔔</span>
        <h3>Cảnh báo sắp hết hạn quản lý</h3>
        <button className="ap-close" onClick={onClose}>✕</button>
      </div>

      {/* Settings */}
      <div className="alert-settings">
        <label>Cảnh báo trước: <b style={{color:"#ef4444"}}>{warnDays} ngày</b></label>
        <div className="range-row">
          <span style={{fontSize:11,color:"var(--muted)"}}>7</span>
          <input type="range" min="7" max="90" step="1" value={warnDays}
            onChange={e=>saveWarnDays(parseInt(e.target.value))}/>
          <span style={{fontSize:11,color:"var(--muted)"}}>90</span>
        </div>
        <div style={{display:"flex",gap:5,marginTop:6}}>
          {[7,15,30,45,60].map(d=>(
            <button key={d} onClick={()=>saveWarnDays(d)}
              style={{padding:"2px 9px",borderRadius:6,border:"1.5px solid "+(d===warnDays?"#ef4444":"var(--border)"),
                background:d===warnDays?"#fee2e2":"#fff",color:d===warnDays?"#ef4444":"var(--muted)",
                cursor:"pointer",fontSize:11.5,fontWeight:700,fontFamily:"inherit"}}>
              {d}n
            </button>
          ))}
        </div>
      </div>

      {/* Tabs */}
      <div className="alert-tabs">
        {tabs.map(t=>(
          <button key={t.id} className={"alert-tab"+(tab===t.id?" active":"")} onClick={()=>setTab(t.id)}>
            {t.lbl}
          </button>
        ))}
      </div>

      {/* Body */}
      <div className="alert-panel-body">
        {shown.length===0?(
          <div style={{textAlign:"center",padding:"40px 20px",color:"var(--muted)"}}>
            <div style={{fontSize:48,marginBottom:12}}>✅</div>
            <p style={{fontWeight:700,fontSize:14,marginBottom:4}}>Không có cảnh báo</p>
            <p style={{fontSize:12}}>Tất cả đối tượng còn hơn {warnDays} ngày</p>
          </div>
        ):shown.map((a,i)=>{
          const cls=a.daysLeft<=0?"alert-item-expired":a.daysLeft<=7?"alert-item-critical":a.daysLeft<=15?"alert-item-warning":"alert-item-soon";
          const dayColor=a.daysLeft<=0?"#ef4444":a.daysLeft<=7?"#f97316":a.daysLeft<=15?"#eab308":"#22c55e";
          const dayText=a.daysLeft<=0?`Đã hết hạn ${Math.abs(a.daysLeft)} ngày trước`:a.daysLeft===0?"HẾT HẠN HÔM NAY":`Còn ${a.daysLeft} ngày`;
          const urgencyIcon=a.daysLeft<=0?"🔴":a.daysLeft<=7?"🟠":a.daysLeft<=15?"🟡":"🟢";
          return(
            <div key={a._id+"_"+i} className={`alert-item ${cls}`}>
              <div className="alert-item-header">

function AlertBell({data,onNavigate}){
  const [open,setOpen]=useState(false);
  const [warnDays,setWarnDays]=useState(()=>{
    try{return parseInt(localStorage.getItem("alert_warn_days")||"30");}catch{return 30;}
  });
  const [ringing,setRinging]=useState(false);
  const btnRef=useRef();

  // Recheck every time warnDays changes from panel
  const checkWarnDays=()=>{
    try{return parseInt(localStorage.getItem("alert_warn_days")||"30");}catch{return 30;}
  };

  const count=collectAlerts(data,checkWarnDays()).length;
  const hasUrgent=collectAlerts(data,7).length>0;

  // Ring bell if there are urgent items
  useEffect(()=>{
    if(hasUrgent){setRinging(true);setTimeout(()=>setRinging(false),700);}
  },[hasUrgent]);

  // Click outside to close
  useEffect(()=>{
    if(!open)return;
    const handler=(e)=>{
      if(btnRef.current&&!btnRef.current.contains(e.target)){
        // Check if click is inside alert panel
        const panel=document.querySelector(".alert-panel");
        if(panel&&panel.contains(e.target))return;
        setOpen(false);
      }
    };
    document.addEventListener("mousedown",handler);
    return()=>document.removeEventListener("mousedown",handler);
  },[open]);

  return(
    <>
      <div ref={btnRef} className={"alert-bell"+(ringing?" ringing":"")}
        onClick={()=>setOpen(o=>!o)}
        title={count>0?`${count} cảnh báo sắp hết hạn`:"Không có cảnh báo"}>
        <span style={{fontSize:18}}>{count>0?"🔔":"🔕"}</span>
        {count>0&&<span className="bell-badge">{count>99?"99+":count}</span>}
      </div>
      {open&&<AlertPanel data={data} onClose={()=>setOpen(false)} onNavigate={onNavigate}/>}
    </>
  );
}

// vào window.storage → tự động xóa sạch cả Firebase lẫn cache localStorage
// (theo đúng cơ chế set() hiện có: ghi đè Firebase + _lsClear key cũ)

function DaLoaiDataboardPage({doiTuong,setDoiTuong,toast}){

  const [delConfirmText,setDelConfirmText]=useState("");
  const [busy,setBusy]=useState(false);

  const loaiList=useMemo(()=>doiTuong.filter(r=>r.da_loai),[doiTuong]);

  const filtered=loaiList.filter(r=>{
    if(filterNhom!=="all"&&!(r.nhom||[]).includes(filterNhom))return false;
    return matchesNguoiSearch(r,search);
  }).sort((a,b)=>new Date(b.ngay_loai||0)-new Date(a.ngay_loai||0));

  const groupCounts=NHOM_LIST.map(n=>({...n,n:loaiList.filter(r=>(r.nhom||[]).includes(n.id)).length}));

  const restore=async(rec)=>{
    const next=doiTuong.map(r=>r._id===rec._id?{...r,da_loai:false,ngay_loai:"",ly_do_loai:"",ghi_chu_loai:""}:r);
    try{await saveStore(KEYS.doi_tuong,next);setDoiTuong(next);toast("Đã phục hồi đối tượng","success");}
    catch(e){toast("❌ Lỗi phục hồi: "+e.message,"error");}
  };

  const hardDelete=async()=>{
    if(!delRec)return;
    setBusy(true);
    const next=doiTuong.filter(r=>r._id!==delRec._id);
    try{
      // Ghi đè toàn bộ danh sách (không còn bản ghi này) lên Firebase + xóa cache localStorage tương ứng
      await saveStore(KEYS.doi_tuong,next);
      setDoiTuong(next);
      setDelRec(null);setDelConfirmText("");
      toast("🗑️ Đã xóa vĩnh viễn khỏi hệ thống (Firebase + bộ nhớ đệm trình duyệt)","success");
