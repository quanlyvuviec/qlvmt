<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="light"/>
<title>Quản lý Ma túy – Công an phường Tân Bình</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/pizzip@3.1.7/dist/pizzip.js"></script>
<script src="https://unpkg.com/docxtemplater@3.50.0/js/docxtemplater.js"></script>
<style>
/* Dùng phông có sẵn của hệ điều hành – không tải phông từ Internet để chạy được offline */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;font-family:'Inter','Segoe UI',system-ui,-apple-system,'Roboto','Helvetica Neue',Arial,sans-serif;font-size:13.5px}
body{background:#f0f2f8;color:#1a2340}
:root{
  color-scheme:light;
  /* Brand */
  --navy:#0c1b4d;--navy2:#152158;--navy3:#1e2d6b;
  --accent:#3b5bdb;--accent2:#4c6ef5;
  /* Groups */
  --g-sd:#d32f2f;--g-sd-bg:#fff5f5;--g-sd-light:#ffcdd2;
  --g-ng:#e65100;--g-ng-bg:#fff8f0;--g-ng-light:#ffe0b2;
  --g-sc:#1565c0;--g-sc-bg:#f0f6ff;--g-sc-light:#bbdefb;
  --g-vp:#6a1b9a;--g-vp-bg:#f8f0ff;--g-vp-light:#e1bee7;
  --g-nv:#00838f;--g-nv-bg:#e0f7fa;--g-nv-light:#80deea;
  --g-st:#5d4037;--g-st-bg:#efebe9;--g-st-light:#bcaaa4;
  --g-vu:#b71c1c;--g-vu-bg:#fff0f0;--g-vu-light:#ffcdd2;
  --g-bn:#00695c;--g-bn-bg:#f0faf8;--g-bn-light:#b2dfdb;
  --g-dtc:#bf360c;--g-dtc-bg:#fff3f0;--g-dtc-light:#ffccbc;
  --g-hd26:#283593;--g-hd26-bg:#f0f3ff;--g-hd26-light:#c5cae9;
  /* UI */
  --green:#2e7d32;--red:#c62828;--orange:#e65100;--gold:#f59f00;
  --bg:#f0f2f8;--card:#ffffff;--card2:#f8f9fe;
  --border:#e2e8f0;--border2:#cbd5e1;
  --text:#1a2340;--text2:#334155;--muted:#64748b;--muted2:#94a3b8;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.08);
  --sidebar-w:234px;
  --radius:10px;--radius-sm:7px;--radius-lg:14px;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* ── LAYOUT ── */
#root{display:flex;height:100%}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  background:linear-gradient(180deg,#0c1b4d 0%,#0f2060 60%,#112272 100%);
  display:flex;flex-direction:column;overflow-y:auto;z-index:100;
  box-shadow:3px 0 16px rgba(0,0,0,.18);
}
.sidebar-logo{
  padding:16px 14px 14px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 100%);
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.sidebar-logo .logo-cand{
  width:56px;height:56px;margin-bottom:9px;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));
}
.sidebar-logo h1{color:#fff;font-size:12px;font-weight:700;line-height:1.4;letter-spacing:.2px}
.sidebar-logo .logo-cap-tren{color:rgba(255,255,255,.75);font-size:10.5px;font-weight:600;margin-bottom:2px}
.sidebar-logo p{color:rgba(255,255,255,.45);font-size:10px;margin-top:2px}
.sidebar-logo .version-tag{
  display:inline-block;margin-top:8px;padding:2px 8px;
  background:linear-gradient(135deg,#3b5bdb,#4c6ef5);
  color:#fff;border-radius:20px;font-size:9.5px;font-weight:700;letter-spacing:.5px;
}
.sidebar-section{padding:6px 0}
.sidebar-section-title{
  padding:8px 18px 4px;color:rgba(255,255,255,.28);
  font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;
  color:rgba(255,255,255,.62);font-size:12.5px;font-weight:500;
  transition:all .18s;border-left:3px solid transparent;margin:1px 0;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{
  background:rgba(59,91,219,.22);color:#fff;border-left-color:#60a5fa;
  font-weight:600;
}
.nav-item .ni-icon{
  width:28px;height:28px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:14px;flex-shrink:0;
  background:rgba(255,255,255,.08);transition:all .18s;
}
.nav-item.active .ni-icon{background:rgba(96,165,250,.2);}
.nav-item:hover .ni-icon{background:rgba(255,255,255,.12);}
.nav-item .ni-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .ni-count{
  font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;
  background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);flex-shrink:0;
}
.nav-item.active .ni-count{background:rgba(96,165,250,.3);color:#bfdbfe}

/* Cảnh báo hết hạn: nhấp nháy để thu hút chú ý khi đang có cảnh báo (count>0) */
.nav-item .ni-count.ni-count-alert{
  background:#ef4444;color:#fff;
  animation:alertBadgePulse 1.4s ease-in-out infinite;
}
.nav-item .ni-icon.ni-icon-alert{
  animation:alertIconPulse 1.4s ease-in-out infinite;
}
@keyframes alertBadgePulse{
  0%,100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 rgba(239,68,68,.55);}
  50%{opacity:.9;transform:scale(1.18);box-shadow:0 0 0 5px rgba(239,68,68,0);}
}
@keyframes alertIconPulse{
  0%,100%{background:rgba(239,68,68,.18);}
  50%{background:rgba(239,68,68,.5);}
}

.sidebar-divider{height:1px;background:rgba(255,255,255,.06);margin:6px 18px}

.sidebar-filter{padding:10px 14px 14px}
.sidebar-filter label{color:rgba(255,255,255,.35);font-size:9.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:6px}
.sidebar-date-input{
  width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:6px;padding:5px 8px;color:rgba(255,255,255,.8);font-size:11px;
  margin-bottom:5px;font-family:inherit;
}
.sidebar-date-input:focus{outline:none;border-color:rgba(96,165,250,.5);background:rgba(255,255,255,.1)}
.sidebar-clear-btn{
  width:100%;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);
  border-radius:6px;color:rgba(255,255,255,.65);padding:4px 8px;cursor:pointer;
  font-size:10.5px;font-weight:600;font-family:inherit;
}
.sidebar-clear-btn:hover{background:rgba(239,68,68,.25)}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── TOPBAR ── */
.topbar{
  background:#fff;border-bottom:1px solid var(--border);
  padding:8px 24px;display:flex;align-items:center;gap:12px;
  flex-shrink:0;min-height:58px;
  box-shadow:0 1px 0 var(--border),0 2px 8px rgba(0,0,0,.03);
}
.topbar-title{flex:1;min-width:0}
.topbar-title h2{font-size:15.5px;font-weight:700;color:var(--navy);white-space:normal;overflow-wrap:break-word;line-height:1.3}
.topbar-title p{font-size:11px;color:var(--muted);margin-top:1px}
.topbar-actions{display:flex;align-items:center;gap:8px}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;padding:20px 24px;background:var(--bg)}

/* ── PAGE HEADER ── */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.page-title{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
.page-sub{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:8px}

/* ── CARDS ── */
.card{
  background:var(--card);border-radius:var(--radius-lg);
  border:1px solid var(--border);overflow:hidden;
  box-shadow:var(--shadow);
}
.card-hd{
  padding:13px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,#f8f9fe 0%,#ffffff 100%);
}
.card-hd h3{font-size:13px;font-weight:700;color:var(--navy)}

/* ── GROUP COLOR CARDS ── */
.group-card-sd{border-top:3px solid var(--g-sd)}
.group-card-ng{border-top:3px solid var(--g-ng)}
.group-card-sc{border-top:3px solid var(--g-sc)}
.group-card-vp{border-top:3px solid var(--g-vp)}
.group-card-vu{border-top:3px solid var(--g-vu)}

/* ── STATS GRID ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.stat-card{
  background:var(--card);border-radius:var(--radius-lg);border:1px solid var(--border);
  padding:16px 18px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;
  position:relative;overflow:hidden;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
}
.stat-card-sd::before{background:linear-gradient(90deg,var(--g-sd),#ef5350)}
.stat-card-ng::before{background:linear-gradient(90deg,var(--g-ng),#ff9800)}
.stat-card-sc::before{background:linear-gradient(90deg,var(--g-sc),#1976d2)}
.stat-card-vp::before{background:linear-gradient(90deg,var(--g-vp),#9c27b0)}
.stat-card-vu::before{background:linear-gradient(90deg,var(--g-vu),#e53935)}
.stat-card-total::before{background:linear-gradient(90deg,var(--navy),var(--accent))}.stat-card-nv::before{background:linear-gradient(90deg,var(--g-nv),#00acc1)}.stat-card-st::before{background:linear-gradient(90deg,var(--g-st),#8d6e63)}
.stat-card .sc-icon{font-size:28px;margin-bottom:8px}
.stat-card .sc-val{font-size:30px;font-weight:800;line-height:1;letter-spacing:-1px}
.stat-card .sc-lbl{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px;text-transform:uppercase;letter-spacing:.4px}
.stat-card .sc-sub{font-size:10.5px;color:var(--muted2);margin-top:4px}
.stat-card .sc-trend{
  position:absolute;bottom:12px;right:14px;
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;
}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;max-height:62vh}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{position:sticky;top:0;z-index:10}
th{
  background:linear-gradient(135deg,#0c1b4d 0%,#152158 100%);
  color:rgba(255,255,255,.9);padding:9px 11px;text-align:center;
  white-space:nowrap;font-weight:600;font-size:11px;
  border-right:1px solid rgba(255,255,255,.08);
}
th:last-child{border-right:none}
td{
  padding:8px 11px;border-bottom:1px solid #f1f5f9;
  color:var(--text2);vertical-align:middle;font-size:12.5px;
}
tbody tr{transition:background .1s}
tbody tr:hover td{background:#f8faff}
tbody tr:nth-child(even) td{background:#fafbfe}
tbody tr:nth-child(even):hover td{background:#f0f4ff}
tr.da-loai td{color:#94a3b8;font-style:italic;background:#fafafa!important}
tr.da-loai:hover td{background:#f5f5f5!important}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.2px}
.badge-green{background:#dcfce7;color:#166534}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-orange{background:#ffedd5;color:#9a3412}
.badge-gray{background:#f1f5f9;color:#475569}
.badge-purple{background:#f3e8ff;color:#6b21a8}
.badge-teal{background:#ccfbf1;color:#0f766e}
.badge-yellow{background:#fef9c3;color:#854d0e}
.badge-navy{background:#eff6ff;color:#1e3a8a}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
  border-radius:8px;border:none;cursor:pointer;font-size:12.5px;font-weight:600;
  transition:all .15s;white-space:nowrap;letter-spacing:.1px;font-family:inherit;
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{
  background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;
  box-shadow:0 2px 8px rgba(12,27,77,.25);
}
.btn-primary:hover:not(:disabled){background:linear-gradient(135deg,var(--navy3),#2a3e8a);transform:translateY(-1px);box-shadow:0 4px 12px rgba(12,27,77,.3)}
.btn-red{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;box-shadow:0 2px 6px rgba(220,38,38,.25)}
.btn-red:hover:not(:disabled){background:linear-gradient(135deg,#b91c1c,#991b1b);transform:translateY(-1px)}
.btn-green{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;box-shadow:0 2px 6px rgba(22,163,74,.25)}
.btn-green:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 10px rgba(22,163,74,.3)}
.btn-blue{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.25)}
.btn-blue:hover:not(:disabled){transform:translateY(-1px)}
.btn-orange{background:linear-gradient(135deg,#ea580c,#c2410c);color:#fff;box-shadow:0 2px 6px rgba(234,88,12,.25)}
.btn-orange:hover:not(:disabled){transform:translateY(-1px)}
.btn-gold{background:linear-gradient(135deg,#d97706,#b45309);color:#fff}
.btn-ghost{background:#fff;border:1.5px solid var(--border);color:var(--text2);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.btn-ghost:hover:not(:disabled){background:#f8faff;border-color:var(--accent);color:var(--navy)}
.btn-sm{padding:5px 11px;font-size:11.5px;border-radius:6px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:5px}
.btn-icon{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:7px}
.btn-grp{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

/* ── ACTION BUTTONS IN TABLE ── */
.act-view{background:#f0fdf4;border:1.5px solid #bbf7d0;color:#15803d}.act-view:hover{background:#dcfce7;border-color:#86efac}.act-edit{background:#eff6ff;border:1.5px solid #bfdbfe;color:#1d4ed8}
.act-edit:hover{background:#dbeafe;border-color:#93c5fd}
.act-loai{background:#fff7ed;border:1.5px solid #fed7aa;color:#c2410c}
.act-loai:hover{background:#ffedd5;border-color:#fb923c}
.act-restore{background:#f0fdf4;border:1.5px solid #bbf7d0;color:#15803d}
.act-restore:hover{background:#dcfce7;border-color:#86efac}
.act-delete{background:#fff1f2;border:1.5px solid #fecdd3;color:#be123c}
.act-delete:hover{background:#ffe4e6;border-color:#fda4af}

/* ── FORM INPUTS ── */
.fi{
  width:100%;padding:8px 11px;border:1.5px solid #e2e8f0;border-radius:7px;
  font-size:13px;color:var(--text);background:#fff;transition:all .15s;
  font-family:inherit;
}
.fi:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,91,219,.1)}
.fi:hover:not(:focus){border-color:#cbd5e1}
.fi-err{border-color:#ef4444!important;background:#fef2f2!important}
.fi-err:focus{box-shadow:0 0 0 3px rgba(239,68,68,.12)!important}
select.fi{cursor:pointer;appearance:none}
textarea.fi{resize:vertical;min-height:60px;line-height:1.5}

/* ── SEARCH ── */
.srch-wrap{position:relative;display:inline-flex;align-items:center}
.srch{
  padding:7px 11px 7px 34px;border:1.5px solid var(--border);border-radius:8px;
  font-size:12.5px;width:220px;background:#f8faff;font-family:inherit;
  transition:all .15s;color:var(--text);
}
.srch:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(59,91,219,.1);width:260px}
.srch-icon{position:absolute;left:10px;color:var(--muted2);font-size:14px;pointer-events:none}

/* ── TAB BAR ── */
.tab-bar{
  display:flex;background:var(--card);border-radius:10px;
  border:1.5px solid var(--border);overflow:hidden;margin-bottom:12px;
  box-shadow:var(--shadow);
}
.tab-btn{
  flex:1;padding:10px 12px;border:none;cursor:pointer;font-size:12px;font-weight:600;
  background:transparent;color:var(--muted);border-bottom:3px solid transparent;
  transition:all .15s;font-family:inherit;
}
.tab-btn.active{background:linear-gradient(180deg,#f0f4ff,#e8eeff);color:var(--navy);border-bottom-color:var(--accent)}
.tab-btn:hover:not(.active){background:#f8f9fc;color:var(--text)}

/* ── PAGINATION ── */
.pag{display:flex;gap:5px;align-items:center;justify-content:space-between;padding:11px 16px;font-size:12px;color:var(--muted);background:#f8f9fe;border-top:1px solid var(--border)}
.pag-info{font-size:11.5px;color:var(--muted)}
.pag-btn{
  padding:4px 10px;border:1.5px solid var(--border);border-radius:6px;
  cursor:pointer;background:#fff;font-size:11.5px;color:var(--text2);
  font-family:inherit;transition:all .12s;
}
.pag-btn:hover{background:#f0f4ff;border-color:var(--accent);color:var(--accent)}
.pag-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.pag-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── TOAST ── */
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideOut{from{transform:translateY(0);opacity:1}to{transform:translateY(20px);opacity:0}}
.toast{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;
  color:#fff;box-shadow:var(--shadow-lg);animation:slideUp .25s ease;
  display:flex;align-items:center;gap:8px;max-width:360px;
}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(10,20,50,.6);backdrop-filter:blur(2px);
  display:flex;align-items:flex-start;justify-content:center;
  z-index:1000;overflow-y:auto;padding:16px;
}
.modal-box{
  background:#fff;border-radius:var(--radius-lg);width:min(980px,98vw);
  margin:auto;box-shadow:0 24px 64px rgba(0,0,0,.25);
  display:flex;flex-direction:column;max-height:95vh;
}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--border);margin:14px 0}

/* ── BACKUP ZONE ── */
.backup-zone{
  border:2px dashed #cbd5e1;border-radius:12px;padding:32px;
  text-align:center;cursor:pointer;transition:all .15s;background:#f8faff;
}
.backup-zone:hover,.backup-zone.drag{border-color:var(--accent);background:#eef2ff}

/* ── EXPORT GRID ── */
.export-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:12px}
.export-card{
  background:var(--card);border:1.5px solid var(--border);border-radius:12px;
  padding:14px 16px;display:flex;flex-direction:column;gap:8px;
  box-shadow:var(--shadow);transition:all .15s;
}
.export-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.export-card h4{font-size:13px;font-weight:700;color:var(--navy)}
.export-card p{font-size:11.5px;color:var(--muted);line-height:1.5}

/* ── ACTIONS ── */
.actions{display:flex;gap:4px;justify-content:center}

/* ── REPORT SECTION ── */

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useMemo}=React;

// ── Expiry Warning Helpers ────────────────────────────────────
// Parse "179-09/04/2025" → Date object from dd/mm/yyyy part
function parseDateFromQD(qdStr){
  if(!qdStr)return null;
  // Try format "SoQD-dd/mm/yyyy"
  const m=String(qdStr).match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(m)return new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
  // Try yyyy-mm-dd ISO
  const iso=String(qdStr).match(/(\d{4})-(\d{2})-(\d{2})/);
  if(iso)return new Date(iso[0]);
  return null;
}
// Parse duration string → days (e.g. "1 năm"→365, "2 năm"→730, "6 tháng"→180, "18 tháng"→540)
function parseDurationDays(durStr){
  if(!durStr)return null;
  const s=String(durStr).toLowerCase().trim();
  const nam=s.match(/(\d+(?:[,.]\d+)?)\s*(năm|nam)/);
  if(nam)return Math.round(parseFloat(nam[1].replace(",","."))*365);
  const thang=s.match(/(\d+(?:[,.]\d+)?)\s*(tháng|thang)/);
  if(thang)return Math.round(parseFloat(thang[1].replace(",","."))*30);
  const tuan=s.match(/(\d+)\s*(tuần|tuan)/);
  if(tuan)return parseInt(tuan[1])*7;
  const ngay=s.match(/(\d+)\s*(ngày|ngay)/);
  if(ngay)return parseInt(ngay[1]);
  return null;
}
// Calculate days remaining until expiry
function calcDaysLeft(startDate,durationDays){
  if(!startDate||!durationDays)return null;
  const expiry=new Date(startDate);
  expiry.setDate(expiry.getDate()+durationDays);
  const today=new Date();today.setHours(0,0,0,0);
  const diff=Math.round((expiry-today)/(1000*60*60*24));
  return{expiry,daysLeft:diff};
}
// Collect all expiry alerts from all groups
// Tính hạn quản lý sưu tra (Loại A: 1-2 năm theo số tiền án, Loại B: 6 tháng), dùng chung
// cho trang Cảnh báo và cột "Cảnh báo"/"Trạng thái" trong bảng danh sách sưu tra.
function calcSuuTraExpiry(r){
  if(!r.ngay_lap_hs_st||!r.loai_st)return null;
  const start=new Date(r.ngay_lap_hs_st);
  if(isNaN(start.getTime()))return null;
  const loaiVal=dv(r,"loai_st");
  let months=null,label="";
  if(loaiVal.startsWith("Loại A")){
    const soTienAn=(r.tien_an_st||"").split("\n").filter(l=>l.trim().startsWith("-")).length;
    const years=soTienAn>=2?2:1;
    months=years*12;
    label=`Loại A (tối đa ${years} năm – ${soTienAn} tiền án)`;
  }else if(loaiVal.startsWith("Loại B")){
    months=6;
    label="Loại B (tối đa 6 tháng)";
  }
  if(!months)return null;
  const expiry=new Date(start);expiry.setMonth(expiry.getMonth()+months);expiry.setHours(0,0,0,0);
  const now=new Date();now.setHours(0,0,0,0);
  const daysLeft=Math.round((expiry-now)/(1000*60*60*24));
  return{months,label,expiry,daysLeft};
}

function collectAlerts(data,warnDays){
  const alerts=[];
  const now=new Date();now.setHours(0,0,0,0);

  // Helper to push alert
  const push=(r,group,icon,qd_so,qd_tg,startFallback,label)=>{
    // Try parse start date from QD number first, then fallback
    let start=parseDateFromQD(qd_so)||startFallback;
    const dur=parseDurationDays(qd_tg);
    if(!start||!dur)return;
    const res=calcDaysLeft(start,dur);
    if(!res)return;
    const{expiry,daysLeft}=res;
    if(daysLeft<=warnDays){
      alerts.push({
        _id:r._id,name:r.ho_ten||r.ten_bang_nhom||r.ten_dia_chi||"?",
        group,icon,label,
        qd_so:qd_so||"",qd_tg:qd_tg||"",
        startDate:start,expiry,daysLeft,
        cccd:r.cccd||"",hktt:r.hktt||"",
      });
    }
  };

  // SD – QĐ quản lý
  (data.su_dung||[]).filter(r=>!r.da_loai).forEach(r=>{
    const fb=r.ngay_vao_so?new Date(r.ngay_vao_so):null;
    push(r,"su_dung","💊",r.qd_ql_so,r.qd_ql_tg,fb,"QĐ Quản lý SD");
    push(r,"su_dung","📋",r.qd_xlhc_so,r.qd_xlhc_tg,fb,"QĐ XLHC");
  });
  // NG – QĐ quản lý (dùng ngay_vao_so nếu không có QĐ số)
  (data.nghien||[]).filter(r=>!r.da_loai).forEach(r=>{
    const fb=r.ngay_vao_so?new Date(r.ngay_vao_so):null;
    push(r,"nghien","⚕️",r.qd_ql_so,r.qd_ql_tg,fb,"QĐ Quản lý Nghiện");
  });
  // SC – QĐ quản lý sau cai
  (data.sau_cai||[]).filter(r=>!r.da_loai).forEach(r=>{
    const fb=r.ngay_vao_so?new Date(r.ngay_vao_so):null;
    push(r,"sau_cai","🏠",r.qd_sau_cai_so,r.qd_sau_cai_th,fb,"QĐ Quản lý Sau cai");
  });
  // HD26 – hạn đấu tranh
  (data.hd26_dt||[]).filter(r=>!r.da_loai).forEach(r=>{
    if(r.han_dau_tranh){
      const expiry=new Date(r.han_dau_tranh);expiry.setHours(0,0,0,0);
      const daysLeft=Math.round((expiry-now)/(1000*60*60*24));
      if(daysLeft<=warnDays){
        alerts.push({
          _id:r._id,name:r.ho_ten_ten_diem||"?",
          group:"hd26_dt",icon:"🔍",label:"Hạn đấu tranh HĐ26",
          qd_so:"",qd_tg:"",startDate:null,expiry,daysLeft,
          cccd:"",hktt:r.dia_chi||"",
        });
      }
    }
  });
  // Sưu tra – hạn theo Loại A/B, tính từ Ngày lập hồ sơ (ngay_lap_hs_st)
  // Loại A: 1 năm nếu Tiền án có 1 gạch đầu dòng, 2 năm nếu có ≥2 gạch đầu dòng
  // Loại B: tối đa 6 tháng, phải cảnh báo chuyển Loại A hoặc kết thúc
  (data.suu_tra||[]).filter(r=>!r.da_loai&&!r.so_nop_luu).forEach(r=>{
    const calc=calcSuuTraExpiry(r);
    if(!calc)return;
    if(calc.daysLeft<=warnDays){
      alerts.push({
        _id:r._id,name:r.ho_ten||"?",
        group:"suu_tra",icon:"📂",label:"Sưu tra "+calc.label,
        qd_so:r.so_ho_so_suu_tra||"",qd_tg:calc.months+" tháng",
        startDate:new Date(r.ngay_lap_hs_st),expiry:calc.expiry,daysLeft:calc.daysLeft,
        cccd:r.cccd||"",hktt:r.hktt||"",
      });
    }
  });
  // Sort: expired first, then by daysLeft ascending
  alerts.sort((a,b)=>a.daysLeft-b.daysLeft);
  return alerts;
}

// ══════════════════════════════════════════════════════════════
// CẤU HÌNH HỆ THỐNG – lưu/đọc từ localStorage
// ══════════════════════════════════════════════════════════════
const SYS_CFG_KEY="sys:config_v1";
function loadSysCfg(){
  try{const s=localStorage.getItem(SYS_CFG_KEY);return s?JSON.parse(s):{};}catch{return{};}
}
function saveSysCfg(cfg){
  localStorage.setItem(SYS_CFG_KEY,JSON.stringify(cfg));
  // Đồng bộ thêm cấu hình hệ thống (gồm cấu hình Firebase) ra file JSON cục bộ
  // và lên Firebase (nếu đã kết nối) — best-effort, KHÔNG chặn luồng lưu chính.
  // QUAN TRỌNG: ghi TRỰC TIẾP qua _fbDb (không qua window.storage.set), vì
  // window.storage.set() sẽ tự động XÓA bản localStorage sau khi ghi Firebase
  // xong (đúng cho dữ liệu nghiệp vụ thông thường, nhưng sys:config_v1 là
  // ngoại lệ — đây là bản DUY NHẤT được loadSysCfg() đọc để khởi tạo kết nối
  // Firebase ở lần tải trang kế tiếp; xóa nó đi sẽ khiến app "quên" cấu hình
  // Firebase ngay sau khi reload).
  try{
    const json=JSON.stringify(cfg);
    if(typeof _trackForLocalSync==="function")_trackForLocalSync(SYS_CFG_KEY,json);
    if(_fbDb){
      Promise.resolve(_fbAuthReady).then(()=>
        _fbDb.collection(COL).doc(encodeKey(SYS_CFG_KEY)).set({v:json,_t:Date.now()})
      ).catch(e=>console.warn("Đồng bộ cấu hình hệ thống lên Firebase thất bại:",e.message));
    }
  }catch(e){console.warn("Lỗi đồng bộ cấu hình hệ thống:",e);}
}

// ══════════════════════════════════════════════════════════════
// FIREBASE STORAGE ADAPTER
// window.storage: ưu tiên Firebase nếu đã cấu hình, fallback localStorage
// ══════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════
// FIREBASE STORAGE ADAPTER
// Nguyên tắc: khi Firebase đã kết nối → CHỈ dùng Firebase.
// Không fallback localStorage để tránh dữ liệu cũ "hồi sinh" sau khi xóa.
// localStorage CHỈ dùng khi chưa cấu hình Firebase.
// ══════════════════════════════════════════════════════════════
let _fbApp=null,_fbDb=null,_fbAuth=null;
// Promise đại diện cho "đã thử đăng nhập Firebase Auth xong" (thành công hay
// thất bại đều resolve, không bao giờ bị treo mãi). window.storage sẽ luôn
// chờ Promise này trước khi gọi Firestore, để tránh lỗi permission-denied do
// gọi Firestore trước khi kịp đăng nhập (Rules yêu cầu request.auth != null).
let _fbAuthReady=Promise.resolve(false);
let _fbAuthOk=false; // trạng thái đăng nhập gần nhất, hiển thị lên UI Cấu hình

function initFirebase(cfg){
  if(!cfg||!cfg.apiKey||!cfg.projectId)return false;
  try{
    // Kiểm tra xem app đã init chưa (tránh duplicate-app error)
    try{_fbApp=firebase.app("cand_app");}
    catch{_fbApp=firebase.initializeApp(cfg,"cand_app");}
    _fbDb=firebase.firestore(_fbApp);
    _fbAuth=firebase.auth(_fbApp);
    // Bật cache ngoại tuyến (IndexedDB) để app vẫn đọc/ghi được dữ liệu khi
    // mất mạng, và tự động đồng bộ lại khi có mạng trở lại. Nếu KHÔNG bật,
    // mọi lượt đọc lúc mất mạng sẽ báo lỗi → ứng dụng hiểu nhầm là "chưa có
    // dữ liệu" và có nguy cơ ghi đè mất dữ liệu thật (xem migrateToUnified).
    try{
      _fbDb.enablePersistence({synchronizeTabs:true}).catch(err=>{
        // failed-precondition: đang mở nhiều tab cùng lúc (bình thường, bỏ qua)
        // unimplemented: trình duyệt không hỗ trợ (Safari cũ, chế độ ẩn danh...)
        console.warn("Không bật được cache ngoại tuyến Firestore:",err&&err.code);
      });
    }catch(e){console.warn("enablePersistence lỗi:",e);}
    // ── Đăng nhập Firebase Auth bằng tài khoản dùng chung (Phương án A) ──
    // Firestore Security Rules chuẩn yêu cầu request.auth != null; vì app
    // dùng chung 1 mật khẩu cho mọi cán bộ (không phân biệt từng người), ta
    // dùng 1 tài khoản Email/Password cố định — tài khoản này PHẢI được tạo
    // sẵn trong Firebase Console → Authentication → Users (xem hướng dẫn).
    if(cfg.sharedEmail&&cfg.sharedPassword){
      _fbAuthReady=_fbAuth.signInWithEmailAndPassword(cfg.sharedEmail,cfg.sharedPassword)
        .then(()=>{_fbAuthOk=true;return true;})
        .catch(err=>{
          console.error("Firebase Auth đăng nhập lỗi:",err&&err.code,err&&err.message);
          _fbAuthOk=false;return false;
        });
    }else{
      // Chưa cấu hình tài khoản dùng chung → không đăng nhập được → mọi
      // request Firestore sẽ bị Rules từ chối nếu Rules yêu cầu auth.
      _fbAuthOk=false;_fbAuthReady=Promise.resolve(false);
    }
    return true;
  }catch(e){console.error("Firebase init error",e);_fbDb=null;return false;}
}

// Khởi tạo Firebase ngay khi load (nếu đã có config)
(function(){
  const cfg=loadSysCfg();
  if(cfg.firebase&&cfg.firebase.apiKey)initFirebase(cfg.firebase);
})();

const COL="cap_data"; // Firestore collection name

function encodeKey(k){
  // Firestore doc ID: không được chứa / và các ký tự đặc biệt
  return k.replace(/\//g,"__").replace(/[^a-zA-Z0-9_\-\.]/g,"_");
}
function getStorageMode(){return _fbDb?"Firebase Firestore":"localStorage";}

// Xóa key khỏi localStorage (gọi khi Firebase đã xử lý xong)
function _lsClear(k){try{localStorage.removeItem(k);}catch{}}

// Firestore đôi khi báo "client is offline" ngay ở lượt gọi ĐẦU TIÊN sau khi
// vừa bật cache ngoại tuyến (enablePersistence) hoặc khi mạng chập chờn một
// nhịp — phần lớn là lỗi THOÁNG QUA, tự hết sau 1-2 giây. Bọc mọi lệnh
// Firestore bằng cơ chế tự thử lại để 1 lần timeout ngắn không làm cả app
// báo lỗi ngay, thay vì bắt người dùng phải tự bấm tải lại trang.
function _isTransientNetErr(err){
  // navigator.onLine===false là tín hiệu chắc chắn nhất: khi đó MỌI lỗi Firestore
  // (kể cả "permission-denied" do chưa kịp đăng nhập Auth vì cũng cần mạng) đều
  // thực chất là do mất mạng, không phải do sai cấu hình/quyền thật sự.
  if(typeof navigator!=="undefined"&&navigator.onLine===false)return true;
  return!!(err&&(err.code==="unavailable"||err.code==="deadline-exceeded"||err.code==="cancelled"||err.code==="internal"||/offline|network|failed to fetch/i.test(err.message||"")));
}
async function _fsRetry(fn,retries=2,delayMs=1500){
  for(let i=0;i<=retries;i++){
    try{return await fn();}
    catch(err){
      const transient=_isTransientNetErr(err);
      if(transient&&i<retries){await new Promise(r=>setTimeout(r,delayMs));continue;}
      throw err;
    }
  }
}

// ── Trạng thái đồng bộ Cloud (dùng cho nút/badge hiển thị trên giao diện) ──
// idle=đã đồng bộ xong, syncing=đang ghi lên Firebase, error=lần ghi gần nhất lỗi
// (không phải do mất mạng — VD sai quyền/cấu hình), offline=mất mạng, đang lưu
// tạm cục bộ và chờ tự động đồng bộ lại khi có mạng trở lại.
window.__cloudSync={status:"idle",lastSyncAt:null,lastError:null,pendingCount:0};
function _cloudSyncMark(patch){Object.assign(window.__cloudSync,patch);}

// ══════════════════════════════════════════════════════════════
// HÀNG ĐỢI NGOẠI TUYẾN (OFFLINE OUTBOX)
// Khi mất mạng, thay vì chặn thao tác lưu và báo lỗi, dữ liệu được:
//  1) Lưu ngay vào localStorage (để không mất nếu tắt trình duyệt)
//  2) Ghi vào file quan_ly_ma_tuy_backup.json trên ổ cứng (nếu đã gắn file
//     backup — xem pickLocalSyncFile) qua _trackForLocalSync/writeLocalBackup
//  3) Đưa vào "hàng đợi" — mỗi khi có mạng trở lại (sự kiện 'online' của
//     trình duyệt, hoặc poll định kỳ mỗi 20s vì sự kiện 'online' không phải
//     lúc nào cũng đáng tin), hệ thống tự động đẩy toàn bộ hàng đợi lên
//     Firebase, KHÔNG cần người dùng thao tác gì thêm.
// Chỉ những lỗi MẤT MẠNG mới được đưa vào hàng đợi; lỗi do sai quyền/cấu
// hình Firebase vẫn báo lỗi ngay để người dùng biết mà khắc phục (tránh
// hàng đợi bị kẹt mãi vì 1 lỗi không phải do mạng).
// ══════════════════════════════════════════════════════════════
const OUTBOX_KEY="cap:pending_outbox_v1";
function _loadOutbox(){
  try{return JSON.parse(localStorage.getItem(OUTBOX_KEY)||"{}");}catch{return{};}
}
function _saveOutbox(ob){
  try{localStorage.setItem(OUTBOX_KEY,JSON.stringify(ob));}catch{}
  _cloudSyncMark({pendingCount:Object.keys(ob).length});
}
function _queueOutbox(k,v){
  const ob=_loadOutbox();
  ob[k]={v,ts:Date.now()};
  _saveOutbox(ob);
}
function _dequeueOutbox(k){
  const ob=_loadOutbox();
  if(k in ob){delete ob[k];_saveOutbox(ob);}
}
let _flushingOutbox=false;
async function _flushOutbox(){
  if(_flushingOutbox||!_fbDb)return;
  const ob=_loadOutbox();
  const keys=Object.keys(ob);
  if(keys.length===0)return;
  _flushingOutbox=true;
  _cloudSyncMark({status:"syncing"});
  try{
    await _fbAuthReady;
    for(const k of keys){
      try{
        await _fsRetry(()=>_fbDb.collection(COL).doc(encodeKey(k)).set({v:ob[k].v,_t:Date.now()}));
        _dequeueOutbox(k);
        _lsClear(k);
      }catch(e){
        if(!_isTransientNetErr(e)){
          // Lỗi thật (không phải do mạng) — vẫn giữ trong hàng đợi để không mất
          // dữ liệu, nhưng dừng lại và báo lỗi để người dùng biết mà kiểm tra.
          _cloudSyncMark({status:"error",lastError:e.message});
          _flushingOutbox=false;
          return;
        }
        // Vẫn mất mạng — dừng vòng lặp, đợi lần thử tiếp theo
        _cloudSyncMark({status:"offline",pendingCount:Object.keys(_loadOutbox()).length});
        _flushingOutbox=false;
        return;
      }
    }
    _cloudSyncMark({status:"idle",lastSyncAt:Date.now(),lastError:null,pendingCount:0});
  }finally{_flushingOutbox=false;}
}
if(typeof window!=="undefined"){
  window.addEventListener("online",()=>_flushOutbox());
  setInterval(()=>{if(navigator.onLine)_flushOutbox();},20000);
  // Thử đồng bộ hàng đợi (nếu có từ phiên trước) ngay sau khi app khởi động và
  // đã có mạng — không cần đợi tới lượt poll định kỳ đầu tiên (tối đa 20 giây).
  setTimeout(()=>{if(navigator.onLine)_flushOutbox();},3000);
}

window.storage={
  // ── GET ──
  // Firebase kết nối → chỉ đọc Firebase
  // Chưa kết nối    → chỉ đọc localStorage
  get:async(k)=>{
    if(_fbDb){
      await _fbAuthReady; // đảm bảo đã đăng nhập Firebase Auth (nếu có cấu hình) trước khi gọi Firestore
      try{
        const snap=await _fsRetry(()=>_fbDb.collection(COL).doc(encodeKey(k)).get());
        // QUAN TRỌNG: nếu key này đang có 1 bản ghi CHƯA đồng bộ xong trong hàng đợi
        // ngoại tuyến (VD: lần lưu trước bị mất mạng thoáng qua, đã đưa vào outbox
        // nhưng _flushOutbox() chưa kịp chạy), thì bản trong outbox mới là thay đổi
        // MỚI NHẤT của người dùng — còn dữ liệu vừa đọc được từ Firestore ở trên có
        // thể đang CŨ. Nếu không ưu tiên outbox ở đây, người dùng tải lại trang (hoặc
        // mở ở máy khác) sẽ thấy dữ liệu vừa lưu "biến mất", dù nó vẫn còn nguyên
        // trong hàng đợi và rồi sẽ bị đẩy đè lên sau — đây chính là nguyên nhân khiến
        // việc lưu lên Firebase có vẻ như "không ăn".
        const ob=_loadOutbox();
        if(k in ob)return{value:ob[k].v};
        if(snap.exists){const d=snap.data();return{value:d.v};}
        return null; // key không tồn tại trên Firebase → null (KHÔNG đọc localStorage)
      }catch(e){
        // Mất mạng: nếu key này đang có bản ghi tạm chưa kịp đồng bộ trong hàng đợi
        // ngoại tuyến, trả về bản đó thay vì lỗi — để không "mất" dữ liệu vừa nhập
        // khi người dùng tải lại trang lúc chưa có mạng.
        if(_isTransientNetErr(e)){
          const ob=_loadOutbox();
          if(k in ob)return{value:ob[k].v};
        }
        _cloudSyncMark({status:"error",lastError:e.message});throw e;
      }
    }
    const v=localStorage.getItem(k);
    return v!=null?{value:v}:null;
  },

  // ── SET ──
  // Firebase kết nối + có mạng → ghi Firebase + xóa localStorage để tránh stale data
  // Firebase kết nối + MẤT MẠNG → KHÔNG chặn thao tác: lưu tạm vào hàng đợi ngoại
  //   tuyến (localStorage) + ghi ra file backup cục bộ, coi như "đã lưu" đối với
  //   người dùng, và tự động đẩy lên Firebase khi có mạng trở lại (xem _flushOutbox)
  // Chưa kết nối    → ghi localStorage
  set:async(k,v)=>{
    if(_fbDb){
      await _fbAuthReady;
      _cloudSyncMark({status:"syncing"});
      try{
        await _fsRetry(()=>_fbDb.collection(COL).doc(encodeKey(k)).set({v,_t:Date.now()}));
        _dequeueOutbox(k); // nếu trước đó đang chờ trong hàng đợi vì key này thì xoá đi, đã ghi thành công
        _cloudSyncMark({status:"idle",lastSyncAt:Date.now(),lastError:null});
      }catch(e){
        if(_isTransientNetErr(e)){
          // Mất mạng — không chặn người dùng: lưu tạm + đưa vào hàng đợi, coi như thành công
          _queueOutbox(k,v);
          _cloudSyncMark({status:"offline",lastError:e.message});
          return{key:k,value:v,offline:true};
        }
        _cloudSyncMark({status:"error",lastError:e.message});throw e;
      }
      _lsClear(k); // xóa bản localStorage cũ nếu có
      return{key:k,value:v};
    }
    localStorage.setItem(k,v);
    return{key:k,value:v};
  },

  // ── DELETE ──
  // Firebase kết nối → xóa Firebase VÀ xóa localStorage (đảm bảo sạch)
  // Chưa kết nối    → xóa localStorage
  delete:async(k)=>{
    if(_fbDb){
      await _fbAuthReady;
      _cloudSyncMark({status:"syncing"});
      try{
        await _fsRetry(()=>_fbDb.collection(COL).doc(encodeKey(k)).delete());
        _cloudSyncMark({status:"idle",lastSyncAt:Date.now(),lastError:null});
      }catch(e){_cloudSyncMark({status:"error",lastError:e.message});throw e;}
      _lsClear(k); // xóa cả localStorage để không bao giờ đồng bộ ngược lại
      return{key:k,deleted:true};
    }
    localStorage.removeItem(k);
    return{key:k,deleted:true};
  },
};

// LOCAL DISK SYNC (File System Access API) — LỚP SAO LƯU BỔ SUNG
// Ghi tự động 1 bản JSON đầy đủ dữ liệu ra 1 file trên ổ cứng máy
// tính, KHÔNG phụ thuộc localStorage (nên không mất khi xóa cache
// trình duyệt), và độc lập với trình duyệt đang dùng. Nếu đã cấu
// hình Firebase, Firebase vẫn là nguồn đồng bộ THỜI GIAN THỰC giữa
// nhiều máy/trình duyệt; file cục bộ là lớp sao lưu dự phòng, và là
// cách để chuyển dữ liệu giữa các trình duyệt KHÁC NHAU trên cùng
// máy khi CHƯA cấu hình Firebase (chọn cùng 1 file rồi bấm "Khôi
// phục" ở trình duyệt kia). Lưu ý: trình duyệt không có cơ chế tự
// "theo dõi" thay đổi của file bên ngoài, nên việc đọc lại là thao
// tác chủ động (không tự động ghi đè ngầm, tránh mất dữ liệu ngoài ý muốn).
// Chỉ hỗ trợ trên Chrome/Edge (File System Access API).
// ══════════════════════════════════════════════════════════════
const LOCAL_SYNC_SUPPORTED=typeof window!=="undefined"&&"showSaveFilePicker" in window;
const IDB_HANDLE_DB="cap_local_sync_v1",IDB_HANDLE_VER=1,IDB_HANDLE_STORE="handles";

function _openHandleDb(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(IDB_HANDLE_DB,IDB_HANDLE_VER);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(IDB_HANDLE_STORE))req.result.createObjectStore(IDB_HANDLE_STORE);};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function saveLocalFileHandle(handle){
  const db=await _openHandleDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_HANDLE_STORE,"readwrite");
    tx.objectStore(IDB_HANDLE_STORE).put(handle,"backup_file");
    tx.oncomplete=()=>resolve(true);
    tx.onerror=()=>reject(tx.error);
  });
}
async function getLocalFileHandle(){
  try{
    const db=await _openHandleDb();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(IDB_HANDLE_STORE,"readonly");
      const req=tx.objectStore(IDB_HANDLE_STORE).get("backup_file");
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error);
    });
  }catch{return null;}
}
async function clearLocalFileHandle(){
  try{
    const db=await _openHandleDb();
    const tx=db.transaction(IDB_HANDLE_STORE,"readwrite");
    tx.objectStore(IDB_HANDLE_STORE).delete("backup_file");
  }catch{}
}
async function verifyHandlePermission(handle,mode){
  try{
    const opts={mode:mode||"readwrite"};
    if((await handle.queryPermission(opts))==="granted")return true;
    if((await handle.requestPermission(opts))==="granted")return true;
    return false;
  }catch{return false;}
}
// Người dùng chọn/tạo file JSON trên ổ cứng để gắn làm nơi tự động sao lưu
async function pickLocalSyncFile(){
  if(!LOCAL_SYNC_SUPPORTED)throw new Error("Trình duyệt này không hỗ trợ lưu file trực tiếp ra ổ cứng (chỉ Chrome/Edge). Vẫn có thể dùng Firebase hoặc nút Backup & Xuất Excel để sao lưu thủ công.");
  const handle=await window.showSaveFilePicker({
    suggestedName:"quan_ly_ma_tuy_backup.json",
    types:[{description:"JSON Backup",accept:{"application/json":[".json"]}}],
  });
  await saveLocalFileHandle(handle);
  return handle;
}
// Ghi toàn bộ snapshot dữ liệu ra file cục bộ — best-effort, KHÔNG chặn luồng lưu chính
// (nếu chưa gắn file, hoặc mất quyền, hoặc trình duyệt không hỗ trợ → âm thầm bỏ qua)
async function writeLocalBackup(snapshot){
  try{
    if(!LOCAL_SYNC_SUPPORTED)return false;
    const handle=await getLocalFileHandle();
    if(!handle)return false;
    if(!(await verifyHandlePermission(handle,"readwrite")))return false;
    const writable=await handle.createWritable();
    await writable.write(JSON.stringify({_t:Date.now(),data:snapshot},null,2));
    await writable.close();
    return true;
  }catch(e){console.warn("Ghi backup ổ cứng thất bại:",e);return false;}
}
// Đọc lại dữ liệu từ file cục bộ đã gắn — dùng khi khôi phục thủ công
// (VD mở app ở trình duyệt khác trên cùng máy, chưa cấu hình Firebase)
async function readLocalBackup(){
  const handle=await getLocalFileHandle();
  if(!handle)throw new Error("Chưa gắn file sao lưu nào trên máy này.");
  if(!(await verifyHandlePermission(handle,"read")))throw new Error("Không có quyền đọc file. Vui lòng chọn lại file.");
  const file=await handle.getFile();
  const text=await file.text();
  const parsed=JSON.parse(text);
  return parsed&&parsed.data?parsed:{data:{}};
}

// Bộ nhớ đệm trong phiên làm việc: gộp giá trị MỌI key đã từng lưu/tải trong phiên này,
// để mỗi lần ghi ra file cục bộ là 1 bản JSON ĐẦY ĐỦ (không chỉ riêng key vừa đổi).
let _localSyncSnapshot={};
const _writeLocalBackupDebounced=debounce(()=>{writeLocalBackup(_localSyncSnapshot);},1500);
function _trackForLocalSync(k,v){_localSyncSnapshot[k]=v;_writeLocalBackupDebounced();}

// ── Optimized storage helpers ──────────────────────────────
// All report numbers stored in ONE key to reduce I/O
const RPT_KEY="cap:reports_v2";
const LISTS_META_KEY="cap:meta_v2"; // timestamps, counts cache

// Debounce helper – prevents hammering storage on rapid changes
function debounce(fn, ms){
  let t;
  const wrapped=function(...args){
    clearTimeout(t);
    t=setTimeout(()=>fn.apply(this,args), ms);
  };
  wrapped.cancel=()=>clearTimeout(t);
  return wrapped;
}

// Storage usage monitor
function getStorageUsage(){
  let total=0;
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    const v=localStorage.getItem(k)||"";
    total+=k.length+v.length;
  }
  return Math.round(total/1024); // KB
}

// Compress: remove undefined/null/empty-string fields before saving
function compactRecord(r){
  const out={};
  Object.entries(r).forEach(([k,v])=>{
    if(v!==null&&v!==undefined&&v!=="")out[k]=v;
  });
  return out;
}
function compactList(arr){return arr.map(compactRecord);}

// Unified report save – all report fields in one key
async function saveReportAll(rpt){
  try{
    await window.storage.set(RPT_KEY, JSON.stringify(rpt));
  }catch(e){console.error("saveReportAll error",e);}
}
async function loadReportAll(fb){
  try{
    const r=await window.storage.get(RPT_KEY);
    if(r)return JSON.parse(r.value);
  }catch{}
  return fb;
}

// BẢO MẬT TÀI KHOẢN (v8.3)
// Mật khẩu KHÔNG còn lưu dạng văn bản thường. Hệ thống lưu chuỗi băm
// PBKDF2-SHA256 (210.000 vòng lặp) kèm muối ngẫu nhiên 16 byte, nên kể cả
// khi người khác đọc được localStorage cũng không suy ra được mật khẩu.
// Bản cũ (admin_pwd_v1) được tự động chuyển sang dạng băm ở lần đăng nhập
// đúng đầu tiên rồi xóa bản văn bản thường.
// ══════════════════════════════════════════════════════════════════════
const ADMIN_PWD_KEY="admin_pwd_v1";        // (cũ – chỉ dùng để chuyển đổi)
const ADMIN_PWD_KEY2="admin_pwd_v2";       // {salt,hash,iter}
const PWD_FAIL_KEY="admin_pwd_fail_v1";    // chống dò mật khẩu
const PWD_ITER=210000;
const _hex=buf=>Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
const _rndHex=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return _hex(a.buffer);};
async function _pbkdf2(pwd,saltHex,iter){
  const enc=new TextEncoder();
  const salt=Uint8Array.from(saltHex.match(/.{2}/g).map(h=>parseInt(h,16)));
  const key=await crypto.subtle.importKey("raw",enc.encode(pwd),{name:"PBKDF2"},false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:iter||PWD_ITER,hash:"SHA-256"},key,256);
  return _hex(bits);
}
async function setAdminPwd(p){
  const salt=_rndHex(16);
  const hash=await _pbkdf2(p,salt,PWD_ITER);
  localStorage.setItem(ADMIN_PWD_KEY2,JSON.stringify({salt,hash,iter:PWD_ITER,at:Date.now()}));
  localStorage.removeItem(ADMIN_PWD_KEY);
  return true;
}
// Trạng thái chống dò: khóa tạm sau nhiều lần sai liên tiếp
function pwdLockInfo(){
  let st={n:0,until:0};
  try{st=JSON.parse(localStorage.getItem(PWD_FAIL_KEY)||"null")||st;}catch{}
  const left=Math.max(0,Math.ceil((st.until-Date.now())/1000));
  return{fails:st.n||0,lockedFor:left};
}
function _pwdFail(){
  const{fails}=pwdLockInfo();
  const n=fails+1;
  // 5 lần sai → khóa 30 giây, mỗi 5 lần tiếp theo thời gian khóa tăng gấp đôi
  const wait=n>=5?30*1000*Math.pow(2,Math.floor(n/5)-1):0;
  localStorage.setItem(PWD_FAIL_KEY,JSON.stringify({n,until:wait?Date.now()+wait:0}));
  return Math.ceil(wait/1000);
}
const _pwdOk=()=>localStorage.removeItem(PWD_FAIL_KEY);
// Kiểm tra mật khẩu – trả về {ok, lockedFor, mustChange}
async function verifyAdminPwd(pwd){
  const lock=pwdLockInfo();
  if(lock.lockedFor>0)return{ok:false,lockedFor:lock.lockedFor};
  let rec=null;
  try{rec=JSON.parse(localStorage.getItem(ADMIN_PWD_KEY2)||"null");}catch{}
  if(rec&&rec.salt&&rec.hash){
    const h=await _pbkdf2(pwd,rec.salt,rec.iter||PWD_ITER);
    if(h===rec.hash){_pwdOk();return{ok:true,mustChange:pwd==="admin"};}
    return{ok:false,lockedFor:_pwdFail()};
  }
  // Chưa có bản băm → so với bản cũ/mật khẩu mặc định rồi nâng cấp ngay
  const legacy=localStorage.getItem(ADMIN_PWD_KEY)||"admin";
  if(pwd===legacy){await setAdminPwd(pwd);_pwdOk();return{ok:true,mustChange:pwd==="admin"};}
  return{ok:false,lockedFor:_pwdFail()};
}

// ── Migrate old 4-store data into unified store ───────────────
// QUAN TRỌNG: hàm này chạy ở MỌI lần mở app (không chỉ lần đầu), nên tuyệt đối
// không được ghi đè "cap:doi_tuong_v1" bằng dữ liệu rỗng/di trú lại chỉ vì:
//   (1) lượt đọc kiểm tra "đã có dữ liệu chưa" bị lỗi mạng/Firestore tạm thời, hoặc
//   (2) người dùng trước đó đã xóa hết nên mảng đang lưu là [] một cách hợp lệ.
// → Phân biệt rõ 3 trường hợp: đọc lỗi (throw, KHÔNG di trú), đã từng lưu dù rỗng
//   (dùng nguyên, KHÔNG di trú lại), và thực sự chưa từng lưu lần nào (mới di trú).
async function migrateToUnified(oldSD,oldNG,oldSC,oldVP){
  const res=await loadStoreStrict(KEYS.doi_tuong);
  if(!res.ok){
    // Không đọc được dữ liệu (rất có thể do mất mạng/Firestore lỗi tạm thời).
    // Not overwrite: ném lỗi để App.jsx xử lý (báo cho người dùng, KHÔNG lưu gì cả).
    throw res.error||new Error("Không đọc được dữ liệu đối tượng.");
  }
  if(res.existed)return res.value||[]; // đã từng lưu (kể cả mảng rỗng) → dùng nguyên, không di trú lại
  const unified=[];
  const addGroup=(list,nhomId)=>{
    list.forEach(r=>{
      const ex=unified.find(u=>u._id===r._id||(u.ho_ten===r.ho_ten&&u.cccd&&u.cccd===r.cccd));
      if(ex){if(!ex.nhom.includes(nhomId))ex.nhom.push(nhomId);}
      else unified.push({...r,nhom:[nhomId]});
    });
  };
  addGroup(oldSD,"su_dung");
  addGroup(oldNG,"nghien");
  addGroup(oldSC,"sau_cai");
  addGroup(oldVP,"vppl");
  await saveStore(KEYS.doi_tuong,unified);
  return unified;
}

// Mỗi mục: {id, ho_ten, chuc_vu, la_chi_huy, la_cskv, la_pctp}
function syncCanBoOptions(list){
  // Cán bộ là Chỉ huy KHÔNG hiện trong danh sách "Cán bộ được phân công theo dõi"
  const nonChiHuy=(list||[]).filter(c=>!c.la_chi_huy);
  const all=[...new Set(nonChiHuy.map(c=>c.ho_ten).filter(Boolean))];
  const chiHuy=[...new Set((list||[]).filter(c=>c.la_chi_huy).map(c=>c.ho_ten).filter(Boolean))];
  OPT.canBoList.splice(0,OPT.canBoList.length,...all);
  OPT.chiHuyList.splice(0,OPT.chiHuyList.length,...chiHuy);
  const seenDetail=new Set();
  const detail=[];
  nonChiHuy.forEach(c=>{
    if(!c.ho_ten||seenDetail.has(c.ho_ten))return;
    seenDetail.add(c.ho_ten);
    detail.push({ho_ten:c.ho_ten,tag:c.la_cskv?"CSKV":(c.la_pctp?"PCTP":"")});
  });
  OPT.canBoDetail.splice(0,OPT.canBoDetail.length,...detail);
}

// ── DateInputVN – hiển thị dd/mm/yyyy, lưu yyyy-mm-dd ────────
function DateInputVN({value,onChange,style,onFocus,onBlur}){
  // ISO yyyy-mm-dd ↔ display dd/mm/yyyy
  const toDisplay=iso=>{
    if(!iso)return"";
    const m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m?m[3]+"/"+m[2]+"/"+m[1]:"";
  };
  const toISO=disp=>{
    const m=String(disp).match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    return m?m[3]+"-"+m[2]+"-"+m[1]:"";
  };
  const hiddenRef=useRef();
  const [focused,setFocused]=useState(false);

  // Open native date picker when clicking the display area
  const openPicker=()=>{
    if(hiddenRef.current){
      try{hiddenRef.current.showPicker();}catch(e){hiddenRef.current.focus();}
    }
  };
  const handleNativeChange=e=>{
    // native input gives yyyy-mm-dd → store & display dd/mm/yyyy
    onChange(e.target.value||"");
  };

  const display=toDisplay(value);
  const baseStyle={
    padding:"7px 32px 7px 10px",border:"1.5px solid #d0d7e8",borderRadius:8,
    fontSize:13,background:"#f8fafd",outline:"none",width:"100%",
    boxSizing:"border-box",cursor:"pointer",fontFamily:"monospace",
    letterSpacing:.5,color:value?"#1a2340":"#94a3b8",
    transition:"border .15s",
    ...style,
    // override position to relative for icon overlay
    position:"relative",
  };

  return(
    <div style={{position:"relative",display:"inline-block",width:"100%"}}>
      {/* Display layer – shows dd/mm/yyyy */}
      <div
        onClick={openPicker}
        onFocus={()=>{setFocused(true);if(onFocus)onFocus();}}
        onBlur={()=>{setFocused(false);if(onBlur)onBlur();}}
        tabIndex={0}
        style={{
          padding:"7px 32px 7px 10px",
          border:"1.5px solid "+(focused?"#3b5bdb":"#d0d7e8"),
          borderRadius:8,fontSize:13,background:"#f8fafd",cursor:"pointer",
          fontFamily:"monospace",letterSpacing:.5,
          color:value?"#1a2340":"#94a3b8",
          transition:"border .15s",userSelect:"none",
          boxSizing:"border-box",
          ...style,
        }}
      >
        {display||"dd/mm/yyyy"}
      </div>
      {/* Calendar icon */}
      <span
        onClick={openPicker}
        style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",
          fontSize:14,cursor:"pointer",color:"#94a3b8",pointerEvents:"all",zIndex:2}}
      >📅</span>
      {/* Hidden native date input – provides the picker */}
      <input
        ref={hiddenRef}
        type="date"
        value={value||""}
        onChange={handleNativeChange}
        style={{position:"absolute",opacity:0,pointerEvents:"none",
          width:1,height:1,top:0,left:0,zIndex:-1}}
        tabIndex={-1}
      />
    </div>
  );
}

const fmtDate=d=>{
  if(!d)return"";
  try{
    const s=String(d).trim();
    // Already dd/mm/yyyy
    if(/^\d{2}\/\d{2}\/\d{4}$/.test(s))return s;
    // yyyy-mm-dd → parse as local date (avoid UTC shift)
    const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(iso)return iso[3]+"/"+iso[2]+"/"+iso[1];
    const dt=new Date(s);
    if(isNaN(dt.getTime()))return s;
    const dd=String(dt.getUTCDate()).padStart(2,"0");
    const mm=String(dt.getUTCMonth()+1).padStart(2,"0");
    const yyyy=dt.getUTCFullYear();
    return dd+"/"+mm+"/"+yyyy;
  }catch{return String(d);}
};

// Parse 1 ô ngày từ Excel (chuỗi dd/mm/yyyy, Date object, hoặc số serial Excel) → "yyyy-mm-dd"
const parseExcelDateG=v=>{
  if(!v)return"";
  if(v instanceof Date)return v.toISOString().slice(0,10);
  const s=String(v).trim();
  const m1=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m1){const y=m1[3].length===2?"20"+m1[3]:m1[3];return`${y}-${m1[2].padStart(2,"0")}-${m1[1].padStart(2,"0")}`;}
  const m2=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m2)return s.slice(0,10);
  if(/^\d+$/.test(s)&&Number(s)>1000){const d=new Date((Number(s)-25569)*86400000);if(!isNaN(d))return d.toISOString().slice(0,10);}
  return"";
};

const DATE_KEYS_HD26=new Set(["ngay_vao_so","ngay_sinh"]);
const BOOL_KEYS_HD26=new Set(["co_mat"]);
// Dò cột tự động theo TIÊU ĐỀ của file mẫu (không phụ thuộc vị trí cột cố định),
// nhờ đó nhập được cả file mẫu có cột "Khu phố" lẫn file mẫu chính thức không có.
function _autoMapHD26(aoa,headerIdx){
  const norm=v=>String(v||"").replace(/\s+/g," ").trim().toLowerCase();
  const rows=[aoa[headerIdx]||[],aoa[headerIdx+1]||[]];
  const map={};
  const set=(k,c)=>{if(map[k]===undefined&&c>=0)map[k]=c;};
  rows.forEach((row,ri)=>{
    row.forEach((cell,c)=>{
      const t=norm(cell);
      if(!t)return;
      if(/^stt$/.test(t))return;
      if(/phường\/xã|phuong\/xa/.test(t))set("phuong_xa",c);
      else if(/quận\/huyện|^tp$|^thành phố$/.test(t))set("quan_huyen",c);
      else if(/khu phố/.test(t)&&/cũ/.test(t))set("khu_pho_cu",c);
      else if(/khu phố/.test(t))set("khu_pho_moi",c);
      else if(/vào\s*sổ/.test(t))set("ngay_vao_so",c);
      else if(/họ và tên/.test(t))set("ho_ten",c);
      else if(/năm sinh/.test(t))set("ngay_sinh",c);
      else if(/giới tính/.test(t))set("gioi_tinh",c);
      else if(/hktt|hộ khẩu thường trú|nơi đăng ký/.test(t))set("hktt",c);
      else if(/nơi ở hiện tại/.test(t))set("noi_o_ht",c);
      else if(/cccd|định danh/.test(t))set("cccd",c);
      else if(/trình độ/.test(t))set("trinh_do_hv",c);
      else if(/xét nghiệm chất ma túy|loại ma túy dương tính/.test(t))set("loai_ma_tuy",c);
      else if(/quyết định quản lý người sử dụng/.test(t)){set("qd_ql_so",c);set("qd_ql_tg",c+1);}
      else if(/giáo dục tại xã|quyết định xlhc/.test(t)){set("qd_xlhc_so",c);set("qd_xlhc_tg",c+1);}
      else if(/xác định tình trạng nghiện/.test(t))set("phieu_xd_nghien",c);
      else if(/hình thức cai nghiện/.test(t))set("hinh_thuc_cai",c);
      else if(/giấy chứng nhận chấp hành xong/.test(t)){set("gcn_so",c);set("gcn_co_quan",c+1);set("gcn_hinh_thuc",c+2);set("gcn_thoi_gian",c+3);set("gcn_co_so",c+4);}
      else if(/quyết định quản lý sau cai/.test(t)){set("qd_sau_cai_so",c);set("qd_sau_cai_cq",c+1);set("qd_sau_cai_th",c+2);}
      else if(/tình trạng hiện tại/.test(t)){set("co_mat",c);set("vang_mat",c+1);}
      else if(/cập nhật.*phần mềm|phần mềm quản lý đối tượng/.test(t))set("cap_nhat_pm",c);
      else if(/^ghi chú/.test(t))set("ghi_chu",c);
      else if(/^có mặt$/.test(t))set("co_mat",c);
      else if(/^vắng mặt/.test(t))set("vang_mat",c);
    });
  });
  return map;
}
function parseHD26ListFile(wb,nhomId){
  const mapTinh=COLMAP_HD26[nhomId];
  let map=mapTinh;
  const ws=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  let headerIdx=-1;
  for(let i=0;i<aoa.length;i++){
    if((aoa[i]||[]).some(c=>String(c||"").toLowerCase().includes("họ và tên"))){headerIdx=i;break;}
  }
  if(headerIdx<0)return{error:"Không tìm thấy hàng tiêu đề 'Họ và Tên' – vui lòng dùng đúng file mẫu chính thức (PL1/PL2/PL3 – Hướng dẫn 26)."};
  // Ưu tiên bản đồ cột dò tự động theo tiêu đề; nếu không nhận đủ trường thì quay về bản đồ cột cố định
  const mapAuto=_autoMapHD26(aoa,headerIdx);
  if(mapAuto.ho_ten!==undefined&&Object.keys(mapAuto).length>=6)map=mapAuto;
  // Hàng dữ liệu đầu tiên: bỏ qua hàng đánh số cột "(1) (2) (3)…" hoặc "-1 -2 -3…" nếu có
  let dataStart=headerIdx+2;
  const isNumRow=r=>{
    const cells=(aoa[r]||[]).map(v=>String(v||"").trim()).filter(Boolean);
    return cells.length>3&&cells.every(v=>/^\(?-?\d+\)?$/.test(v));
  };
  while(isNumRow(dataStart))dataStart++;
  if(!String((aoa[dataStart]||[])[map.ho_ten]||"").trim()&&String((aoa[dataStart+1]||[])[map.ho_ten]||"").trim())dataStart++;
  const records=[];
  for(let i=dataStart;i<aoa.length;i++){
    const row=aoa[i]||[];
    const hoTen=String(row[map.ho_ten]||"").trim();
    if(!hoTen)continue;
    const rec={nhom:[nhomId]};
    Object.entries(map).forEach(([key,col])=>{
      let val=row[col];
      if(DATE_KEYS_HD26.has(key))val=parseExcelDateG(val);
      else if(BOOL_KEYS_HD26.has(key))val=/^x$/i.test(String(val||"").trim());
      else val=String(val||"").trim();
      rec[key]=val;
    });
    records.push(rec);
  }
  return{records,count:records.length};
}
const saveStore=async(k,v)=>{
  // Khi Firebase đang dùng: lỗi phải throw để UI thông báo, tránh silent data loss

  // kể cả xóa/loại (vì xóa/loại cũng là ghi đè lại toàn bộ mảng đã cập nhật)
  _trackForLocalSync(k,json);
};
const loadStore=async(k,fb)=>{
  try{
    let r=await window.storage.get(k);
    // ── Tự động "di trú" dữ liệu cục bộ cũ lên Firebase khi mới kết nối ──
    // window.storage.get() khi Firebase đã kết nối CHỈ đọc Firestore (không
    // đọc localStorage) — đúng để tránh dữ liệu cũ "hồi sinh". NHƯNG nếu
    // dữ liệu (VD: Danh mục Khu phố, Danh sách cán bộ) đã được nhập TỪ TRƯỚC
    // khi cấu hình Firebase, nó vẫn đang nằm im trong localStorage của máy
    // này và CHƯA TỪNG được đẩy lên Firestore (vì chưa có thao tác lưu nào
    // xảy ra sau khi kết nối). Nếu bỏ qua, người dùng sẽ thấy danh mục
    // "biến mất trống trơn" ngay sau khi bật đồng bộ Firebase, dù dữ liệu
    // vẫn còn nguyên trên máy — đây chính là nguyên nhân khiến khu phố/cán bộ
    // có vẻ như "không đồng bộ". Xử lý: nếu Firestore chưa có doc cho key này
    // mà localStorage máy này lại có, tự động đẩy bản cục bộ đó lên Firebase.
    if(!r&&_fbDb){
      const local=localStorage.getItem(k);
      if(local!=null){
        try{
          await window.storage.set(k,local);
          r={value:local};
          console.info("Đã tự động đồng bộ dữ liệu cục bộ cũ lên Firebase cho key:",k);
        }catch(e){console.warn("Không thể tự động đồng bộ dữ liệu cũ lên Firebase cho key",k,e);}
      }
    }
    const json=r?r.value:JSON.stringify(fb);
    _trackForLocalSync(k,json); // nạp cả các key chưa từng sửa trong phiên vào bản sao lưu cục bộ
    return r?JSON.parse(r.value):fb;
  }catch{return fb;}
};
// Đọc "nghiêm ngặt" cho dữ liệu QUAN TRỌNG (đối tượng): KHÔNG được nuốt lỗi
// rồi coi như "chưa có dữ liệu", vì điều đó có thể khiến các đoạn code khác

const loadStoreStrict=async(k)=>{
  try{
    const r=await window.storage.get(k);
    if(r)_trackForLocalSync(k,r.value);
    return{ok:true,value:r?JSON.parse(r.value):null,existed:!!r};
  }catch(e){
    console.error("loadStoreStrict lỗi khi đọc key",k,e);
    return{ok:false,error:e};
  }
};

// TÌM KIẾM ĐỐI TƯỢNG THEO HỌ TÊN / CCCD / SĐT
// – Không phân biệt hoa-thường và KHÔNG phân biệt dấu tiếng Việt
//   (gõ "hoang" vẫn tìm ra "Hoàng"), để tránh gõ sai chính tả/dấu
//   khiến không tìm thấy.
// – CHỈ khớp trên họ tên, CCCD/CMND và số điện thoại (KHÔNG dò tất
//   cả các trường khác như địa chỉ, ghi chú...) để từ khóa như
//   "hoàng" không bị nhiễu bởi các trường không liên quan đến danh
//   tính đối tượng (vd địa chỉ có chữ "Hoàng Văn Thụ").
// ══════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════
// useDraggableModal — cho phép người dùng KÉO cửa sổ popup sang vị trí
// khác trên màn hình (giữ chuột/ngón tay vào thanh tiêu đề rồi kéo), để
// xem được dữ liệu ở phía sau mà không cần đóng popup. Trả về:
//  - style: gắn vào phần "khung trắng" của modal (áp dụng translate)
//  - dragHandleProps: gắn vào thanh tiêu đề (khu vực dùng để kéo)
//  - resetPos(): gọi khi đóng/mở lại modal để về đúng vị trí giữa màn hình
// Bỏ qua thao tác kéo nếu bấm trúng nút/ô nhập liệu trong thanh tiêu đề
// (VD nút đóng ✕) để không phá vỡ các nút bấm sẵn có.
// ══════════════════════════════════════════════════════════════
function useDraggableModal(){
  const [pos,setPos]=useState({x:0,y:0});
  const dragRef=useRef({active:false,startX:0,startY:0,origX:0,origY:0});
  const onDragMove=useRef();
  const onDragEnd=useRef();
  onDragMove.current=(e)=>{
    if(!dragRef.current.active)return;
    const isTouch=e.type==="touchmove";
    const clientX=isTouch?e.touches[0].clientX:e.clientX;
    const clientY=isTouch?e.touches[0].clientY:e.clientY;
    setPos({x:dragRef.current.origX+(clientX-dragRef.current.startX),y:dragRef.current.origY+(clientY-dragRef.current.startY)});
    if(!isTouch)e.preventDefault();
  };
  onDragEnd.current=()=>{
    dragRef.current.active=false;
    document.removeEventListener("mousemove",onDragMove.current);
    document.removeEventListener("mouseup",onDragEnd.current);
    document.removeEventListener("touchmove",onDragMove.current);
    document.removeEventListener("touchend",onDragEnd.current);
  };
  const onDragStart=(e)=>{
    if(e.target.closest("button,input,select,textarea,a"))return; // không kéo khi bấm nút/ô nhập trong thanh tiêu đề
    const isTouch=e.type==="touchstart";
    const clientX=isTouch?e.touches[0].clientX:e.clientX;
    const clientY=isTouch?e.touches[0].clientY:e.clientY;
    dragRef.current={active:true,startX:clientX,startY:clientY,origX:pos.x,origY:pos.y};
    document.addEventListener(isTouch?"touchmove":"mousemove",onDragMove.current,{passive:false});
    document.addEventListener(isTouch?"touchend":"mouseup",onDragEnd.current);
  };
  const resetPos=()=>setPos({x:0,y:0});
  const style=pos.x||pos.y?{transform:`translate(${pos.x}px,${pos.y}px)`}:undefined;
  return{
    style,
    dragHandleProps:{onMouseDown:onDragStart,onTouchStart:onDragStart,style:{cursor:"grab"}},
    resetPos,
  };
}

function stripDiacriticsVN(str){
  return String(str||"")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/đ/g,"d").replace(/Đ/g,"D");
}

// ĐẾM SỐ ĐỐI TƯỢNG THỰC TẾ (KHÔNG TRÙNG) — gộp 2 bản ghi làm 1 người CHỈ KHI
// vừa trùng Số CCCD, VỪA trùng Họ tên (khi chưa có CCCD thì so Họ tên + Ngày sinh).
// LÝ DO CẦN HÀM RIÊNG: 1 đối tượng có thể vừa thuộc nhóm "Sau cai nghiện" vừa
// thuộc nhóm "Sưu tra" (gắn nhiều nhãn "nhom" trên CÙNG 1 bản ghi) — nếu tính
// tổng bằng cách CỘNG số lượng từng nhóm lại (sd.length+ng.length+...) thì
// người này bị đếm 2 LẦN, làm sai lệch số liệu "Tổng đang quản lý".
// LƯU Ý QUAN TRỌNG: KHÔNG được chỉ dựa vào Số CCCD trùng để gộp — trên thực tế
// đã phát hiện trường hợp 2 người HOÀN TOÀN KHÁC NHAU (khác họ tên, khác năm
// sinh) bị trùng Số CCCD do SAI SÓT NHẬP LIỆU (gõ nhầm) ở 1 trong 2 bản ghi.
// Nếu chỉ so CCCD, hệ thống sẽ gộp nhầm 2 người thành 1, làm "biến mất" 1
// người thật khỏi thống kê (VD: tổng bị lệch 91 → 90 dù thực tế có 91 người).
// Do đó bắt buộc phải khớp CẢ Số CCCD LẪN Họ tên mới coi là trùng 1 người —
// xem thêm findCccdConflicts() để phát hiện và cảnh báo các Số CCCD bị trùng
// giữa 2 tên khác nhau (nhiều khả năng là lỗi nhập liệu cần cán bộ kiểm tra lại).
// ══════════════════════════════════════════════════════════════
function _dedupKeyDoiTuong(r){
  const name=stripDiacriticsVN(r.ho_ten||"").toLowerCase().trim().replace(/\s+/g," ");
  const cccd=String(r.cccd||"").replace(/\D/g,"");
  if(cccd)return"c:"+cccd+"|"+name;
  const dob=String(r.ngay_sinh||"").trim();
  return"n:"+name+"|"+dob;
}
function countUniqueSubjects(list){
  const seen=new Set();
  (list||[]).forEach(r=>{
    if(!r||(!r.ho_ten&&!r.cccd))return; // bỏ qua bản ghi rỗng/hỏng, không tính vào tổng
    seen.add(_dedupKeyDoiTuong(r));
  });
  return seen.size;
}
// Trả về danh sách đối tượng đã loại bỏ trùng lặp (giữ 1 bản ghi/người, theo
// cùng khoá CCCD+họ tên hoặc họ tên+ngày sinh như countUniqueSubjects) — dùng
// khi xuất báo cáo/Excel liệt kê từng người 1 lần duy nhất, kể cả khi người đó
// thuộc nhiều nhóm quản lý (SD, Nghiện, Sau cai, VPPL, Nghi vấn, Sưu tra...).
function dedupSubjectsForExport(list){
  const seen=new Set();
  const out=[];
  (list||[]).forEach(r=>{
    if(!r||(!r.ho_ten&&!r.cccd))return;
    const k=_dedupKeyDoiTuong(r);
    if(seen.has(k))return;
    seen.add(k);
    out.push(r);
  });
  return out;
}
// Phát hiện các Số CCCD bị dùng chung bởi ≥2 họ tên KHÁC NHAU — gần như chắc
// chắn là lỗi nhập liệu (gõ nhầm CCCD) cần cán bộ kiểm tra, sửa lại cho đúng.
function findCccdConflicts(list){
  const byCccd=new Map();
  (list||[]).forEach(r=>{
    const cccd=String(r.cccd||"").replace(/\D/g,"");
    if(!cccd)return;
    if(!byCccd.has(cccd))byCccd.set(cccd,[]);
    byCccd.get(cccd).push(r);
  });
  const conflicts=[];
  byCccd.forEach((recs,cccd)=>{
    const names=new Set(recs.map(r=>stripDiacriticsVN(r.ho_ten||"").toLowerCase().trim().replace(/\s+/g," ")));
    if(names.size>1)conflicts.push({cccd,records:recs});
  });
  return conflicts;
}
function matchesNguoiSearch(r,search){
  const s=String(search||"").trim();
  if(!s)return true;
  const needle=stripDiacriticsVN(s).toLowerCase();
  const name=stripDiacriticsVN(r.ho_ten||"").toLowerCase();
  if(name.includes(needle))return true;
  const digits=s.replace(/\D/g,"");
  if(digits){
    if(String(r.cccd||"").includes(digits))return true;
    if(String(r.sdt||"").includes(digits))return true;
  }
  return false;
}
// ══════════════════════════════════════════════════════════════
// THỐNG KÊ "KHU PHỐ NÓNG" – khu phố nào có nhiều đối tượng ma túy nhất
// – Nguồn 1 (chính, chính xác nhất): trường "Khu phố/ấp/khu dân cư
//   (theo phương án sắp xếp mới)" (khu_pho_moi) đã được gán trực tiếp
//   cho từng đối tượng khi nhập liệu.
// – Nguồn 2 (bổ sung): với các đối tượng CHƯA gán khu_pho_moi khớp với
//   danh mục hiện tại, dò tên khu phố xuất hiện trong "Nơi thường trú"
//   (hktt) hoặc "Nơi ở hiện tại" (noi_o_ht) — để không bỏ sót các
//   trường hợp nhập địa chỉ dạng tự do chưa chọn đúng khu phố ở danh mục.
// So khớp không phân biệt hoa/thường và không dấu để tránh lệch chính tả.
// ══════════════════════════════════════════════════════════════
function computeKhuPhoHotspot(khuPho,subjects,loaiSubjects){
  const norm=s=>stripDiacriticsVN(s).toLowerCase().trim();
  const stats=(khuPho||[]).map(kp=>({
    id:kp.id,ten:kp.ten_moi||kp.ten_cu||"(chưa đặt tên)",ten_cu:kp.ten_cu||"",
    quanLy:0,theoCuTru:0,nu:0,chuaPM:0,daLoai:0,
    perNhom:{su_dung:0,nghien:0,sau_cai:0,vppl:0,nghi_van:0,suu_tra:0},
  }));
  const byName=new Map(stats.filter(s=>norm(s.ten)).map(s=>[norm(s.ten),s]));
  let khongXacDinh=0;
  const khongXacDinhList=[];
  (subjects||[]).forEach(r=>{
    const nhomList=r.nhom||[];
    const bump=s=>nhomList.forEach(n=>{if(s.perNhom[n]!=null)s.perNhom[n]++;});
    const extra=(s,rec)=>{
      if(String(rec.gioi_tinh||"")==="Nữ")s.nu++;
      if(String(rec.cap_nhat_pm||"").trim()!=="Đã nhập")s.chuaPM++;
    };
    const assignedName=norm(r.khu_pho_moi||"");
    if(assignedName&&byName.has(assignedName)){
      const s=byName.get(assignedName);s.quanLy++;bump(s);extra(s,r);return;
    }
    const addr=norm((r.hktt||"")+" "+(r.noi_o_ht||""));
    let hit=null;
    if(addr){
      for(const s of stats){
        const n=norm(s.ten);
        if(n&&n.length>=3&&addr.includes(n)){hit=s;break;}
      }
    }
    if(hit){hit.theoCuTru++;bump(hit);extra(hit,r);}
    else{khongXacDinh++;khongXacDinhList.push({_id:r._id,ho_ten:r.ho_ten||"(chưa có tên)",cccd:r.cccd||"",hktt:r.hktt||"",noi_o_ht:r.noi_o_ht||""});}
  });
  // Đối tượng ĐÃ THANH LOẠI – dùng để so sánh biến động theo khu phố
  (loaiSubjects||[]).forEach(r=>{
    const nameL=norm(r.khu_pho_moi||"");
    let s=nameL&&byName.has(nameL)?byName.get(nameL):null;
    if(!s){
      const addr=norm((r.hktt||"")+" "+(r.noi_o_ht||""));
      if(addr)for(const x of stats){const n=norm(x.ten);if(n&&n.length>=3&&addr.includes(n)){s=x;break;}}
    }
    if(s)s.daLoai++;
  });
  stats.forEach(s=>{s.tong=s.quanLy+s.theoCuTru;});
  stats.sort((a,b)=>b.tong-a.tong||a.ten.localeCompare(b.ten,"vi"));
  const tongCoXacDinh=stats.reduce((a,s)=>a+s.tong,0);
  const soKpCoDT=stats.filter(s=>s.tong>0).length;
  const tongToanBo=tongCoXacDinh+khongXacDinh;
  // Cơ cấu theo 6 diện quản lý trên toàn địa bàn
  const coCau={su_dung:0,nghien:0,sau_cai:0,vppl:0,nghi_van:0,suu_tra:0};
  (subjects||[]).forEach(r=>(r.nhom||[]).forEach(n=>{if(coCau[n]!=null)coCau[n]++;}));
  const top3=stats.slice(0,3).reduce((a,s)=>a+s.tong,0);
  return{
    stats,khongXacDinh,khongXacDinhList,tongCoXacDinh,soKpCoDT,tongKp:stats.length,tongToanBo,coCau,
    binhQuan:soKpCoDT?Math.round(tongCoXacDinh/soKpCoDT*10)/10:0,
    top3Share:tongCoXacDinh?Math.round(top3/tongCoXacDinh*100):0,
    kpSach:stats.filter(s=>s.tong===0).length,
    tongNu:stats.reduce((a,s)=>a+s.nu,0),
    tongChuaPM:stats.reduce((a,s)=>a+s.chuaPM,0),
    tongDaLoai:stats.reduce((a,s)=>a+s.daLoai,0),
  };
}
const filterActive=(list,from,to,dkey="ngay_vao_so")=>{
  const active=list.filter(r=>!r.da_loai);
  if(!from&&!to)return active;
  const f=from?new Date(from):null,t=to?new Date(to+"T23:59:59"):null;
  return active.filter(r=>{
    const raw=r[dkey]||r.ngay_ph_hv||r.ngay_ph_bt||"";
    if(!raw)return true;const d=new Date(raw);if(isNaN(d))return true;
    if(f&&d<f)return false;if(t&&d>t)return false;return true;
  });
};

// EXCEL EXPORT – FULL TEMPLATE MATCH v6
// Font: Times New Roman 14 | Tiêu đề in đậm | Kẻ khung dữ liệu
// ══════════════════════════════════════════════════════════════

// ─── Style constants ───────────────────────────────────────────
// ══════════════════════════════════════════════════════════════
// STYLE CONSTANTS (xlsx-js-style)
// ══════════════════════════════════════════════════════════════
const BORDER_THIN={style:"thin",color:{rgb:"000000"}};
const BORDER_MEDIUM={style:"medium",color:{rgb:"000000"}};
const BORDER_ALL={top:BORDER_THIN,bottom:BORDER_THIN,left:BORDER_THIN,right:BORDER_THIN};
const BORDER_OUTER={top:BORDER_MEDIUM,bottom:BORDER_MEDIUM,left:BORDER_MEDIUM,right:BORDER_MEDIUM};

const XS={
  font:     {name:"Times New Roman",sz:14},
  fontBold: {name:"Times New Roman",sz:14,bold:true},
  fontHead: {name:"Times New Roman",sz:14,bold:true},
  fontCapTren:{name:"Times New Roman",sz:13,bold:true},
  fontTitle:{name:"Times New Roman",sz:15,bold:true},
  fontSub:  {name:"Times New Roman",sz:13,italic:true},
  fontSmall:{name:"Times New Roman",sz:11},
  border:BORDER_ALL,
  fillHead:{patternType:"solid",fgColor:{rgb:"BDD7EE"}},  // xanh nhạt chuẩn Excel
  fillAlt: {patternType:"solid",fgColor:{rgb:"EBF3FB"}},  // xanh rất nhạt xen kẽ
  fillSub: {patternType:"solid",fgColor:{rgb:"D9E1F2"}},  // sub-header
};

// Tạo 1 cell xlsx-js-style đúng định dạng
function mkCell(v, fontKey, fillKey, borderType, hAlign, vAlign, wrapText){
  const t=(v===null||v===undefined)?"s": typeof v==="number"?"n":"s";
  const cell={v:v==null?"":v, t};
  cell.s={
    font: fontKey?XS[fontKey]:XS.font,
    alignment:{
      horizontal: hAlign||"left",
      vertical:   vAlign||"center",
      wrapText:   wrapText!==false,
    },
  };
  if(fillKey) cell.s.fill=XS[fillKey];
  if(borderType==="all")  cell.s.border=BORDER_ALL;
  if(borderType==="outer")cell.s.border=BORDER_OUTER;
  return cell;
}

/**
 * applySheetStyle – áp dụng style trực tiếp lên từng cell của worksheet.
 *
 * @param ws           worksheet đã tạo bằng XLSX.utils.aoa_to_sheet
 * @param headerRows   mảng index (0-based) các hàng tiêu đề cột cần bold+fill+border
 *                     VD: [6] hoặc [7,8,9] (có sub-header, hàng số thứ tự)
 * @param dataStartRow index hàng dữ liệu đầu tiên (0-based)
 * @param capRow0      index hàng đơn vị cấp trên (thường 0)
 * @param capRow1      index hàng tên đơn vị (thường 1)
 * @param titleRow     index hàng tiêu đề báo cáo (thường 3)
 * @param periodRow    index hàng kỳ báo cáo (thường 4 hoặc 5)
 */
function applySheetStyle(ws, headerRows, dataStartRow, capRow0, capRow1, titleRow, periodRow){
  const ref=ws["!ref"];
  if(!ref)return;
  const range=XLSX.utils.decode_range(ref);
  const totalRows=range.e.r+1;
  const totalCols=range.e.c+1;

  const headerSet=new Set(Array.isArray(headerRows)?headerRows:[headerRows]);

  for(let R=0;R<=range.e.r;R++){
    for(let C=0;C<=range.e.c;C++){
      const addr=XLSX.utils.encode_cell({r:R,c:C});
      let cell=ws[addr];

      // Xác định loại cell và style tương ứng
      let font=XS.font, fill=null, border=null, hAlign="left", wrap=true;

      if(R===capRow0){
        // Hàng cấp trên: trái đậm | phải đậm căn giữa (CỘNG HÒA)
        font=XS.fontCapTren;
        hAlign=C===0?"left":"center";
      } else if(R===capRow1){
        font=XS.fontCapTren;
        hAlign=C===0?"left":"center";
      } else if(R===titleRow){
        font=XS.fontTitle;
        hAlign="center"; wrap=true;
      } else if(R===periodRow){
        font={...XS.font,italic:true};
        hAlign="center";
      } else if(headerSet.has(R)){
        // Header cột: bold + fill + border
        font=XS.fontHead;
        fill=XS.fillHead;
        border=BORDER_ALL;
        hAlign="center";
      } else if(R>=dataStartRow){
        // Hàng dữ liệu
        font=XS.font;
        border=BORDER_ALL;
        // Xen kẽ màu nền
        if((R-dataStartRow)%2===1) fill=XS.fillAlt;
        // Cột 0 (STT): căn giữa
        if(C===0) hAlign="center";
      } else {
        // Các hàng giữa (trống hoặc phụ lục): không border
        font=XS.font;
      }

      const s={
        font,
        alignment:{horizontal:hAlign,vertical:"center",wrapText:wrap},
      };
      if(fill)   s.fill=fill;
      if(border) s.border=border;

      if(cell){
        cell.s=s;
      } else if(headerSet.has(R)||R>=dataStartRow){
        // Tạo cell trống để giữ khung border
        ws[addr]={v:"",t:"s",s};
      }
    }
  }

  // ── Chiều cao hàng ────────────────────────────────────────
  if(!ws["!rows"]) ws["!rows"]=[];
  for(let R=0;R<totalRows;R++){
    if(headerSet.has(R))       ws["!rows"][R]={hpt:32};
    else if(R>=dataStartRow)   ws["!rows"][R]={hpt:30};
    else if(R===titleRow)      ws["!rows"][R]={hpt:24};
    else                       ws["!rows"][R]={hpt:18};
  }
}

function buildSheet(title,period,headers,rows,customHeader){
  const cap=customHeader||[
    [CONFIG.capTren],
    [CONFIG.donVi],
    [],
    [title],
    [period],
    [],
  ];
  const aoa=[...cap,headers,...rows];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const NC=headers.length;
  ws["!cols"]=headers.map((_,i)=>({wch:i===0?5:i<=4?24:i<=8?18:20}));
  const headerRow=cap.length;
  const dataStartRow=headerRow+1;
  // Merge tiêu đề và header đơn vị span toàn bộ chiều rộng
  ws["!merges"]=[
    {s:{r:0,c:0},e:{r:0,c:Math.floor(NC/2)-1}},        // capTren trái
    {s:{r:0,c:Math.ceil(NC/2)},e:{r:0,c:NC-1}},        // CỘNG HÒA phải
    {s:{r:1,c:0},e:{r:1,c:Math.floor(NC/2)-1}},        // donVi trái
    {s:{r:1,c:Math.ceil(NC/2)},e:{r:1,c:NC-1}},        // Độc lập phải
    {s:{r:3,c:0},e:{r:3,c:NC-1}},                      // title
    {s:{r:4,c:0},e:{r:4,c:NC-1}},                      // period
  ];
  applySheetStyle(ws,[headerRow],dataStartRow,0,1,3,4);
  return ws;
}

function buildHeaderAoa(title,period){

// Thêm merge cells chuẩn cho sheets dùng buildHeaderAoa
// NC = số cột; headerRow = index hàng header (6 hoặc 8 với QD28)
function addStdMerges(ws, NC, headerRow){
  const half=Math.max(Math.floor(NC/2),1);
  const merges=ws["!merges"]||[];
  // Phần đầu đơn vị (R0, R1)
  if(NC>1){
    merges.push(
      {s:{r:0,c:0},e:{r:0,c:half-1}},       // capTren trái
      {s:{r:0,c:half},e:{r:0,c:NC-1}},       // CỘNG HÒA phải
      {s:{r:1,c:0},e:{r:1,c:half-1}},        // donVi trái
      {s:{r:1,c:half},e:{r:1,c:NC-1}},       // Độc lập phải
    );
  }
  // Tiêu đề và kỳ báo cáo span toàn bộ
  merges.push(
    {s:{r:3,c:0},e:{r:3,c:NC-1}},            // title
    {s:{r:4,c:0},e:{r:4,c:NC-1}},            // period
  );
  ws["!merges"]=merges;
}

// Cột (20) Tăng/giảm – TỰ TÍNH theo kỳ báo cáo, không dùng giá trị cũ đã lưu

function tb136LinhVucToCode(v){

  const m=s.match(/^([1-5])(?!\d)/);if(m)return +m[1];
